orientation: >-
  Terms: the eHC is the high-speed USB 2.0 host controller hardware and EHCI its register and
  shared-memory schedule interface; a cHC is an optional USB 1.1 companion host controller (UHCI
  or OHCI) that services full- and low-speed devices attached directly to the root ports. Base
  means the start of the controller's memory-mapped I/O register space, and Operational Base means
  Base + CAPLENGTH. An iTD (Isochronous Transfer Descriptor) handles high-speed isochronous
  transfers, an siTD (Split-Transaction Isochronous Transfer Descriptor) handles full-speed
  isochronous transfers through a USB 2.0 hub Transaction Translator, and a QH (Queue Head) paired
  with qTDs (Queue Element Transfer Descriptors) handles control, bulk and interrupt transfers.
  This spec records the generic EHCI 1.0 programming model; SoC-specific placement, clocks,
  integrated transaction translators and quirks belong in the SoC spec that names `ehci` in
  `instances[].ip`.
facts:
- id: interface-and-companion-architecture
  section: standards
  title: EHCI scope and companion host controller architecture
  claim: >-
    The EHCI specification defines the register-level and shared-memory schedule interface for a
    USB 2.0 high-speed host controller; where it conflicts with the USB 2.0 specification, the
    USB 2.0 specification takes precedence. A USB 2.0 host controller consists of one high-speed
    EHCI controller and zero or more USB 1.1 companion host controllers (cHCs, such as UHCI or
    OHCI) that manage full- and low-speed devices connected to the root ports. The EHCI controller
    cannot work directly with a full- or low-speed device on a root port: if an implementation has
    no companion controllers (HCSPARAMS N_CC is 0), either a high-speed device (such as a USB 2.0
    hub) must be permanently attached to each root port used, or any full- or low-speed device
    attached to a root port will fail the high-speed chirp during reset and leave the port
    disabled. On a PCI implementation that includes companion controllers, the USB 2.0 host
    controller must be a multi-function PCI device whose companion controller function numbers are
    less than the EHCI controller's function number; if the PCI device contains only an EHCI
    controller (no companion controllers or other PCI functions), the EHCI controller must be
    function zero.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - page: '11'
      section: '1'
    - pages: ['12', '14']
      section: '1.2'
      figure: '1-2'
    - page: '24'
      section: 2.2.3
      table: '2-6'
    - pages: ['64', '65']
      section: '4.2'

- id: pci-configuration-registers
  section: standards
  title: PCI configuration space registers (CLASSC, USBBASE, SBRN, FLADJ, PORTWAKECAP)
  claim: >-
    When implemented as a PCI device, the controller's PCI configuration space (Table 2-2)
    provides CLASSC at offset 09h-0Bh (24-bit read-only value 0C0320h: Base Class 0Ch Serial Bus
    controller, Sub-Class 03h USB Host Controller, Programming Interface 20h USB 2.0 EHCI),
    USBBASE at 10h-13h (the 32-bit Base Address Register for the DWord-aligned MMIO register
    space, with bits 31:8 as the R/W base address, bits 7:3 and bit 0 read-only 0, and bits 2:1
    Type set to 00b for 32-bit addressing space, recommended, or 10b for 64-bit addressing space),
    SBRN at 60h (8-bit read-only Serial Bus Release Number, 20h for USB 2.0), FLADJ at 61h in the
    auxiliary power well (8-bit R/W Frame Length Adjustment, default 20h = 32 decimal, bits 7:6
    reserved 0, bits 5:0 adjusting the SOF micro-frame cycle time to 59488 + FLADJ high-speed bit
    times in 16-bit-time steps so 20h yields 60000 bit times; modified only when USBSTS HCHalted
    is 1), and the optional 16-bit PORTWAKECAP at 62h-63h in the auxiliary power well (an
    informational wake policy mask where bit 0 = 1 indicates the register is implemented and bits
    15:1 correspond to physical ports 15:1 without affecting hardware operation). PCI
    implementations must also implement the PCI Power Management interface (Appendix A), where D0,
    D3hot and D3cold are required and D1 and D2 are optional, and software must place all enabled
    downstream ports into Suspend or Disabled before leaving D0.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - page: '18'
      section: '2.1'
      table: '2-2'
    - page: '19'
      section: 2.1.2
    - page: '19'
      section: 2.1.3
    - page: '19'
      section: 2.1.4
    - page: '20'
      section: 2.1.5
    - page: '21'
      section: 2.1.6
    - pages: ['135', '137']
      section: A.1
      table: 'A-3'
  todo:
    check: document
    text: >-
      The PCI Power Management PME# assertion rules, Aux_Current reporting, and per-state
      functional and wake-up characteristics (Appendix A, Table A-4, pp. 135-137) are not
      extracted.

- id: capability-registers
  section: programming-model
  title: Capability registers (CAPLENGTH, HCIVERSION, HCSPARAMS, HCCPARAMS, HCSP-PORTROUTE)
  claim: >-
    The read-only capability registers start at MMIO Base (offset 00h): CAPLENGTH at 00h (1 byte,
    added to Base to find the beginning of the Operational Register Space), Reserved at 01h
    (1 byte), HCIVERSION at 02h (2 bytes, BCD encoding of the EHCI revision, default 0100h for
    1.0, with major revision in the high byte and minor in the low byte), HCSPARAMS at 04h
    (4 bytes), HCCPARAMS at 08h (4 bytes) and the optional HCSP-PORTROUTE at 0Ch (60 bits). In
    HCSPARAMS (Table 2-6), bits 3:0 N_PORTS give the number of physical downstream ports (valid
    range 1h to Fh; 0 is undefined), bit 4 PPC indicates whether ports have port power switches
    (1) or hard-wired power (0), bit 7 Port Routing Rules selects how ports map to companion
    controllers, bits 11:8 N_PCC give the number of ports supported per companion controller, bits
    15:12 N_CC give the number of companion controllers (0 means none and no port-ownership
    hand-off), bit 16 P_INDICATOR indicates port indicator control support in PORTSC, and bits
    23:20 Debug Port Number give the 1-based port number of the optional debug port (0 if none,
    and never greater than N_PORTS). When Port Routing Rules is 0, the first N_PCC ports route to
    the lowest-numbered function companion controller, the next N_PCC to the next lowest, and so
    on; when it is 1, HCSP-PORTROUTE is a 15-element 4-bit nibble array whose first N_PORTS
    elements (PORTROUTE[0] for port 1, etc.) explicitly name the companion controller for each
    port (0 for lowest-numbered function, 1 for next lowest, and so on). In HCCPARAMS (Table 2-7),
    bit 0 is the 64-bit Addressing Capability (0 = 32-bit address memory pointers in schedule data
    structures, 1 = 64-bit data structures in Appendix B), bit 1 is the Programmable Frame List
    Flag (0 = mandatory 1024-element frame list and RO 00b Frame List Size in USBCMD; 1 = software
    may select 1024, 512 or 256 elements via USBCMD), bit 2 is the Asynchronous Schedule Park
    Capability, bits 7:4 give the Isochronous Scheduling Threshold, and bits 15:8 EECP give the
    PCI configuration space offset of the first EHCI extended capability (00h if none, or at least
    40h when implemented).
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - page: '23'
      section: '2.2'
      table: '2-5'
    - page: '23'
      section: 2.2.1
    - page: '24'
      section: 2.2.2
    - pages: ['24', '25']
      section: 2.2.3
      table: '2-6'
    - pages: ['25', '26']
      section: 2.2.4
      table: '2-7'
    - page: '26'
      section: 2.2.5

- id: operational-register-map
  section: programming-model
  title: Operational register offsets, access width and power wells
  claim: >-
    The operational registers start at Operational Base (Base + CAPLENGTH, DWord-aligned), are all
    32 bits in length, and should be read and written using only DWord accesses; host controllers
    are not required to support exclusive-access mechanisms such as PCI LOCK to the MMIO space
    (using them yields undefined results), and software should preserve reserved bits when writing
    modifiable registers. Operational offsets 00h to 3Fh reside in the core power well (initialized
    to defaults on core hardware reset, HCRESET = 1, or a PCI Power Management D3hot-to-D0
    transition): USBCMD at 00h, USBSTS at 04h, USBINTR at 08h, FRINDEX at 0Ch, CTRLDSSEGMENT at
    10h, PERIODICLISTBASE at 14h, ASYNCLISTADDR at 18h, and Reserved at 1Ch-3Fh. Offsets from 40h
    to the end of the register space reside in the auxiliary power well (initialized to defaults
    only on initial auxiliary power-up or HCRESET = 1, and retained across D3hot-to-D0
    transitions): CONFIGFLAG at 40h and PORTSC(1..N_PORTS) at 44h + 4*(Port Number - 1) for
    1-based Port Number 1 to N_PORTS.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['17', '18']
      section: '2'
      table: '2-1'
    - page: '27'
      section: '2.3'
      table: '2-8'
    - page: '35'
      section: 2.3.8
      table: '2-15'
    - page: '36'
      section: 2.3.9
    - page: '136'
      section: A.1.1

- id: usbcmd-control-fields
  section: programming-model
  title: USBCMD command, schedule enables, park mode and interrupt threshold
  claim: >-
    USBCMD (Operational Base + 00h, default 00080000h, or 00080B00h when HCCPARAMS Asynchronous
    Schedule Park Capability is 1) has bit 0 Run/Stop (1 = Run, 0 = Stop), bit 1 Host Controller
    Reset (HCRESET), bits 3:2 Frame List Size (00b = 1024 elements/4096 bytes default, 01b = 512
    elements/2048 bytes, 10b = 256 elements/1024 bytes, 11b reserved; R/W only when HCCPARAMS
    Programmable Frame List Flag is 1, otherwise RO), bit 4 Periodic Schedule Enable (0 = skip,
    1 = use PERIODICLISTBASE), bit 5 Asynchronous Schedule Enable (0 = skip, 1 = use
    ASYNCLISTADDR), bit 6 Interrupt on Async Advance Doorbell, and bit 7 optional Light Host
    Controller Reset (resets the controller without affecting port state, PORTSC or CONFIGFLAG CF;
    reads 1 while in progress and 0 when complete or unimplemented). When HCCPARAMS Asynchronous
    Schedule Park Capability is 1, bit 11 Asynchronous Schedule Park Mode Enable (default 1b, R/W;
    otherwise 0b, RO) and bits 9:8 Asynchronous Schedule Park Mode Count (default 3h, R/W, valid
    1h to 3h; otherwise 0, RO; writing 0 to Park Mode Count while Park Mode Enable is 1 yields
    undefined behavior) allow the controller to execute up to Park Mode Count consecutive bus
    transactions from a high-speed queue head in the asynchronous schedule before continuing
    horizontal traversal (park mode is never applied to full- or low-speed queue heads or to the
    periodic schedule). Bits 23:16 Interrupt Threshold Control (default 08h = 8 micro-frames/1 ms;
    valid values 01h, 02h, 04h, 08h, 10h, 20h and 40h for 1, 2, 4, 8, 16, 32 and 64 micro-frames,
    with 00h reserved and any other value undefined) select the maximum rate at which the host
    controller issues transaction-based interrupts and must not be modified while USBSTS HCHalted
    is 0.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['28', '30']
      section: 2.3.1
      table: '2-9'
    - pages: ['94', '96']
      section: 4.10.3.2
      table: '4-10'
  todo:
    check: document
    text: >-
      The per-PID and per-handshake Park Mode continuation table (Table 4-10, pp. 95-96) is not
      extracted.

- id: usbsts-and-usbintr
  section: programming-model
  title: Status and interrupt enable registers (USBSTS and USBINTR)
  claim: >-
    USBSTS (Operational Base + 04h, default 00001000h) has four read-only status bits in bits
    15:12—bit 15 Asynchronous Schedule Status (1 = enabled, 0 = disabled), bit 14 Periodic
    Schedule Status (1 = enabled, 0 = disabled), bit 13 Reclamation (0 = default, used to detect
    an empty asynchronous schedule) and bit 12 HCHalted (1 = default; 0 whenever Run/Stop is 1,
    set to 1 after the controller has stopped)—and six R/WC interrupt status bits in bits 5:0
    cleared by writing 1: bit 5 Interrupt on Async Advance, bit 4 Host System Error, bit 3 Frame
    List Rollover, bit 2 Port Change Detect, bit 1 USB Error Interrupt (USBERRINT) and bit 0 USB
    Interrupt (USBINT, set when a TD/qTD with IOC = 1 is retired or when a short packet is
    detected on an IN queue head). USBINTR (Operational Base + 08h, default 00000000h) holds the
    matching R/W interrupt enable bits 5:0 (1 = enabled, 0 = disabled); disabled sources still
    appear in USBSTS for polling, and clearing an enable bit in USBINTR is not required to
    de-assert a currently active interrupt, so software must acknowledge interrupts by writing 1s
    to the USBSTS status bits. Interrupts for USBINT (bit 0), USBERRINT (bit 1) and Interrupt on
    Async Advance (bit 5) are deferred to the next interrupt threshold interval, whereas Port
    Change Detect (bit 2), Frame List Rollover (bit 3) and Host System Error (bit 4) are signaled
    immediately without waiting for the interrupt threshold. When a Host System Error occurs (such
    as a PCI Parity error, Master Abort or Target Abort), the controller clears USBCMD Run/Stop to
    0, sets USBSTS Host System Error and HCHalted to 1, and software must reset the controller via
    USBCMD HCRESET before re-initializing and restarting it.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['31', '32']
      section: 2.3.2
      table: '2-10'
    - pages: ['32', '33']
      section: 2.3.3
      table: '2-11'
    - pages: ['125', '127']
      section: '4.15'
      table: '4-18'
    - pages: ['127', '129']
      section: 4.15.2.4
      table: '4-19'
  todo:
    check: document
    text: >-
      The per-cycle-type Host System Error fatality matrix (Table 4-19, p. 128) is not extracted.

- id: initialization-reset-and-halt
  section: programming-model
  title: Host controller reset, initialization sequence, start and halt
  claim: >-
    Writing 1 to USBCMD bit 1 HCRESET resets the controller's internal pipelines, timers,
    counters, state machines and all operational registers (including port registers, port state
    machines and CONFIGFLAG, returning port ownership to the companion host controllers) to their
    default values, immediately terminates any USB transaction in progress without driving a USB
    reset on downstream ports, and does not affect PCI configuration registers; the controller
    clears HCRESET to 0 when the reset process is complete, and software cannot terminate it early
    by writing 0. Software must not set HCRESET to 1 when USBSTS HCHalted is 0, and must not write
    1 to USBCMD bit 0 Run/Stop unless HCHalted is 1; either action yields undefined behavior. To
    initialize the host controller from its halted post-reset state, software programs
    CTRLDSSEGMENT with the 4 GiB segment holding all schedule data structures, writes USBINTR to
    enable interrupts, writes PERIODICLISTBASE with the Periodic Frame List base address (setting
    all frame list elements' T-bits to 1 if there are no periodic work items), writes USBCMD to
    set the interrupt threshold, frame list size (if applicable) and Run/Stop = 1, and writes 1 to
    CONFIGFLAG bit 0 (CF) to route all ports to the EHCI controller. When software clears Run/Stop
    to 0, the controller completes the current and any actively pipelined USB transactions and
    must halt within 16 micro-frames (2 ms), setting USBSTS HCHalted to 1.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['28', '30']
      section: 2.3.1
      table: '2-9'
    - page: '31'
      section: 2.3.2
      table: '2-10'
    - pages: ['63', '64']
      section: '4.1'
      table: '4-1'

- id: port-routing-and-companion-handoff
  section: programming-model
  title: Port routing, CONFIGFLAG, Line Status and companion handoff
  claim: >-
    Root port routing between the EHCI controller and companion USB 1.1 controllers is controlled
    globally by CONFIGFLAG bit 0 (CF, Operational Base + 40h, default 0b) and per port by PORTSC
    bit 13 (Port Owner, default 1b). Whenever CF is 0 (after auxiliary power-up, HCRESET or
    software writing 0), Port Owner unconditionally goes to 1b and all ports default-route to the
    companion controllers. When software transitions CF from 0b to 1b, all Port Owner bits
    unconditionally clear to 0b so all ports default-route to the EHCI controller, inhibiting
    connect events from reaching the companion controllers' port registers. When a device attaches
    to an EHCI-owned port (PORTSC bit 0 Current Connect Status = 1, bit 2 Port Enabled = 0),
    software inspects PORTSC bits 11:10 Line Status (D+ in bit 11, D- in bit 10, valid only when
    Port Enabled is 0 and Current Connect Status is 1): if Line Status is 01b (K-state), the
    attached device is low-speed and software releases port ownership to the companion controller
    by writing 1 to Port Owner without performing an EHCI port reset. If Line Status is 00b (SE0),
    10b (J-state) or 11b (not low-speed), software starts a USB 2.0 bus reset by writing 1 to
    PORTSC bit 8 Port Reset (and 0 to Port Enabled, while HCHalted is 0), times the reset
    duration, writes 0 to Port Reset, and waits for Port Reset to read 0; the controller must
    terminate reset and stabilize port state within 2 ms of software writing 0. If the device
    is high-speed, the controller automatically sets Port Enabled (bit 2) to 1; if Port Enabled
    remains 0 after reset completes, the device is full-speed and software writes 1 to Port Owner
    to hand the port to a companion controller (which causes the EHCI PORTSC to report a
    disconnect with Connect Status Change = 1 and Current Connect Status = 0). When a device
    disconnects from a companion-owned port while CF is 1, the routing logic immediately returns
    Port Owner to 0 (EHCI ownership).
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - page: '35'
      section: 2.3.8
      table: '2-15'
    - pages: ['36', '40']
      section: 2.3.9
      table: '2-16'
    - pages: ['64', '67']
      section: '4.2'
      table: '4-2'
      figure: '4-2'

- id: portsc-power-suspend-and-test
  section: programming-model
  title: Port power, suspend/resume, over-current and test modes (PORTSC)
  claim: >-
    In PORTSC (Operational Base + 44h + 4*(Port Number - 1), default 00002000h when PPC is 1 or
    00003000h when PPC is 0), bit 12 Port Power (PP) is RO 1b when HCSPARAMS PPC is 0 and R/W when
    PPC is 1; when PPC is 1, software cannot change the port's state while PP is 0 and must wait
    until power is stable (guaranteed within 20 ms of the 0-to-1 transition). Whenever PP is 0,
    PORTSC bits 22:20 (WKOC_E, WKDSCNNT_E, WKCNNT_E), 15:14 (Port Indicator Control), 8:6 (Port
    Reset, Suspend, Force Port Resume) and 3:0 (Port Enable/Disable Change, Port Enabled/Disabled,
    Connect Status Change, Current Connect Status) are 0 and bits 11:10 (Line Status) are
    undefined. Software places an enabled, EHCI-owned port into selective suspend by writing 1 to
    bit 7 Suspend (writes of 0 to Suspend are ignored, and setting Suspend when Port Enabled is 0
    is undefined). To initiate a resume, software must wait at least 10 ms after Suspend reads 1,
    write 1 to bit 6 Force Port Resume (setting Force Port Resume when the port is not suspended
    has undefined bus effects, and software-initiated resume does not set USBSTS Port Change
    Detect), time the resume signaling (nominally 20 ms), and write 0 to Force Port Resume while
    HCHalted is 0; the controller switches the port to high-speed idle and clears both Force Port
    Resume and Suspend to 0 within 2 ms. A remote-wakeup J-to-K transition on a suspended port is
    reflected downstream within 100 us and sets both Force Port Resume and USBSTS Port Change
    Detect to 1. Bit 4 Over-current Active (RO) reflects an active over-current condition, bit 5
    Over-current Change (R/WC) is set on any transition of Over-current Active, and bit 3 Port
    Enable/Disable Change (R/WC) is set only when a port is disabled due to a Port Error at the
    EOF2 point. Bits 19:16 Port Test Control select USB 2.0 test modes (0000b not enabled, 0001b
    Test J_STATE, 0010b Test K_STATE, 0011b Test SE0_NAK, 0100b Test Packet, 0101b Test
    FORCE_ENABLE; 0110b-1111b reserved) on at most one EHCI-owned port at a time after disabling
    both schedules, suspending all enabled root ports, and halting the controller (for
    Test_Force_Enable, Run/Stop is then set back to 1); software exits test mode by halting the
    controller and setting USBCMD HCRESET to 1.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['36', '40']
      section: 2.3.9
      table: '2-16'
    - pages: ['67', '71']
      section: 4.2.4
      table: '4-3'
    - pages: ['69', '71']
      section: '4.3'
      table: '4-4'
    - pages: ['124', '125']
      section: '4.14'
  todo:
    check: document
    text: >-
      The per-combination Port Power Enable (PPE) truth table across CF, CHC(PP), EHC(PP) and
      Owner (Table 4-3, p. 68) and the per-event D0/not-D0 wake-up response matrix (Table 4-4,
      pp. 70-71) are not extracted in full.

- id: periodic-frame-list-and-frindex
  section: programming-model
  title: Periodic Frame List, PERIODICLISTBASE, FRINDEX and H-Frame phase shift
  claim: >-
    The periodic schedule services all isochronous and interrupt transfers and is executed before
    the asynchronous schedule in each micro-frame. PERIODICLISTBASE (Operational Base + 14h, DWord
    writes) holds the 4 KiB-aligned physical base address of the Periodic Frame List in bits 31:12
    (bits 11:0 must be written as 0). FRINDEX (Operational Base + 0Ch, default 00000000h) holds a
    14-bit micro-frame counter in bits 13:0 (bits 31:14 reserved) that increments every 125 us
    micro-frame; FRINDEX bits [N:3] index the Periodic Frame List (N = 12 for 1024 elements, 11
    for 512, 10 for 256, per USBCMD Frame List Size) and bits 2:0 count the 8 micro-frames within
    each 1 ms H-Frame, so each frame list element is accessed 8 consecutive times. FRINDEX may be
    written only as a DWord while USBSTS HCHalted is 1 (byte writes or writes while Run/Stop is 1
    yield undefined results), and software should never write a FRINDEX value with bits 2:0 equal
    to 111b or 000b. The bus SOF token's 11-bit frame number (B-Frame) lags FRINDEX[13:3]
    (H-Frame) by one micro-frame (125 us), incrementing when FRINDEX[2:0] transitions from 000b to
    001b. Each 32-bit Frame List Link Pointer has bits 31:5 as a 32-byte-aligned address, bits 4:3
    written as 0, bits 2:1 Typ (00b iTD, 01b QH, 10b siTD, 11b FSTN) and bit 0 Terminate (T = 1
    marks the End-Of-Periodic-List, causing the controller to switch immediately to the
    asynchronous schedule for the rest of the micro-frame). Software enables or disables the
    periodic schedule via USBCMD bit 4 Periodic Schedule Enable, waiting until it matches USBSTS
    bit 14 Periodic Schedule Status before modifying it again; the controller evaluates Periodic
    Schedule Enable only when FRINDEX[2:0] is 000b, and software must remove any active
    split-transaction work item that spans micro-frame 000b before clearing Periodic Schedule
    Enable.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['33', '35']
      section: 2.3.4
      table: '2-12'
    - pages: ['34', '35']
      section: 2.3.6
      table: '2-13'
    - pages: ['41', '42']
      section: '3.1'
      figure: '3-2'
      table: '3-1'
    - page: '71'
      section: '4.4'
      figure: '4-3'
    - pages: ['74', '76']
      section: '4.5'
      table: '4-6'
    - pages: ['76', '77']
      section: '4.6'

- id: high-speed-isochronous-itd
  section: programming-model
  title: High-speed Isochronous Transfer Descriptor (iTD)
  claim: >-
    High-speed isochronous endpoints use 32-byte-aligned iTDs (64 bytes / 16 DWords in 32-bit
    mode; 92 bytes / 23 DWords in 64-bit mode, adding seven 32-bit Extended Buffer Pointer DWords
    at offsets 40h-5Bh) linked only into the periodic schedule. DWord 0 is the Next Link Pointer
    (bits 31:5 address, bits 4:3 zero, bits 2:1 Typ, bit 0 Terminate T). DWords 1-8 hold eight
    Transaction Status and Control slots indexed by FRINDEX[2:0], each containing Status in bits
    31:28 (bit 31 Active, cleared to 0 by the controller on completion; bit 30 Data Buffer Error;
    bit 29 Babble Detected; bit 28 Transaction Error XactErr, set only for IN transactions),
    Transaction X Length in bits 27:16 (actual byte count from 0 to C00h = 3072; updated by the
    controller with bytes received on IN, not required to be updated on OUT), bit 15 Interrupt On
    Complete (IOC), bits 14:12 Page Select PG (0 to 6, selecting one of the seven buffer page
    pointers; software must not use Page 6 for a transfer that wraps a page boundary), and bits
    11:0 Transaction X Offset. DWords 9-15 hold seven 4 KiB-aligned Buffer Page Pointers (bits
    31:12) for a virtually contiguous buffer of up to 24576 bytes (3 * 1024 * 8), with endpoint
    metadata in the low 12 bits of the first three pages: Page 0 holds Endpoint Number (bits
    11:8), bit 7 reserved 0, and Device Address (bits 6:0); Page 1 holds Direction I/O (bit 11:
    0 = OUT, 1 = IN) and Maximum Packet Size (bits 10:0, at most 400h = 1024; larger values are
    undefined); Page 2 holds bits 11:2 reserved 0 and Multi (bits 1:0: 01b = 1, 10b = 2, 11b = 3
    transactions per micro-frame; 00b is reserved and undefined); Pages 3-6 have bits 11:0
    reserved 0. A short packet on an iTD IN transaction does not set USBSTS USBINT. When adding
    isochronous work, software reads FRINDEX and observes HCCPARAMS bits 7:4 Isochronous
    Scheduling Threshold: 0 means no caching (software may add work as near as 2 micro-frames
    ahead of FRINDEX), bit 7 = 0 with bits 2:0 = k > 0 means k micro-frames of periodic structures
    cached on-chip, and bit 7 = 1 means full-frame caching (from frame N, software schedules into
    frame N+1 if FRINDEX[2:0] is 0..6, or frame N+2 if FRINDEX[2:0] is 7).
