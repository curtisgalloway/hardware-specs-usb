- id: extended-capabilities-and-bios-handoff
  section: programming-model
  title: Extended capabilities (EECP) and Pre-OS to OS handoff (USBLEGSUP)
  claim: >-
    When HCCPARAMS bits 15:8 (EECP) are non-zero (40h or greater), they give the PCI configuration
    space offset of the first entry in a linked list of EHCI Extended Capabilities (Table 5-1):
    each 32-bit capability header has Capability ID in bits 7:0 (01h = Pre-OS to OS Handoff
    Synchronization / Legacy Support; 00h reserved), Next EHCI Extended Capability Pointer in bits
    15:8 (PCI configuration space offset of the next capability, or 00h at the end of the list),
    and capability-specific bits in 31:16. The Legacy Support capability (ID 01h) consists of two
    contiguous 32-bit registers in the auxiliary power well: USBLEGSUP at EECP + 00h (Table 2-3)
    and USBLEGCTLSTS at EECP + 04h (Table 2-4). In USBLEGSUP, bit 16 is the HC BIOS Owned
    Semaphore (R/W, default 0) and bit 24 is the HC OS Owned Semaphore (R/W, default 0), placed in
    adjacent bytes so BIOS and the OS driver can update their respective semaphores without
    overwriting each other (bits 31:25 and 23:17 are reserved and must be 0). To request
    ownership, the OS driver sets HC OS Owned Semaphore (bit 24) to 1 and waits for HC BIOS Owned
    Semaphore (bit 16) to read 0 before using the controller; to relinquish ownership on driver
    unload, the OS sets bit 24 to 0 (BIOS may claim ownership only during POST or when bit 24 is
    0, and must never reclaim ownership after relinquishing it while bit 24 remains 1).
    USBLEGCTLSTS provides R/WC status bits 31 (SMI on BAR write), 30 (SMI on PCI Command write)
    and 29 (SMI on OS Ownership Change), read-only bits 21:16 that shadow USBSTS bits 5:0
    (cleared by writing 1s to the corresponding USBSTS bits), and R/W SMI enable bits 15:13 (for
    bits 31:29) and 5:0 (for bits 21:16, issuing SMIs immediately and independently of the USBCMD
    interrupt threshold).
