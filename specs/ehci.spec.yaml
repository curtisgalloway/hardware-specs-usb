- id: asynchronous-schedule-and-reclamation
  section: programming-model
  title: Asynchronous schedule circular list, H-bit reclamation and Ping control
  claim: >-
    The asynchronous schedule services all control and bulk transfers and is a circular
    singly-linked list of Queue Heads (linking an iTD, siTD or FSTN into the asynchronous schedule
    yields undefined results) rooted at ASYNCLISTADDR (Operational Base + 18h, bits 31:5 holding a
    32-byte-aligned QH pointer and bits 4:0 hardwired to 0). Software may write ASYNCLISTADDR with
    defined results only while the schedule is disabled (both USBCMD Asynchronous Schedule Enable
    and USBSTS Asynchronous Schedule Status are 0), and must not modify Asynchronous Schedule
    Enable unless it equals Asynchronous Schedule Status. When traversing the asynchronous
    schedule after the periodic schedule ends, the controller starts at ASYNCLISTADDR and stores
    the horizontal pointer of the last accessed QH back into ASYNCLISTADDR when stopping at micro-
    frame end, empty list detection or schedule disable, providing round-robin service. Software
    must keep at most one QH in the asynchronous schedule marked with H = 1 (Head of Reclamation
    List, DWord 1 bit 15; setting H = 1 on an interrupt QH in the periodic schedule is undefined).
    The controller sets USBSTS bit 13 Reclamation to 1 on an asynchronous schedule Start Event
    (transitioning from the periodic schedule or waking from the async schedule sleep timer) and
    whenever it executes an asynchronous transaction, and clears Reclamation to 0 whenever it
    fetches an asynchronous QH with H = 1; if it fetches a QH with H = 1 while Reclamation is
    already 0, it stops traversing the asynchronous schedule until the next Start Event. During
     the first pass through the reclamation list after a Start Event (between the first and second
    fetches of the H = 1 QH), the controller reloads each visited QH's NakCnt from RL when RL is
    non-zero. For high-speed bulk and control OUT endpoints (S-mask = 0, EPS = High-Speed,
    PID_Code = OUT), the controller manages the USB 2.0 PING flow-control protocol via Status bit
    0 (Ping State: 0b Do OUT, 1b Do Ping), preserving Ping State across qTD overlay advances: in
    Do OUT, an OUT that receives NAK, NYET (which accepts the data and advances transfer state) or
    XactErr transitions Ping State to Do Ping, while ACK stays in Do OUT; in Do Ping, a PING that
    receives ACK transitions to Do OUT, while NAK or XactErr stays in Do Ping, and STALL in either
    state halts the QH.
