- id: async-schedule-unlink-doorbell
  section: programming-model
  title: Unlinking a Queue Head with the Interrupt on Async Advance Doorbell
  claim: >-
    Because the host controller may retain cached on-chip pointers to Queue Heads in an active
    asynchronous schedule, software must not modify or free an unlinked QH until it completes the
    Interrupt on Async Advance doorbell handshake. To remove one or more QHs without disabling the
    asynchronous schedule, software first deactivates all active qTDs on the target QH(s) and
    waits for each target QH to go inactive; if a QH being removed has H = 1, software first sets
    H = 1 on another QH that will remain linked in the schedule. Software then sets the previous
    QH's Horizontal Link Pointer to the Horizontal Link Pointer of the unlinked QH (bypassing it
    in the circular list), sets each unlinked QH's Horizontal Link Pointer to a QH that remains in
    the schedule, and writes 1 to USBCMD bit 6 Interrupt on Async Advance Doorbell (software must
    not write 1 to this bit when the asynchronous schedule is disabled, as that yields undefined
    results). Once the controller has evicted all cached schedule state that could reference the
    unlinked structures (either by advancing past its locally reachable QHs or by observing the
    head of the list twice), it sets USBSTS bit 5 Interrupt on Async Advance to 1 and clears the
    USBCMD doorbell bit to 0, asserting an interrupt at the next interrupt threshold if USBINTR
    bit 5 is 1. Software may free or reuse the unlinked QH memory only after observing USBSTS
    Interrupt on Async Advance = 1, and should clear that USBSTS bit (by writing 1) before using
    the doorbell handshake again.
