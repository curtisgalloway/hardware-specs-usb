- id: qtd-layout-and-status
  section: programming-model
  title: Queue Element Transfer Descriptor (qTD) layout, token and buffer pointers
  claim: >-
    Control, bulk and interrupt transfers use 32-byte-aligned, physically contiguous qTDs (32
    bytes / 8 DWords in 32-bit mode; 52 bytes / 13 DWords in 64-bit mode, adding five 32-bit
    Extended Buffer Pointer DWords at offsets 20h-33h). DWord 0 is Next qTD Pointer (bits 31:5
    32-byte-aligned address, bits 4:1 reserved, bit 0 Terminate T: 1 = invalid, 0 = valid) and
    DWord 1 is Alternate Next qTD Pointer (same layout, used by hardware to advance to the next
    client buffer when an IN qTD is retired due to a short packet and its T-bit is 0). DWord 2 is
    the qTD Token (Table 3-16): bit 31 Data Toggle (dt), bits 30:16 Total Bytes to Transfer (0 to
    5000h = 20480 bytes; decremented by bytes moved on each successful transaction; if 0 when
    fetched with Active = 1, the controller executes a zero-length transaction and retires the
    qTD), bit 15 Interrupt On Complete (IOC), bits 14:12 Current Page C_Page (0h to 4h, indexing
    the buffer pointer list), bits 11:10 Error Counter CERR (2-bit down-counter for consecutive
    Transaction Errors; 00b disables error counting for high-speed endpoints, whereas programming
    CERR = 00b for a full- or low-speed endpoint yields undefined behavior; when CERR decrements
    from 1 to 0 the controller marks the qTD inactive, sets Halted and the causing error status
    bit, and sets USBSTS USBERRINT), bits 9:8 PID Code (00b OUT token E1h, 01b IN token 69h, 10b
    SETUP token 2Dh which is undefined on an interrupt endpoint, 11b reserved), and bits 7:0
    Status. In Status, bit 7 is Active, bit 6 is Halted (set on babble, CERR underflow or STALL
    handshake, always clearing Active to 0), bit 5 is Data Buffer Error (does not decrement CERR),
    bit 4 is Babble Detected (also sets Halted and does not decrement CERR), bit 3 is Transaction
    Error (XactErr: timeout, CRC, bad PID, or NAK/NYET to SETUP), bit 2 is Missed Micro-Frame
    (periodic full-/low-speed split only), bit 1 is SplitXstate (0b Do Start Split, 1b Do Complete
    Split, for full-/low-speed endpoints), and bit 0 is Ping State (P)/ERR (for high-speed OUT: 0b
    Do OUT, 1b Do Ping; for non-high-speed periodic split: set to 1 on an ERR handshake). DWords
    3-7 (Table 3-17) hold five 4 KiB-aligned Buffer Pointers (Pages 0..4, bits 31:12), with
    Current Offset in Page 0 bits 11:0 and bits 11:0 reserved (initialized to 0) in Pages 1..4;
    the data buffer must be virtually contiguous, and software must use a separate buffer pointer
    element for each physical 4 KiB page even when the pages are physically contiguous.
