- id: portsc-enable-cannot-be-set-by-software
  section: gotchas
  title: Software cannot enable a port by writing 1 to PORTSC Port Enabled
  claim: >-
    Software cannot enable an EHCI root port by writing a 1 to PORTSC bit 2 (Port
    Enabled/Disabled); only the host controller sets Port Enabled to 1 when a port reset sequence
    determines that the attached device is a high-speed device (software writes 0 to disable a
    port). Moreover, when software initiates a port reset by writing 1 to PORTSC bit 8 (Port
    Reset), it must also write 0 to Port Enabled in that write.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['36', '39']
      section: 2.3.9
      table: '2-16'

- id: portsc-rwc-bits-on-read-modify-write
  section: gotchas
  title: Unmasked read-modify-write on PORTSC clears status change bits
  claim: >-
    Operational registers are accessed as 32-bit DWords, and PORTSC combines R/W control fields
    (such as Port Owner, Port Power, Port Reset, Suspend, Force Port Resume, Port Indicator
    Control, Port Test Control and the Wake Enables) with three write-1-to-clear (R/WC) change
    bits: bit 5 Over-current Change, bit 3 Port Enable/Disable Change and bit 1 Connect Status
    Change. A naive read-modify-write to PORTSC that does not mask bits 5, 3 and 1 to 0 will
    write 1 back to any asserted change bit and silently clear the status change before the root
    hub driver processes it.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - pages: ['17', '18']
      section: '2'
    - page: '27'
      section: '2.3'
    - pages: ['36', '39']
      section: 2.3.9
      table: '2-16'

- id: hcreset-and-frindex-require-halted-controller
  section: gotchas
  title: Setting HCRESET or writing FRINDEX, FLADJ or Interrupt Threshold while running is undefined
  claim: >-
    Software must not set USBCMD bit 1 (HCRESET) to 1 while USBSTS bit 12 (HCHalted) is 0;
    attempting to reset an actively running host controller yields undefined behavior, so software
    must clear USBCMD bit 0 (Run/Stop) to 0 and wait for HCHalted to read 1 (within 16
    micro-frames) first. Likewise, writing 1 to USBCMD Run/Stop, modifying USBCMD Interrupt
    Threshold Control (bits 23:16), writing FRINDEX, or changing PCI FLADJ while the controller is
    running (HCHalted = 0 / Run/Stop = 1) yields undefined results.
  support:
  - class: standard
    doc: ehci-1.0.pdf
    at:
    - page: '20'
      section: 2.1.5
    - pages: ['28', '30']
      section: 2.3.1
      table: '2-9'
    - page: '33'
      section: 2.3.4

- id: ctrldssegment-controls-only-structures-not-buffers
  section: gotchas
  title: CTRLDSSEGMENT supplies high address bits for schedule structures, not data buffers
  claim: >-
    When 64-bit Addressing Capability (HCCPARAMS bit 0) is 1, the 32-bit link pointers inside
    schedule data structures (Periodic Frame List elements, QH Horizontal Link Pointer, qTD
    Next/Alternate/Current pointers, and iTD/siTD/FSTN link pointers) and the PERIODICLISTBASE and
    ASYNCLISTADDR registers do not widen to 64 bits; all of them concatenate their 32-bit pointer
    with the single 32-bit CTRLDSSEGMENT register as bits [63:32], requiring every schedule
    control structure to be allocated in the same 4 GiB memory segment. Only the data buffer page
    pointers in iTD-64, siTD-64, qTD-64 and QH-64 have per-page 32-bit Extended Buffer Pointer
    fields for bits [63:32], and FSTNs have no 64-bit structure variant at all.
  support:
