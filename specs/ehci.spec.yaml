- id: memory-alignment-and-64bit-segment
  section: programming-model
  title: 4 KiB page-boundary rule and 64-bit addressing (CTRLDSSEGMENT vs buffer pointers)
  claim: >-
    Software must ensure that no schedule interface data structure reachable by the EHCI
    controller spans a 4 KiB page boundary; the Periodic Frame List is 4 KiB-page aligned (and
    therefore physically contiguous), while iTDs, siTDs, QHs, qTDs and FSTNs are 32-byte aligned.
    When HCCPARAMS bit 0 (64-bit Addressing Capability) is 0, the controller uses the 32-bit
    schedule data structures of Chapter 3 and CTRLDSSEGMENT (Operational Base + 10h, default
    00000000h) is unused (software cannot write it and reads return 0). When 64-bit Addressing
    Capability is 1, the controller uses the 64-bit data structures of Appendix B (iTD-64,
    siTD-64, qTD-64 and QH-64; FSTN has no separate 64-bit layout): CTRLDSSEGMENT supplies bits
    [63:32] for PERIODICLISTBASE, ASYNCLISTADDR and every control data structure link pointer, so
    all schedule control data structures must reside in the same 4 GiB memory segment, whereas
    each iTD-64, siTD-64, qTD-64 and QH-64 appends an Extended Buffer Pointer array supplying bits
    [63:32] for each 4 KiB data buffer page pointer independently. Note that HCCPARAMS bit 0 (bus
    master 64-bit addressing) is independent of PCI USBBASE bits 2:1 (slave MMIO BAR 32- or
    64-bit decoding).
  support:
