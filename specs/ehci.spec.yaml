- id: split-transaction-isochronous-sitd
  section: programming-model
  title: Split-Transaction Isochronous Transfer Descriptor (siTD) and FSTN
  claim: >-
    Full-speed isochronous transfers through a USB 2.0 hub Transaction Translator (TT) use
    32-byte-aligned siTDs (28 bytes / 7 DWords in 32-bit mode; 36 bytes / 9 DWords in 64-bit mode,
    adding two 32-bit Extended Buffer Pointer DWords at offsets 1Ch-23h). DWord 0 is the Next Link
    Pointer (bits 31:5 address, bits 4:3 zero, bits 2:1 Typ, bit 0 T). DWord 1 (Table 3-9) holds
    Direction I/O (bit 31: 0 = OUT, 1 = IN), TT Port Number (bits 30:24), bit 23 reserved 0, Hub
    Address (bits 22:16), bits 15:12 reserved 0, Endpoint Number (bits 11:8), bit 7 reserved 0 and
    Device Address (bits 6:0). DWord 2 (Table 3-10) holds bits 31:16 reserved 0, Split Completion
    Mask uFrame C-Mask (bits 15:8) and Split Start Mask uFrame S-mask (bits 7:0, non-zero). DWord
    3 (Table 3-11) holds IOC (bit 31), Page Select P (bit 30: 0 selects Page 0, 1 selects Page 1),
    bits 29:26 reserved 0, Total Bytes to Transfer (bits 25:16, maximum 3FFh = 1023), uFrame
    Complete-split Progress Mask C-prog-Mask (bits 15:8) and Status (bits 7:0: bit 7 Active, bit 6
    ERR handshake from TT, bit 5 Data Buffer Error, bit 4 Babble Detected, bit 3 XactErr for IN
    only, bit 2 Missed Micro-Frame, bit 1 SplitXstate 0b Do Start Split / 1b Do Complete Split,
    bit 0 reserved 0). DWords 4-5 (Table 3-12) hold two 4 KiB-aligned Buffer Page Pointers (bits
    31:12) supporting one page cross, with Current Offset in Page 0 bits 11:0 and, in Page 1, bits
    11:5 reserved, Transaction Position TP in bits 4:3 (00b All for <= 188 bytes, 01b Begin, 10b
    Mid, 11b End) and Transaction Count T-Count in bits 2:0 (number of OUT start-splits, 1 to 6;
    values above 6 are undefined). DWord 6 (Table 3-13) is the 32-byte-aligned siTD Back Pointer
    (bits 31:5 address of an siTD, bits 4:1 reserved 0, bit 0 Terminate T) used for IN
    complete-splits that span an H-Frame boundary. To manage full- and low-speed interrupt split
    transactions that span an H-Frame boundary, the periodic schedule may contain a 2-DWord
    (8-byte, 32-byte-aligned) Frame Span Traversal Node (FSTN, Typ 11b, supported only when
    HCIVERSION >= 0096h and forbidden in the asynchronous schedule): DWord 0 is the Normal Path
    Link Pointer (bits 31:5 address, bits 4:3 zero, bits 2:1 Typ, bit 0 T) and DWord 1 is the Back
