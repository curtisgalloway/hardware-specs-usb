- id: debug-port-capability
  section: programming-model
  title: Optional USB2 Debug Port capability and registers
  claim: >-
    An EHCI controller that implements the optional USB2 Debug Port reports its 1-based physical
    port number in HCSPARAMS bits 23:20 (non-zero, at most N_PORTS) and provides a PCI Capability
    in the standard PCI Capability List with CAP_ID = 0Ah (bits 7:0), NXT_PTR in bits 15:8, Offset
    in bits 28:16 (DWord-aligned byte offset within the target BAR, bits 17:16 always 0, up to 4
    KiB) and BAR# in bits 31:29 (valid values 1h to 6h, selecting the memory BAR at PCI
    configuration offset 10h to 24h). The Debug Port register interface (Table C-4) at BAR +
    Offset consists of Control/Status at 00h, USB PIDs at 04h, an 8-byte Data Buffer as two DWords
    at 08h and 0Ch (least significant byte at 08h, individually byte-accessible), and Device
    Address at 10h (bits 14:8 USB Address, default 7Fh; bits 3:0 USB Endpoint, default 01h). In
    Control/Status (Table C-5, preserving reserved bits with read-modify-write), bit 30 Owner
    (R/W, default 0) forces port ownership to the EHCI controller overriding CONFIGFLAG CF and
    PORTSC Port Owner, bit 28 Enabled (R/W, default 0) enables the debug port (software can set it
    directly only when PORTSC Port Enabled is 1), bit 16 Done (R/WC, default 0) indicates request
    completion, bit 10 In Use (R/W, default 0) is a software-only advisory flag, bits 9:7
    Exception (RO: 000b none, 001b transaction error or babble, 010b hardware error when port is
    suspended or reset, 011b-111b reserved) and bit 6 Error/Good# (RO) report completion status,
    bit 5 Go (R/W) starts a request (hardware clears Go when it sets Done; writing 1 while Go is 1
    is undefined), bit 4 Write/Read# selects write (1) or read (0), and bits 3:0 Data Length give
    the transfer byte count (0h for zero-length packet, 1h-8h for 1-8 bytes; 9h-Fh are illegal and
    undefined). In USB PIDs (Table C-6), bits 7:0 hold the outgoing Token PID (IN, OUT or SETUP),
    bits 15:8 hold the outgoing Send PID (typically DATA0 or DATA1), and bits 23:16 report the
    Received PID when Done is 1 and Error/Good# is 0. The Debug Port operates only with a
    high-speed debug device while the controller is in D0 and the port is neither suspended nor in
    reset, checking for debug requests at least every 125 us and transmitting 32-bit SYNC
