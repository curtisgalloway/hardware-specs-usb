- id: queue-head-layout-and-overlay
  section: programming-model
  title: Queue Head (QH) layout, endpoint capabilities and transfer overlay
  claim: >-
    Each control, bulk or interrupt endpoint is managed by a 32-byte-aligned Queue Head (48 bytes
    / 12 DWords in 32-bit mode; 68 bytes / 17 DWords in 64-bit mode, adding five 32-bit Extended
    Buffer Pointer DWords at offsets 30h-43h). DWord 0 (Table 3-18) is the Queue Head Horizontal
    Link Pointer: bits 31:5 hold the 32-byte-aligned address of the next QH, iTD, siTD or FSTN
    (never a qTD), bits 4:3 must be written as 0, bits 2:1 Typ select 00b iTD, 01b QH, 10b siTD or
    11b FSTN, and bit 0 Terminate (T) marks the end of the periodic list when 1 and is ignored in
    the asynchronous schedule (where software must keep T = 0 and horizontal pointers valid).
    DWord 1 (Table 3-19, static endpoint characteristics, never modified by the controller) holds
    Nak Count Reload RL (bits 31:28; must be 0 for interrupt endpoints), Control Endpoint Flag C
    (bit 27: set to 1 only when EPS is not high-speed and the endpoint is a control endpoint,
    otherwise 0), Maximum Packet Length (bits 26:16, wMaxPacketSize up to 400h = 1024), Head of
    Reclamation List Flag H (bit 15), Data Toggle Control DTC (bit 14: 0b preserves the DT bit in
    the QH overlay on qTD advance; 1b copies the initial DT bit from the incoming qTD), Endpoint
    Speed EPS (bits 13:12: 00b Full-Speed 12 Mb/s, 01b Low-Speed 1.5 Mb/s, 10b High-Speed 480
    Mb/s, 11b reserved), Endpoint Number (bits 11:8), Inactivate on Next Transaction I (bit 7,
    valid only for periodic full-/low-speed QHs; setting it to 1 in the asynchronous schedule or
    for a high-speed device is undefined) and Device Address (bits 6:0). DWord 2 (Table 3-20)
    holds High-Bandwidth Pipe Multiplier Mult (bits 31:30: 01b = 1, 10b = 2, 11b = 3 transactions
    per micro-frame; 00b is reserved and undefined), TT Port Number (bits 29:23, for full-/low-
    speed split transactions), Hub Addr (bits 22:16, USB 2.0 hub address for split transactions),
    uFrame C-Mask (bits 15:8, for periodic full-/low-speed complete-splits; 0 is undefined when
    used) and Interrupt Schedule Mask uFrame S-mask (bits 7:0: 00h on the asynchronous schedule,
    non-zero for interrupt endpoints on the periodic schedule; 00h on the periodic schedule is
    undefined). DWord 3 (Table 3-21) holds Current qTD Pointer (bits 31:5), and DWords 4-11 form
    the Transfer Overlay (Table 3-22), which mirrors a qTD and adds NakCnt in DWord 5 bits 4:1,
    C-prog-mask in DWord 8 bits 7:0, FrameTag in DWord 9 bits 4:0 and S-bytes in DWord 9 bits 11:5
    (software must ensure S-bytes in a qTD is 0 before activating it). When advancing the queue
    (Active = 0 and Halted = 0), the controller fetches the next qTD (using Alternate Next qTD
    Pointer if Total Bytes to Transfer != 0 and Alternate Next T = 0, otherwise Next qTD Pointer),
    overlays it into DWords 4-11 (reloading NakCnt from RL, zeroing C-prog-mask and FrameTag, and
    preserving Ping State for high-speed endpoints), executes transactions from the overlay, and
    writes Total Bytes to Transfer, CERR and Status back to the source qTD at Current qTD Pointer
    when Active transitions to 0.
