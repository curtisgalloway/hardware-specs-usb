- id: data-rate-register-role-inversion-and-hs1
  section: gotchas
  title: Data Rate register bit fields swap Tx/Rx roles between host and peripheral, and symmetric HS1 is invalid
  claim: >-
    In the Data Rate register (RAP address 4), bits d7:d4 always denote the Downstream Data Rate
    (DS Rate, host-to-peripheral) and bits d3:d0 always denote the Upstream Data Rate (US Rate,
    peripheral-to-host). The same byte value therefore configures opposite transceiver directions
    at the two ends of the link: d7:d0 = 00011010b configures a peripheral to receive at HS1 (480
    Mb/s) and transmit at HS10 (4.8 Gb/s), whereas on the host the same value configures the host
    to transmit at HS1 and receive at HS10. In addition, d7:d0 = 00010001b (symmetric HS1) is
    invalid in eUSB2V2, the Data Rate register applies only during Compliance Mode or Rx Margining
    Mode (and must not be changed in Functional Mode), and software must wait at least 10 ms after
    changing the data rate before the next operation.
  support:
