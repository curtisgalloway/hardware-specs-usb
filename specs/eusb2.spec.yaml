orientation: >-
  Terms: eUSB2V2 (Embedded USB2 Version 2.0) extends eUSB2 native mode for inside-the-box
  host-to-peripheral links, keeping the USB 2.0 half-duplex transactional protocol, device
  framework and software model while scaling the low-voltage differential PHY to gigabit rates.
  HSx denotes a bit rate of x times 480 Mb/s (HS1 is 480 Mb/s; HS2 through HS10 are 0.96 Gb/s to
  4.8 Gb/s). Links operate in symmetric high-speed mode (HSSx, x = 2..10) or asymmetric mode with
  one direction at x * 480 Mb/s and the other at 480 Mb/s (HSUx for fast upstream, HSDx for fast
  downstream). CM.RAP is the Control Message Register Access Protocol over the eUSB2 link, using
  CM.14 to reach an eUSB2V2 re-driver and CM.15 to reach a host or peripheral's 6-bit register
  space. This spec records the eUSB2V2 architecture, link speeds, PHY state machine, CM.RAP
  register map, scrambling and framing rules, timing bounds, isochronous burst transactions and
  device-framework descriptor and request extensions. Analog channel S-parameters, reference CTLE
  transfer curves, CDR/JTF equations and compliance eye masks are summarized only where software-
  visible registers reference them.
facts:
- id: scope-and-compatibility
  section: standards
  title: Scope, architecture and compatibility with USB 2.0 and eUSB2
  claim: >-
    eUSB2V2 is constructed on the USB 2.0 architectural base (half-duplex link, host-scheduled
    transactional protocol and device framework) and extends eUSB2 native mode for inside-the-box
    (embedded) peripheral interconnects. It is fully compatible with the USB 2.0 base
    specification at the protocol layer and makes no change to the USB 2.0 software programming
    model; client applications and device drivers, including all class drivers, require no
    modification, while host and peripheral controllers are updated for the eUSB2V2 PHY, protocol,
    new descriptors and increased MaxPacketSizes. eUSB2V2 operation is defined for native mode
    only: it is not compatible with standard USB 2.0 external connectors or external cables
    (though an internal cable and connector inside the system boundary are allowed), is not
    compatible at the physical layer with USB 2.0 or eUSB2 (Revision 1.2), and does not require
    physical- or protocol-level backward compatibility with USB 2.0 or eUSB2 or define how to
    switch to them. Support for eUSB2 native mode or repeater mode is optional, and any eUSB2V2
    port that optionally supports eUSB2 must comply with eUSB2 native mode operation.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '13'
      section: '1.1'
    - page: '13'
      section: '1.2'
    - pages: ['13', '14']
      section: '1.3'
    - page: '17'
      section: '2'
    - page: '18'
      section: '2.1'
    - page: '22'
      section: '3'
    - page: '27'
      section: '3.5'

- id: hsx-data-rates-and-link-modes
  section: standards
  title: HSx data rates and symmetric or asymmetric link configurations
  claim: >-
    eUSB2V2 bit rates, denoted HSx, are integer multiples of 480 Mb/s: HS1 is 480 Mb/s, and HS2
    through HS10 (multipliers x = 2 to 10) are 0.96 Gb/s (2), 1.44 Gb/s (3), 1.92 Gb/s (4), 2.4
    Gb/s (5), 2.88 Gb/s (6), 3.36 Gb/s (7), 3.84 Gb/s (8), 4.32 Gb/s (9) and 4.8 Gb/s (10). Upstream
    Facing Port (UFP) and Downstream Facing Port (DFP) links support three configurations for
    integer multipliers x from 2 to 10: HSSx (HSSx-speed, symmetric operation with identical
    upstream and downstream rates from 960 Mb/s to 4.8 Gb/s), HSUx (HSUx-speed, asymmetric
    operation with upstream at x * 480 Mb/s from 960 Mb/s to 4.8 Gb/s and downstream at 480 Mb/s)
    and HSDx (HSDx-speed, asymmetric operation with downstream at x * 480 Mb/s from 960 Mb/s to
    4.8 Gb/s and upstream at 480 Mb/s). HS1 (480 Mb/s) is used only as the slow direction of an
    asymmetric link; 480 Mb/s symmetric links are not supported by eUSB2V2 and, if desired, are
    optionally performed via eUSB2 native mode.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '16'
      section: '1.6'
    - page: '18'
      section: '2.1'
    - page: '19'
      section: 2.2.2
    - page: '20'
      section: 2.2.3
      table: '2-1'

- id: physical-bus-topology
  section: standards
  title: In-box physical bus topology, single re-driver limit and per-port bus instances
  claim: >-
    Unlike USB 2.0, which uses hub tiers for fanout and cable reach, eUSB2V2 supports only in-box
    physical topologies with at most one eUSB2V2 re-driver between a host root port and a
    peripheral. Multiple functions may be packaged in a single physical peripheral as a composite
    device that has a single device address and presents multiple independently controlled
    interfaces. The logical bus topology and client-software-to-function relationship are
    unchanged from USB 2.0 section 5.2.4. The host treats each downstream-facing eUSB2V2 port as
    an independent full eUSB2V2 bus instance for scheduling and bandwidth calculations, and no
    more than 90% of any frame or microframe may be allocated to periodic (isochronous and
    interrupt) transfers across the periodic endpoints on that port.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '18'
      section: '2.1'
    - pages: ['56', '57']
      section: 4.1.1
      figure: '4-1'
    - page: '57'
      section: 4.1.2
    - page: '57'
      section: '4.2'
    - page: '65'
      section: 6.4.2

- id: cm-rap-message-encoding
  section: programming-model
  title: Control Message Register Access Protocol (CM.RAP) CM.14 and CM.15 encodings and roles
  claim: >-
    eUSB2 defines a generic Control Message Register Access Protocol (CM.RAP) with a 64-byte
    register address space and Read, Write, Set and Clear messages using command message ID 15
    (CM.15), without defining register assignments. eUSB2V2 uses the term CM.RAP generically for
    both CM.14 and CM.15 and extends the eUSB2 Control Message table (where CM[3:0] = 0..13 with
    parity X remain as defined in the eUSB2 specification) by assigning CM.14 (CM[3:0] = 14,
    Parity = 0) as Start of Re-driver register access and CM.15 (CM[3:0] = 15, Parity = 1) as
    Start of host or peripheral register access. A peripheral device must implement CM.15 as a
    receptor, a re-driver is accessed via CM.14, and a host port must implement CM.15 both as an
    initiator (to access a peripheral's registers) and as a receptor (enabled on entry to
    Compliance Mode so external test equipment acting as a CM.15 initiator can access the host's
    PHY configuration and operational mode registers).
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '21'
      section: '2.3'
      table: '2-2'
    - page: '25'
      section: 3.3.1.5
    - page: '46'
      section: '3.9'

- id: phy-states-and-lpm
  section: programming-model
  title: PHY architecture, HSx bus states, L1/L2 power management and Connect/Reset transitions
  claim: >-
    The eUSB2V2 PHY retains the basic eUSB2 block structure (differential transceiver, low-power
    squelch detector, two pairs of single-ended buffers, pull-down resistors and LS/FS/HS
    transceiver requirements per eUSB2 section 3.1), and its operation state machine and power
    management match eUSB2 native mode: HSx bus state representation, HSx signaling, transition
    to HSx idle, squelch entry, Bus Reset, L1 (LPM-L1) and L2 Suspend entry, and Resume or Remote
    Wake from L1 and L2 Suspend all follow their eUSB2 native mode definitions. Unlike eUSB2,
    eUSB2V2 never allows an un-terminated receiver, replaces squelch exit with the 40-bit HSx SYNC
    pattern, and deprecates the HSx analog ping for disconnect detection (though a peripheral may
    still perform soft disconnect via XeSE1). In the Connect and Reset states, the host and
    peripheral follow the eUSB2 native mode HS connect and Bus Reset process, except that the HSx
    data rate and PHY settings are pre-determined prior to Connect so no HSx speed negotiation is
    performed during Bus Reset; upon completion of Bus Reset, the link enters L0 and starts
    eUSB2V2 operation.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '23'
      section: '3.1'
      figure: '3-1'
    - pages: ['23', '24']
      section: '3.2'
    - page: '24'
      section: '3.3'
    - page: '26'
      section: 3.3.2
    - pages: ['28', '29']
      section: '3.6'

- id: default-substates
  section: programming-model
  title: Default state sub-state machine
  claim: >-
    In the Default state, the host may optionally configure its own PHY transceiver and configure
    the peripheral transceiver via CM.15 (or implementation-specific means). Default defines five
    operational sub-states after initial Power-up: (1) Port Reset, where the host transmits XeSE1
    to reset the link (entered by a peripheral upon detecting XeSE1, and entered by a host when
    directed to exit Rx Margining Mode) without resetting the PHY configuration registers at RAP
    addresses 4 and 7 through 10; (2) PHY Configuration, an optional substate for configuring host
    or peripheral PHY registers before Port Configuration, Compliance Mode or Rx Margining Mode,
    where peripheral configuration via CM.15 takes priority over other means; (3) Port
    Configuration, where the host initiates the Port Configuration handshake by enabling its
    receiver termination to synchronize and conclude link initialization before Connect; (4) Rx
    Margining Mode, entered to perform host or peripheral receive margining (optional for an HS1
    receiver) by setting bits d2:d0 of both Operational Mode registers to 010b (host Rx margining)
    or 110b (peripheral Rx margining); and (5) Compliance Mode, entered when a host is directed
    into Compliance Mode (enabling its CM.15 receptor for external test equipment) or when a
    peripheral's Operational Mode register bits d1:d0 are set to 01b via CM.15.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '24'
      section: 3.3.1
    - page: '24'
      section: 3.3.1.1
    - page: '24'
      section: 3.3.1.2
    - page: '24'
      section: 3.3.1.3
    - page: '25'
      section: 3.3.1.4
    - page: '25'
      section: 3.3.1.5
    - page: '26'
      figure: '3-2'

- id: scrambling-and-bit-stuffing
  section: programming-model
  title: Packet LFSR scrambling and bit-stuffing rules
  claim: >-
    All packets in both directions must be scrambled starting with the first byte after the PID
    and ending with the last byte before EOP. Scrambling and unscrambling use a free-running
    16-bit Linear Feedback Shift Register (LFSR) implementing G(X) = X^16 + X^5 + X^4 + X^3 + 1
    initialized to seed FFFFh (D0-D15): for each 8-bit character (D0-D7), LFSR output D15 is
    serially XORed with data bit D0 through D7, advancing the LFSR and data register after each
    XOR for eight serial shifts per symbol. Bit stuffing follows USB 2.0 except that it is applied
    after scrambling and starts with the first J of the SYNC pattern.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '30'
      section: 3.6.1
      figure: '3-5'

- id: hsx-sync-and-sof-eop
  section: programming-model
  title: 40-bit HSx SYNC pattern and SOF EOP translation
  claim: >-
    The HSx SYNC pattern is 40 bits long: the first 24 bits are consecutive Ks (to reduce squelch
    detector sensitivity when using a half-differential comparator for squelch exit, whereas
    squelch entry still requires a fully differential detector), followed by seven KJ pairs (14
    bits) and ending with two Ks. Host, peripheral and eUSB2V2 re-driver receivers may each
    consume up to 8 Ks when exiting the HSx idle state. With analog ping removed, the SOF packet's
    EOP on the wire remains 8 UIs, and the host PHY must report 40 UIs of EOP to the host
    controller while transmitting only 8 UIs of EOP.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - pages: ['30', '31']
      section: 3.6.2
      figure: '3-6'

- id: interpacket-delay-and-timeout
  section: programming-model
  title: HSx inter-packet delays, bus turnaround limit and transaction timeout
  claim: >-
    HSx inter-packet delays are measured from when the line returns to HSx idle at the end of one
    packet to when it leaves HSx idle at the start of the next: (1) consecutive packets traveling
    in the same direction require a minimum inter-packet delay of at least THSXIPDSD = 32 transmit
    bit times; (2) transmitting after receiving a packet (opposite direction) requires a minimum
    inter-packet delay of at least THSXIPDOD = 32 responding PHY transmit bit times; (3) the
    maximum bus turnaround time (maximum host or peripheral response time) is THSXRSPIPD1 = 1920
    HS10 bit times, and when a peripheral transmits consecutive packets their delay must not
    exceed THSXRSPIPD1 (if exceeded, the peripheral must not send further data packets within the
    transaction); and (4) a host or peripheral assumes a transaction timeout after TTIMEOUT = 1 us
    (minimum), with the timeout counter reset and restarted after every packet received in an
    isochronous burst.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '31'
      section: 3.6.3
    - page: '32'
      table: '3-2'

- id: rap-register-map
  section: programming-model
  title: Configuration and operational mode register map (6-bit RAP address space)
  claim: >-
    Hosts, peripherals and re-drivers must implement their applicable registers in the 6-bit RAP
    address space (0 to 63, accessed via CM.15 on hosts and peripherals and CM.14 on re-drivers):
    addresses 0 (Vendor ID Low), 1 (Vendor ID High), 2 (Product ID Low) and 3 (Product ID High)
    are read-only on Peripheral and Re-driver (N/A on Host); address 4 (Data Rate: DS Rate in
    d7:d4, US Rate in d3:d0; applicable only during Compliance Mode or Rx Margining Mode), address
    5 (Operational Mode, default 0: Trig d7, DScr d6, TP d5:d3, Dir d2, Mode d1:d0; writing a test
    mode triggers entry into test mode) and address 6 (Error Count, default 0) are read/write on
    Host and Peripheral (N/A on Re-driver); address 7 (Tx Configuration: DE in d4:d3, Vswing in
    d2:d0) is read/write for Host Downstream, Peripheral Upstream and Re-driver Upstream;
    addresses 8 (Tx Configuration Downstream, vendor defined) and 9 (Rx Configuration Upstream,
    vendor defined) are read/write on Re-driver only (N/A on Host and Peripheral); address 10 (Rx
    Configuration: VGA in d6:d4, CTLE in d3:d0) is read/write for Host Upstream, Peripheral
    Downstream and Re-driver Downstream; addresses 11 (Rx Voltage Margining, default 0) and 12 (Rx
    Timing Margining, default 0) are read/write on Host and Peripheral (N/A on Re-driver);
    addresses 13:31 are Reserved (read/write); and addresses 32:63 are Vendor defined
    (read/write).
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '46'
      section: '3.9'
    - page: '46'
      section: 3.9.1
      table: '3-11'
    - page: '47'
      table: '3-12'
    - pages: ['48', '49']
      table: '3-13'
    - page: '49'
      table: '3-14'
  todo:
    check: document
    text: >-
      The per-field mode applicability cells across Compliance Mode, Rx Margining Mode, Functional
      Mode and Debug Operation in Functional Mode in Tables 3-13 and 3-14 (pp. 48-49) and the
      external test equipment compliance test sequences of sections 3.7.5, 3.8.5 and 3.9 (pp.
      35-36, 40-41 and 46) are not extracted in full.

- id: data-rate-register
  section: programming-model
  title: Data Rate register (RAP address 4) encodings and 10 ms PLL settling delay
  claim: >-
    In the 8-bit Data Rate register (RAP address 4), bits d7:d4 select the Downstream Data Rate
    (DS Rate) and bits d3:d0 select the Upstream Data Rate (US Rate). Both 4-bit fields use the
    same encoding: 0000b Reserved, 0001b HS1, 0010b HS2, 0011b HS3, 0100b HS4, 0101b HS5, 0110b
    HS6, 0111b HS7, 1000b HS8, 1001b HS9, 1010b HS10, and 1011b through 1111b Reserved. Default
    values on the host and peripheral are implementation-specific, the symmetric-HS1 value
    d7:d0 = 00010001b is invalid, and because changing data rate typically changes the PHY's PLL
    frequency, software must wait at least 10 ms after changing the Data Rate register before the
    next operation.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '50'
      section: 3.9.2
      table: '3-15'
    - page: '50'
      table: '3-16'
    - page: '51'
      figure: '3-15'

- id: operational-mode-and-error-count-registers
  section: programming-model
  title: Operational Mode (RAP address 5) and Error Count (RAP address 6) registers
  claim: >-
    In the Operational Mode register (RAP address 5): Mode (d1:d0) is 00b Functional Mode
    (default), 01b Compliance Mode, 10b Rx Margining Mode, 11b Reserved; Dir (d2) is 0 Upstream
    (Peripheral Tx and Host Rx) or 1 Downstream (Host Tx and Peripheral Rx); TP (d5:d3) selects a
    test pattern framed with Sync and EOP — 000b 3M bits of alternating 0 and 1 (1 shot, no
    scrambling/bit-stuffing/NRZI), 001b 3M bits of PRBS16 + bit-stuffing + NRZI (1 shot), 010b
    8192 bits of PRBS16 + bit-stuffing + NRZI repeated 1k times with THSXIPDSD inter-packet delay,
    011b 1k bits of PRBS7 repeated 10k times with THSXIPDSD delay (scrambled, no bit-stuffing or
    NRZI), 100b 8 bits of PRBS7 repeated 100k times with THSXIPDSD delay (scrambled, no
    bit-stuffing or NRZI), 101b (64 bits of 0 + 64 bits of 1) repeated 1k times (1 shot, no
    scrambling/bit-stuffing/NRZI), and 110b..111b Reserved (PRBS16 uses G(X) = X^16 + X^5 + X^4 +
    X^3 + 1 with seed FFFFh and all-zero input; PRBS7 uses G(X) = X^7 + X^6 + 1 with seed FFh and
    all-zero input); DScr (d6) is 0 scrambler/de-scrambler enabled (default) or 1 disabled
    (applicable only in Functional Mode debug operation and ignored in Compliance and Rx Margining
    modes); and TP Trigger (d7) is 0 Idle or 1 Triggered (set to 1 to transmit the selected test
    pattern and reset to 0 by the PHY once transmission completes). The 8-bit Error Count register
    (RAP address 6, bits 7:0) counts bit errors during Rx compliance testing or Rx margining, does
    not roll over, and saturates at FFh until reset by the PHY or explicitly written to 0.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - pages: ['48', '49']
      table: '3-13'
    - page: '49'
      table: '3-14'
