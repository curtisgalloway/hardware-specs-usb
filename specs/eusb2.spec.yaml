- id: isochronous-burst-transactions
  section: programming-model
  title: Isochronous burst transactions, Burst Count and DATA2/DATA1/DATA0/MDATA PID sequencing
  claim: >-
    eUSB2V2 isochronous endpoints execute burst transactions managed automatically by the host
    controller for data transactions greater than 1024 B, transferring 1, 2 or 3 consecutive data
    packets after a single IN or OUT token packet with no handshake phase. A service interval's
    (SI's) burst sequence consists of one or more burst transactions; every burst transaction in
    the sequence contains 3 data packets except the last, which may be a short burst transaction
    (< 3072 B), and every data packet is 1024 B except the last data packet of a short burst
    transaction, which is a short packet (< 1024 B, including zero-length) unless
    dwBytesPerInterval bytes have been transferred and is a multiple of 1024 B. Within a burst
    transaction, Burst Count is derived from the bytes remaining for the transfer — 1 for <= 1024
    B, 2 for 1025 B to 2048 B, and 3 for > 2048 B: for <= 1024 B, both IN and OUT send DATA0; for
    1025 B to 2048 B, IN sends DATA1 then DATA0 while OUT sends MDATA then DATA1; for 2049 B to
    3072 B, IN sends DATA2, DATA1 then DATA0 (descending order, always ending with DATA0) while
    OUT sends two MDATA packets followed by DATA2 (always sending MDATA until the final packet of
    the burst, which is DATA2, DATA1 or DATA0).
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '16'
      section: '1.6'
    - page: '19'
      section: 2.2.1
    - page: '58'
      section: '4.6'
    - pages: ['58', '60']
      section: 4.6.1
      figure: '4-2'
    - page: '64'
      section: '6.4'
    - page: '64'
      section: 6.4.1

- id: isochronous-error-handling
  section: programming-model
  title: Isochronous burst error handling and IN versus OUT recovery
  claim: >-
    Isochronous transfers do not support handshakes or retransmission. A data error is indicated
    in a service interval if any USB 2.0 section 8.7 error condition occurs, if a data PID is
    missing in the expected burst sequence, or if the service interval ends without a terminating
    short burst transaction when fewer than dwBytesPerInterval bytes have been received. If a PID
    Check, Bit Stuff or Data CRC (CRC16) error is detected on a data packet, the endpoint drops
    that packet, transitions to the HSx idle state and drops all subsequent data packets until the
    end of the service interval; any error in a service interval invalidates and drops all data
    for that endpoint (and retires the associated IRP) for that service interval. During an
    isochronous IN transaction expecting more than one data packet (dwBytesPerInterval > 1024), if
    the host receives a corrupted data packet while still expecting further data packets, the host
    must not start a new transaction until TTIMEOUT (1 us) is detected; during an isochronous OUT
    transaction, if the host runs out of data, it may start a new transaction immediately
    (observing THSXIPDSD) and the peripheral treats the uncompleted transaction as corrupted and
    processes the new transaction.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '31'
      section: 3.6.3
    - pages: ['58', '60']
      section: 4.6.1
      figure: '4-2'
    - page: '64'
      section: '6.4'
    - page: '65'
      section: 6.4.3

- id: device-and-endpoint-descriptors
  section: programming-model
  title: eUSB2V2 Device, Endpoint, Alternate Interface and Isochronous Endpoint Companion descriptors
  claim: >-
    An eUSB2V2 peripheral adjusts the configuration bandwidth settings it presents according to
    its connected speed (HSSx, HSUx or HSDx). Its standard Device descriptor sets bcdUSB to 0x230
    and bMaxPacketSize0 to 64 B. Control, bulk and interrupt endpoints use standard USB 2.0
    Endpoint descriptors (with control and interrupt transfer semantics unchanged from USB 2.0).
    For each isochronous endpoint, the standard Endpoint descriptor sets wMaxPacketSize to 0
    (declaring zero bandwidth) and is immediately followed in the GetDescriptor(Configuration)
    response (before the next endpoint or interface descriptor; never directly accessible via
    GetDescriptor() or SetDescriptor()) by an 8-byte eUSB2 Isochronous Endpoint Companion
    descriptor: bLength (offset 0, 1 byte, value 8), bDescriptorType (offset 1, 1 byte, constant
    EUSB2_ISO_ENDPOINT_COMPANION), wMaxPacketSize (offset 2, 2 bytes, set to 1024 unless the
    endpoint transfers less than 1024 B per Service Interval) and dwBytesPerInterval (offset 4, 4
    bytes, the maximum bytes transferred per Service Interval, replacing the USB 2.0
    high-bandwidth wMaxPacketSize bits 12:11 multiplier and allowing more than 3072 B per
    microframe; if dwBytesPerInterval > 1024 B, the Service Interval must be 1 microframe). To
    support legacy software, an eUSB2V2 peripheral with isochronous endpoints must also include at
    least one Alternate Interface that declares all of its isochronous endpoints with a maximum
    packet size of 1024 B and a Mult of 3.
  support:
