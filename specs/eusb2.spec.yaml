- id: cm-rap-no-error-detection-and-legacy-alt-interface
  section: gotchas
  title: CM.RAP lacks error detection, VGA text/table range differs, and the legacy alternate interface still uses eUSB2V2 bursts
  claim: >-
    Three specification subtleties affect software and PHY bring-up: (1) the CM.RAP protocol
    includes no error detection mechanism, so software should read back RAP registers to confirm
    writes when debugging; (2) section 3.8.1 states that the receiver Variable Gain Amplifier
    (VGA) should be programmable from 0 to 2.5x amplification, whereas Table 3-26 defines the
    3-bit VGA field (d6:d4 of RAP address 10) from 1x (000b) to 2.5x (110b) in 0.25x steps (with
    tables taking precedence over figures and text under section 1.5.1); and (3) when legacy
    system software selects the mandatory backward-compatible Alternate Interface (which declares
    isochronous endpoints with standard wMaxPacketSize = 1024 B and Mult = 3), those isochronous
    endpoints must still follow the eUSB2V2 protocol even when transferring less than 3072 B.
  support:
