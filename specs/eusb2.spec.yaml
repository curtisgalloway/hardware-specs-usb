      section: 3.9.3
      table: '3-17'
    - page: '52'
      table: '3-18'
    - page: '52'
      table: '3-19'
    - page: '53'
      table: '3-20'
    - page: '53'
      table: '3-21'
    - page: '53'
      section: 3.9.4
      table: '3-22'

- id: tx-and-rx-configuration-registers
  section: programming-model
  title: Transmit Configuration (RAP address 7) and Receive Configuration (RAP address 10) registers
  claim: >-
    The 8-bit Transmit Configuration register (RAP address 7, bits d7:d5 reserved) configures
    transmitter differential peak-to-peak voltage swing Vswing (d2:d0: 000b 360 mV, 001b 400 mV,
    010b 500 mV, 011b 600 mV, 100b 700 mV, 101b 800 mV, 110b..111b Reserved) and de-emphasis boost
    DE (d4:d3: 00b 0 dB, 01b -3.5 dB, 10b -6 dB, 11b -8 dB); the normative transmitter swing range
    is 360 to 800 mVdiff-pp and de-emphasis range is 0 to -8 dB (recommended minimum support of 0,
    -3.5, -6 and -8 dB), while the specific Table 3-23 and Table 3-24 bit encodings are
    informative. The 8-bit Receive Configuration register (RAP address 10, bit d7 reserved)
    configures receiver CTLE boost (d3:d0: 0000b through 1000b for 0 dB through 8 dB in 1 dB
    steps, 1001b..1111b Reserved) and Variable Gain Amplifier gain multiplier VGA (d6:d4: 000b 1x,
    001b 1.25x, 010b 1.5x, 011b 1.75x, 100b 2x, 101b 2.25x, 110b 2.5x, 111b Reserved; section
    3.8.1 states the VGA should be programmable from 0 to 2.5x); the Table 3-25 and Table 3-26
    settings are informative recommendations provided the implementation can meet the strongest
    2.5x VGA gain plus 8 dB CTLE boost.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
