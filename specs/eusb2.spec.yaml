- id: sof-eop-host-phy-translation-and-no-analog-ping
  section: gotchas
  title: Host PHY translates 8-UI wire SOF EOP into 40-UI controller EOP and deprecates analog ping
  claim: >-
    eUSB2V2 deprecates the HSx analog ping mechanism for in-band disconnect detection because
    embedded peripheral connectivity is known and managed by the system (though a peripheral may
    still perform soft disconnect based on XeSE1). With analog ping removed, the EOP of an SOF
    packet on the wire remains 8 UIs, but to maintain interoperability with the host controller,
    the host PHY must report 40 UIs of EOP to the host controller while transmitting only 8 UIs of
    EOP on the link.
  support:
