- id: port-reset-preserves-phy-config-registers
  section: gotchas
  title: Entering Port Reset via XeSE1 does not reset PHY Data Rate or Tx/Rx Configuration registers
  claim: >-
    When the host transmits XeSE1 to enter the Port Reset substate of Default (including when it
    is directed to exit Rx Margining Mode), the PHY configuration registers at RAP addresses 4
    (Data Rate) and 7 through 10 (Tx Configuration and Rx Configuration) are not reset so that PHY
    Configuration does not need to be reprogrammed across port resets. Consequently, if margining
    software changes any transmitter or receiver configuration register values during Rx Margining
    Mode, it must explicitly restore them to their functional-mode values before exiting Rx
    Margining Mode into Port Reset.
