- id: receive-margining-registers-and-flow
  section: programming-model
  title: Receive voltage and timing margining registers (RAP addresses 11 and 12) and software flows
  claim: >-
    Host and peripheral eUSB2V2 receivers must support software-controlled receive voltage and
    timing margining in the Default state (Rx Margining Mode; optional for an HS1 receiver, and
    hardware-based margining is optional and vendor-specific). Rx Voltage Margining (RAP address
    11, bits 7:0) and Rx Timing Margining (RAP address 12, bits 7:0) take vendor-specific signed
    8-bit offsets (default 0). Voltage margining requires independent positive (high) and negative
    (low) directions with a range of +/- 74 mV (min) to +/- 200 mV (max) and a maximum step size
    of 3 mV; timing margining requires a range of +/- 0.2 UI (min) to +/- 0.5 UI (max) and a
    maximum step size of 0.03 UI (independent left/right directions are optional but recommended).
    For host Rx margining, software directs the link into Default, clears the host's error count
    and margining registers, writes 00001010b to the host Operational Mode register (upstream
    Dir = 0, TP(1), Rx Margining Mode) and writes 10001010b via CM.15 to the peripheral
    Operational Mode register so the peripheral waits THSXIPDSD, transmits TP(1) and clears d7 to
    0. For peripheral Rx margining, software clears the peripheral's error count and margining
    registers via CM.15, writes 00001110b via CM.15 to the peripheral Operational Mode register
    (downstream Dir = 1, TP(1), Rx Margining Mode) and writes 10001110b to the host Operational
    Mode register so the host waits THSXIPDSD, transmits TP(1) and clears d7 to 0.
  support:
  - class: standard
    doc: eusb2-2.0.pdf
    at:
    - page: '25'
      section: 3.3.1.4
    - pages: ['41', '42']
      section: 3.8.6
      table: '3-10'
    - pages: ['43', '44']
