- id: bulk-max-packet-update
  section: programming-model
  title: SetFeature(BULK_MAX_PACKET_UPDATE) for 1024-byte bulk endpoints
  claim: >-
    Every eUSB2V2 peripheral that supports Bulk endpoints must support the standard device request
    SetFeature(BULK_MAX_PACKET_UPDATE): bmRequestType 00000000B (recipient Device), bRequest
    SET_FEATURE, wValue BULK_MAX_PACKET_UPDATE (feature selector value 8), wIndex 0, wLength 0 and
    no Data stage. This request sets the maximum packet size of all Bulk endpoints in the
    peripheral to 1024 B when operating with eUSB2V2-compliant software. It is valid in the
    Default and Address (Addressed) states and is not valid in the Configured state. An eUSB2V2
    Bulk endpoint reverts its maximum packet size to 512 B upon a USB 2.0 Bus Reset, a Disconnect
    or Deconfiguration.
