- id: bulk-descriptor-stays-512
  section: gotchas
  title: Bulk endpoint descriptor wMaxPacketSize remains 512 even after BULK_MAX_PACKET_UPDATE
  claim: >-
    Even after the host issues SetFeature(BULK_MAX_PACKET_UPDATE) (feature selector 8) in the
    Default or Address state to raise the active maximum packet size of all Bulk endpoints to 1024
    bytes, the wMaxPacketSize field in each Bulk endpoint's standard Endpoint descriptor must
    always remain set to 512, independent of whether the current maximum packet size is 512 or
    1024. Because SetFeature(BULK_MAX_PACKET_UPDATE) is invalid in the Configured state and bulk
    endpoints revert to 512 bytes on USB 2.0 Bus Reset, Disconnect or Deconfiguration, host
    software must issue the request before SetConfiguration() and re-issue it after any reset,
    disconnect or deconfiguration.
