# The corpus ledger (driver-lab, skills/spec-format/SKILL.md, "Corpus ledger"): every document
# and block of the USB standard family found in discovery, each with a disposition. A document's
# name equals its resources.documents name in the specs that cite it.
format: 2
derivation: >-
  Documents: the USB-IF document library's specification listing (usb.org/documents, category
  Specification) filtered to the USB, xHCI, Type-C, USB PD and TCPCI family, plus Intel's
  public host controller interface specifications (xHCI, EHCI). Blocks: the software-visible
  interfaces those documents define (host controller interfaces, port controller interfaces,
  connector and power-delivery protocols), one per document that defines a programming model,
  with the xHCI extended capabilities of Table 7-2 that a driver handles separately.
documents:
- name: xhci-1.2c.pdf
  title: eXtensible Host Controller Interface for Universal Serial Bus (xHCI) Requirements Specification, Revision 1.2c
  sha256: 0b06318005c3e0c8b896f2a002c2a3c78426b5fdacac4ad1cc02ffec15835190
  access: public
  subsystem: host-controller
  disposition: spec:xhci
- name: xhci-1.2b.pdf
  title: eXtensible Host Controller Interface for Universal Serial Bus (xHCI) Requirements Specification, Revision 1.2b
  access: public
  subsystem: host-controller
  disposition: "excluded: superseded by revision 1.2c, and its pages are stamped Intel Confidential although Intel serves it publicly; a public root cites 1.2c instead"
- name: usb-type-c-2.5.pdf
  title: Universal Serial Bus Type-C Cable and Connector Specification, Release 2.5
  sha256: 6636cd61387a2f78b0fa96c8ea86ccc0f39ec59f98821cdb57b206d31445a328
  access: public
  subsystem: type-c
  disposition: spec:usb-type-c
- name: usb-pd-r3.2
  title: Universal Serial Bus Power Delivery Specification, Revision 3.2
  access: public
  subsystem: power-delivery
  disposition: "planned: a USB PD protocol spec"
- name: usb-tcpci-r2.0
  title: Universal Serial Bus Type-C Port Controller Interface Specification, Revision 2.0, Version 1.3
  access: public
  subsystem: type-c
  disposition: "planned: a TCPCI register-interface spec"
- name: usb-ucsi-3.1
  title: USB Type-C Connector System Software Interface (UCSI) Specification, Revision 3.1
  access: public
  subsystem: type-c
  disposition: "planned: after the Type-C and PD specs it depends on"
- name: usb-2.0.pdf
  title: Universal Serial Bus Specification Revision 2.0 (base specification, April 2000)
  sha256: d39698a33486c399124af92bd02e4f978fd9a836b5cf4e52e6e4633eb1d89f61
  access: public
  subsystem: protocol
  disposition: spec:usb2
- name: usb-2.0-ecns
  title: USB 2.0 errata and engineering change notices (Connect Timing, LPM, IAD and others)
  access: public
  subsystem: protocol
  disposition: "planned: the ECNs in the USB 2.0 package, starting with Connect Timing and Link Power Management"
- name: usb-3.2
  title: Universal Serial Bus 3.2 Specification
  access: public
  subsystem: protocol
  disposition: "planned: protocol facts the host controller specs refer to"
- name: usb4
  title: USB4 Specification
  access: public
  subsystem: protocol
  disposition: "planned: no USB4 host router spec has been requested yet"
- name: eusb2
  title: Embedded USB2 (eUSB2) Version 2.0 Supplement to the USB 2.0 Specification
