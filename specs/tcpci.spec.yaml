- id: cc-status-register
  section: programming-model
  title: CC_STATUS register (1Dh) and CC debounce timing
  claim: >-
    CC_STATUS (1Dh, read-only, unlatched, B7:6 reserved 0) is updated by the TCPC within tSetReg
