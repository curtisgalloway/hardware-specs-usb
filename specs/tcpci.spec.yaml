      figure: 'A-3'

- id: gotcha-rx-buffer-overflow-and-nested-alert-clearing
  section: gotchas
  title: Clearing RxBufferOverflow or nested alerts in the wrong order leaves Alert# asserted or discards transmits
  claim: >-
    Writing 1b to ALERT.RxBufferOverflow (B10) alone only acknowledges the overflow and does not
    clear it: RxBufferOverflow stays asserted as long as the SOP* receive buffer registers are
    full, and those registers can only be cleared by writing 1b to ALERT.ReceiveSOP*MessageStatus
    (B2). While RxBufferOverflow is 1b, the TCPC suppresses automatic GoodCRC replies to incoming
    messages, so the TCPM should clear RxBufferOverflow and ReceiveSOP*MessageStatus in the same
    ALERT write after reading RECEIVE_BUFFER. Likewise, for the latched nested status registers
    FAULT_STATUS (1Fh) and ALERT_EXTENDED (21h), the TCPM must clear all active bits in
    FAULT_STATUS or ALERT_EXTENDED before writing 1b to ALERT.Fault (B9) or ALERT.AlertExtended
    (B14). Finally, the TCPM must clear all received message alerts before writing TRANSMIT for
    anything other than a Hard Reset: if ALERT.ReceivedHardReset (B3) or
    ALERT.ReceiveSOP*MessageStatus (B2) is still 1b when TRANSMIT is written, the TCPC discards the
    transmit request and asserts ALERT.TransmitSOP*MessageDiscarded (B5).
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - pages: ['18', '19']
      section: '3.3'
    - pages: ['44', '45']
      section: 4.4.2
      table: '4-8'
    - page: '64'
