- id: fault-control-and-status-registers
  section: programming-model
  title: FAULT_CONTROL (1Bh), FAULT_STATUS (1Fh), ALERT_EXTENDED (21h), GENERIC_TIMER (2Ch..2Dh) and watchdog timer
  claim: >-
    FAULT_CONTROL (1Bh, R/W, reset 00h, B7:5 reserved 0) enables fault detection when a bit is 0b
    and disables it when 1b (setting a FAULT_CONTROL bit to 1b also forces the corresponding
    FAULT_STATUS bit to 0b so the TCPM ignores it, and writing all 1s powers down all fault
    circuitry): B0 VCONN Over Current Fault, B1 Internal or External OVP, B2 Internal or External
    OCP, B3 VBUS Discharge Fault Detection Timer (enables/disables the timers for both
    AutoDischargeFailed and ForceDischargeFailed; required), and B4 Force Off VBUS (0b allow
    STANDARD_INPUT.ForceOffVbus control, default; 1b block). FAULT_STATUS (1Fh, R/W, reset 80h,
    latched RW1C) bits are cleared by writing 1b to the bit positions and then writing 1b to
    ALERT.Fault after all FAULT_STATUS bits are cleared: B0 I2C Interface Error, B1 VCONN Over
    Current Fault, B2 Internal or External OVP, B3 Internal or External OCP, B4 Force Discharge
    Failed (VBUS not below vSafe0V within tSafe0V when StopDischargeThreshold = 0b and
    ForceDischarge = 1b), B5 Auto Discharge Failed (VBUS not below vSafe0V within tSafe0V when
    AutoDischargeDisconnect = 1b), B6 Force Off VBUS (VBUS disconnected due to
    STANDARD_INPUT.ForceOffVbus), and B7 AllRegistersResetToDefault (asserted at initial power-up
    or unexpected power reset). The TCPC must assert B0 I2CInterfaceError when the TCPM writes
    TRANSMIT for an SOP* message while TRANSMIT_BUFFER has fewer than 2 bytes, when the watchdog
    timer expires, when the TCPM writes an invalid COMMAND, when the TCPM writes TRANSMIT_BUFFER
    while the TCPC is transmitting a Fast Role Swap signal triggered by the Standard Input pin,
    when the TCPM writes CONFIG_EXTENDED1.FRSwapBidirectionalPin without
    STANDARD_INPUT_CAPABILITIES.SourceFastRoleSwap = 10b, or when the Main State-Machine enters
    Connected_Invalid (and may assert it on reserved-bit, unaligned or multi-register I2C
    accesses). ALERT_EXTENDED (21h, R/W, reset 00h, B7:3 reserved 0, RW1C cleared before clearing
    ALERT.AlertExtended) reports B0 Sink Fast Role Swap (FRS signal received), B1 Source Fast Role
    Swap (FRS signal sent due to Standard Input pin low), and B2 Timer Expired (asserted when the
    optional 16-bit write-only GENERIC_TIMER at 2Ch..2Dh, 0.1 ms LSB, expires; writing a non-zero
    value starts or restarts GENERIC_TIMER and writing 0000h stops it). When
    TCPC_CONTROL.EnableWatchdogTimer is 1b, the watchdog timer starts when Alert# is asserted (or
    any unmasked ALERT bit is set) and resets on any TCPM I2C read or write (restarting if Alert#
    remains asserted); if it expires after tHVWatchdog (650 to 5000 ms, Table 4-49), the TCPC
    immediately sets ROLE_CONTROL bits 3:0 to 1111b (Open/Open), disconnects Source or Sink paths,
    discharges VBUS to vSafe0V (removing the discharge circuit edge-triggered once below vSafe0V),
    and sets FAULT_STATUS.I2CInterfaceError.
