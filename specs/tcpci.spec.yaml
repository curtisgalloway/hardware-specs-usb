- id: pd-receive-buffer-and-protocol
  section: programming-model
  title: Reading USB PD messages from RECEIVE_BUFFER (30h)
  claim: >-
    RECEIVE_BUFFER is read-only and comprises READABLE_BYTE_COUNT, RX_BUF_FRAME_TYPE and
    RX_BUF_BYTE_x, all accessed only by reading at register address 30h (Table 4-1, Figure 4-6). A
    read at 30h returns READABLE_BYTE_COUNT first (the number of bytes in RX_BUF_BYTE_x plus 1 for
    RX_BUF_FRAME_TYPE, or 1 when a Cable Reset is received; its value is undefined when
    RECEIVE_BUFFER is cleared), then the hidden RX_BUF_FRAME_TYPE byte (B7:3 reserved 0; B2:0: 000b
    SOP, 001b SOP', 010b SOP'', 011b SOP_DBG', 100b SOP_DBG'', 110b Cable Reset), followed by the
    hidden RX_BUF_BYTE_x payload bytes. The TCPC auto-increments the RX_BUF_BYTE_x pointer as the
    TCPM reads RX_BUF_BYTE_x, but does not increment it when the TCPM reads only
    READABLE_BYTE_COUNT or RX_BUF_FRAME_TYPE; writing COMMAND.ResetReceiveBuffer (EEh) resets the
    pointer (to offset 1 when at 132 or less, or offset 133 when at 133 or higher) without clearing
    the buffer. When DEVICE_CAPABILITIES_2.LongMessage is 0b, RECEIVE_BUFFER holds two 30-byte SOP*
    messages and READABLE_BYTE_COUNT is at most 31; when LongMessage is 1b, it holds one 264-byte
    SOP* message plus one 30-byte SOP* message and READABLE_BYTE_COUNT is at most 133. For an SOP*
    message with <= 128 data bytes (READABLE_BYTE_COUNT <= 133), the TCPC asserts
    ALERT.ReceiveSOP*MessageStatus (B2); after the TCPM reads the buffer, writing 1b to B2 clears
    the receive buffer registers, sets READABLE_BYTE_COUNT to 0, and loads the next buffered
    message (if any) into RX_BUF_BYTE_x. For an extended SOP* message with > 128 data bytes
    (LongMessage = 1b), the TCPC loads the 4 header bytes and first 128 data bytes
    (READABLE_BYTE_COUNT = 133) and asserts ALERT.BeginningSOP*MessageStatus (B12); after the TCPM
    reads those 134 bytes and writes 1b to B12, the TCPC clears that first half, loads the
    remaining data bytes (up to 132 bytes, with the pointer at offset 133), and asserts
    ALERT.ReceiveSOP*MessageStatus (B2), which the TCPM reads and clears by writing 1b to B2. When
    SMBus PEC is enabled, the TCPM must read as many bytes in the buffer as defined in
    READABLE_BYTE_COUNT in one I2C read transaction (plus the PEC byte).
