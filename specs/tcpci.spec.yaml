- id: pd-transmit-buffer-and-protocol
  section: programming-model
  title: Transmitting USB PD messages via TRANSMIT_BUFFER (51h) and TRANSMIT (50h)
  claim: >-
    To transmit an SOP* message, the TCPM writes the message header and data bytes into
    TRANSMIT_BUFFER at address 51h (Figure 4-5) and then writes TRANSMIT (50h, R/W, reset 00h; the
    TCPC is not allowed to NAK TRANSMIT). Each write to 51h begins with I2C_WRITE_BYTE_COUNT
    followed by that exact number of hidden TX_BUF_BYTE_x bytes in a single I2C write transaction:
    if the number of bytes written differs from I2C_WRITE_BYTE_COUNT, the TCPC asserts
    FAULT_STATUS.I2CInterfaceError and ignores the write (leaving TX_BUF_BYTE_x and its pointer
    unchanged). When DEVICE_CAPABILITIES_2.LongMessage is 0b, TRANSMIT_BUFFER holds up to 30 bytes
    and the TCPC ignores any write transaction with I2C_WRITE_BYTE_COUNT > 30; when LongMessage is
    1b, TRANSMIT_BUFFER holds up to 264 bytes written in bursts of up to 132 bytes, and the TCPC
    ignores any write transaction with I2C_WRITE_BYTE_COUNT > 132 (note that section 4.7.2 p. 97
    states that if more than 132 bytes are written into TX_BUF_BYTE_x, the first 132 bytes are
    written and overflow bytes are discarded, while Table 4-40 p. 82 states the transaction is
    ignored if I2C_WRITE_BYTE_COUNT > 132, with tables taking precedence per section 1.4.1). The
    TCPC auto-increments the TX_BUF_BYTE_x offset across bursts and transmits the aggregate bytes
    written since the pointer was last reset (by writing TRANSMIT or COMMAND.ResetTransmitBuffer,
    DDh), placing the first bit of the preamble on CC within tBUFFER2CC (at most 195 us after the
    I2C STOP bit, Table 4-49). Writing TRANSMIT for an SOP* message (codes 000b..100b) when fewer
    than 2 bytes are in TX_BUF_BYTE_x (pointer < offset 3) asserts FAULT_STATUS.I2CInterfaceError.
    In TRANSMIT (Table 4-39, B7:6 and B3 reserved 0), B2:0 selects 000b SOP, 001b SOP', 010b SOP'',
    011b SOP_DBG', 100b SOP_DBG'', 101b Hard Reset, 110b Cable Reset, or 111b BIST Carrier Mode 2
    (exiting no later than tBISTContMode max), and B5:4 Retry Counter selects 00b no retry, 01b one
    retry, 10b two retries, or 11b three retries (ignored for Hard Reset, Cable Reset and BIST
    Carrier Mode 2). After executing an SOP* transmission, the TCPC clears I2C_WRITE_BYTE_COUNT and
    its internal transmit buffer, resets the pointer, and asserts one and only one of
    ALERT.TransmitSOP*MessageSuccessful (B6, matching GoodCRC received),
    ALERT.TransmitSOP*MessageFailed (B4, no GoodCRC after retries), or
    ALERT.TransmitSOP*MessageDiscarded (B5, discarded due to an incoming message); the TCPM must
    not write TRANSMIT again for anything other than a Hard Reset until that transmission completes
    and the resulting ALERT bit is cleared.
