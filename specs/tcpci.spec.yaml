- id: power-control-and-discharge
  section: programming-model
  title: POWER_CONTROL register (1Ch), VCONN control and VBUS discharge
  claim: >-
    POWER_CONTROL (1Ch, R/W, reset 60h) controls VCONN, VBUS discharge, VBUS monitoring and alarms,
    and Fast Role Swap: B0 Enable VCONN (0b disable VCONN source, default; 1b enable VCONN to the
    CC pin selected by TCPC_CONTROL.PlugOrientation, which the TCPM must write before setting B0 =
    1b), B1 VCONN Power Supported (0b deliver at least 1 W; 1b deliver at least the power in
    DEVICE_CAPABILITIES_2.VconnPowerSupported), B2 Force Discharge (0b disable, default; 1b enable
    forced VBUS discharge; required if DEVICE_CAPABILITIES_1.ForceDischarge = 1b), B3 Enable Bleed
    Discharge (0b disable, default; 1b enable low-current bleed load, recommended 10 kOhm or 2 mA;
    required if DEVICE_CAPABILITIES_1.BleedDischarge = 1b), B4 Auto Discharge Disconnect (0b
    disable, default; 1b automatically discharge VBUS on disconnect, and in a Source TCPC also
    disable VBUS sourcing before or at the same time as starting VBUS discharge; required), B5
    Disable Voltage Alarms (0b voltage alarms enabled; 1b disabled, default), B6 VBUS_VOLTAGE
    Monitor (0b monitoring enabled; 1b disabled, default, causing VBUS_VOLTAGE to report all
    zeroes), and B7 Fast Role Swap Enable (0b disable, 1b enable). The TCPC does not autonomously
    disable VCONN when VBUS is removed or CC status changes; when a Source-only TCPC is requested
    to disable VCONN (EnableVCONN = 0b), it must apply Rdch termination on the CC pin that was
    providing VCONN until the pin falls below vVCONNDischarge (a DRP TCPC may not provide Rdch).
