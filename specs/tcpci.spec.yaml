- id: gotcha-cc-status-zeroed-conditions
  section: gotchas
  title: CC_STATUS CC1/CC2 state fields read 00b while Looking4Connection=1 or on the VCONN pin
  claim: >-
    In CC_STATUS (1Dh, Table 4-22), the CC1 State (B1:0) and CC2 State (B3:2) fields always return
    00b while Looking4Connection (B5) is 1b, when ROLE_CONTROL sets that pin to Ra (00b) or Open
    (11b), or when CC Status reporting is disabled (ROLE_CONTROL.DRP = 0b and CC1 = CC2 = 11b).
    Furthermore, once VCONN sourcing is enabled (POWER_CONTROL.EnableVconn = 1b), the CC pin
    supplying VCONN — CC2 when TCPC_CONTROL.PlugOrientation is 0b, or CC1 when PlugOrientation is
    1b — always returns 00b in CC_STATUS, so a driver that reads CC_STATUS after enabling VCONN
    sees 00b on the VCONN pin even if a powered cable's Ra is attached there. On the active CC pin,
    the non-zero bit encodings 01b and 10b change meaning between Source (01b = SRC.Ra, 10b =
    SRC.Rd, 11b = reserved) and Sink (01b = SNK.Default, 10b = SNK.Power1.5, 11b = SNK.Power3.0)
    according to whether ROLE_CONTROL.CCx is Rp (or ConnectResult = 0b) or Rd (or ConnectResult =
    1b).
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - pages: ['61', '62']
      section: 4.4.6.1
      table: '4-22'
    - page: '105'
      section: 4.8.3

- id: gotcha-drp-look4connection-autodischarge-gate
  section: gotchas
  title: COMMAND.Look4Connection is ignored while AutoDischargeDisconnect=1b, and Sink swaps must disable disconnect detection
  claim: >-
    COMMAND.Look4Connection (99h) starts autonomous DRP toggling only if ROLE_CONTROL.DRP is 1b,
    ROLE_CONTROL.CC1 and CC2 are both 01b (Rp) or both 10b (Rd), and
    POWER_CONTROL.AutoDischargeDisconnect (B4) is 0b; if AutoDischargeDisconnect is 1b,
    Look4Connection does nothing. Because the TCPM sets AutoDischargeDisconnect = 1b once a
    connection is established, on disconnect it must clear AutoDischargeDisconnect to 0b
    (recommended after writing ROLE_CONTROL.DRP = 0b) before setting ROLE_CONTROL.DRP = 1b and
    issuing COMMAND.Look4Connection (Figures 4-25 and 4-26). Conversely, while connected as a Sink,
    before transmitting or upon receiving a PR_Swap message — or when enabling Fast Role Swap
    (POWER_CONTROL.FastRoleSwapEnable = 1b) — the TCPM must disable Sink disconnect detection by
    setting POWER_CONTROL.AutoDischargeDisconnect = 0b and clearing
    RECEIVE_DETECT.MessageDisableDisconnect = 0b (if previously set to 1b) so that VBUS transitions
    during the swap do not trigger automatic VBUS discharge or disable USB PD message delivery. In
    addition, on a DRP TCPC that supports STANDARD_OUTPUT_CAPABILITIES.DebugAccessoryIndicator =
    1b, a non-dead-battery power-on initializes ROLE_CONTROL to 4Ah (DRP = 1b, Rd/Rd) and the Debug
    Accessory State-Machine enters Start_Debug_Accessory, where the TCPC issues
    COMMAND.Look4Connection to itself unless the TCPM sets TCPC_CONTROL.DebugAccessoryControl = 1b.
