- id: command-register
  section: programming-model
  title: COMMAND register (23h) opcodes and invalid-command rules
  claim: >-
    COMMAND (23h, write-only, reset 00h) is written by the TCPM and cleared by the TCPC after
    execution; reserved opcodes are ignored, while an invalid COMMAND is ignored and asserts
    FAULT_STATUS.I2CInterfaceError. Table 4-27 defines 14 command codes: 11h (0001_0001b) WakeI2C
    (wakes the I2C interface only); 22h (0010_0010b) DisableVbusDetect (disables VBUS Present and
    vSafe0V detection; invalid if VBUS sourcing or sinking is enabled); 33h (0011_0011b)
    EnableVbusDetect (enables VBUS Present and vSafe0V detection); 44h (0100_0100b) DisableSinkVbus
    (disables VBUS sinking, discharges to vSafe0V, and clears FAULT_STATUS InternalorExternalOCP
    and InternalorExternalOVP without disabling VBUS Present detection); 55h (0101_0101b) SinkVbus
    (enables VBUS sinking and VBUS Present detection; invalid if VBUS sourcing is enabled); 66h
    (0110_0110b) DisableSourceVbus (disables VBUS sourcing, discharges to vSafe0V, and stops
    reporting OCP or OVP faults without disabling VBUS Present detection); 77h (0111_0111b)
    SourceVbusDefaultVoltage (enables sourcing vSafe5V over VBUS, or transitions from a nondefault
    voltage to vSafe5V, and enables VBUS Present detection; invalid if VBUS sinking is enabled);
    88h (1000_1000b) SourceVbusNondefaultVoltage (transitions VBUS to a nondefault voltage set in
    VBUS_NONDEFAULT_TARGET or vendor-defined registers; invalid if currently sinking VBUS, if
    incapable of sourcing nondefault voltages, or if not already sourcing VBUS); 99h (1001_1001b)
    Look4Connection (starts DRP toggling when ROLE_CONTROL.DRP = 1b, starting with Rp if
    CC1/CC2 = 01b or Rd if 10b, doing nothing if CC1/CC2 are not both 01b or both 10b or if
    POWER_CONTROL.AutoDischargeDisconnect != 0b; or restarts connection detection when
    ROLE_CONTROL.DRP = 0b); AAh (1010_1010b) RxOneMore (automatically clears RECEIVE_DETECT after
    sending the next GoodCRC); CCh (1100_1100b) SendFRSwapSignal (Source TCPC sends a Fast Role
    Swap signal within tTCPCSendFRSwap, at most 50 us per Table 4-49; invalid if
    POWER_CONTROL.FastRoleSwapEnable = 0b); DDh (1101_1101b) ResetTransmitBuffer (resets the
    TRANSMIT_BUFFER pointer to offset 1 and invalidates its contents); EEh (1110_1110b)
    ResetReceiveBuffer (resets the RECEIVE_BUFFER.RX_BUF_BYTE_x pointer without clearing buffer
    contents, to offset 1 if the pointer is at 132 or less, or to offset 133 if the pointer is at
