      The pin-level signal descriptions and active polarities in Section 4.5 and Tables 4-47 and
      4-48 (pp. 86-87) are not extracted separately.

- id: alert-and-mask-registers
  section: programming-model
  title: ALERT (10h..11h), ALERT_MASK (12h..13h) and nested status masks (14h..17h)
  claim: >-
    ALERT (10h..11h, R/W, reset 0000h) latches status changes from the TCPC: when an event occurs,
    the TCPC sets the corresponding ALERT bit to 1b and asserts the open-drain active-low Alert#
    pin unless that bit is masked (0b) in ALERT_MASK (12h..13h, R/W, reset 7FFFh; masking prevents
    Alert# assertion but has no effect on ALERT register bits). The TCPM clears ALERT bits by
    writing 1b to the bit positions to clear (writing 0b has no effect, and writing 1b to a bit
    already 0b leaves it 0b), and Alert# stays asserted until all unmasked ALERT bits are cleared.
    The 16 ALERT bits (and matching ALERT_MASK bits) are: B0 CC Status (not asserted on
    CC_STATUS.Looking4Connection changes when TCPC_CONTROL.EnableLooking4ConnectionAlert is 0b), B1
    Power Status, B2 Received SOP* Message Status (not set when READABLE_BYTE_COUNT is set to 0),
    B3 Received Hard Reset (not expected to be masked), B4 Transmit SOP* Message Failed, B5
    Transmit SOP* Message Discarded, B6 Transmit SOP* Message Successful, B7 VBUS Voltage Alarm Hi,
    B8 VBUS Voltage Alarm Lo, B9 Fault, B10 Rx Buffer Overflow, B11 VBUS Sink Disconnect Detected
    (asserted only in Attached_Snk when POWER_CONTROL.AutoDischargeDisconnect is 1b), B12 Beginning
    SOP* Message Status (set when READABLE_BYTE_COUNT > 133 for an extended message with > 128 data
    bytes), B13 Extended Status, B14 Alert Extended, and B15 Vendor Defined Alert (reset masked in
    ALERT_MASK at 7FFFh). POWER_STATUS_MASK (14h, reset FFh), FAULT_STATUS_MASK (15h, reset FFh),
    EXTENDED_STATUS_MASK (16h, reset 01h, B0 vSafe0V Status Mask) and ALERT_EXTENDED_MASK (17h,
    reset 07h, B0 Sink Fast Role Swap Mask, B1 Source Fast Role Swap Mask, B2 Timer Expired) are
    nested masks: a change in one of those registers asserts Alert# only when unmasked in both its
    nested mask register and the corresponding top-level bit of ALERT_MASK (note that section 4.4.3
    prose on p. 46 mistakenly writes ALERT.PowerStatusInterruptMask for FAULT_STATUS_MASK, whereas
    Table 4-9 B9 and section 4.4.6.3 p. 64 name ALERT_MASK.Fault). When a TCPM is connected to a
    TCPC acting as a Source and has set SinkTxOK (Rp = 3.0A) so the Sink may initiate Atomic
    Message Sequences, the TCPM must service TCPC Alerts (clearing ALERT and reading/clearing
    RECEIVE_BUFFER if needed) within tSinkTxOKService (5 ms typical, 15 ms max, Table 4-53).
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - page: '33'
      section: '4.2'
      table: '4-1'
    - pages: ['44', '45']
      section: 4.4.2
      table: '4-8'
    - pages: ['46', '49']
      section: 4.4.3
      table: '4-9'
    - page: '47'
      table: '4-10'
    - page: '48'
      table: '4-11'
    - page: '48'
      table: '4-12'
    - pages: ['48', '49']
      table: '4-13'
    - page: '64'
      section: 4.4.6.3
    - page: '113'
      section: C
      table: '4-53'
  todo:
    check: document
    text: >-
      The per-bit definitions of POWER_STATUS_MASK (Table 4-10, p. 47) and FAULT_STATUS_MASK (Table
      4-11, p. 48) match the bit positions of POWER_STATUS and FAULT_STATUS (with Table 4-11 B7
      noting that writing 0b to AllRegistersResetToDefault will not mask it because the reset
      condition also resets that mask bit) and are not repeated here.

- id: tcpc-control-register
  section: programming-model
  title: TCPC_CONTROL register (19h)
  claim: >-
    TCPC_CONTROL (19h, R/W, reset 00h) is set and cleared only by the TCPM after power-on reset: B0
    Plug Orientation (0b: apply VCONN when enabled to CC2 and monitor CC1 for BMC PD
    communications; 1b: apply VCONN when enabled to CC1 and monitor CC2 for BMC PD communications;
    required), B1 BIST Test Mode (0b normal operation; 1b BIST Test Mode for PHY layer compliance
    testing, where incoming messages enabled by RECEIVE_DETECT receive a GoodCRC reply and may be
    stored in the receive buffer but may or may not assert Receive SOP* Message Status or Rx Buffer
    Overflow alerts — the TCPM should clear B1 on disconnect), B3:2 I2C Clock Stretching Control
    (optional; 00b disable clock stretching, default; 01b reserved; 10b enable limited clock
    stretching during each I2C transfer; 11b enable clock stretching only while Alert# is not
    asserted, disabling it as soon as Alert# asserts), B4 Debug Accessory Control (0b controlled by
    TCPC, default; 1b controlled by TCPM; register bit is required), B5 Enable Watchdog Timer (0b
    disabled, default; 1b enabled; required if DEVICE_CAPABILITIES_2.WatchdogTimer = 1b), B6 Enable
    Looking4Connection Alert (0b disable ALERT.CcStatus assertion when
    CC_STATUS.Looking4Connection changes, default; 1b enable), and B7 Enable SMBus PEC (0b
    disabled, default; 1b enabled). Regardless of the clock stretching setting in B3:2, the TCPC is
    never allowed to NAK I2C transfers unless the TCPM has put it to sleep with COMMAND.I2CIdle,
    writes to an unimplemented or reserved register/bit, or sends an invalid SMBus PEC byte.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - pages: ['32', '33']
      section: '4'
    - page: '33'
      table: '4-1'
    - pages: ['51', '52']
      section: 4.4.5.1
      table: '4-15'
    - page: '108'
      table: '4-51'

- id: role-control-register
  section: programming-model
  title: ROLE_CONTROL register (1Ah) and power-on default terminations
  claim: >-
    ROLE_CONTROL (1Ah, R/W, B7 reserved 0) controls CC1 and CC2 terminations and autonomous DRP
    toggling: B1:0 CC1 and B3:2 CC2 each select 00b Ra, 01b Rp (using the Rp value in B5:4), 10b
    Rd, or 11b Open (disconnect or don't care); B5:4 Rp Value selects 00b Rp default, 01b Rp 1.5A,
    10b Rp 3.0A, or 11b reserved; and B6 DRP selects 0b direct control by B3:0 (used for
    Source-only, Sink-only, or manual Try.SRC/Try.SNK after DRP connection detection) or 1b
    autonomous DRP toggling. When DRP = 1b, the only allowed values for CC1/CC2 are Rp/Rp (01b/01b)
    or Rd/Rd (10b/10b), which select the initial toggling polarity; the TCPC does not start
    toggling until the TCPM writes COMMAND.Look4Connection while
    POWER_CONTROL.AutoDischargeDisconnect = 0b, and upon resolving to Potential_Connect_as_Src it
    applies the Rp value in B5:4 and stays in Potential_Connect_as_Src or Potential_Connect_as_Sink
    until directed otherwise. When DRP = 0b and CC1 = CC2 = 11b (Open), the TCPC disables CC_STATUS
    reporting, sets CC_STATUS to all zeroes (which the TCPM must ignore) without setting or
    clearing ALERT.CcStatus, and may power down the PHY and CC comparators; a Sink TCPC is
    recommended to remove CC terminations while VBUS is present so a bus-powered Sink can enter USB
    Type-C ErrorRecovery. At power-on reset (Table 4-17 and Figure 4-18), ROLE_CONTROL defaults to
    0Ah (Rd/Rd, DRP=0b) for Source-or-Sink (000b), Sink-only (010b), Sink with Accessory (011b),
    and any dead-battery boot; 05h (Rp/Rp default, DRP=0b) for Source-only (001b) when not dead
    battery; and for DRP roles (100b, 101b, 110b) when not dead battery, 4Ah (Rd/Rd, DRP=1b) if
    STANDARD_OUTPUT_CAPABILITIES.DebugAccessoryIndicator is 1b or 0Fh (Open/Open, DRP=0b) if
    DebugAccessoryIndicator is 0b.
