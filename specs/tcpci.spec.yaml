    after the TCPC's minimal debounce of tTCPCfilter (250 to 500 us, Table 4-21; the TCPM must
    complete the full USB Type-C debounce). B5 Looking4Connection is 1b while the TCPC is actively
    looking for a connection (DRP toggling or Source/Sink-only connection detection) and transitions
    from 1b to 0b when a potential connection has been found. B4 ConnectResult reports whether the
    TCPC is presenting Rp (0b) or Rd (1b). B3:2 CC2 State and B1:0 CC1 State encode each pin's
    status: when (ROLE_CONTROL.CCx = Rp) or (ConnectResult = 0b), 00b is SRC.Open (open, Rp), 01b
    is SRC.Ra (below maximum vRa), 10b is SRC.Rd (within the vRd range), and 11b is reserved; when
    (ROLE_CONTROL.CCx = Rd) or (ConnectResult = 1b), 00b is SNK.Open (below maximum vRa), 01b is
    SNK.Default (above minimum vRd-Connect), 10b is SNK.Power1.5 (detects Rp 1.5A), and 11b is
    SNK.Power3.0 (detects Rp 3.0A). If ROLE_CONTROL.CCx is Ra or Open, or if Looking4Connection is
    1b, or if VCONN is enabled on that pin (POWER_CONTROL.EnableVconn = 1b with
    TCPC_CONTROL.PlugOrientation = 0b for CC2 or 1b for CC1), that pin's state field always returns
    00b. A TCPM using polling rather than Alerts should treat CC_STATUS as invalid until at least
