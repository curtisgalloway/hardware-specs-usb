- id: device-capabilities-1-2-3
  section: programming-model
  title: Device capability registers (DEVICE_CAPABILITIES_1/2 at 24h..27h, DEVICE_CAPABILITIES_3 at 7Ch..7Dh)
  claim: >-
    The read-only nonvolatile capability registers advertise TCPC features to the TCPM:
    DEVICE_CAPABILITIES_1 (24h..25h, normative) encodes Source VBUS (bit 0), Source Nondefault VBUS
    (bit 1; requires bit 10 to be 1b), Sink VBUS (bit 2), Source VCONN (bit 3), SOP'_DBG/SOP''_DBG
    Support (bit 4), Power Roles Supported (bits 7:5: 000b Source-only or Sink-only configured by
    TCPM, not DRP; 001b Source-only; 010b Sink-only; 011b Sink with accessory support; 100b DRP
    only; 101b Source, Sink, DRP, Adapter/Cable all supported; 110b Source, Sink, DRP; 111b not
    valid), Source Resistor Supported (bits 9:8: 00b Rp default only, 01b Rp 1.5A and default, 10b
    Rp 3.0A, 1.5A and default, 11b reserved), VBUS Measurement and Alarm Capable (bit 10), Force
    Discharge (bit 11), Bleed Discharge (bit 12), VBUS OVP Reporting (bit 13), VBUS OCP Reporting
    (bit 14), and VBUS Nondefault Target (bit 15). DEVICE_CAPABILITIES_2 (26h..27h, normative)
    encodes VCONN Overcurrent Fault Capable (bit 0), VCONN Power Supported (bits 3:1: 000b 1.0W,
    001b 1.5W, 010b 2.0W, 011b 3W, 100b 4W, 101b 5W, 110b 6W, 111b External), VBUS Voltage Alarm
    LSB (bits 5:4: 00b 25 mV step using all bits, 01b 50 mV step ignoring bit 0, 10b 100 mV step
    ignoring bits 1:0, 11b reserved), Stop Discharge Threshold (bit 6), Sink Disconnect Detection
    (bit 7), Watchdog Timer (bit 8), Sink FR Swap (bit 9), Source FR Swap (bit 10), SMBus PEC (bit
    11), Long Message (bit 12: 0b up to 30-byte SOP* message content, 1b up to 264-byte SOP*
    message content), Generic Timer (bit 13), Message Disable Disconnect (bit 14), and
    DEVICE_CAPABILITIES_3 Support (bit 15). When DEVICE_CAPABILITIES_2 bit 15 is 1b,
    DEVICE_CAPABILITIES_3 (7Ch..7Dh, optional normative, bits 15:3 reserved 0) bits 2:0 (VBUS
    Voltage Support) report the maximum nominal VBUS voltage supported (000b 5 V, 001b 9 V, 010b
    15 V, 011b 20 V, 100b 28 V, 101b 36 V, 110b 48 V, 111b reserved), and the TCPC's VBUS threshold
    and alarm registers must support voltages of at least that nominal maximum plus 10%.
  support:
