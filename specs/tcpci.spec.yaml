- id: power-on-and-drp-connection-sequence
  section: programming-model
  title: Power-on initialization, DRP toggling and connection establishment sequence
  claim: >-
    At power-on or reset (Figure 4-24), the TCPM reads POWER_STATUS.TCPCInitializationStatus (B6)
    until it reads 0b (confirming initialization is complete and all registers are valid) and reads
    FAULT_STATUS.AllRegistersResetToDefault (B7). To configure autonomous DRP toggling, the TCPM
    ensures POWER_CONTROL.AutoDischargeDisconnect is 0b (it is recommended to write
    ROLE_CONTROL.DRP = 0b before writing AutoDischargeDisconnect = 0b), writes ROLE_CONTROL with
    DRP = 1b and CC1 = CC2 = 01b (Rp) or 10b (Rd), and writes COMMAND.Look4Connection (99h). In the
    Main State-Machine (Figure 4-19), the TCPC sets CC_STATUS.Looking4Connection = 1b and toggles
    between Apply_Rp (for tToggleSrc = dcSRC.DRP * tDRP) and Apply_Rd (for tToggleSnk = (1 -
    dcSRC.DRP) * tDRP), not driving any CC line that has VCONN connected. When CC1 or CC2 is SRC.Rd
    (or both are SRC.Ra) for > tTCPCfilter, the TCPC enters Potential_Connect_As_Src, sets
    Looking4Connection = 0b and ConnectResult = 0b, applies the Rp strength in
    ROLE_CONTROL.RpValue, and asserts ALERT.CcStatus; when CC1 or CC2 is not SNK.Open for >
    tTCPCfilter, it enters Potential_Connect_As_Sink, sets Looking4Connection = 0b and
    ConnectResult = 1b, keeps Rd applied, and asserts ALERT.CcStatus. Upon seeing ALERT.CcStatus =
    1b and CC_STATUS.Looking4Connection = 0b, the TCPM enables VBUS detection
    (COMMAND.EnableVbusDetect, 33h), debounces CC_STATUS for tCCDebounce, writes the resolved
    ROLE_CONTROL (CC1, CC2, DRP = 0b), sets TCPC_CONTROL.PlugOrientation, sets
    POWER_CONTROL.AutoDischargeDisconnect = 1b, enables VCONN if needed
    (POWER_CONTROL.EnableVconn = 1b), enables VBUS_VOLTAGE monitoring if supported
    (POWER_CONTROL.VbusVoltageMonitor = 0b), writes COMMAND to source or sink VBUS, and clears
    ALERT.CcStatus. Setting AutoDischargeDisconnect = 1b transitions the TCPC Main State-Machine
    (Figure 4-19 and Figure 4-20) to Attached_Src or Attached_Snk if the active CC pin in
    ROLE_CONTROL matches PlugOrientation (CC2 = Rp/Rd when PlugOrientation = 1b, or CC1 = Rp/Rd
    when PlugOrientation = 0b) and DebugAccessoryConnected# is not asserted under TCPM control;
    otherwise the TCPC enters Connected_Invalid and asserts FAULT_STATUS.I2CInterfaceError.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - page: '52'
      section: 4.4.5.2
    - pages: ['88', '90']
      section: '4.6'
      figure: '4-18'
    - page: '89'
      figure: '4-19'
    - page: '90'
      figure: '4-20'
    - page: '94'
      figure: '4-24'
  todo:
    check: document
    text: >-
      The Source and Sink disconnect flowcharts in Figures 4-25 and 4-26 (pp. 95-96) and the
      autonomous Debug Accessory state machines in Figures 4-21 to 4-23 (pp. 91-93) are not
      extracted in full.

- id: i2c-idle-and-wake-sequence
  section: programming-model
  title: Low-power I2C idle and wake handshake (COMMAND.I2CIdle and COMMAND.WakeI2C)
  claim: >-
    The TCPM may put the TCPC's I2C interface into an idle state to save power by issuing
    COMMAND.I2CIdle (FFh), which is decoupled from Alert# and status detection blocks (CC_STATUS,
    POWER_STATUS, RECEIVE_DETECT). While in I2C idle, the TCPC may generate a bit-level NAK to its
    own slave address or any I2C command. To wake the TCPC from I2C idle, the TCPM sends a
    throw-away I2C command addressing the TCPC (or COMMAND.WakeI2C, 11h) and starts a tWakeI2Cfail
    timer (at most 5 ms): the TCPC restarts its I2C interface as a side effect of seeing its slave
    address (even if it NAKed the transaction), wakes on either the first wake command or a second
    wake command sent if tWakeI2Cfail expires before Alert# asserts, sets ALERT.PowerStatus = 1b
    without setting any bit in POWER_STATUS, and asserts Alert# within tWakeI2Cfail. Subsequent I2C
    requests to the slave address must not be NAKed, and the TCPM reads and clears
    ALERT.PowerStatus to complete the wake sequence.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - page: '67'
      section: 4.4.8
    - pages: ['68', '69']
      table: '4-27'
    - page: '105'
      section: 4.8.1

- id: gotcha-hard-reset-tx-sets-both-success-and-fail
  section: gotchas
  title: Transmitting Hard Reset or Cable Reset asserts both TransmitSuccessful and TransmitFailed, and Hard Reset does not clear ALERT
  claim: >-
    Unlike an SOP* transmission — which asserts one and only one of
    ALERT.TransmitSOP*MessageSuccessful (B6), ALERT.TransmitSOP*MessageFailed (B4) or
    ALERT.TransmitSOP*MessageDiscarded (B5) — completing a Hard Reset (TRANSMIT[2:0] = 101b) or
    Cable Reset (110b) transmission causes the TCPC to assert both
    ALERT.TransmitSOP*MessageSuccessful (B6) and ALERT.TransmitSOP*MessageFailed (B4) regardless of
    whether the PHY sent the reset or tHardResetComplete expired (and if an earlier TRANSMIT
    request had not yet completed when the Hard Reset was written, the TCPC also asserts
    ALERT.TransmitSOP*MessageDiscarded, B5). In addition, a Hard Reset (transmitted or received)
    clears RECEIVE_DETECT and READABLE_BYTE_COUNT to 00h and resets the mask registers per Table
    4-1 (sections 4.4.3.1 to 4.4.3.5 specify all five mask registers — ALERT_MASK,
    POWER_STATUS_MASK, FAULT_STATUS_MASK, EXTENDED_STATUS_MASK and ALERT_EXTENDED_MASK — while the
    parentheticals in sections 2.4, 4.7.3 and 4.7.8 list four of them, omitting FAULT_STATUS_MASK),
    but does not reset the ALERT register itself; the TCPM must explicitly clear the asserted ALERT
    bits (including ALERT.ReceiveSOP*MessageStatus if set) before re-enabling RECEIVE_DETECT.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - page: '16'
      section: '2.4'
