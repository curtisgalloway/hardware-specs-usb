- id: vbus-voltage-thresholds-and-alarms
  section: programming-model
  title: VBUS voltage measurement, threshold, alarm and nondefault target registers (70h to 7Bh)
  claim: >-
    TCPCs that source or sink nondefault VBUS voltages (or set
    DEVICE_CAPABILITIES_1.VbusMeasurementAndAlarmCapable = 1b) provide 16-bit VBUS measurement and
    threshold registers: VBUS_VOLTAGE (70h..71h, read-only, reset 0000h, upper and lower bytes
    synchronized by the TCPC; reports 0000h when POWER_CONTROL.VbusVoltageMonitor = 1b) has B15:12
    reserved 0, B11:10 Scale Factor (00b not scaled, 01b VBUS divided by 2, 10b VBUS divided by 4,
    11b reserved), and B9:0 a 10-bit measurement of (VBUS / Scale Factor) with a 25 mV LSB that the
    TCPM multiplies by the scale factor (accuracy +/-2% or +/-50 mV, whichever is greater).
    VBUS_SINK_DISCONNECT_THRESHOLD (72h..73h, R/W, reset 008Ch = 3.5 V; edge-triggered, required
    for Sinks supporting nondefault VBUS and declared by
    DEVICE_CAPABILITIES_2.SinkDisconnectDetection = 1b; a value of 0 disables this threshold and
    Sink Auto Discharge, and the register has no action for a Source) and
    VBUS_STOP_DISCHARGE_THRESHOLD (74h..75h, R/W, reset 0020h = 0.8 V; edge-triggered threshold at
    which a Source stops Force Discharge when POWER_CONTROL.ForceDischarge = 1b, required for
    Sources supporting nondefault VBUS or ForceDischarge and declared by
    DEVICE_CAPABILITIES_2.StopDischargeThreshold = 1b; has no action for a Sink, and a Source
    always discharges to vSafe0V on disconnect, Hard Reset or Power Role Swap) each have B15:12
    reserved 0 and B11:0 a 12-bit voltage trip point with a 25 mV LSB (+/-5% accuracy).
    VBUS_VOLTAGE_ALARM_HI_CFG (76h..77h, R/W, reset 0000h) and VBUS_VOLTAGE_ALARM_LO_CFG (78h..79h,
    R/W, reset 0000h) each hold a 12-bit level-triggered trip point in B11:0 with a 25 mV LSB
    (+/-5% accuracy, B15:12 reserved 0): when POWER_CONTROL.DisableVoltageAlarms is 0b, the TCPC
    sets ALERT.VbusVoltageAlarmHi (B7) when VBUS exceeds the high alarm or ALERT.VbusVoltageAlarmLo
    (B8) when VBUS drops below the low alarm, and re-asserts the alert if the condition prevails
    after the TCPM clears the ALERT bit. Depending on DEVICE_CAPABILITIES_2.VbusVoltageAlarmLSB,
    the TCPC may ignore B0 (50 mV step) or B1:0 (100 mV step) of the four threshold and alarm
    registers (72h..79h) provided it still meets each threshold's minimum accuracy.
    VBUS_NONDEFAULT_TARGET (7Ah..7Bh, R/W, reset 0000h, required if
    DEVICE_CAPABILITIES_1.VbusNondefaultTarget = 1b) holds a 16-bit target voltage in B15:0 with a
    20 mV LSB (+/-5% accuracy) for COMMAND.SourceVbusNondefaultVoltage (88h); the TCPC ignores
    writes below 3.3 V (00A5h) or when VbusNondefaultTarget = 0b.
