orientation: >-
  Terms: the TCPM (USB Type-C Port Manager) is the host or embedded controller driver holding the
  Policy Engine, the Type-C state machines, and the upper portion of the USB Power Delivery (PD)
  Protocol Layer; the TCPC (USB Type-C Port Controller) is the port controller IC reached over I2C
  that encapsulates VBUS and VCONN power control, CC pin terminations and comparators, the USB PD
  BMC Physical Layer, and the time-critical lower portion of the USB PD Protocol Layer (automatic
  GoodCRC generation, CRCReceiveTimer, and retries). Alert# is the TCPC's open-drain active-low
  interrupt line to the TCPM. SOP* refers to SOP, SOP', SOP'', SOP_DBG' and SOP_DBG'' frames. This
  spec records the standard TCPCI register interface and operational sequences; how a particular
  board or SoC wires a TCPC (I2C bus, slave address, Alert# GPIO, external power switches) belongs
  in that board's or SoC's spec.
facts:
- id: tcpm-tcpc-split
  section: standards
  title: Split between the Type-C Port Manager (TCPM) and Type-C Port Controller (TCPC)
  claim: >-
    The TCPCI specification defines the register-level interface over I2C between a USB Type-C Port
    Manager (TCPM, the I2C master holding the Policy Engine and the upper portion of the USB PD
    Protocol Layer) and one or more USB Type-C Port Controllers (TCPCs, each an I2C slave with an
    open-drain active-low Alert# pin). The TCPC encapsulates three normative functions: VBUS and
    VCONN port power control, USB Type-C CC pin control and sensing, and USB PD message delivery
    (the entire BMC Physical Layer and the portion of the USB PD Protocol Layer covering automatic
    GoodCRC transmission, CRCReceiveTimer, RetryCounter, and matching MessageID and SOP type on
    expected GoodCRC responses). The TCPC is opaque to USB PD messages: it does not interpret
    messages constructed by the TCPM, does not check MessageID when receiving a non-GoodCRC message
    (passing retried messages to the TCPM over I2C), and shall not include support for USB PD BFSK.
    Where text, figures and tables in the specification conflict, tables take precedence over
    figures, and figures over text.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - page: '12'
      section: '1'
      figure: '1-1'
    - page: '12'
      section: '1.1'
    - page: '13'
      section: 1.4.1
    - page: '15'
      section: '2.2'
      figure: '2-1'
    - pages: ['18', '19']
      section: '3'
    - pages: ['21', '22']
      section: '3.6'
      figure: '3-3'
    - page: '22'
      figure: '3-4'

- id: i2c-transport-and-access-rules
  section: programming-model
  title: I2C bus requirements, single-register transactions and SMBus PEC
  claim: >-
    The TCPM is the only master on the I2C bus and each USB Type-C port has its own unique I2C
    slave address (a multi-port TCPC exposes a unique slave address per port). The TCPC must
    support Fast-mode Plus (Fm+, 1 Mbit/s, 400 kHz to 1000 kHz SCL clock frequency) over an I/O
    supply voltage (VDD) of 1.8 V to 3.6 V, and must allow reads to every register even when
    defined as write-only (the TCPM should treat data read from a write-only register as invalid).
    Each 16-bit (2-byte) register occupies two contiguous bytes in little-endian order, with the 8
    least significant bits at the lower address and the 8 most significant bits at the higher
    address. Adopting part of the SMBus protocol as normative, the TCPM must read or write only a
    single register per I2C transaction, write a complete register in a single I2C transaction, and
    begin every register access at its first byte; if the TCPM reads or writes an address that is
    not the first byte of a register, or accesses multiple registers in one transaction, the TCPC
    may assert FAULT_STATUS.I2CInterfaceError and ignore the write or leave SDA open on a read so
    the TCPM reads all 1s. When DEVICE_CAPABILITIES_2.SMBusPEC (bit 11) is 1b and the TCPM sets
    TCPC_CONTROL.EnableSMBusPEC (bit 7) to 1b, every transaction is appended with an SMBus CRC-8
    Packet Error Code (PEC) byte, and on writes the TCPC checks the PEC in real time and generates
    a bit-level NAK to the PEC byte if it is incorrect.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - pages: ['32', '33']
      section: '4'
    - pages: ['32', '33']
      section: '4.1'
    - page: '33'
      section: '4.2'
    - pages: ['36', '38']
      section: '4.3'
    - pages: ['107', '108']
      section: '4.10'
      table: '4-50'
    - page: '108'
      table: '4-51'
  todo:
    check: document
    text: >-
      The three allowed TCPC responses when the TCPM writes to an unimplemented or reserved
      register or bit (ignore, bit-level NAK, or assert FAULT_STATUS.I2CInterfaceError, p. 32), the
      remaining I2C static and dynamic electrical parameters in Tables 4-50 and 4-51 (pp. 107-108,
      including the 1.7 V to 3.3 V range stated in section 4.10 prose vs 1.8 V to 3.6 V in section
      4 and Table 4-50), and the bit-level transaction diagrams in Figures 4-1 to 4-12 (pp. 36-41)
      are not extracted.

- id: register-map-overview
  section: programming-model
  title: TCPCI register map layout (00h to FFh)
  claim: >-
    Table 4-1 partitions the 256-byte TCPC register address space as follows: identification
    registers at 00h..0Bh (0Ch..0Fh reserved), ALERT at 10h..11h, mask registers at 12h..17h,
    CONFIG_STANDARD_OUTPUT at 18h, control registers at 19h..1Ch (TCPC_CONTROL 19h, ROLE_CONTROL
    1Ah, FAULT_CONTROL 1Bh, POWER_CONTROL 1Ch), status and extended alert registers at 1Dh..21h
    (CC_STATUS 1Dh, POWER_STATUS 1Eh, FAULT_STATUS 1Fh, EXTENDED_STATUS 20h, ALERT_EXTENDED 21h;
    22h reserved), COMMAND at 23h, capability registers at 24h..29h (DEVICE_CAPABILITIES_1 24h..25h,
    DEVICE_CAPABILITIES_2 26h..27h, STANDARD_INPUT_CAPABILITIES 28h, STANDARD_OUTPUT_CAPABILITIES
    29h), CONFIG_EXTENDED1 at 2Ah (2Bh reserved), GENERIC_TIMER at 2Ch..2Dh, MESSAGE_HEADER_INFO at
    2Eh, RECEIVE_DETECT at 2Fh, RECEIVE_BUFFER always read at 30h (READABLE_BYTE_COUNT and hidden
    RX_BUF_FRAME_TYPE and RX_BUF_BYTE_x across 30h..4Fh), TRANSMIT at 50h, TRANSMIT_BUFFER always
    written at 51h (I2C_WRITE_BYTE_COUNT and hidden TX_BUF_BYTE_x across 51h..6Fh), VBUS voltage,
    threshold, alarm and target registers at 70h..7Bh, DEVICE_CAPABILITIES_3 at 7Ch..7Dh (7Eh..7Fh
    reserved), and optional vendor-defined registers at 80h..FFh.
  support:
  - class: standard
    doc: usb-tcpci-r2.0.pdf
    at:
    - pages: ['33', '35']
      section: '4.2'
      table: '4-1'
  todo:
    check: document
    text: >-
      The per-register Normative/Optional classifications, R/W access types and reset values of
      Table 4-1 (pp. 33-35) are covered in the individual register facts rather than duplicated
      row-by-row here.

- id: identification-registers
  section: programming-model
  title: Identification and specification revision registers (00h to 0Bh)
  claim: >-
    Six normative 16-bit read-only registers at 00h..0Bh identify the TCPC and are the only
    registers (along with reserved 0Ch..0Fh) guaranteed to return valid values while
    POWER_STATUS.TCPCInitializationStatus (bit 6) is 1b: VENDOR_ID at 00h..01h (16-bit unsigned
    VID assigned by the USB-IF), PRODUCT_ID at 02h..03h (16-bit unsigned PID assigned by the
    vendor), DEVICE_ID at 04h..05h (16-bit unsigned bcdDevice version assigned by the vendor),
    USBTYPEC_REV at 06h..07h (bits 15:8 reserved 0, bits 7:0 packed BCD bcdUSBTYPEC release such as
    21h for USB Type-C Release 2.1), USBPD_REV_VER at 08h..09h (bits 15:8 packed BCD bcdUSBPD
    Revision and bits 7:0 packed BCD bcdUSBPD Version, such as 31h and 10h for USB PD Revision 3.1
    Version 1.0), and PD_INTERFACE_REV at 0Ah..0Bh (bits 15:8 packed BCD bcd USB-PD Inter-Block
    Specification Revision and bits 7:0 packed BCD Version, such as 20h and 13h for TCPCI Revision
    2.0 Version 1.3).
