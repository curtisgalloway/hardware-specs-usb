    doc: usb-tcpci-r2.0.pdf
    at:
    - pages: ['34', '35']
      table: '4-1'
    - pages: ['71', '72']
      section: 4.4.9.1
      table: '4-28'
    - pages: ['72', '74']
      table: '4-29'
    - page: '74'
      section: 4.4.9.2
      table: '4-30'
  todo:
    check: document
    text: >-
      The per-power-role required/optional bit matrices for DEVICE_CAPABILITIES_1 and
      DEVICE_CAPABILITIES_2 in Tables 3-1 and 3-2 (pp. 24-26) and the role requirement summaries in
      Tables 3-3 to 3-6 (pp. 27-30) are not extracted.

- id: standard-io-capabilities-and-config
  section: programming-model
  title: Standard input/output capability and configuration registers (28h, 29h, 18h, 2Ah)
  claim: >-
    STANDARD_INPUT_CAPABILITIES (28h, read-only, normative) declares optional standard input pins:
    bit 0 Force Off VBUS (Source or Sink), bit 1 VBUS External Over Current Fault, bit 2 VBUS
    External Over Voltage Fault, and bits 4:3 Source Fast Role Swap (00b not present, 01b input-only
    pin, 10b bidirectional pin shared with the VBUS Sink Disconnect Detect Indicator output, 11b
    reserved; bits 7:5 reserved 0). STANDARD_OUTPUT_CAPABILITIES (29h, read-only, normative)
    declares optional push/pull or open-drain standard outputs: bit 0 Connector Orientation, bit 1
    Connection Present, bit 2 MUX Configuration Control, bit 3 Active Cable Indicator, bit 4 Audio
    Adapter Accessory Indicator, bit 5 VBUS Present Monitor, bit 6 Debug Accessory Indicator (if 0b,
    the TCPC does not support the Debug Accessory State-Machine), and bit 7 VBUS Sink Disconnect
    Detect Indicator (must be 1b if Source Fast Role Swap in 28h is 10b). When any standard outputs
    are declared, CONFIG_STANDARD_OUTPUT (18h, R/W, reset 60h) configures or reads them: bit 0
    Connector Orientation (0b Normal: CC1=A5, CC2=B5, TX1=A2/A3, RX1=B10/B11, default; 1b Flipped:
    CC2=A5, CC1=B5, TX1=B2/B3, RX1=A10/A11), bit 1 Connection Present (0b no connection, 1b
    connection), bits 3:2 MUX Control (00b no connection, 01b USB 3.1 connected, 10b DP Alternate
    Mode 4 lanes, 11b USB 3.1 + DisplayPort lanes 0 & 1), bit 4 Active Cable Connected, bit 5 Audio
    Accessory Connected# (0b connected, 1b not connected, default), bit 6 Debug Accessory
    Connected# (0b connected, 1b not connected, default), and bit 7 High Impedance outputs (1b
    forces all outputs to high impedance). For bits 6 and 0 of CONFIG_STANDARD_OUTPUT, the TCPC
    writes the bits and ignores TCPM writes when TCPC_CONTROL.DebugAccessoryControl is 0b, and
    takes input from the TCPM when DebugAccessoryControl is 1b. CONFIG_EXTENDED1 (2Ah, R/W, reset
    00h, bits 7:2 reserved 0) controls Fast Role Swap pin behavior: bit 0 Standard Input Source FR
    Swap (0b allow input pin to trigger sending FRS signal, default; 1b block) and bit 1 FR Swap
    Bidirectional Pin (0b input Source FRS, default; 1b output VBUS Sink Disconnect Detect
    Indicator; writing bit 1 when the bidirectional pin is not declared in 28h and 29h is ignored
    and asserts FAULT_STATUS.I2CInterfaceError).
