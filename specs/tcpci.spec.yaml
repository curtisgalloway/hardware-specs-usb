    (stopping below VBUS_STOP_DISCHARGE_THRESHOLD if StopDischargeThreshold = 1b, or vSafe0V if 0b)
    automatically disable the discharge circuit as an edge-triggered event without clearing B4 or
    B2, and do not re-apply the discharge circuit if VBUS rises again. In Attached_Src, disconnect
    is detected when the monitored CC pin (per PlugOrientation) indicates SRC.Open; in Attached_Snk,
    disconnect is detected within tDisconnectDetect (at most 6 ms, Table 4-20) of
    POWER_STATUS.VbusPresent transitioning 1b to 0b (if SinkDisconnectDetection = 0b) or VBUS
    falling below VBUS_SINK_DISCONNECT_THRESHOLD (if SinkDisconnectDetection = 1b). After a
