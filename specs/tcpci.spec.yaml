- id: pd-message-header-and-receive-detect
  section: programming-model
  title: MESSAGE_HEADER_INFO (2Eh), RECEIVE_DETECT (2Fh) and automatic GoodCRC generation
  claim: >-
    On attach and after tCCDebounce, the TCPM must update MESSAGE_HEADER_INFO (2Eh, R/W, B7:5
    reserved 0; power-on default 0Dh for Source-only not dead battery and 04h for all other roles
    per Table 4-17) before enabling RECEIVE_DETECT (2Fh, R/W, reset 00h), because the TCPC reads
    MESSAGE_HEADER_INFO to construct the Message Header of automatic GoodCRC replies: B0 Power Role
    (0b Sink, 1b Source), B2:1 USB PD Specification Revision (00b Revision 1.0, 01b Revision 2.0,
    10b Revision 3.0, 11b reserved), B3 Data Role (0b UFP, 1b DFP), and B4 Cable Plug (0b message
    originated from Source, Sink or DRP; 1b from a Cable Plug). RECEIVE_DETECT enables detection of
    SOP (B0), SOP' (B1), SOP'' (B2), SOP_DBG' (B3), SOP_DBG'' (B4), Hard Reset signaling (B5), and
    Cable Reset signaling (B6), plus B7 Message Disable Disconnect (0b Sink TCPC disables PD
    message delivery when ALERT.VbusSinkDisconnectDetected is asserted, default; 1b Sink TCPC
    disables PD message delivery when SNK.Open is detected for at least tPDDebounce min, 10 ms; a
    Source TCPC always uses SRC.Open regardless of B7). For any enabled SOP* message type other
    than an incoming GoodCRC, the TCPC automatically sends a GoodCRC reply (unless the receive
    buffer has overflowed) and makes the received message ready in RECEIVE_BUFFER within tCc2BUFFER
    (at most 50 us from the last bit of EOP, Table 4-49); an unexpected incoming GoodCRC is not
    answered with a GoodCRC and is instead reported to the TCPM via ALERT.ReceiveSOP*MessageStatus
    as a regular message (Figure 3-3). The TCPC disables PD message delivery — disabling automatic
    GoodCRC transmission, discarding any unacted COMMAND.RxOneMore, and setting all bits of
    RECEIVE_DETECT and READABLE_BYTE_COUNT to zero — when RECEIVE_DETECT.HardReset is set and a
    Hard Reset is received, when the TCPM writes TRANSMIT to request a Hard Reset, when
    RECEIVE_DETECT.CableReset is set and a Cable Reset is received, or on disconnect detection
    (transmitting a Cable Reset has no effect on RECEIVE_DETECT).
