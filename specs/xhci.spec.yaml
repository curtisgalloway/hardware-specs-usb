- id: dbc-context-and-ep-contexts
  section: programming-model
  title: Debug Capability Context (DCCP), Info Context (DbCIC) and Endpoint Contexts
  claim: >-
    DCCP (DbC base + 30h, 64-bit, RW, default 0, initialized before setting DCCTRL DCE to 1)
    holds the Debug Capability Context address in bits 63:4 (bits 3:0 RsvdP). HCCPARAMS1 CSZ
    does not apply to the DbC: the Debug Capability Context is three contiguous 64-byte
    structures: the Debug Capability Info Context (DbCIC) at offset 000h, the OUT Endpoint
    Context (element 0, managing the OUT Transfer Ring) at 040h and the IN Endpoint Context
    (element 1, managing the IN Transfer Ring) at 080h. DbCIC holds four 64-bit USB String
    Descriptor addresses (each with bit 0 RsvdZ and bits 63:1 the pointer) — String 0 at 00h
    (supported language; only one LANGID is supported), Manufacturer at 08h, Product at 10h and
    Serial Number at 18h — followed at 20h by their four 1-byte lengths in bytes (bits 7:0
    String 0, 15:8 Manufacturer, 23:16 Product, 31:24 Serial Number; setting a Manufacturer,
    Product or Serial Number length to 0 makes the xHC ignore its address) and RsvdZ at
    24h..3Fh. Software initializes each 64-byte DbC Endpoint Context with Max Packet Size =
    1024, Max Burst Size = DCCTRL Debug Max Burst Size (hardware may use a smaller burst size
    than set by software), EP Type = 2 (Bulk OUT) for the OUT context at 040h and 6 (Bulk IN)
    for the IN context at 080h, TR Dequeue Pointer pointing to the respective Transfer Ring,
