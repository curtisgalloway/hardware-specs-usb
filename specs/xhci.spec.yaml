- id: dbc-port-status-and-control
  section: programming-model
  title: DbC Port Status and Control (DCPORTSC)
  claim: >-
    DCPORTSC (DbC base + 28h, 32-bit, default 0 except PLS which is undefined) manages the
    assigned Root Hub port as an upstream-facing port: bit 0 CCS (RO, 0 when DCE = 0) is 1 when
    connected to a Debug Host and assigned to the DbC; bit 1 PED (RW, 0 when DCE or CCS is 0) is
    set to 1 by hardware on a 0-to-1 transition of CCS or a 1-to-0 transition of PR, cleared to
    0 by a 0-to-1 transition of PR (moving the link to Rx.Detect), a disconnect or a port fault,
    and may be written as 0 by software to hold the link in SS.Disabled (appearing disconnected
    to the Debug Host while keeping the Root Hub port mapped to the DbC) or as 1 to re-enable
    it; bits 3:2, 9, 16:14, 20:18 and 31:24 are RsvdZ; bit 4 PR (RO, 0 when DCE or CCS is 0) is
    1 while bus reset signaling from the Debug Host is active (which clears PED, DCR and Device
    Address to 0) and clears to 0 when reset completes (setting PED and PRC to 1 and entering
    the USB Default state); bits 8:5 PLS (RO, relevant when Debug Port Number > 0) report the
    completed link state (0 U0, 1 U1, 2 U2, 3 U3 Suspended, 4 Disabled, 5 RxDetect, 6 Inactive,
    7 Polling, 8 Recovery, 9 Hot Reset, 15:10 Reserved); and bits 13:10 Port Speed (RO, relevant
    when CCS = 1, else 0 Undefined Speed) report the Protocol Speed ID (1 to 15; LS, FS and HS
    are not supported). The four RW1C change bits — bit 17 CSC (connect status change), bit 21
    PRC (reset complete, 1-to-0 transition of PR), bit 22 PLC (PLS transitions U0->U3 suspend,
    U3->U0 resume, Polling->Disabled training error, or Ux/Recovery->Inactive error) and bit 23
    CEC (port config error) — remain set until software writes 1, a Chip Hardware Reset occurs
    or DCE becomes 0; they are ORed into DCPSCEG, whose 0-to-1 transition queues a Port Status
    Change Event TRB with Port ID = 0 on the DbC Event Ring (unless the ring is full, in which
    case the change bit stays set).
