- id: extended-capability-list
  section: programming-model
  title: Walking the extended capability list
  claim: >-
    Extended capabilities form a linked list in MMIO space starting at Base + (xECP << 2). Each
    entry's first Dword holds the Capability ID in bits 7:0 and, in bits 15:8, the offset in
    Dwords from this entry to the next one; 0 ends the list. Defined IDs include 1 USB Legacy
    Support, 2 Supported Protocol, 3 Extended Power Management, 4 I/O Virtualization, 5 Message
    Interrupt, 6 Local Memory, 10 USB Debug Capability, 17 Extended Message Interrupt and 18
    USB3 Tunneling Support; 192 to 255 are vendor defined.
