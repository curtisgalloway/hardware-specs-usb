- id: portsc-port-enable
  section: programming-model
  title: Enabling, disabling and resetting a root hub port (PORTSC)
  claim: >-
    In PORTSC, bit 0 CCS (ROS, sticky read-only) shows a device connected and bit 1 PED shows
    the port enabled.
    Software cannot enable a port through PED: writing 1 to PED disables the port. A USB2 port
    is enabled by a port reset, writing 1 to bit 4 PR (RW1S); a USB3 port enables itself after
    successful link training. Software never writes PED and PR as 1 in the same write (the
    result is undefined). Bits 17 to 23 are change flags (CSC, PEC, WRC, OCC, PRC, PLC, CEC),
    each cleared by writing 1; WRC and CEC exist only on USB3 ports and are RsvdZ on USB2
    ports. Software writes PORTSC only while the controller is running (HCHalted = 0).
