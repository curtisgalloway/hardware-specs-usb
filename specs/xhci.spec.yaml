    - page: '522'
      section: 7.6.10.4
      table: '7-36'
    - pages: ['523', '524']
      section: 7.6.10.6
      table: '7-38'

- id: dbc-registers-and-structures-before-dce
  section: gotchas
  title: DbC setup registers must be initialized before DCE = 1, and HCRST can reset the DbC
  claim: >-
    DCERSTSZ, DCERSTBA, DCERDP, DCCP, DCDDI1 and DCDDI2 must all be initialized before software
    sets DCCTRL bit 31 DCE to 1, and while DCE is 1 the xHC owns the DbC memory structures
    (except a Stopped endpoint's Transfer Ring). When DCST bit 1 SBR is 0, an OS host controller
    driver that asserts USBCMD HCRST = 1 or LHCRST = 1 also resets the DbC and clears DCE to 0;
    the DbC driver detects this by observing DCE = 0 after enabling it and must reinitialize the
    DbC to continue communicating. Also, if a Debug Host and Debug Target are cabled together
    before DCE is set to 1, both Root Hub ports advertise downstream-only capability and enter
    the SS.Inactive (Error) link state until the cable is disconnected, DCE is enabled, or the
    Debug Host issues a Warm Reset.
