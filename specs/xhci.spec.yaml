- id: dbc-control-and-status
  section: programming-model
  title: DbC Control (DCCTRL) and Status (DCST) registers
  claim: >-
    DCCTRL (DbC base + 20h, 32-bit, default 0): bit 0 DCR (RO, default 0) reads 1 when the Debug
    Device is in the Configured state (Run Mode) and bulk transactions are routed to the IN and
    OUT Transfer Rings, and is cleared when DCPORTSC PR transitions 0 to 1 or the port exits
    DbC-Configured; bit 1 LSE (RW, default 0) enables Port Status Change Events when DCPORTSC
    PLC transitions 0 to 1; bit 2 HOT (Halt OUT TR, RW1S, default 0) and bit 3 HIT (Halt IN TR,
    RW1S, default 0) are valid only when DCR = 1 (when DCR = 0 they read 0 and writes are
    ignored), cause the DbC to send STALL TPs for IN TPs on the OUT TR or OUT DPs on the IN TR
    respectively while 1, and are cleared when the DbC receives ClearFeature(ENDPOINT_HALT);
    bit 4 DRC (DbC Run Change, RW1C, default 0) is set to 1 whenever DCR clears to 0, disables
    DCDB while 1, and is cleared by software writing 1; bits 15:5 are RsvdP; bits 23:16 Debug
    Max Burst Size (RO, vendor defined) give the maximum burst size supported by the DbC bulk
    endpoints; bits 30:24 Device Address (RO, default 0) report the assigned USB address while
    DCR = 1; and bit 31 DCE (RW, default 0) enables the DbC when 1 and when cleared to 0
    releases the assigned Root Hub port and terminates all DbC Transfer and Event Ring activity.
    DCST (DbC base + 24h, 32-bit, RO, default 0): bit 0 ER reads 1 while the DbC Event Ring is
    not empty and is cleared by hardware when the ring's enqueue pointer equals DCERDP; bit 1
    SBR selects which resets clear DCE and reset the DbC (when 0, Chip Hardware Reset, HCRST = 1
    or LHCRST = 1; when 1, Chip Hardware Reset, system bus reset such as PCI RST#, or a PCI PM
    D3hot to D0 transition); bits 23:2 are RsvdP; and bits 31:24 Debug Port Number report the
    1-based Root Hub port ID assigned to the DbC, or 0 when none is assigned.
