- id: dbc-device-descriptor-and-strings
  section: programming-model
  title: DbC Device Descriptor Info registers (DCDDI1, DCDDI2) and synthesized USB descriptors
  claim: >-
    Software must initialize DCDDI1 (DbC base + 38h, 32-bit, RW, default 0) and DCDDI2 (DbC base
    + 3Ch, 32-bit, RW, default 0) before setting DCCTRL DCE to 1. DCDDI1 holds DbC Protocol in
    bits 7:0 (reported in the Interface Descriptor bInterfaceProtocol field: 0 = Debug Target
    vendor defined, 1 = GNU Remote Debug Command Set supported, 2 to 255 = Reserved), RsvdZ in
