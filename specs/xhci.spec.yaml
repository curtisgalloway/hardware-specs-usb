- id: dbc-initialization-and-enumeration
  section: programming-model
  title: Initializing the DbC, polling for enumeration and handling DbC-Configured exits
  claim: >-
    To initialize the DbC (after USBSTS CNR reads 0), software allocates and initializes in
    read/write memory the DbC Event Ring Segment Table and its Event Ring segments, the Debug
    Capability Context (DbCIC string addresses/lengths and the OUT and IN Endpoint Contexts),
    the String Descriptors and the OUT and IN Transfer Rings; writes DCERSTSZ, DCERSTBA, DCERDP,
    DCCP, DCDDI1 and DCDDI2; and sets DCCTRL DCE to 1. Setting DCE = 1 moves the DbC port from
    DbC-Off to DbC-Disconnected and places the DbC in Enumeration Mode (Transfer Rings
    disabled). When a Debug Host attaches to a Root Hub port and completes the USB3 Port
    Capability LMP exchange, the port enters DbC-Enabled (DCST Debug Port Number > 0, DCPORTSC
    CCS = 1, PED = 1, CSC = 1) and queues a Port Status Change Event. Hardware services control
    requests on endpoint 0 and, when SET_CONFIGURATION completes, enters DbC-Configured (Run
    Mode), setting DCCTRL DCR = 1 and enabling the bulk endpoints, which reply to host IN TPs
    and OUT DPs with NRDY until software rings DCDB (and send ERDY when DCDB is rung after an
    NRDY). Software polls DCST ER or the Event Ring Cycle bit for events and must enforce a
    software-chosen timeout between host connection detection and DCR becoming 1 (the
    specification defines no numeric bound), toggling DCE to 0 and back to 1 to retry
    enumeration if it expires. Any exit from DbC-Configured — a Debug Host Warm or Hot Reset,
    SetConfiguration(0), an LTSSM Recovery timeout, cable disconnect, writing 0 to DCPORTSC PED
    or writing 0 to DCCTRL DCE — clears DCR to 0 and sets DCCTRL DRC to 1: if a valid Transfer
    TRB is on a Transfer Ring, hardware generates a Transfer Event with Completion Code USB
    Transaction Error (whether IOC is set or not), advances the ring's TR Dequeue Pointer to the
    next TRB (not required to be a TD boundary), and writes the updated TR Dequeue Pointer and
    Endpoint State to the Endpoint Context; software may inspect or update TR Dequeue Pointer,
    clear DRC by writing 1, and ring DCDB once configured again.
  support:
