- id: dbc-endpoint-halt-recovery
  section: programming-model
  title: Halting DbC bulk endpoints (HOT, HIT) and ClearFeature(ENDPOINT_HALT) recovery
  claim: >-
    In Run Mode (DCCTRL DCR = 1), DCCTRL bit 2 HOT (Halt OUT TR) or bit 3 HIT (Halt IN TR) may
    be set to 1 by software or by DbC hardware upon detecting a Data Buffer Error, Parameter
    Error, TRB Error, Vendor Defined Error or Undefined Error, transitioning the endpoint to the
    Halted state. Under section 7.6.4.3, if a bulk endpoint is transferring data when HOT or HIT
    is set to 1, the DbC writes the current TR Dequeue Pointer to its Endpoint Context (not
    required to advance to the next TD boundary, and not necessarily equal to the last Transfer
    Event's TRB Pointer) and generates a Transfer Event referencing the Transfer TRB where the
    error occurred with Completion Code Stall Error (whether IOC was set or not). When the Debug
    Host sends a ClearFeature(ENDPOINT_HALT) request, the DbC clears the respective HIT or HOT
    flag, clears internal endpoint state, and transitions the endpoint to the Stopped state; the
    next time software rings DCDB, the endpoint returns to the Running state and begins
    executing the TRB at the address stored in the Endpoint Context's TR Dequeue Pointer (the
    DbC does not support Soft Retry). The DbC does not support the USB3 Set Halt Feature option
    on SetFeature(ENDPOINT_HALT), and section 7.6.4.3 recommends responding with an ACK TP so
    USB compliance tests pass.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - pages: ['498', '500']
      section: 7.6.4.3
    - pages: ['510', '511']
      section: 7.6.8.4
      table: '7-22'
    - page: '598'
      section: I.4.13
  todo:
    check: document
    text: >-
      Footnote 123 (p. 498) on Packet Babble versus TD Babble handling and the full list of
      possible DbC Transfer Event completion codes (p. 498 note: Success, Stall Error, USB
      Transaction Error, Babble Detected Error, TRB Error, Short Packet, Undefined Error, Event
      Ring Full Error and Vendor Defined Error) are not extracted separately.

- id: specification-revisions
  section: variants-quirks
  title: Specification revisions
  claim: >-
    The specification's revisions are 0.96 (2009), 1.0 (2010), 1.1 (2013, reissued 2017), 1.2
    (May 2019), 1.2b (April 2023, adds the USB3 Tunneling Support capability) and 1.2c (October
    2025, adds eUSB2V2, double isochronous IN bandwidth and the Camera Sideband capability). A
    controller reports the revision it implements in HCIVERSION. Stopped EDTLA support
    (HCCPARAMS1 bit 10 SEC = 1) is mandatory for xHCI 1.1 and 1.2 controllers.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - page: '21'
      heading: Revision History
    - pages: ['348', '349']
      section: 5.3.2
    - pages: ['352', '353']
      section: 5.3.6
      table: '5-13'
    - pages: ['355', '356']
      table: '5-16'

- id: capability-table-omits-vtiosoff
  section: gotchas
  title: Table 5-9 lists 20h as reserved, but VTIOSOFF lives there
  claim: >-
    In revision 1.2c, Table 5-9 lists capability offsets 20h up to CAPLENGTH as reserved, while
    section 5.3.10 defines the VTIO Register Space Offset register (VTIOSOFF) at Base + 20h.
    HCCPARAMS2 bit 9 (VTC) reports whether the controller supports VTIO.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - page: '348'
      table: '5-9'
    - page: '357'
      section: 5.3.10
      table: '5-17'
    - pages: ['355', '356']
      section: 5.3.9
      table: '5-16'

- id: virtualization-alignment-disagreement
  section: gotchas
  title: Runtime and doorbell alignment under virtualization is stated two ways
  claim: >-
    Revision 1.2c gives two answers for how the runtime registers and doorbell array are
    aligned when the controller supports virtualization. Table 5-2 says PAGESIZE with VTIO, and
    with IOV PAGESIZE for virtual functions but 32 bytes (runtime) and 4 bytes (doorbells) for
    physical function 0. The notes to sections 5.3.7 (DBOFF) and 5.3.8 (RTSOFF) say both are
    PAGESIZE aligned whenever IOV or VTIO is supported. Without virtualization both sources agree:
    32-byte runtime and 4-byte doorbell alignment.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - pages: ['336', '337']
      table: '5-2'
    - pages: ['353', '354']
      section: 5.3.7
    - pages: ['354', '355']
      section: 5.3.8

- id: erstba-value-wording
  section: gotchas
  title: Section 4.9.4 names the wrong value for ERSTBA
  claim: >-
    The Event Ring rules in section 4.9.4 say to write ERSTBA "with the value of
    ERST(0).BaseAddress", the first segment's address. Sections 4.2 and 5.5.2.3.2 say ERSTBA
    holds the address of the Event Ring Segment Table itself, and it is ERDP that section 4.2
    initializes with the first segment's address. ERSTBA's own definition (Table 5-41) is the
    start address of the Event Ring Segment Table.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - pages: ['162', '164']
      section: 4.9.4
    - pages: ['68', '70']
      section: '4.2'
    - pages: ['393', '394']
      section: 5.5.2.3.2
      table: '5-41'

- id: bus-master-disable-while-running
  section: gotchas
  title: Clearing PCI Bus Master Enable while running
  claim: >-
    On a PCI controller, software halts the controller (Run/Stop 0, then HCHalted reads 1)
    before clearing Bus Master Enable. Clearing it while the controller runs may be treated as a
    Host Controller Error: HCE is set, the controller halts immediately, and only HCRST
    recovers it.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - page: '308'
      section: 4.21.2

- id: interrupt-moderation-default
  section: gotchas
  title: Interrupts are throttled to about 1 ms by default
  claim: >-
    IMOD's interval defaults to 4000 (250 ns units, about 1 ms), so an interrupter left at its
    default delivers at most about one interrupt per millisecond. Section 4.2 has software set the
    interval to the rate it wants; 0 disables throttling.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - page: '392'
      section: 5.5.2.2
      table: '5-39'
    - pages: ['68', '70']
      section: '4.2'

- id: dbc-transfer-ring-direction-inverted
  section: gotchas
  title: DbC Transfer Ring directions are opposite to the USB host transfer directions
  claim: >-
    Because the DbC emulates a USB device rather than a host, its two Transfer Rings are
    cross-coupled to the opposite USB transaction directions: the OUT Transfer Ring (Endpoint
    Context 0 at offset 040h of the Debug Capability Context, initialized with EP Type = 2 Bulk
    OUT and rung with DCDB DB Target = 0) holds data that the Debug Device sends to the Debug
    Host in response to host IN TPs on bulk IN endpoint 81h, whereas the IN Transfer Ring
    (Endpoint Context 1 at offset 080h, initialized with EP Type = 6 Bulk IN and rung with DCDB
    DB Target = 1) holds buffers that receive data from host OUT DPs on bulk OUT endpoint 01h.
  support:
  - class: standard
    doc: xhci-1.2c.pdf
    at:
    - pages: ['494', '495']
      section: 7.6.3.2
    - pages: ['505', '506']
      section: 7.6.7.2
