- id: dbc-capability-structure
  section: programming-model
  title: USB Debug Capability (DbC) header and register map
  claim: >-
    The optional USB Debug Capability (Capability ID 10, chained via xECP in MMIO space) lets a
    Debug Target present an upstream-facing Enhanced SuperSpeed Debug Device on the first Root
    Hub port that detects an attach of a downstream-facing Enhanced SuperSpeed port (Root Hub or
    external hub); a Debug Target can expose the DbC only through one of its own Root Hub ports,
    never through a hub it controls. The DbC operates independently of the OS xHCI interface
    (USBCMD Run/Stop has no effect on it) whenever the port is not suspended and the controller
    is in D0; software should shut down DbC activity before transitioning the xHC to D3 and
    should not access DbC registers while USBSTS CNR is 1. The assigned Root Hub port appears to
    the xHCI driver as a port that never sees a device attach (PORTSC CCS = 0 when PP = 1) and
    reports 0 available bandwidth to a Get Port Bandwidth command. From the DbC base, the
    registers are: DCID at 00h (4 bytes, RO: bits 7:0 Capability ID = 10, bits 15:8 Next
    Capability Pointer in Dwords, bits 20:16 DCERST Max = 0 to 15 giving up to 2^(DCERST Max)
    Event Ring Segment Table entries, bits 31:21 RsvdP), DCDB at 04h (4 bytes), DCERSTSZ at 08h
    (4 bytes), 0Ch (4 bytes, RsvdZ), DCERSTBA at 10h (8 bytes), DCERDP at 18h (8 bytes), DCCTRL
    at 20h (4 bytes), DCST at 24h (4 bytes), DCPORTSC at 28h (4 bytes), 2Ch (4 bytes, RsvdP),
