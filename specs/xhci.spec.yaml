- id: bios-os-handoff
  section: programming-model
  title: Taking the controller from firmware (USB Legacy Support)
  claim: >-
    When the USB Legacy Support capability (ID 1) is present, its first Dword (USBLEGSUP) holds
    the HC BIOS Owned semaphore in bit 16 and the HC OS Owned semaphore in bit 24, in separate
    bytes so each side can write its own with a byte access. The operating system requests the
    controller by setting OS Owned to 1, and owns it once OS Owned reads 1 and BIOS Owned reads
    0; it should not wait more than 1 second for firmware to release it. The capability's
    second Dword (USBLEGCTLSTS) holds the firmware's SMI enables. Both are in the Aux power well.
