      table: '5-43'

- id: trb-format
  section: programming-model
  title: TRB layout
  claim: >-
    A TRB is four Dwords (16 bytes), aligned on a 16-byte boundary: a 64-bit Parameter, a 32-bit
    Status and a 32-bit Control Dword. In the Control Dword, bit 0 is the Cycle bit and bits
    15:10 the TRB Type. If software does not write all four Dwords atomically, it writes the
    Parameter and Status Dwords before the Control Dword.
