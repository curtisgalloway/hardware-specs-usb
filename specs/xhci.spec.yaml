- id: memory-structure-alignment
  section: programming-model
  title: Size, alignment and boundary limits of memory structures
  claim: >-
    No data structure whose maximum size is 64 KiB or less may cross a 64 KiB boundary, and none
    whose maximum size is PAGESIZE or less may cross a PAGESIZE boundary. Transfer Ring segments
    are 16-byte aligned, and Command and Event Ring segments 64-byte aligned, each at most 64 KiB
    and not crossing a 64 KiB boundary. The Event Ring Segment Table and the Device Context Base
    Address Array are 64-byte aligned; slot and endpoint contexts 32-byte aligned. A data buffer
    a transfer TRB points to must not cross a 64 KiB boundary; a buffer that would cross one is
    described by chained TRBs.
