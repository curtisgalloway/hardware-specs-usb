- id: dbc-spec-disagreements
  section: gotchas
  title: Section 7.6 disagrees internally on pointer low bits, DCST.ER scope and HOT/HIT events
  claim: >-
    Section 7.6 contains three internal discrepancies: (1) Table 7-20 (DCERSTBA) and Table 7-25
    (DCCP) define bits 3:0 as RsvdP and bits 63:4 as the pointer, whereas Figure 7-9 marks those
    low bits RsvdZ, section 7.6 states the DbC Event Ring Management register block is identical
    to section 5.5.2.3 (Table 5-41: ERSTBA bits 5:0 RsvdP, 64-byte aligned) and sections 7.6.3.1
    and 7.6.9 state the DbC Event Ring Segment Table is identical to section 6.5 (Table 6-94:
    bits 5:0 RsvdZ, 64-byte aligned), and Figure 7-10 labels the end of the three 64-byte context
    structures at offsets 000h, 040h and 080h as 0CFh instead of 0BFh; (2) Table 7-23 says DCST
    bit 0 ER = 1 indicates the DbC Event Ring "has a Transfer Event on it", whereas section
    7.6.4.1 has software poll ER to detect the Debug Host connection (a Port Status Change Event)
    or any event generated by the DbC; and (3) section 7.6.4.3 says setting HOT or HIT to 1 while
    transferring data writes the current TR Dequeue Pointer to the Endpoint Context and generates
    a Transfer Event with Completion Code Stall Error, whereas section 7.6.4.4 says that when the
    DbC exits DbC-Configured "or if the HIT or HOT flags are set to '1'" the Transfer Event has
    Completion Code USB Transaction Error and the DbC advances TR Dequeue Pointer to the next
    TRB.
