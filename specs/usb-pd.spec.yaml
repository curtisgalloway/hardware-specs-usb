- id: asymmetric-power-vs-data-role-header-verification
  section: gotchas
  title: Receiver never verifies Port Power Role (Bit 8) but must verify Port Data Role (Bit 5)
  claim: >-
    In the 16-bit Message Header of SOP packets (Table 6.2), the two role bits have opposite
    receiver validation rules. Bit 8 (Port Power Role) must never be verified by the receiver
    (Table 6.2: "Shall Not be verified by the receiver and therefore Shall Not lead to Soft Reset,
    Hard Reset or Error Recovery if it is incorrect"); enforcing a check on Bit 8 of incoming SOP
    packets breaks PR_Swap handshakes while power roles are transitioning. By contrast, Bit 5 (Port
    Data Role) must be verified on every received SOP packet except GoodCRC (Table 6.2): if a USB
    Type-C port receives any non-GoodCRC SOP message whose Port Data Role field is set to the same
    Data Role as its own current Data Role (both DFP or both UFP), the port must perform USB Type-C
    Error Recovery actions within tInitiateErrorRecovery (15 ms maximum, Section 7.31.10.6 and
    Table 7.9). In addition, in GoodCRC messages, Bits 7..6 (Specification Revision) carry no
    meaning (the value received could be 00b, 01b, 10b, or 11b) and must be ignored by the
    recipient (Section 6.1.3).
  support:
