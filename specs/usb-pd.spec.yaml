orientation: >-
  Terms: a Source supplies power on VBUS and a Sink consumes it; a Dual-Role-Power (DRP) port can
  operate as either. A Downstream Facing Port (DFP) is the USB host-side data role and an Upstream
  Facing Port (UFP) is the device-side data role; a Dual-Role-Data (DRD) port can operate as
  either. The VCONN Source supplies power to electronics in an active or electronically marked
  cable plug. USB PD messages travel half-duplex over the single active USB Type-C Configuration
  Channel (CC) wire using Bi-phase Mark Coding (BMC) and 4b5b framing, addressed to the port
  partner (SOP) or to the near and far cable plugs (SOP' and SOP''). Standard Power Range (SPR)
  operation covers contracts up to 100 W (20 V, 5 A); Extended Power Range (EPR) operation extends
  contracts above 100 W up to 240 W (48 V, 5 A). This spec records the protocol and programming
  model a port controller or policy engine driver acts on: roles and contracts, SPR and EPR power
  ranges, physical framing and collision avoidance, message headers and message types, Power Data
  Objects (PDOs) and Request Data Objects (RDOs), GoodCRC acknowledgment, MessageID counters,
  retries, timers, Atomic Message Sequences (AMS) for power negotiation, EPR keep-alive, role swaps
  and resets, and Structured Vendor Defined Messages (SVDMs). Mechanical and electrical filter
  masks, battery/manufacturer/security/firmware-update extended data blocks, and Fast Role Swap
  electrical signaling are out of its scope so far.
facts:
- id: port-power-data-vconn-roles
  section: standards
  title: Independent power, data, and VCONN roles and cable plug communication
  claim: >-
    Each USB Power Delivery connection has one Source Port (which provides power, defaults at
    initial connection to Downstream Facing Port (DFP) and VCONN Source, and initiates power
    negotiations) and one Sink Port (which consumes power and defaults at initial connection to
    Upstream Facing Port (UFP)). Power roles (Source or Sink; Dual-Role Power (DRP) ports can
    operate as either and swap between them), data roles (DFP associated with the USB Host role and
    Initiator in Data Role negotiations, or UFP associated with the USB Peripheral role and
    Responder in Data Role negotiations; Dual-Role Data (DRD) ports can operate as either and swap
    between them even if they are Source-only or Sink-only for power), and the VCONN Source role
    (which supplies VCONN power to Cable Plugs) can be swapped independently during a connection.
    To communicate with Cable Plugs (embedded electronic marker and/or active cable circuitry
    powered when VCONN is present), a port must be the VCONN Source; Cable Plugs do not initiate
    communication and only respond to messages addressed to them.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - page: '21'
      section: '1.2'
    - pages: ['21', '22']
      section: '1.3'

- id: default-explicit-implicit-contracts
  section: standards
  title: Default, Explicit, and Implicit operational contracts
  claim: >-
    A PD Source and Sink operate in one of three power contracts. A Default Contract is a
    non-negotiated power contract established at initial connection (as defined in USB Type-C)
    with a default voltage of 5 V where the Sink may draw up to the advertised USB-C current; the
    Source remains in the Default Contract until the Sink disconnects or both ports negotiate and
    establish an Explicit Contract. An Explicit Contract is the normal operational state entered
    after PD Power Negotiation takes place (where a Source offers power contracts using USB PD
    messaging, the Sink requests a contract, and the Source accepts it); an Explicit Contract must
    be entered before other USB PD messaging can occur, and data connections and modes other than
    USB2 and USB3 may be established in an Explicit Contract. An Implicit Contract is a transitory
    power contract that follows a Power Role Swap or Fast Role Swap: the available voltage is 5 V
    with current defined by the advertised USB-C current, all existing data connections and modes
    are maintained, and the Source in an Implicit Contract immediately negotiates with the Sink to
    establish an Explicit Contract.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - pages: ['22', '23']
      section: '1.4'

- id: pd-device-stack-architecture
  section: standards
  title: Per-port protocol stack layers and Device Policy Manager
  claim: >-
    A USB PD-capable device is structured as a hierarchy of control layers where each port includes
    its own USB-C Port Control, Physical Layer, Protocol Layer, Policy Engine, and Power
    Source/Sink block (connected to the VCONN and VBUS pins), while a single Device Policy Manager
    coordinates USB PD behavior across all ports within the device based on overall device power
    and data policy. Within each port, from lowest to highest control layer: USB-C Port Control (on
    the CC pin) provides mechanisms to execute USB-C state machines, informs the other layers of
    Attach/Detach events and plug orientation, and sets and detects Type-C current advertisements;
    the Physical Layer (on the CC pin) handles bit-level transmission and reception on the physical
    connector and performs error detection on messages using a CRC mechanism; the Protocol Layer
    constructs and interprets USB PD messages exchanged between ports; and the Policy Engine
    enforces local power and data policy for the individual port, interacting with the Device
    Policy Manager, Protocol Layer, USB-C Port Control, and Power Source/Sink block.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - pages: ['24', '25']
      section: '1.7'
      figure: '1.1'

- id: spr-vs-epr-power-ranges
  section: standards
  title: Standard Power Range (SPR) and Extended Power Range (EPR) source capability tiers
  claim: >-
    USB Power Delivery sources and sinks operate in two power ranges. The Standard Power Range
    (SPR) covers Port Power Delivery Power (PDP) ratings up to 100 W (up to 20 V at 5 A). Based on
    Port Maximum PDP (Table 3.1) or Port Present PDP (Table 3.2), SPR Sources must offer Fixed
    Supply PDOs at progressive voltage tiers: 5 V only for 0.5 W <= PDP <= 15 W; 5 V and 9 V for
    15 W < PDP <= 27 W; 5 V, 9 V, and 15 V plus an SPR Adjustable Voltage Supply (AVS) APDO (9 V to
    15 V) for 27 W < PDP <= 45 W; and 5 V, 9 V, 15 V, and 20 V plus an SPR AVS APDO (9 V to 20 V)
    for 45 W < PDP <= 100 W. Required minimum currents for the 5 V, 9 V, and 15 V SPR Fixed PDOs
    are capped at 3 A (min(3 A, PDP / Voltage)), whereas the 20 V SPR Fixed PDO current scales up
    to the cable rating (min(Cable Rating, PDP / 20 V), up to 5 A when a 5 A-capable cable is
    present, which is required for Port Present PDP > 60 W). For SPR AVS, the 9 V–15 V maximum
    current equals the 15 V Fixed PDO Maximum Current and the 15 V–20 V maximum current equals the
    20 V Fixed PDO Maximum Current. The Extended Power Range (EPR) covers PDP ratings above 100 W
    up to 240 W (up to 48 V at 5 A) and requires both Port Partners to be EPR-capable and connected
    by an electronically marked EPR-capable cable (50 V, 5 A rating verified via SOP' Discover
    Identity). In EPR Mode, in addition to the 100 W SPR capabilities (5 V, 9 V, and 15 V Fixed
    PDOs at 3 A, 20 V Fixed PDO at 5 A, and SPR AVS APDO), an EPR Source must offer Fixed Supply
    PDOs at 28 V (for 100 W < PDP <= 140 W, current PDP / 28), 28 V at 5 A and 36 V at PDP / 36
    (for 140 W < PDP <= 180 W), or 28 V at 5 A, 36 V at 5 A, and 48 V at PDP / 48 (for 180 W < PDP
    <= 240 W), together with an EPR AVS APDO spanning from 15 V to the maximum offered EPR Fixed
    PDO voltage.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - page: '37'
      section: '3.1'
    - pages: ['38', '40']
      section: 3.2.4
      table: '3.1'
    - page: '40'
      table: '3.2'
    - pages: ['42', '43']
      section: 3.2.5.3
      table: '3.5'
    - page: '44'
      table: '3.6'
    - pages: ['217', '220']
      section: 7.30.1
  todo:
    check: document
    text: >-
      Summarizes required SPR and EPR Fixed PDO and AVS APDO tiers from Tables 3.1, 3.2, 3.5, and
      3.6; worked capability examples (Tables 3.3 and 3.7), optional SPR Programmable Power Supply
