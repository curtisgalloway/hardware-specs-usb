- id: protocol-timers-and-counters
  section: programming-model
  title: Protocol Layer and Policy Engine timer parameters and counter limits
  claim: >-
    Core Protocol Layer and Policy Engine timing parameters (Tables 7.9 and 7.10) are:
    CRCReceiveTimer (tReceive = 900 us min, 1000 us nom, 1100 us max; Protocol Layer wait for
    GoodCRC), tTransmit and tRetry (195 us max; PHY delay to send GoodCRC or retransmit a packet),
    tReceiverResponse (15 ms max; target Policy Engine time to begin transmitting a response
    message after sending GoodCRC EOP), SenderResponseTimer (tSenderResponse = 27 ms min, 50 ms
    max; initiator Policy Engine wait for a response message after receiving GoodCRC EOP),
    SourceCapabilityTimer (tTypeCSendSourceCap = 100 ms min, 150 ms nom, 200 ms max; interval
    between Source_Capabilities advertisements before an Explicit Contract), SinkWaitCapTimer
    (tTypeCSinkWaitCap = 310 ms min, 465 ms nom, 620 ms max; Sink wait for Source_Capabilities
    before issuing a Hard Reset), tFirstSourceCap (250 ms max; time from attach, reset, or EPR
    mode transition to Source_Capabilities / EPR_Source_Capabilities), PSTransitionTimer
    (tPSTransition = 450–550 ms with 500 ms nom in SPR Mode, 830–1020 ms with 925 ms nom in EPR
    Mode; Sink wait for PS_RDY after Accept), PSSourceOffTimer (tPSSourceOff = 750–920 ms with 835
    ms nom in SPR Mode, 1120–1400 ms with 1260 ms nom in EPR Mode; wait for Initial Source PS_RDY
    during PR_Swap), PSSourceOnTimer (tPSSourceOn = 390–480 ms with 435 ms nom in SPR Mode; wait
    for New Source PS_RDY during PR_Swap or FR_Swap), SinkPPSPeriodicTimer (tPPSRequest = 10 s max;
    Sink periodic re-request interval in PPS Mode), SourcePPSCommTimer (tPPSTimeout = 12.0 s min,
    13.5 s nom, 15.0 s max; Source timeout in PPS Mode before Hard Reset), SinkEPREnterTimer
    (tEnterEPR = 450 ms min, 500 ms nom, 550 ms max), SinkEPRKeepAliveTimer (tSinkEPRKeepAlive =
    250 ms min, 375 ms nom, 500 ms max), SourceEPRKeepAliveTimer (tSourceEPRKeepAlive = 750 ms min,
    875 ms nom, 1000 ms max), tEPRSourceCableDiscovery (2 s max), PSHardResetTimer (tPSHardReset =
    25 ms min, 30 ms nom, 35 ms max; Source delay after Hard Reset before driving VBUS to vSafe0V),
    HardResetCompleteTimer (tHardResetComplete = 4000 us min, 4500 us nom, 5000 us max),
    NoResponseTimer (tNoResponse = 4.5 s min, 5.0 s nom, 5.5 s max), ChunkSenderRequestTimer and
    ChunkSenderResponseTimer (tChunkSenderRequest / tChunkSenderResponse = 24 ms min, 27 ms nom,
    30 ms max; tChunkReceiverRequest / tChunkReceiverResponse = 15 ms max), and
    ChunkingNotSupportedTimer (tChunkingNotSupported = 40 ms min, 45 ms nom, 50 ms max). The six
    protocol counter parameters (Tables 7.11 and 7.12) are: nBusyCount = 5 (VDMBusyCounter max; 1
    recommended for USB-C Alternate Mode Entry), nCapsCount = 50 (CapsCounter max
    Source_Capabilities attempts), nDiscoverIdentityCount = 20 (DiscoverIdentityCounter max SOP'
    Discover Identity attempts without GoodCRC), nHardResetCount = 2 (HardResetCounter max Hard
    Reset retries), nMessageIDCount = 7 (MessageIDCounter max value for 3-bit rolling counter
    0..7), and nRetryCount = 2 (RetryCounter max packet retries).
