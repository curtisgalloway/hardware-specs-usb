- id: spr-power-negotiation-ams
  section: programming-model
  title: Standard Power Range (SPR) Power Negotiation Atomic Message Sequence
  claim: >-
    Standard Power Range (SPR) Power Negotiation is a Source-initiated Atomic Message Sequence
    (AMS) that establishes or updates an Explicit Contract. First, the Source sends a
    Source_Capabilities Data Message (acknowledged by the Sink with GoodCRC) advertising 1 to 7
    SPR PDOs/APDOs, and starts SenderResponseTimer (tSenderResponse = 27–50 ms); before an
    Explicit Contract exists, the Source repeats Source_Capabilities every tTypeCSendSourceCap
    (100–200 ms), while an attached Sink runs SinkWaitCapTimer (tTypeCSinkWaitCap = 310–620 ms)
    and issues Hard Reset signaling if it expires without seeing Source_Capabilities. Second, the
    Sink evaluates the offered PDOs and responds within tReceiverResponse (15 ms max) with a
    Request Data Message containing one RDO referencing an SPR Object Position (0001b..0111b),
    setting Capability Mismatch = 1b in the RDO if none of the offered PDOs satisfy its full power
    needs. Third, if the Request is valid and can be met, the Source replies with an Accept
    Control Message (causing the Sink to start PSTransitionTimer, tPSTransition = 450–550 ms) and
    transitions VBUS to the negotiated voltage and current limits; if the Source cannot meet the
    Request, it replies with Reject (keeping any prior Explicit Contract or returning to vSafe5V
    if none existed) or Wait (after which the Sink uses SinkRequestTimer and must wait at least
    tSinkRequest = 100 ms min before sending a new Request). Fourth, once the Source's power supply
    reaches the target operating condition, the Source sends a PS_RDY Control Message, and
    reception of the Sink's GoodCRC for PS_RDY completes the Explicit Contract. When the negotiated
    contract selects an SPR PPS APDO, the Sink must re-send a Request message at least every
    tPPSRequest (10 s max) or the Source's SourcePPSCommTimer (tPPSTimeout = 12.0–15.0 s) expires
    and triggers Hard Reset signaling.
