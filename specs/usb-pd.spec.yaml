- id: source-capabilities-pdo-ordering-and-encoding
  section: programming-model
  title: Source Power Data Object (PDO and APDO) ordering, bit fields, and scaling units
  claim: >-
    Power Data Objects (PDOs) in Source_Capabilities (1–7 32-bit PDOs, Section 6.4.1.1) and
    EPR_Source_Capabilities (Section 6.5.18, Figure 6.8) must be transmitted in a strict order:
    first, the mandatory vSafe5V Fixed Supply PDO (5 V) in Object Position 1; second, any remaining
    SPR Fixed Supply PDOs in ascending voltage order (lowest to highest: 9 V, 15 V, 20 V); third,
    Battery Supply PDOs in ascending Minimum Voltage order; fourth, Variable Supply (non-Battery)
    PDOs in ascending Minimum Voltage order; fifth, the SPR Adjustable Voltage Supply (AVS) APDO;
    and sixth, SPR Programmable Power Supply (PPS) APDOs in ascending Maximum Voltage order. In
    EPR_Source_Capabilities, Object Positions 1..7 contain the exact SPR Source_Capabilities PDOs
    padded with 0000_0000h unused objects through position 7, followed in Object Positions 8..11 by
    EPR Fixed Supply PDOs in ascending voltage order (28 V, 36 V, 48 V) and finally one EPR AVS
    APDO. Bits 31..30 encode the PDO Type (Table 6.6): 00b Fixed Voltage, 01b Battery, 10b Variable
    (non-Battery), and 11b Augmented PDO (APDO). In a Fixed Supply PDO (00b), the 5 V Source PDO at
    Object Position 1 (Table 6.8) carries capability flags in Bits 29..22 (Bit 29 Dual-Role Power,
    Bit 28 USB Suspend Supported, Bit 27 Unconstrained Power, Bit 26 USB Communications Capable,
    Bit 25 Dual-Role Data, Bit 24 Unchunked Extended Messages Supported, Bit 23 EPR Capable, Bit 22
    Reserved 0b; in Fixed PDOs > 5 V at positions 2..N in Table 6.10, Bits 29..22 are Reserved and
    ignored by the receiver), followed in all Fixed Source PDOs by Bits 21..20 Peak Current, Bits
    19..10 Voltage in 50 mV units (100 = 5.0 V, 180 = 9.0 V, 300 = 15.0 V, 400 = 20.0 V, 560 =
    28.0 V, 720 = 36.0 V, 960 = 48.0 V), and Bits 9..0 Maximum Current in 10 mA units (0..500 for
    0–5.00 A, or 0 when offering no capabilities). In a Battery PDO (01b, Table 6.11), Bits 29..20
    are Maximum Voltage in 50 mV units, Bits 19..10 Minimum Voltage in 50 mV units, and Bits 9..0
    Maximum Power in 250 mW units (0..400 for 0–100 W). In a Variable PDO (10b, Table 6.12), Bits
    29..20 are Maximum Voltage in 50 mV units, Bits 19..10 Minimum Voltage in 50 mV units (at least
    80% of Maximum Voltage for a Source), and Bits 9..0 Maximum Current in 10 mA units (0..500 for
    0–5.00 A). In an APDO (11b, Table 6.7), Bits 29..28 select the APDO Type: 00b SPR PPS Source
    APDO (Table 6.13: Bit 27 PPS Power Limited, Bits 26..25 Reserved, Bits 24..17 Maximum Voltage
    in 100 mV increments with allowed values 110 = 11 V, 160 = 16 V, 210 = 21 V, Bit 16 Reserved,
    Bits 15..8 Minimum Voltage in 100 mV increments with 50 = 5 V required and 33 = 3.3 V
    deprecated, Bit 7 Reserved, Bits 6..0 Maximum Current in 50 mA units from 0..100 for 0–5 A),
    01b EPR AVS Source APDO (Table 6.16: Bits 27..26 Peak Current, Bits 25..17 Maximum Voltage in
    100 mV increments with allowed values 280 = 28 V, 360 = 36 V, 480 = 48 V, Bit 16 Reserved, Bits
    15..8 Minimum Voltage in 100 mV increments with 150 = 15 V, Bits 7..0 Port Present PDP in 1 W
    increments from 0..240 W), 10b SPR AVS APDO (Table 6.15: Bits 27..26 Peak Current, Bits 25..20
    Reserved, Bits 19..10 Maximum Current 15V for the 9 V–15 V operating range in 10 mA increments
    equal to the 15 V Fixed PDO Maximum Current, Bits 9..0 Maximum Current 20V for the 15 V–20 V
    operating range in 10 mA increments equal to the 20 V Fixed PDO Maximum Current or 0 if maximum
    voltage supported is 15 V), and 11b Invalid.
