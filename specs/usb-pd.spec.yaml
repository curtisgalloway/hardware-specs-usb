- id: control-message-types
  section: programming-model
  title: Control Message type codes and SOP* applicability
  claim: >-
    Control Messages have Extended = 0b and Number of Data Objects = 000b (16-bit Message Header
    only). Their 5-bit Message Type codes (Bits 4..0, Table 6.4) and valid SOP* packet types
    (Tables 7.4 and 7.5) are: 00001b GoodCRC (SOP, SOP', SOP''; acknowledges receipt of a message
    with matching CRC and MessageID), 00010b GotoMin (deprecated; SOP receiver responds with
    Not_Supported), 00011b Accept (SOP, SOP', SOP''; accepts a Request, EPR_Request, PR_Swap,
    DR_Swap, VCONN_Swap, FR_Swap, Data_Reset, Enter_USB, or Soft_Reset), 00100b Reject (SOP, plus
    SOP' and SOP'' when an Active Cable rejects Enter_USB; rejects a Request, EPR_Request,
    PR_Swap, DR_Swap, VCONN_Swap, Enter_USB, EPR_Get_Source_Cap, or EPR_Get_Sink_Cap), 00101b Ping
    (deprecated; SOP receiver responds with Not_Supported or ignores, and Cable Plug ignores),
    00110b PS_RDY (SOP; signals that VBUS or VCONN supply has reached its target operating
    condition), 00111b Get_Source_Cap (SOP; requests SPR Source_Capabilities), 01000b Get_Sink_Cap
    (SOP; requests SPR Sink_Capabilities), 01001b DR_Swap (SOP; requests Data Role Swap), 01010b
    PR_Swap (SOP; requests Power Role Swap), 01011b VCONN_Swap (SOP; requests VCONN Source Swap),
    01100b Wait (SOP, plus SOP' and SOP'' when an Active Cable defers Enter_USB; defers a Request,
    EPR_Request, PR_Swap, DR_Swap, VCONN_Swap, or Enter_USB), 01101b Soft_Reset (SOP, SOP', SOP'';
    resets Protocol Layer counters and state machines without dropping VBUS), 01110b Data_Reset
    (SOP; resets USB data connection, exits all Active Modes, and cycles VCONN), 01111b
    Data_Reset_Complete (SOP; sent by DFP to complete a Data Reset AMS), 10000b Not_Supported
    (SOP, SOP', SOP''; indicates received message is unsupported or unrecognized), 10001b
    Get_Source_Cap_Extended (SOP; requests Source_Capabilities_Extended), 10010b Get_Status (SOP,
    SOP', SOP''; requests Status), 10011b FR_Swap (SOP; initiates the PD messaging phase of a Fast
    Role Swap), 10100b Get_PPS_Status (SOP; requests PPS_Status), 10101b Get_Country_Codes (SOP;
    requests Country_Codes), 10110b Get_Sink_Cap_Extended (SOP; requests
    Sink_Capabilities_Extended), 10111b Get_Source_Info (SOP; requests Source_Info), and 11000b
    Get_Revision (SOP, plus SOP' for Active Cables per Table 7.5 where SOP'' is Not Allowed, though
    Section 6.3.24 mentions SOP'/SOP''; requests Revision). Codes 00000b and 11001b..11111b are
    Reserved (receiver responds with Not_Supported).
