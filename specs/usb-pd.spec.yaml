      All special K-code symbols, Error symbols, and all seven ordered sets from Tables 5.2, 5.3,
      5.4, and 5.5 are extracted; the 16 data-nibble 4b5b code mappings (0h through Fh) in Table
      5.2 are not extracted.

- id: collision-avoidance-rp-signaling
  section: programming-model
  title: Collision avoidance in an Explicit Contract via Source Rp modulation (SinkTxOK and SinkTxNG)
  claim: >-
    Once an Explicit Contract is established, the Source controls bus contention on the
    half-duplex CC wire by modulating its USB Type-C Rp pull-up termination between two values.
    SinkTxOK (Rp set to 3.0 A at 5 V, detected by the Sink as vRd-3.0) indicates that the Sink may
    initiate an Atomic Message Sequence (AMS) and the Source will not initiate an AMS. SinkTxNG
    (Rp set to 1.5 A at 5 V, detected by the Sink as vRd-1.5) indicates that the Source is about
    to initiate or is executing an AMS; the Sink must not initiate any AMS once tSinkDelay (5 ms
    maximum) has elapsed after Rp changes to SinkTxNG. Before sending the first message of a
    Source-initiated AMS, the Source changes Rp from SinkTxOK to SinkTxNG and waits for
    SinkTxTimer (tSinkTx = 16 ms minimum, 18 ms nominal, 20 ms maximum) so any Sink message
    already being prepared can complete first; if a transition into PE_SRC_Ready will immediately
    transition out of PE_SRC_Ready within tSrcHoldsBus (50 ms maximum), the Source may keep Rp at
    SinkTxNG to avoid changing Rp unnecessarily. Even when the Sink is the VCONN Source, it is not
    permitted to initiate an SOP' or SOP'' AMS with a Cable Plug unless Rp is set to SinkTxOK.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - pages: ['85', '86']
      section: 5.2.2
      table: '5.1'
    - page: '197'
