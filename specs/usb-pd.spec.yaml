- id: request-data-object-rdo-formats
  section: programming-model
  title: Request Data Object (RDO) bit fields for Fixed/Variable, Battery, PPS, and AVS requests
  claim: >-
    A Sink requests power by sending a Request Message (containing one 32-bit RDO for SPR Object
    Positions 0001b..0111b) or an EPR_Request Message (Section 6.4.8, Figure 6.3, containing two
    32-bit Data Objects: the RDO in Object 1 and a verbatim copy of the requested SPR or EPR PDO in
    Object 2, covering Object Positions 0001b..1011b). All four RDO formats share the same upper
    header fields in Bits 31..22: Bits 31..28 Object Position (1-based index: 0001b..0111b for SPR
    PDOs/APDOs, 1000b..1011b for EPR PDOs/APDOs), Bit 27 GiveBack (deprecated; receiver Shall
    ignore this field), Bit 26 Capability Mismatch (1b if the offered Source Capabilities cannot
    satisfy the Sink's power or voltage requirements while still making a valid request from the
    offered PDOs; 0b otherwise), Bit 25 USB Communications Capable (1b if the Sink has USB data
    lines and is capable of USB2, USB3, or USB4 communication), Bit 24 No USB Suspend (1b if the
    Sink requests to continue its Explicit Contract during USB Suspend), Bit 23 Unchunked Extended
    Messages Supported (1b if the Sink supports both Chunked and Unchunked Extended Messages), and
    Bit 22 EPR Capable (1b if the Sink is capable of EPR Mode operation). The lower fields in Bits
    21..0 depend on the referenced PDO type: for a Fixed and Variable RDO (Table 6.19), Bits 21..20
    are Reserved (00b), Bits 19..10 are Operating Current in 10 mA units (<= PDO Maximum Current),
    and Bits 9..0 are Maximum Operating Current (Deprecated in PD R3.2: transmitter Shall set this
    field equal to Operating Current and receiver should ignore this field); for a Battery RDO
    (Table 6.20), Bits 21..20 are Reserved (00b), Bits 19..10 are Operating Power in 250 mW units
    (<= PDO Maximum Power), and Bits 9..0 are Maximum Operating Power (Deprecated in PD R3.2:
    transmitter Shall set this field equal to Operating Power and receiver should ignore this
    field); for a Programmable Power Supply (PPS) RDO (Table 6.21), Bit 21 is Reserved (0b), Bits
    20..9 are Output Voltage at the Source's connector in 20 mV units (between APDO Minimum Voltage
    and Maximum Voltage), Bits 8..7 are Reserved (00b), and Bits 6..0 are Operating Current in 50
    mA units (<= APDO Maximum Current); and for an Adjustable Voltage Supply (AVS) RDO (Table
    6.22), Bit 21 is Reserved (0b), Bits 20..9 are Output Voltage in 25 mV units with Bits 10..9
    required to be 00b so the effective voltage step size is 100 mV, Bits 8..7 are Reserved (00b),
    and Bits 6..0 are Operating Current in 50 mA units (for SPR AVS, <= APDO Maximum Current for
    the selected range; for EPR AVS, <= (PDP field from Source_Capabilities / Output Voltage from
    this RDO) rounded down to the nearest 50 mA).
