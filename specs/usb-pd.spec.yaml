- id: avs-rdo-25mv-encoding-with-100mv-step-constraint
  section: gotchas
  title: AVS RDO Output Voltage uses 25 mV bit weighting but requires Bits 10..9 = 00b (100 mV step) and no Source current limit
  claim: >-
    In an Adjustable Voltage Supply (AVS) Request Data Object (Table 6.22, used for both SPR AVS
    and EPR AVS APDO requests), Bits 20..9 (Output Voltage) is encoded in 25 mV units (unlike PPS
    RDOs in Table 6.21, which use 20 mV units in Bits 20..9, and Fixed or Variable PDOs, which use
    50 mV units). However, even though the least-significant bit of Bits 20..9 has a 25 mV weight,
    Table 6.22 requires Bits 10..9 to be set to 00b, making the effective voltage step size 100 mV
    (the 12-bit field value must be a multiple of 4, such as 360 = 0168h for 9.0 V or 600 = 0258h
    for 15.0 V). Furthermore, unlike an SPR Source in PPS Mode, a Source operating in AVS Mode does
    not support a programmable Current Limit (Sections 6.4.1.3 and 7.9.2); the Sink is responsible
    for not drawing more current than it requested.
