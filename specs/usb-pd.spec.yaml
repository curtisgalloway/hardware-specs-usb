- id: epr-request-two-object-layout-and-hard-reset-traps
  section: gotchas
  title: EPR_Request requires two Data Objects (RDO plus PDO copy) and standard Request in EPR Mode triggers Hard Reset
  claim: >-
    Power negotiation in EPR Mode has strict message-format rules that trigger immediate Hard Reset
    signaling when violated. First, unlike a standard Request message (which carries 1 Data
    Object), an EPR_Request message (Message Type = 01001b, Section 6.4.8, Figure 6.3) always
    carries two 32-bit Data Objects (Number of Data Objects = 010b): Data Object 1 is the RDO
    (referencing any SPR Object Position 0001b..0111b or EPR Object Position 1000b..1011b) and Data
    Object 2 is a copy of the 32-bit PDO/APDO from EPR_Source_Capabilities being requested; the
    Source verifies that the PDO in EPR_Request exactly matches the PDO in the latest
    EPR_Source_Capabilities pointed to by Object Position, and initiates a Hard Reset if they do
    not match (Sections 7.30.3 and 7.30.7.3). Second, even when an EPR Sink requests an SPR PDO
    (such as 5 V at Object Position 1 prior to exiting EPR Mode), it must use EPR_Request while in
    EPR Mode; a Source operating in EPR Mode that receives a standard Request message (Message Type
    = 00010b) must initiate a Hard Reset (Sections 7.9.2, 7.30.5, and 7.30.7.3). Third, if a Source
    in SPR Mode receives a standard Request message whose RDO Object Position field (Bits 31..28)
    contains a value greater than 0111b (7), the Source must send Hard Reset signaling (Section
    6.4.2.1.5).
