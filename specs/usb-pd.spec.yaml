- id: epr-mode-entry-negotiation-and-keepalive
  section: programming-model
  title: Extended Power Range (EPR) Mode entry, negotiation, keep-alive, and exit flows
  claim: >-
    Entering and operating in Extended Power Range (EPR) Mode (>100 W up to 240 W) requires an
    established SPR Explicit Contract in which both Port Partners advertised EPR Capable = 1b (bit
    23 of the Source's 5 V Fixed PDO and bit 22 of the Sink's RDO) and are not connected through a
    Charge Through VPD. First, the Sink initiates EPR Mode Entry by sending an EPR_Mode Data
    Message (Table 6.28) with Action = Enter (01h) and Data = EPR Sink Operational PDP (00h–FFh in
    1 W units, Bits 23..16), and starts SinkEPREnterTimer (tEnterEPR = 450–550 ms). Second, the
    Source verifies EPR Capable in the RDO and 5 V PDO, replies with EPR_Mode (Action = Enter
    Acknowledged, 02h), and verifies (if not already discovered prior to or within
    tEPRSourceCableDiscovery = 2 s max of entering the First Explicit Contract, performing a
    VCONN_Swap first if it is not currently the VCONN Source) via SOP' Discover Identity that the
    attached cable's Cable VDO reports Maximum VBUS Voltage = 11b (50 V), VBUS Current Handling
    Capability = 10b (5 A), and EPR Capable = 1b; the Source then sends EPR_Mode (Action = Enter
    Succeeded, 03h) or EPR_Mode (Action = Enter Failed, 04h, with Data set to 00h Unknown cause,
    01h Cable not EPR Capable, 02h Source failed to become VCONN Source, 03h EPR Capable bit not
    set in RDO, 04h Source unable to enter EPR Mode, or 05h EPR Capable bit not set in PDO). Third,
    upon Enter Succeeded both partners enter EPR Mode and the Source sends EPR_Source_Capabilities
    (Extended Message Type 10001b, Figure 6.8, containing SPR PDOs in positions 1..7 padded with
    0000_0000h and EPR PDOs/APDO in positions 8..11) within tFirstSourceCap (250 ms max); the Sink
    responds with an EPR_Request Data Message (Figure 6.3) carrying 2 Data Objects (the RDO in
    Object 1 selecting any SPR or EPR position 0001b..1011b, plus a verbatim copy of the selected
    PDO in Object 2), and the Source replies with Accept and then PS_RDY once VBUS settles (within
    tPSTransition EPR = 830–1020 ms). Fourth, while in EPR Mode (PE_SRC_Ready / PE_SNK_Ready), the
    Sink runs SinkEPRKeepAliveTimer (tSinkEPRKeepAlive = 250–500 ms, stopped and re-initialized on
    every GoodCRC received from the Source) and sends an Extended_Control (EPR_Keep_Alive, Type =
    03h, Tables 6.62 and 6.63) message whenever it expires, to which the Source responds with
    Extended_Control (EPR_Keep_Alive_Ack, Type = 04h); the Source runs SourceEPRKeepAliveTimer
    (tSourceEPRKeepAlive = 750–1000 ms, stopped on any GoodCRC sent to or received from the Sink)
    and issues Hard Reset signaling if it expires. To perform a Commanded Exit from EPR Mode, the
    Port Partners must first be in an Explicit Contract with an SPR PDO or APDO (via the Sink
    negotiating an SPR PDO with bit 31 of the RDO Object Position field set to 0, or the Source
    sending EPR_Source_Capabilities with no EPR PDOs), after which either partner sends EPR_Mode
    (Action = Exit, 05h) and the Source sends Source_Capabilities within tFirstSourceCap.
