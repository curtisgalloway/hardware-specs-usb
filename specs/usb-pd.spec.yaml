- id: message-header-and-extended-header-format
  section: programming-model
  title: 16-bit Message Header and 16-bit Extended Message Header bit fields
  claim: >-
    Every USB PD message begins with a 16-bit Message Header (Table 6.2, transmitted b0 first).
    Bit 15 is Extended (0b for a Control or Data Message, 1b for an Extended Message). Bits 14..12
    are Number of Data Objects (Table 6.3: 000b for Control Messages where Extended = 0b;
    001b..111b for 1 to 7 32-bit Data Objects in Data Messages where Extended = 0b and in Chunked
    Extended Messages where Extended = 1b and Chunked = 1b; and Reserved 000b, ignored by receiver,
    in Unchunked Extended Messages where Extended = 1b and Chunked = 0b). Bits 11..9 are MessageID,
    a 3-bit rolling counter (0..7) incremented by the sender on each new message per SOP*
    communication path and reset to 0 on Hard Reset, Soft_Reset, or PR_Swap. Bit 8 is Port Power
    Role on SOP (0b Sink, 1b Source) or Cable Plug on SOP' and SOP'' (0b message originates from a
    DFP or UFP, 1b message originates from a Cable Plug or VPD). Bits 7..6 are Specification
    Revision (00b Revision 1.0, deprecated and interpreted by receivers as Revision 2.0; 01b
    Revision 2.0; 10b Revision 3.x; 11b Reserved). Bit 5 is Port Data Role on SOP (0b UFP, 1b DFP)
    and is Reserved (0b, ignored by receiver) on SOP' and SOP''. Bits 4..0 hold the 5-bit Message
    Type code, interpreted according to Extended and Number of Data Objects. When Extended is 1b, a
    16-bit Extended Message Header (Table 6.48) immediately follows the Message Header: Bit 15 is
    Chunked (Table 6.49: 1b Chunked Extended Message with up to MaxExtendedMsgChunkLen = 26 data
    bytes per chunk padded with 00h bytes to a 4-byte Data Object boundary; 0b Unchunked Extended
    Message with up to MaxExtendedMsgLen = 260 data bytes in one packet), Bits 14..11 are Chunk
    Number (0000b..1001b for chunks 0 to 9 when Chunked is 1b, with 1010b..1111b invalid so the
    receiver ignores the message; Reserved 0000b when Chunked is 0b), Bit 10 is Request Chunk (0b
    data chunk payload; 1b chunk request, valid only when Chunked is 1b with Number of Data Objects
    = 001b and Data Size = 0), Bit 9 is Reserved (0b, ignored by receiver), and Bits 8..0 are Data
    Size (total bytes in the complete Extended Message Data Block from 0 to 260, or 0 when Request
    Chunk is 1b). Extended Messages on SOP are sent Chunked unless both Port Partners advertise
    Unchunked Extended Messages Supported = 1b (bit 24 of the Source's 5 V Fixed Supply PDO in
    Table 6.8 and bit 23 of the Sink's RDO in Table 6.19); Cable Plugs on SOP' and SOP'' set
    Chunked = 1b in every Extended Message and chunk Extended Messages whose Data Size exceeds
    MaxExtendedMsgLegacyLen (26 bytes).
