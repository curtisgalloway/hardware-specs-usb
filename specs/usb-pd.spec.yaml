- id: phy-bmc-framing-and-crc32
  section: programming-model
  title: BMC signaling rate, packet framing, bit ordering, and CRC-32 calculation
  claim: >-
    USB PD communications run half-duplex over the single active USB Type-C CC wire using Bi-phase
    Mark Coding (BMC) at a nominal bit rate fBitRate of 300 kbps (270 kbps minimum to 330 kbps
    maximum; unit interval tUnitInterval = 3.03 us minimum, 3.33 us nominal, 3.70 us maximum),
    transmitter voltage swing vSwing of 1.05 V minimum, 1.125 V nominal, 1.2 V maximum, and
    minimum inter-frame gap tInterFrameGap of 25 us. Every PD packet other than Hard Reset and
    Cable Reset consists of five fields in order: first, a 64-bit Preamble of alternating 0s and 1s
    starting with 0 and ending with 1 (BMC encoded directly without 4b5b encoding) for receiver
    lock; second, a Start of Packet (SOP*) ordered set of four 5b K-code symbols (20 bits); third,
    the payload consisting of the 16-bit Message Header followed by optional Data Objects or
    Extended Message bytes, 4b5b encoded and transmitted least-significant bit (b0) first, with the
    lower nibble (d3..d0) of each byte sent before the upper nibble (d7..d4); fourth, a 32-bit
    CRC-32 calculated over all payload bytes (excluding Preamble, SOP*, and EOP) using polynomial
    04C1_1DB7h, initial value FFFF_FFFFh, and inverted remainder (residual C704_DD7Bh), 4b5b
    encoded as eight 5b symbols and transmitted LSB first; and fifth, a single 5b End of Packet
    (EOP) K-code symbol (01101b), followed by one final BMC trailing edge to terminate the final
    bit cell of the frame.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - page: '85'
      section: '5.1'
    - pages: ['87', '88']
      section: 5.3.1
      figure: '5.1'
    - pages: ['88', '90']
      section: 5.3.1.1
    - page: '90'
      section: 5.3.1.1.4
    - page: '90'
      section: 5.3.1.1.5
    - page: '93'
