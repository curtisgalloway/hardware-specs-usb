- id: reset-mechanisms-soft-hard-cable-data
  section: programming-model
  title: Soft Reset, Hard Reset, Cable Reset, and Data Reset mechanisms and scope
  claim: >-
    USB Power Delivery defines four reset mechanisms with distinct scopes. First, a Soft Reset
    (Soft_Reset Control Message) recovers from Protocol Errors on SOP (resetting the Port Partner
    only) or on SOP'/SOP'' (resetting the targeted Cable Plug only) without affecting power supply
    operation: the sender resets its MessageIDCounter and RetryCounter for that SOP* path to 0
    before sending Soft_Reset (which always carries MessageID = 0, sent within tSoftReset = 15 ms
    max of CRCReceiveTimer expiration or tProtErrSoftReset = 15 ms max of a Protocol Error), and
    the receiver resets its own MessageIDCounter and RetryCounter to 0 before replying with Accept
    within tReceiverResponse (15 ms max); a Port Partner observing a Protocol Error during an SOP
    Soft Reset initiates a Hard Reset, whereas a DFP observing a Protocol Error during an
    SOP'/SOP'' Soft Reset initiates a Cable Reset. Second, a Hard Reset (Hard Reset ordered set in
    Table 5.4) is issued by either Port Partner on unrecoverable protocol or timer failure
    (regardless of Rp value): it resets both Port Partners and all Cable Plugs, exits EPR Mode and
    all Active Modes, leaves Rp/Rd assertions unchanged, returns Data Roles and VCONN to attach
    defaults (the port asserting Rp becomes DFP and supplies VCONN; the port asserting Rd becomes
    UFP and turns off VCONN), and cycles VBUS (starting tPSHardReset = 25–35 ms after Hard Reset
    signaling, the Source stops VCONN, drives VBUS to vSafe0V within tSafe0V, waits tSrcRecover,
    and restores vSafe5V within tSrcTurnOn). Third, a Cable Reset (Cable Reset ordered set in Table
    5.4) is generated only by a DFP within an Explicit Contract while supplying VCONN (turning on
    VCONN or performing a VCONN_Swap first if needed): it resets the Protocol Layers of both the
    sender and the Cable Plugs, causes the Cable Plugs to perform the equivalent of a power cycle,
    and exits all Active Modes in the Cable Plugs without resetting the Port Partner contract.
    Fourth, a Data Reset (Data_Reset Control Message) may be sent by either the DFP or UFP (mandatory
    for USB4-capable ports) to reset the USB data connection and exit all Alternate Modes while
    preserving the VBUS Power Contract and DFP/UFP Data Roles: the responder replies with Accept,
    both partners disconnect USB data lines, exit Alternate Modes, and power-cycle VCONN to reset
    the cable (using VCONNDischargeTimer, tVconnSourceDischarge = 160–240 ms, and completing within
    tDataReset = 200–250 ms; monitored by DataResetFailTimer, tDataResetFail = 300–400 ms, and
    DataResetFailUFPTimer, tDataResetFailUFP = 450–550 ms), and the DFP always completes the AMS by
    sending Data_Reset_Complete to the UFP regardless of which partner initiated Data_Reset.
