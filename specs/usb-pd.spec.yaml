- id: data-and-extended-message-types
  section: programming-model
  title: Data Message, Extended Message, and Extended_Control type codes
  claim: >-
    Data Messages have Extended = 0b and Number of Data Objects = 001b..111b (1 to 7 32-bit Data
    Objects). Their 5-bit Message Type codes (Bits 4..0, Table 6.5) are: 00001b
    Source_Capabilities (SOP; 1–7 SPR PDOs), 00010b Request (SOP; 1 RDO for SPR power negotiation),
    00011b BIST (SOP, and Receive-only on SOP'/SOP'' per Table 7.7; 1 BDO for PHY test modes),
    00100b Sink_Capabilities (SOP; 1–7 SPR Sink PDOs), 00101b Battery_Status (SOP; 1 BSDO), 00110b
    Alert (SOP; 1 ADO signaling status change events), 00111b Get_Country_Info (SOP; 1 CCDO),
    01000b Enter_USB (SOP, SOP', SOP''; 1 EUDO configuring USB2/USB3/USB4 entry), 01001b EPR_Request
    (SOP; 2 Data Objects: RDO plus copy of requested PDO), 01010b EPR_Mode (SOP; 1 EPRMDO for EPR
    entry or exit), 01011b Source_Info (SOP; 2 SIDOs—SIDO1 and SIDO2—reporting Port Type, Port
    Maximum PDP, Port Present PDP, Port Reported PDP, DPS Port, and Port Guaranteed PDP), 01100b
    Revision (SOP, plus SOP' for Active Cables per Table 7.5 where SOP'' is Not Allowed; 1 RMDO
    reporting Major.Minor Revision and Version), and 01111b Vendor_Defined (SOP, SOP', SOP''; 1–7
    VDOs starting with VDM Header); codes 00000b, 01101b..01110b, and 10000b..11111b are Reserved
    (respond with Not_Supported). Extended Messages have Extended = 1b with 5-bit Message Type
