      (00h–05h) from Table 6.28 are extracted; Tables 7.9 and 7.10 are cited only for EPR-specific
      timers.

- id: role-swap-ams-flows
  section: programming-model
  title: Power Role Swap (PR_Swap), Data Role Swap (DR_Swap), and VCONN Swap (VCONN_Swap) AMS rules
  claim: >-
    Role Swap Atomic Message Sequences allow Port Partners in an Explicit Contract to exchange
    power, data, or VCONN roles independently. A Power Role Swap (PR_Swap) may be initiated by
    either partner in SPR Mode (PR_Swap is forbidden in EPR Mode; EPR Mode must be exited first,
    and a PR_Swap received in EPR Mode is answered with Reject), and the responder replies with
    Accept, Reject, or Wait (the requester waits at least tPRSwapWait = 100 ms min after Wait
    before retrying). On Accept, both partners enter an Implicit Contract: the Initial Source
    ramping down VBUS transitions its CC termination from Rp to Rd and sends PS_RDY with Port Power
    Role = 0b (Sink) before PSSourceOffTimer (tPSSourceOff = 750–920 ms in SPR Mode) expires; the
    Initial Sink then switches its CC termination from Rd to Rp, turns on VBUS to vSafe5V, and
    sends PS_RDY with Port Power Role = 1b (Source) before PSSourceOnTimer (tPSSourceOn = 390–480
    ms) expires. Both partners then reset their Protocol Layers (MessageIDCounter = 0,
    RetryCounter = 0), and the New Source resets CapsCounter, waits at least tSwapSourceStart (20
    ms min, SwapSourceStartTimer), and sends Source_Capabilities to establish a new Explicit
    Contract while DFP/UFP Data Roles and VCONN Source remain unchanged. A Data Role Swap (DR_Swap)
    exchanges DFP (USB Host) and UFP (USB Device) roles while leaving VBUS Source, VCONN Source,
    and CC Rp/Rd terminations unchanged (responder replies with Accept, Reject, or Wait with
    tDRSwapWait = 100 ms min); if any Active Modes exist between Port Partners when DR_Swap is
    received, a Hard Reset must be performed (within tDRSwapHardReset = 15 ms max), and if a Cable
    Plug has any Active Modes the DFP must not issue DR_Swap and must exit all Cable Plug Active
    Modes before accepting DR_Swap. A VCONN Swap (VCONN_Swap) exchanges the VCONN Source role using
    make-before-break power sequencing while leaving VBUS Source, DFP/UFP Data Roles, and CC Rp/Rd
    terminations unchanged: on Accept, the New VCONN Source turns on VCONN and sends PS_RDY within
    tVconnSourceOn (50 ms max; monitored by VconnOnTimer, tVconnSourceTimeout = 100–200 ms), after
    which the Initial VCONN Source stops sourcing VCONN within tVconnSourceOff (25 ms max) of the
    PS_RDY EOP (and after losing VCONN Source due to an incoming VCONN_Swap, a port must wait at
    least tVconnSwapDelayDFP = 100 ms min or tVconnSwapDelayUFP = 500 ms min before initiating
    another VCONN_Swap). A port that is currently the VCONN Source must never send Reject in
    response to VCONN_Swap (and must respond with Accept rather than Wait if the partner's
    Revision/Version is earlier than R3.2 V1.1, while a requester receiving Wait waits at least
    tVconnSwapWait = 100 ms min), and a port that becomes VCONN Source via VCONN_Swap must issue an
    SOP' (and/or SOP'') Soft_Reset before otherwise communicating with the Cable Plugs.
  support:
