- id: cable-plug-no-retries-and-soft-reset-always-msgid-zero
  section: gotchas
  title: Soft_Reset is exempt from duplicate MessageID filtering (always MessageID = 0) and Cable Plugs never retry
  claim: >-
    Two Protocol Layer rules require special-case handling in firmware. First, the receiver
    duplicate-detection rule (acknowledging with GoodCRC and dropping any incoming message whose
    MessageID matches the stored MessageID for that SOP* path) explicitly does not apply to
    Soft_Reset (Section 7.32.3): because the sender resets its MessageIDCounter to 0 before
    transmitting Soft_Reset (Section 7.7), a Soft_Reset message always carries MessageID = 0, so a
    receiver whose stored MessageID is already 0 must still process Soft_Reset and reply with
    Accept rather than dropping it as a duplicate. Second, Cable Plugs do not retry messages when a
    GoodCRC from the VCONN Source is corrupted or lost (Section 7.32.4 and Section 8.6.2.1). In
    addition, when a port becomes VCONN Source via VCONN_Swap, it must send an SOP' (and/or SOP'')
    Soft_Reset before otherwise communicating with the Cable Plugs to synchronize MessageID
    (Sections 7.1.1 and 8.6.1.2.1), whereas if an initial SOP' Discover Identity REQ receives no
    GoodCRC response, the VCONN Source must not send an SOP' Soft_Reset because the cable may be
    passive and not PD-capable (Section 8.6.1.2.1).
  support:
