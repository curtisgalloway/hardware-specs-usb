- id: goodcrc-messageid-and-retry-rules
  section: programming-model
  title: GoodCRC acknowledgment, per-SOP* MessageID rolling counters, and retransmission rules
  claim: >-
    Every valid PD packet (except GoodCRC itself, Hard Reset, and Cable Reset) requires a GoodCRC
    Control Message acknowledgment from the addressed recipient. Each Port maintains an
    independent 3-bit MessageIDCounter (0..nMessageIDCount, where nMessageIDCount = 7) for each
    SOP* packet type it uses. Upon transmitting the last bit of a packet's EOP, the sender's
    Protocol Layer starts CRCReceiveTimer (tReceive = 900 us minimum, 1000 us nominal, 1100 us
    maximum). If a GoodCRC with a MessageID matching MessageIDCounter arrives before
    CRCReceiveTimer expires, the transmitter stops CRCReceiveTimer, re-initializes RetryCounter to
    0, and increments MessageIDCounter modulo 8. If CRCReceiveTimer expires (or a GoodCRC with the
    wrong MessageID or a non-GoodCRC message arrives), the transmitter increments RetryCounter and
    retransmits the exact same packet with the same MessageID within tRetry (195 us maximum) up to
    nRetryCount = 2 retries (3 total transmission attempts); if the nRetryCount retry fails, the
    Port initiates a Soft_Reset AMS within tSoftReset (15 ms maximum). Two classes of messages are
    never retried: Cable Plugs never retry any message, and Unchunked Extended Messages (Chunked =
    0b) with Data Size > MaxExtendedMsgLegacyLen (26 bytes) are not retried (whereas Chunked
    Extended Messages and Unchunked Extended Messages with Data Size <= 26 bytes are retried
    normally). On the receive side, each Port stores a per-SOP* copy of the last received MessageID
    (cleared on Hard Reset, Soft_Reset, or PR_Swap) and returns a GoodCRC carrying the received
    MessageID within tTransmit (195 us maximum) of receiving a valid packet; if the received
    MessageID matches the stored MessageID (and the message is not Soft_Reset, which always carries
    MessageID = 0), the receiver still returns GoodCRC with that MessageID but drops the duplicate
    message without passing it to the Policy Engine.
