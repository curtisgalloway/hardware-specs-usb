- id: structured-vdm-header-and-discovery
  section: programming-model
  title: Structured VDM (SVDM) header layout, commands, and partner/cable discovery rules
  claim: >-
    A Vendor_Defined Data Message (Message Type = 01111b) carries 1 to 7 32-bit Vendor Data
    Objects (VDOs), where the first VDO is the VDM Header. When Bit 15 (VDM Type) is 0b, the
    message is an Unstructured VDM (Table 6.32: Bits 31..16 = 16-bit USB-IF Vendor ID, Bit 15 = 0b,
    Bits 14..0 = vendor-defined). When Bit 15 (VDM Type) is 1b, the message is a Structured VDM
    (SVDM, Table 6.33) with header fields: Bits 31..16 Standard or Vendor ID (SVID: FF00h is the
    USB PD SID used for Discovery Identity and Discovery SVIDs commands), Bit 15 VDM Type (1b),
    Bits 14..13 Structured VDM Version Major (01b = Version 2.x for USB PD Revision 3.x; 00b =
    Version 1.0 deprecated; 10b..11b invalid, receiver uses 01b), Bits 12..11 Structured VDM
    Version Minor (for standard commands 0..15: 00b = Version 2.0 prior to PD R3.1 V1.6, 01b =
    Version 2.1 starting with PD R3.1 V1.6, 10b..11b invalid; for SVID commands 16..31: defined by
    SVID), Bits 10..8 Object Position (000b for commands 0..3 and 7..15; 001b..110b 1-based index
    into the Discover Modes VDO list for Enter Mode, Exit Mode, and Attention; 111b Exit all Active
    Modes, valid only with Exit Mode), Bits 7..6 Command Type (00b REQ from Initiator, 01b ACK
    from Responder, 10b NAK from Responder, 11b BUSY from Responder, where BUSY is forbidden on
    Enter Mode and Exit Mode per Table 8.1), Bit 5 Reserved (0b, ignored), and Bits 4..0 Command:
    1 (00001b) Discover Identity (returns ID Header VDO, Cert Stat VDO, Product VDO, and 0–3
    Product Type VDOs; for a DRD on SOP in Figure 6.5, returns UFP VDO, a 0000_0000h 32-bit Pad
    Object, and DFP VDO), 2 (00010b) Discover SVIDs (returns up to 12 16-bit SVIDs per ACK packed
    two per VDO, terminated by 0000h), 3 (00011b) Discover Modes (returns 1–6 Mode VDOs for the
    SVID), 4 (00100b) Enter Mode (DFP only; responder enters mode before sending ACK, initiator
    enters mode on receiving ACK), 5 (00101b) Exit Mode (DFP only; responder exits mode before
    sending ACK), 6 (00110b) Attention (single REQ message completed upon GoodCRC with no SVDM
    response message), 16..31 SVID-Specific Commands, and 0 or 7..15 Invalid (responder returns
    NAK). Cable Plug discovery (Discover Identity, Discover SVIDs, Discover Modes) is addressed
    only to SOP'; responses from SOP' apply to both SOP' and SOP'', and an initiator must never
    send discovery SVDM REQs to SOP''.
