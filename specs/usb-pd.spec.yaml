- id: phy-4b5b-kcodes-and-ordered-sets
  section: programming-model
  title: 4b5b K-code symbols and SOP*, Hard Reset, and Cable Reset ordered sets
  claim: >-
    The Physical Layer uses six 5-bit special K-code symbols (transmitted b0 first): Sync-1 is
    11000b, Sync-2 is 10001b, Sync-3 is 00110b, RST-1 is 00111b, RST-2 is 11001b, and EOP is
    01101b (while the ten 5b codes 00000b, 00001b, 00010b, 00011b, 00100b, 00101b, 01000b, 01100b,
    10000b, and 11111b are Error symbols that must not be used). Seven 4-symbol ordered sets
    (K-code 1 through K-code 4) frame packets or signal resets: SOP (Port Partner communication) is
    Sync-1, Sync-1, Sync-1, Sync-2; SOP' (Cable Plug attached to the VCONN Source) is Sync-1,
    Sync-1, Sync-3, Sync-3; SOP'' (remote Cable Plug) is Sync-1, Sync-3, Sync-1, Sync-3; SOP'_Debug
    (debug of near Cable Plug) is Sync-1, RST-2, RST-2, Sync-3; SOP''_Debug (debug of far Cable
    Plug) is Sync-1, RST-2, Sync-3, Sync-2; Hard Reset (resets Port Partner and Cable Plugs) is
    RST-1, RST-1, RST-1, RST-2; and Cable Reset (resets Cable Plugs only) is RST-1, Sync-1, RST-1,
    Sync-3. Hard Reset and Cable Reset packets consist solely of the 64-bit Preamble followed by
    the four K-codes of the ordered set, with no Header, Data Objects, CRC-32, or EOP. When a
    receiver finds 3 out of 4 K-codes in the correct position (per Table 5.5), it may interpret
    this as a valid ordered set, and should ensure that all four K-codes are valid to avoid
    ambiguity in detection.
  support:
  - class: standard
    doc: usb-pd-r3.2.pdf
    at:
    - pages: ['89', '90']
      section: 5.3.1.1.2
      table: '5.2'
    - page: '90'
      section: 5.3.1.1.3
      table: '5.3'
    - page: '91'
      section: 5.3.1.2
      table: '5.4'
    - page: '94'
      section: 5.3.2.2
      table: '5.5'
  todo:
    check: document
