      the default address after reset, SetConfiguration() with a non-zero value (9.1.1.5), Configured
      as the state in which "the host may now use the function" (Table 9-1), suspend after 3 ms with
      address and configuration kept, and selective suspend when the hub port is disabled (9.1.1.6)
      all match. Searched the document for "3 ms" and the suspend rules: 7.1.7.6 (p. 182) says a device
      begins the transition to Suspend after more than 3.0 ms of Idle and "must actually be suspended
      ... after no more than 10 ms of bus inactivity". The claim follows Table 9-1 and is not wrong,
      but omits that bound; suggest adding "and must be fully suspended within 10 ms (7.1.7.6, p.
      182)". Also omitted: a power-source change can return the device to Powered or Address (9.1.1.2,
      p. 270), which is covered by the power-budget fact.'
