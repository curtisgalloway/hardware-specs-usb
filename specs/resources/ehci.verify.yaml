      (CTRLDSSEGMENT, USBINTR, PERIODICLISTBASE with T-bits = 1 if empty, USBCMD with Run/Stop =
      1, and CONFIGFLAG CF = 1) and that clearing Run/Stop to 0 halts the controller within 16
      micro-frames (2 ms) and sets USBSTS HCHalted to 1.
