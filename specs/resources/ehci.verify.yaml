    basis: af5e96f6e01a37fdfb2fa72117a9c9625c768688dfe725786fb9d049f5023224
    verdict: PASS
    date: '2026-10-19'
    verifier: independent spec-verifier subagent, EHCI 1.0 reader A
    contrary_evidence: none-found
    citation_precision: exact
    note: >-
      Verified against Section 1 (p. 11), Section 1.2 and Figure 1-2 (pp. 12-14), Section 2.2.3
      Table 2-6 (p. 24), and Section 4.2 (pp. 64-65). Confirmed that the USB 2.0 specification
      takes precedence on conflicts, that an EHCI host controller pairs one high-speed controller
      with 0 or more USB 1.1 companion controllers (UHCI/OHCI), and that when HCSPARAMS N_CC is 0
      a full- or low-speed device on a root port fails the high-speed chirp during reset and
      leaves the port disabled unless a high-speed device (such as a USB 2.0 hub) is attached.
      Confirmed the PCI multi-function ordering rule in Section 4.2 requiring companion controller
      function numbers to be less than the EHCI function number, or function 0 when the EHCI
      controller is the sole PCI function.
