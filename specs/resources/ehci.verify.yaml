      Operational Base + 40h, default 0b) and PORTSC bit 13 (Port Owner, default 1b) routing
      rules: CF = 0 forces Port Owner to 1b (companion ownership), and a 0b-to-1b transition on
      CF clears all Port Owner bits to 0b (EHCI ownership). Confirmed connect handling via PORTSC
      Line Status bits 11:10 (valid when Port Enabled = 0 and Current Connect Status = 1): 01b
      (K-state, low-speed) hands off immediately via Port Owner = 1, whereas 00b (SE0), 10b
      (J-state) or 11b performs an EHCI port reset (Port Reset = 1 and Port Enabled = 0 while
      HCHalted = 0, stabilizing within 2 ms of writing 0 to Port Reset) that either sets Port
      Enabled = 1 for high-speed or leaves Port Enabled = 0 for full-speed handoff via Port
      Owner = 1, and confirmed disconnect immediately returns Port Owner to 0 when CF = 1.
