      Verified against Section 2.3.1 Table 2-9 (pp. 28-30), Section 2.3.2 Table 2-10 (p. 31), and
      Section 4.1 Table 4-1 (pp. 63-64). Confirmed HCRESET (USBCMD bit 1) resets internal state
      and all operational registers (including PORTSC and CONFIGFLAG, returning port ownership to
      companion controllers) without driving a downstream USB reset or affecting PCI configuration
      registers, self-clears to 0 on completion, cannot be terminated early by writing 0, and is
