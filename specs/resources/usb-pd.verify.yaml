    note: Verified against Section 1.7 (page 24) and Figure 1.1 (page 25) of usb-pd-r3.2.pdf. Section
      1.7 and Figure 1.1 show that a single Device Policy Manager coordinates USB PD behavior across
      all ports within the device while each port has its own Policy Engine, Protocol Layer, Physical
      Layer, USB-C Port Control (on the CC pin), and Power Source/Sink block (on VCONN and VBUS pins),
      and state the exact responsibilities of each layer. Note that the prose intro in Section 1.7
      (page 24) says "From lowest to highest, these layers are:" before listing the bullets from Device
      Policy Manager down to USB-C Port Control, whereas Figure 1.1 (page 25) depicts the physical/control
      hierarchy with USB-C Port Control and Physical Layer at the bottom (on the CC pin), Protocol
      Layer in the middle, Policy Engine above them, and Device Policy Manager at the top. Read Section
      1.7 in full; no contrary evidence found.
    contrary_evidence: none-found
    citation_precision: exact
