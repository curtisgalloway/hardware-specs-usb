  port-power-data-vconn-roles:
    basis: 537919c91bd2ea3f1e6ce93aedda0eed6facfc9605ab601b7d7761ffc44d8a72
    verdict: PASS
    date: '2026-10-19'
    verifier: Claude Opus 5.5 (anthropic/claude-opus-5-5), subagent, USB-PD reader A
    note: Verified against Section 1.2 (page 21) and Sections 1.3.1–1.3.8 (pages 21–22) of usb-pd-r3.2.pdf.
      Section 1.2 states that each connection has one Source Port (providing power and defaulting
      at Attachment to DFP and VCONN Source) and one Sink Port (consuming power and defaulting at
      Attachment to UFP), and that power roles (Source/Sink), data roles (DFP/UFP), and the VCONN
      Source role can be swapped independently during a connection. Sections 1.3.1–1.3.8 confirm that
      the Source initiates power negotiations, DFP is associated with the USB Host role and Initiator
      in Data Role negotiations, UFP is associated with the USB Peripheral role and Responder in Data
      Role negotiations, DRP ports swap between Source and Sink, DRD ports swap between DFP and UFP
      even if Source-only or Sink-only for power, a port must be the VCONN Source to communicate with
      Cable Plugs, and Cable Plugs (embedded e-marker and/or active circuitry powered when VCONN is
      present) do not initiate communication and only respond to messages addressed to them. Read
      Sections 1.1–1.6 (pages 21–24) for contrary qualifications; none found.
    contrary_evidence: none-found
    citation_precision: exact
  default-explicit-implicit-contracts:
    basis: 7bc76d22a6e00160c99f04a5874e7e9eae188e6db60e64a8ecccf5ef49b2b1ed
    verdict: PASS
    date: '2026-10-19'
    verifier: Claude Opus 5.5 (anthropic/claude-opus-5-5), subagent, USB-PD reader A
    note: 'Verified against Section 1.4 (pages 22–23) of usb-pd-r3.2.pdf. Section 1.4 defines the
      three operational contracts between a PD Source and Sink: Default Contract (non-negotiated power
      contract at initial connection at 5 V up to advertised USB-C current until disconnect or Explicit
      Contract negotiation), Explicit Contract (normal operational state after PD Power Negotiation
      where Source offers, Sink requests, and Source accepts; entered before other USB PD messaging
      between the ports, and where data connections and modes other than USB2 and USB3 may be established),
      and Implicit Contract (transitory 5 V contract at advertised USB-C current following a Power
      Role Swap or Fast Role Swap where all data connections and modes are maintained and the Source
      immediately negotiates an Explicit Contract). Read Sections 1.4–1.5 (pages 22–24) and checked
      Section 7.13 (page 212, which notes a Source that is also VCONN Source may send SOP'' Discover
      Identity to a Cable Plug prior to the First Explicit Contract); no contradiction to the Source-Sink
      contract rules in Section 1.4.'
    contrary_evidence: none-found
    citation_precision: exact
