    verifier: Claude Opus 4.6 (anthropic/claude-opus-4-6), subagent, USB 2.0 ECNs reader A
    note: >-
      Verified against usb-2.0-connect-timing-ecn.pdf pp. 2-3 (Summary of ECN and Impact on
      Existing Peripherals and Systems) and pp. 5-6 (delta t7 TCON_ISUSP, delta t8 T2SUSP, and the
      Table 7-14 TCON_ISUSP instruction). Delta t7 on p. 5 states that after connecting, a
      good-battery peripheral may draw up to 1 unit load (IUNIT) and a dead/weak-battery peripheral
      up to 5x IUNIT for TCON_ISUSP (1 s max on p. 6), dropping to ISUSP if still unconfigured or
      drawing configured current if configured; delta t8 requires obeying Section 7.1.7.6 suspend
      rules after TCON_ISUSP from connect. Page 3 confirms host/hub hardware must supply 1 unit
      load for at least 1 s (TCON_ISUSP) after connect, no host or peripheral software changes are
      required, and the host may still suspend the bus at any time after connect. Read all 6 pages
      for contrary evidence; none found.
    contrary_evidence: none-found
    citation_precision: exact
