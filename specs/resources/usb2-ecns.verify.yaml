      Verified against usb-2.0-lpm-ecn.pdf pp. 3-5 (Section 1, Table 1-1, Figure 1-1, Section 1.1,
      and Table 1-2). Table 1-1 and Figure 1-1 define L0 (On, L0-Active/L0-Idle with 1 ms FS /
      125 us HS SOFs or LS keep-alives), L1 (Sleep), L2 (Suspend, after 3 ms inactivity) and L3
      (Off: powered-off, disconnected, disabled), forbid direct L1-to-L2 or L2-to-L1 transitions
      (requiring transition via L0), and show L3 entered from L0/L1/L2 on
      disconnect/power-loss/disable and exiting to L0 via reset and enable. Table 1-2 confirms
      low/full-speed idle signaling and ~0.6 mW link pull-up consumption for both L1 and L2, ~10 us
      entry and ~70 us to 1 ms exit latencies for L1 versus ~3 ms entry and >30 ms exit for L2, and
      no specification-mandated device VBUS draw limit in L1 versus <=500 uA or <=2.5 mA in L2.
      Searched the full 29-page ECN for contrary state-transition rules; none found.
    contrary_evidence: none-found
    citation_precision: exact
  ext-token-and-subpid:
    basis: f64626064a44706c4182b02ad18c27eac8234c5289cb2d4c922e4acf58290dc6
