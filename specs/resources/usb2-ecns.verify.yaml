  connect-timing-parameters:
    basis: 251a07ee6694c2b57a380af7b1ca5281120c6643b66df6fa5da768129a013b6e
    verdict: PASS
    date: '2026-10-19'
    verifier: Claude Opus 4.6 (anthropic/claude-opus-4-6), subagent, USB 2.0 ECNs reader A
    note: >-
      Verified against usb-2.0-connect-timing-ecn.pdf p. 1 (Definition of Terms: Attach and Connect
      via 1.5 kOhm pull-up on D+ or D-) and pp. 4-6 (Specification Changes: Figure 7-29, delta t1
      to delta t4 prose on pp. 4-5, and the Table 7-7 and Table 7-14 INSTRUCTIONS blocks on pp.
      5-6). Table 7-7 adds VSESS_VLD (0.8 V min, 4.0 V max); ICCS is globally replaced with ISUSP;
      Table 7-14 replaces TATTDB with TCON_RST (100 ms min software debounce after D+/D- high,
      restarted on disconnect), replaces TSIGATT (100 ms max) with TSVLD_CON_PWD (1 s max), and
      adds TSVLD_CON_WKB (2 minutes max), TUNIT_CON (100 ms max) and TCON_ISUSP (1 s max). Delta
      t1-t3 confirm TSVLD_UNIT current limits (IUNIT for dead/weak battery, ISUSP for good battery)
      and VDP_SRC signaling on D+ during TSVLD_CON_WKB. Read all 6 pages of the ECN for contrary
      evidence; the uncleaned redline in delta t1 ("shall reduce its current draw to ISUSP is
      allowed to draw up to five times IUNIT") and Figure 7-29's 500 mA dashed line are covered by
      sibling fact connect-timing-redline-contradictions. The TODO accurately notes that BC 1.1/1.2
      definitions of VDP_SRC and battery thresholds are external to this ECN.
    contrary_evidence: none-found
    citation_precision: exact
  post-connect-current-and-suspend-window:
    basis: 719e65e07ee8dd3fd2eeb11f5bd996defcfc9fb2c71d4ee8d5ad7f48241b7d3d
    verdict: PASS
