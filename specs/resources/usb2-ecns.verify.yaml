    note: >-
      Verified against usb-2.0-lpm-ecn.pdf pp. 5-7 (Section 2.1, Table 2-1 and footnote, Section
      2.1.1, Figure 2-1, and Table 2-2). Table 2-1 overrides USB 2.0 Table 8-1 to assign Special
      PID 0000B (MSb order, bit 0 sent first) to EXT. Section 2.1.1 and Figure 2-1 specify two
      back-to-back 3-byte token packets (6 bytes total): EXT token (8-bit PID=0000B, 7-bit ADDR,
      4-bit ENDP, 5-bit CRC5) followed by Extended Token (8-bit SubPID, 11-bit variable field,
      5-bit CRC5 over the 11 bits). All 16 4-bit SubPID codes in Table 2-2 are accounted for (#103):
      0011B LPM token, eight codes reserved for future use (0000B, 1011B, 0111B, 1111B, 0010B,
      1010B, 1110B, 0110B), and seven base token PID codes forbidden from SubPID reuse (0001B,
      1001B, 0101B, 1101B, 1000B, 0100B, 1100B). Searched the full ECN for contrary evidence; none
      found.
    contrary_evidence: none-found
    citation_precision: exact
  lpm-token-and-hird-encoding:
