      10-11 (Section 4.1). Figure 2-2 and Table 2-3 define the LPM token (SubPID 0011B) following
      EXT and its 11-bit bmAttributes field: bits 3:0 bLinkState (0001B = L1 Sleep, 0000B and
      0010B-1111B reserved), bits 7:4 HIRD, bit 8 bRemoteWake (1B enables remote wake on an
      application-specific event, 0B disables it), and bits 10:9 reserved. Section 4.1 on pp. 10-11
      confirms that the remote wake flag temporarily overrides the Chapter 9 Remote Wake feature
      while in L1, and defines HIRD as a 4-bit encoding starting at 50 us for 0000B with 75 us
      steps (0001B = 125 us, 0010B = 200 us, up to 1111B = 1.2 ms / 1200 us in Table 4-6). Searched
      the full ECN for contrary evidence; none found.
    contrary_evidence: none-found
    citation_precision: exact
