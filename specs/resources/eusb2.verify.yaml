  scope-and-compatibility:
    basis: 2bb0e1b26c66b62268485cf208a19aaea788c9eae438f2d3e7a776b0ccf67054
    verdict: PASS
    date: '2026-10-19'
    verifier: Claude Opus 5.5 (anthropic/claude-opus-5-5), subagent reader, eUSB2 reader A
    note: >-
      Verified against sections 1.1 (p. 13), 1.2 (p. 13), 1.3 (pp. 13-14), 2 (p. 17), 2.1 (p. 18),
      3 (p. 22) and 3.5 (p. 27). All claims match the specification: USB 2.0 half-duplex,
      host-scheduled transactional protocol and device framework base; extension of eUSB2 native
      mode for inside-the-box interconnects; full protocol-layer compatibility and unchanged USB 2.0
      software programming model (client applications and device/class drivers unmodified; host and
      peripheral controllers updated for the eUSB2V2 PHY, protocol, descriptors and MaxPacketSizes);
      native-mode-only operation; incompatibility with standard USB 2.0 external connectors/cables
      (while allowing an internal cable and connector inside the system boundary per section 3.5);
      physical-layer incompatibility with USB 2.0 and eUSB2 Rev 1.2; no requirement for physical- or
      protocol-level backward compatibility or mode switching; and optional eUSB2 native/repeater
      support requiring compliance with eUSB2 native mode if eUSB2 is supported. Searched Chapters
      1-6 for contrary qualifications; none found (framework-level backward compatibility noted in
      section 1.1 is covered in device-and-endpoint-descriptors).
    contrary_evidence: none-found
    citation_precision: exact
