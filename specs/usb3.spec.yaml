- id: bmaxpower-8ma-units-and-power-fallback
  section: gotchas
  title: Configuration bMaxPower uses 8 mA units at Gen X speed and self-to-bus power switch drops
    configuration
  claim: In the Standard Configuration Descriptor (Table 9-23), bMaxPower at offset 8 is expressed
    in 8 mA units when operating at Gen X speed, versus 2 mA units when operating in USB 2.0 modes
    (for example, bMaxPower = 50 means 400 mA at Gen X speed, not 100 mA). Furthermore, although an
    unconfigured single-lane Enhanced SuperSpeed unit load is 150 mA (I_CCINIT), a USB 3.2 peripheral
    device must not draw more than 100 mA from VBUS until it detects far-end Rx terminations, and
    if a self-powered device operating at Gen X speed in a configuration requiring more than 1 unit
    load switches to being bus-powered, it must drop its current configuration and USB address and
    return to the Powered state (except a self-powered hub whose Hub Controller is already powered
    from VBUS, which may remain in the Configured state when local power is lost per Section 9.1.1.2).
