- id: device-remote-wakeup-ignored-use-function-suspend
  section: gotchas
  title: DEVICE_REMOTE_WAKEUP is ignored; remote wakeup and U1/U2/LTM enables require Configured state
  claim: Enhanced SuperSpeed devices ignore and do not use the USB 2.0 DEVICE_REMOTE_WAKEUP (wValue
    = 1) device feature selector and must return 0 in bit D1 (Remote Wakeup) of a GetStatus(DEVICE)
    response (Figure 9-4). Instead, device remote wakeup from U3 Device Suspend is enabled whenever
    any function within the device has Function Remote Wake enabled via SetFeature(FUNCTION_SUSPEND)
    (wValue = 0, bmRequestType = 00000001B) targeted at the first interface of that function with
    wIndex bit 9 (bit 1 of Suspend Options in wIndex[15..8]) set to 1 (Table 9-9). Furthermore, SetFeature
    and ClearFeature for FUNCTION_SUSPEND, U1_ENABLE (48), U2_ENABLE (49), and LTM_ENABLE (50) are
    valid only in the Configured state — sending them in the Address state before SetConfiguration()
    causes a Request Error (STALL).
