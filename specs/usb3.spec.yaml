- id: packet-types-and-lmp-subtypes
  section: standards
  title: Protocol packet Type encodings and Link Management Packet (LMP) SubTypes
  claim: 'Every Enhanced SuperSpeed packet header begins with a 5-bit Type field in DWORD 0 bits 4..0
    (Table 8-1): Link Management Packet (00000b), Transaction Packet (00100b), Data Packet Header
    (01000b), and Isochronous Timestamp Packet (01100b). Link Management Packets (LMPs, Type = 00000b)
    have no addressing or routing fields, travel only between a pair of directly connected ports,
    and carry a 4-bit SubType field in DWORD 0 bits 8..5 (Table 8-3): 0001b Set Link Function (Table
    8-4, DWORD 0 bit 10 Force_LinkPM_Accept forces the recipient to accept LGO_U1 and LGO_U2 with
    LAU unless an LXU was sent just prior to receiving the LMP), 0010b U2 Inactivity Timeout (Table
    8-5, DWORD 0 bits 16..9 carry the 8-bit timeout value from SetPortFeature(PORT_U2_TIMEOUT)), 0011b
    Vendor Device Test (Table 8-6, DWORD 0 bits 16..9 and DWORD 1..2 64-bit vendor data, prohibited
    during normal operation), 0100b Port Capability (Table 8-7, sent by both link partners within
    tPortConfiguration upon entering U0 from Polling; in Gen 1x1 advertises Link speed bit 0 = 1 in
    DWORD 0 bits 15..9 and Num HP Buffers = 4 in DWORD 1 bits 7..0, both reserved/0 in SuperSpeedPlus,
    plus 2-bit Direction capability in DWORD 1 bits 17..16, USB 3.0 OTG Capable in bit 18, and 4-bit
    Tiebreaker in bits 23..20 for Table 8-8 port-type selection), 0101b Port Configuration (Table
    8-9, sent by the downstream-selected port to select operating speed; if an upstream peripheral
    port does not receive it within tPortConfiguration after link initialization, it transitions to
    eSS.Disabled and tries connecting at a supported USB 2.0 speed), 0110b Port Configuration Response
    (Table 8-10, sent by the upstream port within tPortConfiguration with Response Code in DWORD 0
    bits 15..9, bit 0 = 1 for accept in Gen 1x1; rejection or timeout causes a downstream hub port
    to signal C_PORT_CONFIG_ERROR), and 0111b Precision Time Management (PTM / Link Delay Measurement
    LDM, Table 8-3; if received by a port that does not support PTM, the port still acknowledges the
    packet with LGOOD_n and returns LCRD_x credit per Section 7.2.4.1 but silently drops the LMP).'
