- id: link-commands-and-header-flow-control
  section: standards
  title: Link-layer Header Packet framing, Link Control Word, and Link Commands
  claim: 'Every Link Layer Header Packet (LMP, TP, ITP, and DPH) is 20 bytes in Gen 1 (20 bytes in
    Gen 2 for LMP, TP, ITP, and deferred DPH; 24 bytes for non-deferred Gen 2 DPH): a 4-symbol framing
    ordered set (HPSTART = 3x SHP + EPF, or DPHSTART = 3x DPHP + EPF for non-deferred Gen 2 DPH),
    a 12-byte packet header (DWORD 0..2) protected by a 2-byte CRC-16 (DWORD 3 bits 15..0, polynomial
    100Bh, initial value FFFFh, complemented remainder, constant receiver residual F6AAh), and a 2-byte
    Link Control Word (DWORD 3 bits 31..16) protected by a 5-bit CRC-5 (bits 15..11 of the Link Control
    Word, polynomial 00101b, initial value 11111b, complemented remainder, constant receiver residual
    01100b). The Link Control Word contains the Header Sequence Number (3 bits 2..0 modulo-8 0..7
    in SuperSpeed; 4 bits 3..0 modulo-16 0..15 in SuperSpeedPlus), Reserved bits (5..3 in SuperSpeed;
    5..4 in SuperSpeedPlus), 3-bit Hub Depth index (bits 8..6), Delayed bit (DL, bit 9), and Deferred
    bit (DF, bit 10); non-deferred Gen 2 DPH appends two identical 2-byte Length Field Replica words
    after the Link Control Word. Link Commands are 8 symbols long — LCSTART (3x SLC + EPF) followed
    by a 2-byte Link Command Word (11-bit command in bits 10..0 + 5-bit CRC-5 in bits 15..11) and
    its 2-byte replica — and handle four functions: (1) header acknowledgement and retry (Class 00b:
    LGOOD_0..7 in SuperSpeed or LGOOD_0..15 in SuperSpeedPlus on valid receipt; LBAD on CRC-5 or CRC-16
    error; LRTY sent before retransmitting unacknowledged header packets; three consecutive header
    reception failures transition directly to Recovery without a third LBAD); (2) Rx Buffer Credit
    flow control (Class 00b, Type 01b: 4 credits LCRD_A..LCRD_D cycled alphabetically in SuperSpeed;
    separate Type 1 credits LCRD1_x for periodic DPs, TPs, ITPs, and LMPs and Type 2 credits LCRD2_x
    for asynchronous DPs in SuperSpeedPlus, with 4 credits A..D per class in Gen 1x2/Gen 2x1 and 7
    credits A..G per class in Gen 2x2; a port must not transmit when remote credit is 0, and any out-of-order
    LGOOD_n or LCRD_x triggers Recovery); (3) link power management (Class 01b: LGO_U1 0001b, LGO_U2
    0010b, LGO_U3 0011b, LAU accept, LXU reject for U1/U2, and LPMA acknowledgement); and (4) U0 port
    presence (Class 10b: LDN sent by a downstream port and LUP sent by an upstream port every 10 us
    when idle). Upon entering U0 from Polling, Hot Reset, or Recovery, both ports must transmit LGOOD_n
    (Header Sequence Number Advertisement) followed by LCRD_x/LCRD1_x/LCRD2_x (Rx Buffer Credit Advertisement)
    before sending any header packet or requesting low-power link entry.'
