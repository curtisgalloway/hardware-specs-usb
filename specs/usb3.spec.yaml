- id: isochronous-transfers-and-ping
  section: programming-model
  title: Isochronous service interval sequencing, Last Packet Flag (LPF), and PING wakeup
  claim: Isochronous transfers run on aligned service intervals of 2^(bInterval - 1) * 125 us without
    retries or NRDY/ERDY/STALL handshakes (Section 8.12.5, Section 8.12.6). The first DP (OUT) or
    ACK TP (IN) in every service interval must start with Seq Num = 0, and Seq Num increments by 1
    for each subsequent DP within the service interval (wrapping from 31 to 0 after 32 packets). For
    IN transactions, the host requests each burst with ACK(Seq Num, NumP) (where Seq Num[i + 1] =
    Seq Num[i] + NumP[i] across bursts in the interval, and SuperSpeedPlus hosts may pipeline multiple
    IN ACK TPs as long as total outstanding DPs do not exceed bMaxBurst + 1, Table 8-32), and the
    device returns DPs (or a zero-length DP with LPF = 1 if it has no data). For OUT transactions,
    the host transmits DPs directly with no ACK TP (or sends nothing if it has no data). In both directions,
    every packet except the final packet of the service interval must have LPF = 0 (DWORD 1 bit 6)
    and Data Length = wMaxPacketSize, while the final packet of the service interval must have LPF
    = 1 and Data Length <= wMaxPacketSize. Whenever links along the path to an isochronous endpoint
    may be in U1 or U2, the host must transmit a PING TP (SubType = 0111b) and wait for the device's
    PING_RESPONSE TP (SubType = 1000b) prior to the start of the service interval to bring all intermediate
    links to U0 before initiating the isochronous transfer.
