- id: clear-feature-endpoint-halt-resets-sequence-and-streams
  section: gotchas
  title: ClearFeature(ENDPOINT_HALT) unconditionally resets sequence numbers to 0 and disables Bulk
    Streams
  claim: Regardless of whether a bulk or interrupt endpoint currently has its Halt feature set, a
    ClearFeature(ENDPOINT_HALT) request (bRequest = 1, wValue = 0) always reinitializes the endpoint's
    data sequence number to 0 and, if Bulk Streams are enabled on the endpoint, reinitializes its
    Stream Protocol State Machine (SPSM) to the Disabled state. Host software that sends ClearFeature(ENDPOINT_HALT)
    without resetting its host-side sequence number to 0 (and re-priming a Bulk Stream pipe via Prime
    Pipe) will trigger a sequence number or stream state mismatch. Also, Enhanced SuperSpeed devices
    do not support functional stall (ENDPOINT_HALT) on control endpoints.
