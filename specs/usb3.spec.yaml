- id: asynchronous-flow-control-and-bursting
  section: programming-model
  title: Burst transactions, pipelined ACKs, EOB, Rty recovery, and NRDY/ERDY flow control
  claim: 'Bulk, Interrupt, and Control endpoints transfer packets using credit-bounded bursts and
    asynchronous NRDY/ERDY flow control instead of USB 2.0 NAK polling (Sections 8.10-8.12): (1) For
    IN transactions, the host sends ACK(Seq Num, NumP = N, PP) requesting up to N (1..16, bounded
    by bMaxBurst + 1) packets starting at Seq Num. If the endpoint has no data ready, the device returns
    NRDY and both sides place the pipe in flow control until the device sends ERDY(NumP), prompting
    the host to send a new ACK TP. If data is ready, the device streams up to NumP back-to-back DPs
    (Seq Num, Seq Num + 1, ...) while the host returns pipelined ACK(Seq Num + 1, NumP - 1) TPs as
    each valid DP arrives. A short packet (Data Length < wMaxPacketSize) always terminates a burst;
    if the device ends a burst early with fewer than NumP packets on a full-length packet (or wishes
    to enter flow control immediately after a short packet), it sets EOB = 1 (DWORD 1 bit 6) in that
    DP and later sends ERDY when ready to resume. The host acknowledges the final packet of an IN
    burst with a Terminating ACK(Seq Num + 1, NumP = 0) (or ACK(Seq Num + 1, NumP > 0) after a short
    packet with EOB = 0 if the host immediately initiates another transfer on that endpoint). (2) For
    OUT transactions, the host streams
    up to bMaxBurst + 1 back-to-back DPs (bounded by the device''s advertised NumP credit), and for
    each valid DP stored the device returns ACK(Seq Num + 1, NumP) advertising its remaining buffer
    credit; if NumP reaches 0 in an ACK TP or the device drops a DP and returns NRDY, the pipe enters
    flow control until the device sends ERDY(NumP > 0). (3) If a receiver detects a corrupted DPP
    or an out-of-sequence Seq Num during a burst, it discards that DP and any subsequent DPs in the
    burst and returns a single ACK(Rty = 1, Seq Num = failed_seq_num, NumP > 0), causing the transmitter
    to flush unacknowledged packets and retransmit starting at Seq Num.'
