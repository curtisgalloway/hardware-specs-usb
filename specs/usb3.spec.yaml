orientation: 'Terms: Enhanced SuperSpeed (eSS) encompasses both SuperSpeed (Gen 1x1) and SuperSpeedPlus
  (Gen 2x1, Gen 1x2, Gen 2x2) operation. A USB 3.2 bus is a dual-bus architecture that operates an
  Enhanced SuperSpeed bus in parallel with a USB 2.0 bus (covered in usb2.spec.yaml), while host controller
  register and ring programming for Enhanced SuperSpeed devices is covered in xhci.spec.yaml. This
  spec records the parts of the USB 3.2 Revision 1.1 specification that a host, device, or hub driver
  acts on: the four operating modes and dual-lane Type-C configuration lane, the 12-state LTSSM and
  link-layer header/credit protocol, protocol-layer packets (LMP, TP, DP, ITP) and 20-bit Route Strings,
  transfer packet sizes and bursting, Bulk Streams, Chapter 9 device states, enumeration, standard
  requests (including SET_SEL and SET_ISOCH_DELAY), BOS and Device Capability descriptors, SuperSpeed
  and SuperSpeedPlus Endpoint Companion descriptors, Chapter 10 Enhanced SuperSpeed hub class requests
  and port status bits, and Chapter 11 VBUS power distribution. Descriptor and packet layouts are
  written as prose claims because a kind ip spec carries no structured layout payloads (driver-lab#164).'
facts:
- id: operating-modes-and-dual-bus
  section: standards
  title: Enhanced SuperSpeed operating modes, dual-simplex signaling, and dual-bus architecture
  claim: 'USB 3.2 is a dual-bus architecture consisting of a USB 2.0 bus and an Enhanced SuperSpeed
    bus operating simultaneously in parallel. Each Enhanced SuperSpeed lane uses dual-simplex, four-wire
    differential signaling (separate transmit and receive differential pairs per lane, or eight wires
    for two-lane operation) and supports four operating modes across two protocol architectures: Gen
    1x1 (SuperSpeed USB architecture, 5 Gbps nominal signaling rate over 1 lane using 8b/10b symbol
    encoding), Gen 2x1 (SuperSpeedPlus USB architecture, 10 Gbps nominal signaling rate over 1 lane
    using 128b/132b block encoding where a 4-bit block header is prepended to 16 symbols / 128 bits),
    Gen 1x2 (SuperSpeedPlus USB architecture, 5 Gbps per lane across 2 lanes for 10 Gbps aggregate
    using 8b/10b encoding), and Gen 2x2 (SuperSpeedPlus USB architecture, 10 Gbps per lane across
    2 lanes for 20 Gbps aggregate using 128b/132b block encoding). Dual-lane operation (Gen 1x2 and
    Gen 2x2) is supported only on the USB Type-C connector, where Lane 0 (determined by USB Type-C
    CC pin orientation) serves as the Configuration Lane for all LFPS signaling, LBPM capability negotiation,
    Receiver Detect, and Ux Exit detection. A user-attached USB 3.2 peripheral device must support
    both Enhanced SuperSpeed and at least one USB 2.0 speed (returning bcdUSB = 0210H in its device
    descriptor when operating in a USB 2.0 mode; internal non-user-accessible devices where Enhanced
    SuperSpeed operation is independently assured may omit USB 2.0 support per Section 11.3), but
    simultaneous operation of both Enhanced SuperSpeed and USB 2.0 connections is prohibited for a
    peripheral device; by contrast, a USB 3.2 hub is the logical combination of an Enhanced SuperSpeed
    hub and a USB 2.0 hub that operate simultaneously and report a common 128-bit (16-byte UUID) ContainerID
    in their BOS descriptors.'
