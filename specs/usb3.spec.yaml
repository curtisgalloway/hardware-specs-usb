- id: transaction-packets-and-route-string
  section: standards
  title: Transaction Packet (TP) SubTypes, Addressing Triple, and 20-bit Route String
  claim: 'Transaction Packets (TP, Type = 00100b) traverse the direct path between host and device
    with no data payload. Data flows are addressed by the Addressing Triple: 7-bit Device Address
    (DWORD 0 bits 31..25, 0 default, 1..127 assigned), 4-bit Endpoint Number (DWORD 1 bits 11..8,
    0..15), and 1-bit Direction (DWORD 1 bit 7: 0 for Host-to-Device/OUT, 1 for Device-to-Host/IN;
    ignored and set to 0 for control endpoints). Downstream packets carry a 20-bit Route String in
    DWORD 0 bits 24..5 composed of five 4-bit port-number fields for hub tiers 1 through 5 (up to
    15 downstream ports per hub); a hub at tier depth Hub Depth (0..4) indexes the Route String at
    bit offset (Hub Depth << 2) to select its downstream port (or 0 if targeted at the hub itself).
    The 4-bit TP SubType in DWORD 1 bits 3..0 (Table 8-12) selects: 0001b ACK (Table 8-13, requests
    IN packets or acknowledges received DPs; carries Retry Data Packet rty in DWORD 1 bit 6, Direction
    D in bit 7, Endpoint Number in bits 11..8, 3-bit Transfer Type TT in bits 14..12 in SuperSpeedPlus
    with 100b Control / 101b Isochronous / 110b Bulk / 111b Interrupt / 000b Unknown from SuperSpeed
    bus instances, Host Error HE in bit 15, 5-bit NumP 0..16 in bits 20..16, 5-bit Seq Num 0..31 in
    bits 25..21, TP Follows TPF in bit 31 in SuperSpeedPlus, 16-bit Stream ID in DWORD 2 bits 15..0,
    and Packets Pending PP in DWORD 2 bit 27), 0010b NRDY (Table 8-14, sent only by a device on a
    non-isochronous endpoint when no data or buffer space is available; prohibited during the Setup
    stage of a control transfer), 0011b ERDY (Table 8-15, sent only by a device with Route String
    = 0 to exit flow control, reporting NumP 1..16 in DWORD 1 bits 20..16 and Stream ID in DWORD 2
    bits 15..0), 0100b STATUS (Table 8-16, sent only by the host with DWORD 1 bits 31..12 and DWORD
    2 reserved/0 to initiate the Status stage of a control transfer), 0101b STALL (Table 8-17, sent
    only by a device with DWORD 1 bits 31..12 and DWORD 2 reserved/0 when an endpoint is halted or
    a control transfer has a Request Error), 0110b DEV_NOTIFICATION (Table 8-18..Table 8-22, sent
    only by a device with Route String = 0 and 4-bit Notification Type in DWORD 1 bits 7..4: 0001b
    FUNCTION_WAKE with interface in bits 15..8 in Table 8-19, 0010b LATENCY_TOLERANCE_MESSAGE with
    12-bit BELT in bits 19..8 in Table 8-20, 0011b deprecated BUS_INTERVAL_ADJUSTMENT_MESSAGE in Table
    8-21, 0100b HOST_ROLE_REQUEST, and 0101b SUBLINK_SPEED with 32-bit Sublink Speed Attribute in
    DWORD 2 in Table 8-22), 0111b PING (Table 8-23, sent by the host to bring links along the path
    to an endpoint to U0), and 1000b PING_RESPONSE (Table 8-24, sent by the device in response to
    each PING TP).'
