- id: hub-class-and-power-distribution
  section: standards
  title: Enhanced SuperSpeed Hub Descriptor, Hub Class Requests, Port Status, and VBUS power
  claim: 'An Enhanced SuperSpeed hub reports a 12-byte Hub Descriptor (bDescriptorType = 2AH, Table
    10-5): bDescLength (12), bDescriptorType (2AH), bNbrPorts (offset 2, 1..15 downstream ports),
    2-byte wHubCharacteristics (offset 3: bits 1..0 power switching mode 00b ganged / 01b individual;
    bit 2 compound device; bits 4..3 over-current protection mode 00b global / 01b individual / 1Xb
    none), bPwrOn2PwrGood (offset 5, in 2 ms intervals), bHubContrCurrent (offset 6, in aCurrentUnit
    mA), bHubHdrDecLat (offset 7, 00H..0AH for 0.0..1.0 us header decode latency), 2-byte wHubDelay
    (offset 8, max forwarding delay in ns up to tHubDelay), and 2-byte DeviceRemovable bitmap (offset
    10, bits 1..15 for ports 1..15, 0 = removable, 1 = non-removable). Hub class requests (Table 10-7,
    Table 10-8, worst-case 50 ms per stage in Section 10.16.1) use bRequest codes GET_STATUS 0, CLEAR_FEATURE
    1, SET_FEATURE 3, GET_DESCRIPTOR 6, SET_DESCRIPTOR 7 (optional), SET_HUB_DEPTH 12 (bmRequestType
    = 00100000B, wValue = 0..4 setting the Route String bit offset to wValue << 2; wValue > 4 is a
    Request Error), and GET_PORT_ERR_COUNT 13 (bmRequestType = 10100011B, wLength = 2 returning the
    port''s 2-byte link error count). Hub Class Feature Selectors (Table 10-9) are Hub selectors C_HUB_LOCAL_POWER
    0 and C_HUB_OVER_CURRENT 1, and Port selectors PORT_CONNECTION 0, PORT_OVER_CURRENT 3, PORT_RESET
    4, PORT_LINK_STATE 5, PORT_POWER 8, C_PORT_CONNECTION 16, C_PORT_OVER_CURRENT 19, C_PORT_RESET
    20, PORT_U1_TIMEOUT 23, PORT_U2_TIMEOUT 24, C_PORT_LINK_STATE 25, C_PORT_CONFIG_ERROR 26, PORT_REMOTE_WAKE_MASK
    27, BH_PORT_RESET 28, C_BH_PORT_RESET 29, and FORCE_LINKPM_ACCEPT 30. GetPortStatus (Table 10-12)
    with wValue low byte 00H (PORT_STATUS, wLength = 4) returns 16-bit wPortStatus (Table 10-13: bit
    0 PORT_CONNECTION, bit 1 PORT_ENABLE, bit 3 PORT_OVER_CURRENT, bit 4 PORT_RESET, bits 8..5 PORT_LINK_STATE
    0x00..0x0B, bit 9 PORT_POWER, bits 12..10 PORT_SPEED = 0 for Enhanced SuperSpeed) and 16-bit wPortChange
    (Table 10-14: bit 0 C_PORT_CONNECTION, bit 3 C_PORT_OVER_CURRENT, bit 4 C_PORT_RESET, bit 5 C_BH_PORT_RESET,
    bit 6 C_PORT_LINK_STATE, bit 7 C_PORT_CONFIG_ERROR); on SuperSpeedPlus hubs, wValue low byte 02H
    (EXT_PORT_STATUS, wLength = 8) appends 32-bit dwExtPortStatus (Table 10-15: bits 3..0 RX_SUBLINK_SPEED_ID,
    bits 7..4 TX_SUBLINK_SPEED_ID, bits 11..8 zero-based RX_LANE_COUNT, bits 15..12 zero-based TX_LANE_COUNT).
    For VBUS power distribution (Section 11.4, Table 11-2), downstream VBUS is 4.75 V to 5.50 V (>=
    4.00 V steady-state at the upstream device connector, 3.67 V min transient), and a single-lane
    Enhanced SuperSpeed unit load is 150 mA: unconfigured devices draw at most 150 mA (I_CCINIT, and
    <= 100 mA before detecting far-end Rx terminations), low-power devices draw up to 150 mA single-lane
    / 250 mA dual-lane (I_CCLPF, 1 unit load), high-power configured devices draw up to 900 mA single-lane
    / 1500 mA dual-lane (I_CCHPF, 6 unit loads), and suspended devices draw at most 2.5 mA (I_CCS,
    or up to 12.5 mA for a configured bus-powered compound device with up to 4 internal ports) averaged
    over 1.0 s.'
