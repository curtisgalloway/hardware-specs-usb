- id: endpoint-0-bmaxpacketsize0-exponent
  section: gotchas
  title: bMaxPacketSize0 is a power-of-two exponent (09H = 512 bytes), not a literal byte count
  claim: In the Standard Device Descriptor (Table 9-11), bMaxPacketSize0 at offset 7 is encoded as
    the exponent for 2^bMaxPacketSize0 bytes, and 09H (2^9 = 512 bytes) is the only valid value when
    operating at Gen X speed — unlike USB 2.0, where bMaxPacketSize0 is a literal byte count (8, 16,
    32, or 64). Treating 09H as a literal 9-byte packet size (or programming 64) breaks control transfers.
    In addition, an Enhanced SuperSpeed device operating at Gen X speed must not support device_qualifier
    (6) or other_speed_configuration (7) descriptors (returning STALL), and when operating in a USB
    2.0 mode it must report bcdUSB = 0210H (not 0310H or 0320H) so that host software fetches its
    BOS descriptor (0FH) to discover Enhanced SuperSpeed capabilities.
