- id: suspend-resume-and-function-wake
  section: programming-model
  title: Function Suspend, U3 Device Suspend, and Function Wake remote wakeup
  claim: 'Enhanced SuperSpeed separates per-function power management (Function Suspend) from link-wide
    device suspend (U3 Device Suspend): (1) Host software places a function into Function Suspend
    via SetFeature(FUNCTION_SUSPEND) (bRequest = 3, bmRequestType = 00000001B, wValue = 0) targeted
    at the first interface of that function (wIndex[7..0] = first interface number) with Suspend Options
    in wIndex[15..8] (Table 9-9: bit 0 = 1 for Low power suspend state, bit 1 = 1 for Function Remote
    Wake Enabled). Placing all functions into Function Suspend does not suspend the device, though
    if all functions are in Function Suspend and PORT_U2_TIMEOUT is FFH, the device initiates U2 after
    10 ms of link inactivity. (2) Software selectively suspends a device by sending SetPortFeature(PORT_LINK_STATE)
    (wValue = 5) to its upstream hub port with wIndex[15..8] = 3 (U3); if the link is in U1 or U2,
    the hub first transitions the link to U0 before sending LGO_U3. In U3, the device enters Suspended
    (drawing <= 2.5 mA I_CCS) and preserves all parameters in Table 9-2. (3) Software resumes a suspended
    port via SetPortFeature(PORT_LINK_STATE) with wIndex[15..8] = 0 (U0), which drives LFPS exit handshake
    through Recovery to U0 and sets C_PORT_LINK_STATE = 1 (wPortChange bit 6). Conversely, if any
    function has Function Remote Wake enabled (or port events are enabled in PORT_REMOTE_WAKE_MASK,
    Table 10-18, on a hub), the device can initiate remote wakeup by driving LFPS resume signaling
    to bring its upstream link to U0 (within 10 ms of drawing non-suspend current; hubs do not set
    C_PORT_LINK_STATE when U3 -> U0 is triggered by downstream remote wakeup signaling) and then sending
    a DEV_NOTIFICATION TP with Notification Type = 0001b (FUNCTION_WAKE, Table 8-18, Table 8-19) and
    Interface (DWORD 1 bits 15..8) set to the first interface number of the waking function, repeating
    FUNCTION_WAKE every tNotification until the host accesses the function.'
