- id: standard-and-bos-descriptors
  section: standards
  title: Standard descriptors, BOS, Device Capability descriptors, and Endpoint Companion descriptors
  claim: 'Descriptor Type codes (Table 9-6) are DEVICE 1, CONFIGURATION 2, STRING 3, INTERFACE 4,
    ENDPOINT 5, INTERFACE_POWER 8, OTG 9, DEBUG 10, INTERFACE_ASSOCIATION 11 (0BH), BOS 15 (0FH),
    DEVICE CAPABILITY 16 (10H), SUPERSPEED_USB_ENDPOINT_COMPANION 48 (30H), and SUPERSPEEDPLUS_ISOCHRONOUS_ENDPOINT_COMPANION
    49 (31H). In the 18-byte Device Descriptor (Table 9-11), an Enhanced SuperSpeed device operating
    at Gen X speed sets bcdUSB to at least 0310H (0320H for USB 3.2) and bMaxPacketSize0 (offset 7)
    to 09H (2^9 = 512 bytes), and reports only configurations for the current operating speed in bNumConfigurations
    (offset 17). The 5-byte Binary Device Object Store (BOS) descriptor (Table 9-12: bLength 5, bDescriptorType
    0FH, 2-byte wTotalLength, 1-byte bNumDeviceCaps) is the root container for Device Capability descriptors
    (Table 9-13, Table 9-14: bDescriptorType 10H, bDevCapabilityType at offset 2), which can only
    be read as part of GetDescriptor(BOS): (1) USB 2.0 EXTENSION (02H, 7 bytes, Table 9-15: required
    for all Enhanced SuperSpeed devices, with 4-byte bmAttributes bit 1 LPM set to 1); (2) SUPERSPEED_USB
    (03H, 10 bytes, Table 9-16: required for all Enhanced SuperSpeed devices; contains 1-byte bmAttributes
    at offset 3 with bit 1 LTM Capable, 2-byte wSpeedsSupported at offset 4 with bit 0 Low-Speed,
    bit 1 Full-Speed, bit 2 High-Speed, bit 3 Gen 1, 1-byte bFunctionalitySupport at offset 6, 1-byte
    bU1DevExitLat at offset 7 from 00H zero to 0AH < 10 us, and 2-byte wU2DevExitLat at offset 8 from
    0000H zero to 07FFH < 2047 us); (3) CONTAINER_ID (04H, 20 bytes, Table 9-17: mandatory for all
    USB 3.2 hubs and optional for peripherals, with bReserved = 0 at offset 3 and 16-byte UUID at
    offset 4); (4) SUPERSPEED_PLUS (0AH, 12 + 4 * (SSAC + 1) bytes, Table 9-19: mandatory for all
    SuperSpeedPlus devices; contains bReserved = 0 at offset 3, 4-byte bmAttributes at offset 4 with
    bits 4..0 SSAC = attribute count minus 1 and bits 8..5 SSIC = unique Sublink Speed ID count minus
    1, 2-byte wFunctionalitySupport at offset 8 with bits 3..0 min SSID, bits 11..8 Min Rx Lane Count,
    bits 15..12 Min Tx Lane Count, 2-byte wReserved = 0 at offset 10, and SSAC + 1 4-byte bmSublinkSpeedAttr[i]
    bitmaps at offset 12 with bits 3..0 SSID, bits 5..4 LSE exponent 0 = bps / 1 = Kb/s / 2 = Mb/s
    / 3 = Gb/s, bit 6 ST[0] 0 = Symmetric / 1 = Asymmetric, bit 7 ST[1] 0 = Rx / 1 = Tx paired Rx-then-Tx,
    bits 15..14 LP 0 = SuperSpeed / 1 = SuperSpeedPlus, and bits 31..16 16-bit LSM mantissa); and
    (5) PLATFORM (05H, Table 9-18), PRECISION_TIME_MEASUREMENT (0BH, 3 bytes, Table 9-20), CONFIGURATION
    SUMMARY (10H, Table 9-21), and FWStatus Capability (11H, Table 9-22). When operating at Gen X
    speed, each non-zero Endpoint Descriptor (Table 9-26) in GetDescriptor(CONFIGURATION) is immediately
    followed by a 6-byte SuperSpeed Endpoint Companion Descriptor (Table 9-28: bLength 6, bDescriptorType
    30H, 1-byte bMaxBurst 0..15 at offset 2, 1-byte bmAttributes at offset 3 with Bulk bits 4..0 MaxStreams
    0..16 or Isochronous bits 1..0 Mult 0..2 and bit 7 SSP ISO Companion, and 2-byte wBytesPerInterval
    at offset 4). When operating above Gen 1 speed, any isochronous endpoint requiring > 48 KB per
    service interval sets SSP ISO Companion = 1 (with wBytesPerInterval = 1) and is immediately followed
    by an 8-byte SuperSpeedPlus Isochronous Endpoint Companion Descriptor (Table 9-29: bLength 8,
    bDescriptorType 31H, 2-byte wReserved = 0 at offset 2, 4-byte dwBytesPerInterval at offset 4,
    with effective Mult = ceil(dwBytesPerInterval / bMaxBurst / wMaxPacketSize)).'
