- id: standard-device-requests-and-features
  section: standards
  title: Standard Device Requests, SET_SEL, SET_ISOCH_DELAY, and Feature Selectors
  claim: 'Standard Device Requests on the Default Control Pipe use bRequest codes (Table 9-5): GET_STATUS
    0, CLEAR_FEATURE 1, SET_FEATURE 3, SET_ADDRESS 5, GET_DESCRIPTOR 6, SET_DESCRIPTOR 7, GET_CONFIGURATION
    8, SET_CONFIGURATION 9, GET_INTERFACE 10, SET_INTERFACE 11, SYNCH_FRAME 12, GET_FW_STATUS 26 (1AH),
    SET_FW_STATUS 27 (1BH), SET_SEL 48 (30H), and SET_ISOCH_DELAY 49 (31H). Requests with no Data
    stage must complete within 50 ms; IN Data-stage requests must return the first and each subsequent
    packet within 500 ms and complete the Status stage within 50 ms; OUT Data-stage requests have
    a 5-second limit. SET_SEL (bRequest = 48, bmRequestType = 00000000B, wValue = 0, wIndex = 0, wLength
    = 6) transfers a 6-byte payload setting exit latencies: 1-byte U1SEL at offset 0 (us), 1-byte
    U1PEL at offset 1 (us), 2-byte U2SEL at offset 2 (us), and 2-byte U2PEL at offset 4 (us); it is
    valid in the Address and Configured states and must be accepted whether or not the device supports
    or enables LTM. SET_ISOCH_DELAY (bRequest = 49, bmRequestType = 00000000B, wValue = delay in ns
    from 0 to 65535 calculated as (sum of wHubDelay values) + (tTPTransmissionDelay * (number of hubs
    + 1)), wIndex = 0, wLength = 0) is valid in the Default, Address, and Configured states. Standard
    Feature Selectors (Table 9-7) are ENDPOINT_HALT 0 (Endpoint recipient), FUNCTION_SUSPEND 0 (Interface
    recipient, targeting the first interface of the function with Suspend Options in wIndex[15..8]
    from Table 9-9: bit 0 = 1 for low-power suspend state, bit 1 = 1 for Function Remote Wake Enabled),
    U1_ENABLE 48 (Device recipient), U2_ENABLE 49 (Device recipient), LTM_ENABLE 50 (Device recipient),
    B3_NTF_HOST_REL 51 (Device, OTG), B3_RSP_ENABLE 52 (Device, OTG), and LDM_ENABLE 53 (Device, PTM;
    set to 1 on reset for PTM-capable devices; Section 9.4.9 body text states it may be set or cleared
    in the Address or Configured state, whereas its state summary lists Address state as a Request Error).
    U1_ENABLE, U2_ENABLE, LTM_ENABLE, and FUNCTION_SUSPEND are valid only in the Configured state. GET_STATUS
    (Table 9-8) uses wValue low byte 00H (STANDARD_STATUS, wLength = 2: Device returns bit D0 Self
    Powered, D1 = 0 reserved, D2 U1 Enable, D3 U2 Enable, D4 LTM Enable in Figure 9-4; first Interface
    of a function returns bit D0 Function Remote Wake Capable and D1 Function Remote Wakeup in Figure
    9-5, while other interfaces return 0; Endpoint returns bit D0 Halt in Figure 9-6) or 01H (PTM_STATUS,
    wLength = 4, Device recipient only: returns bit D0 LDM Enable, D1 LDM Valid, and bits D31..D16
    16-bit LDM Link Delay in Figure 9-7).'
