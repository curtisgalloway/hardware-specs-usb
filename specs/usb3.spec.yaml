- id: inband-resets-hot-vs-warm
  section: programming-model
  title: Inband resets — PORT_RESET (Hot Reset) vs. BH_PORT_RESET (Warm Reset)
  claim: 'Hub and root ports support two reset feature selectors (Section 7.4.2, Section 10.3.1.6,
    Section 10.16.2.10): SetPortFeature(PORT_RESET) (wValue = 4) and SetPortFeature(BH_PORT_RESET)
    (wValue = 28). When SetPortFeature(PORT_RESET) is received in DSPORT.Enabled and the port''s link
    is in any state other than U3 (U0, Polling, Recovery, or U1/U2 after LFPS exit to Recovery), the
    port initiates an inband Hot Reset using TS1/TS2 ordered sets with the Reset bit asserted, which
    resets the device''s USB address to 0, deconfigures the device, and resets endpoint halts and
    sequence numbers while preserving PHY equalization and Port Configuration Information (Table 9-10).
    When SetPortFeature(PORT_RESET) is received in DSPORT.Error, or in DSPORT.Enabled with the link
    in U3 (or Loopback, Compliance Mode, or eSS.Inactive), it initiates an LFPS Warm Reset instead;
    if a Hot Reset fails during Recovery (TS1/TS2 training timeout transitions to Rx.Detect and attempts
    a Warm Reset, while an LFPS handshake timeout when exiting U1/U2 transitions to eSS.Inactive per
    Section 7.4.2; at the hub port state machine level in Section 10.3.1.6, a failed Hot Reset falls
    back to a Warm Reset while remaining in DSPORT.Resetting). SetPortFeature(BH_PORT_RESET) unconditionally
    initiates an LFPS Warm Reset from any link state in DSPORT.Enabled or DSPORT.Error (and is ignored
    in DSPORT.Disabled, DSPORT.Powered-off, or DSPORT.Disconnected), transitioning the link through
    Rx.Detect and Polling, retraining the PHY and Rx equalizer, resetting Port Configuration Information
    (Table 9-10), and re-exchanging Port Capability and Port Configuration LMPs upon entering U0.
    When reset completes and the port enters DSPORT.Enabled, the hub sets C_PORT_RESET (wPortChange
    bit 4, feature selector 20) to 1 for any reset (Hot or Warm) and sets C_BH_PORT_RESET (wPortChange
    bit 5, feature selector 29) to 1 for a Warm Reset only; software clears these change bits with
    ClearPortFeature(C_PORT_RESET) and ClearPortFeature(C_BH_PORT_RESET).'
