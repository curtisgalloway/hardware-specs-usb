- id: bulk-streaming-protocol
  section: programming-model
  title: Bulk Streaming Protocol State Machine (SPSM) and reserved Stream IDs
  claim: 'A bulk endpoint with MaxStreams > 0 in its SuperSpeed Endpoint Companion Descriptor (bmAttributes
    bits 4..0 = 1..16, supporting up to 2^MaxStreams streams) multiplexes streams using the 16-bit
    Stream ID (SID) in DWORD 2 bits 15..0 of DP, ACK, NRDY, and ERDY packets (Section 8.12.1.4). Reserved
    and valid SIDs are: Stream 0 (0000h, reserved on stream pipes and required on standard bulk pipes),
    Stream n (1..65533 / 0001h..FFFDh, valid logical Stream IDs), Prime (FFFEh, used for Prime Pipe
    state transitions), and NoStream (FFFFh, used by the host to reject a device''s stream selection).
    The Stream Protocol State Machine (SPSM, Figure 8-38..Figure 8-41) starts in Disabled after configuration,
    SetFeature(ENDPOINT_HALT), or ClearFeature(ENDPOINT_HALT). When software adds or modifies host
    stream buffers, the host transitions the pipe from Disabled (or Idle) to Prime Pipe by sending
    ACK(Prime, NumP > 0, PP = 0) on an IN pipe or a zero-length DP(Prime, PP = 0) on an OUT pipe;
    the device marks all Active Stream IDs as Ready, replies with NRDY(Prime), and enters Idle. From
    Idle, the device initiates stream selection (Start Stream) by sending ERDY(Stream n, NumP > 0):
    the host accepts by sending ACK(Stream n, NumP > 0) (IN) or the first DP(Stream n) (OUT) to enter
    Move Data (CStream = Stream n), or rejects the stream when no host buffer is available by sending
    ACK(NoStream, NumP = 0, PP = 0) (IN, returning the device directly to Idle with Stream n marked
    Not Ready) or a zero-length DP(NoStream, PP = 0) (OUT, transitioning the device through Start Stream
    End where it sends NRDY(NoStream) before marking Stream n Not Ready and returning to Idle). From
    Idle (or concurrently with Start
    Stream), the host can also perform a Host-Initiated Move Data (HIMD) on Stream x by sending ACK(Stream
    x, NumP > 0) (IN) or DP(Stream x) (OUT); the device marks Stream x as Ready, sets CStream = Stream
    x in Move Data, and either transfers data or rejects/flow-controls CStream with NRDY(CStream)
    to return to Idle.'
