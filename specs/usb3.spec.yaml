- id: transfer-types-and-endpoint-parameters
  section: standards
  title: Transfer types, maximum packet sizes, burst lengths, and service intervals
  claim: 'Enhanced SuperSpeed defines four transfer types with constrained wMaxPacketSize, bMaxBurst
    (0..15 for 1..16 packets per burst), and sequence number rules: (1) Control transfers use a Setup
    stage (8-byte DP with S = 1, Seq Num = 0, D = 0), an optional Data stage (starting at Seq Num
    = 1), and a Status stage (STATUS TP followed by ACK TP with Seq Num = 0); the maximum data payload
    size is fixed at 512 bytes (bMaxPacketSize0 = 09H in the Device Descriptor, where 2^9 = 512; wMaxPacketSize
    = 512) and the maximum burst size is fixed at 1 packet (bMaxBurst = 0); Endpoint 0 has no Endpoint
    Descriptor or Endpoint Companion Descriptor. (2) Bulk transfers have a fixed maximum data payload
    size of 1024 bytes (wMaxPacketSize = 1024), burst sizes of 1 to 16 packets (bMaxBurst = 0..15),
    continuous sequence numbers 0..31, and optional Bulk Streams (MaxStreams = 1..16 supporting 2^MaxStreams
    streams). (3) Interrupt transfers have a service interval period of 2^(bInterval - 1) * 125 us,
    where bInterval is 1..16 for Periodic usage type (bmAttributes bits 5..4 = 00b) or 8..16 for Notification
    usage type (bits 5..4 = 01b); maximum burst size is 1 to 3 packets (bMaxBurst = 0..2, up to 3072
    bytes per service interval), wMaxPacketSize is 1..1024 bytes when bMaxBurst = 0 and fixed at 1024
    bytes when bMaxBurst > 0, and sequence numbers run continuously 0..31. (4) Isochronous transfers
    have a service interval period of 2^(bInterval - 1) * 125 us (bInterval = 1..16), no ACK/NRDY/ERDY
    handshakes or retries, and sequence numbers that reset to 0 at the start of every service interval;
    maximum burst size is 1 to 16 packets (bMaxBurst = 0..15), wMaxPacketSize is 0..1024 bytes when
    bMaxBurst = 0 and fixed at 1024 bytes when bMaxBurst > 0, and up to 3 bursts per service interval
    are supported in SuperSpeed (Mult = 0..2, up to 48 DPs / 48 KB per service interval in Gen 1x1;
    Mult must be 0 if bMaxBurst = 0) or up to 6 bursts per service interval in SuperSpeedPlus (up
    to 96 DPs in Gen 1x2/Gen 2x1 and 192 DPs in Gen 2x2).'
