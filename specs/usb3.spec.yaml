- id: hub-port-enable-and-reset-clear-feature-differences
  section: gotchas
  title: Enhanced SuperSpeed hubs have no ClearPortFeature(PORT_ENABLE) or ClearPortFeature(PORT_RESET)
  claim: Enhanced SuperSpeed hubs omit the USB 2.0 PORT_ENABLE (1) and PORT_SUSPEND (2) feature selectors
    and do not support ClearPortFeature(PORT_ENABLE) to disable a port. In addition, ClearPortFeature(PORT_RESET),
    ClearPortFeature(PORT_LINK_STATE), ClearPortFeature(PORT_CONNECTION), and ClearPortFeature(PORT_OVER_CURRENT)
    must not be used by system software and are treated as no-operations by hubs. Instead, software
    disables a port's Enhanced SuperSpeed link by issuing SetPortFeature(PORT_LINK_STATE) (wValue
    = 5) with wIndex[15..8] = 4 (eSS.Disabled, moving the port to DSPORT.Disabled), and exits DSPORT.Disabled
    by issuing SetPortFeature(PORT_LINK_STATE) with wIndex[15..8] = 5 (Rx.Detect, moving the port
    to DSPORT.Disconnected, valid only in DSPORT.Disabled). Also, SetPortFeature(PORT_LINK_STATE)
    with wIndex[15..8] = 1 (U1) or 2 (U2) has undefined behavior unless the link is currently in U0,
    whereas wIndex[15..8] = 3 (U3) is valid from any U state because a hub port in U1 or U2 first
    transitions the link to U0 before initiating U3.
