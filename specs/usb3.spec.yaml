- id: device-enumeration-and-link-pm-setup
  section: programming-model
  title: Device state transitions, bus enumeration, and Link Power Management initialization
  claim: 'An Enhanced SuperSpeed device transitions through the visible states Attached, Powered (Far-end
    Receiver Termination and Link Training substates), Default, Address, Configured, Suspended, and
    Error (Figure 9-1, Table 9-1). During bus enumeration (Section 9.1.2): (1) when attached to a
    powered port, the link detects far-end receiver terminations, trains through Polling to U0, and
    exchanges Port Capability, Port Configuration, and Port Configuration Response LMPs within tPortConfiguration,
    placing the port in DSPORT.Enabled and the device in the Default state (already reset, answering
    at default address 0, drawing <= 1 unit load); (2) the hub reports C_PORT_CONNECTION on its status
    change interrupt pipe and the host queries GetPortStatus (and EXT_PORT_STATUS on SuperSpeedPlus
    hubs) and may optionally reset the port again; (3) the host assigns a unique address (1..127)
    via SetAddress(), moving the device to the Address state; (4) the host reads the 18-byte Device
    Descriptor (bMaxPacketSize0 = 09H = 512 bytes) and reads the BOS descriptor (first reading the
    5-byte BOS header for wTotalLength, then reading wTotalLength bytes to parse USB 2.0 EXTENSION,
    SUPERSPEED_USB, SUPERSPEED_PLUS, CONTAINER_ID, and PRECISION_TIME_MEASUREMENT capabilities); (5)
    the host sends SET_ISOCH_DELAY (bRequest = 49, delay in ns) and SET_SEL (bRequest = 48, 6-byte
    U1SEL/U1PEL/U2SEL/U2PEL payload); (6) the host reads Configuration Descriptors (0..bNumConfigurations
    - 1) and selects one with SetConfiguration(), entering the Configured state (D0), resetting endpoint
    sequence numbers to 0, and allowing up to bMaxPower (in 8 mA units), plus sending SetHubDepth
    (0..4) if the device is a hub; and (7) after configuration, software may program the downstream
    hub port''s inactivity timers via SetPortFeature(PORT_U1_TIMEOUT) (wValue = 23, wIndex[15..8]
    = 01H..7FH for 1..127 us, FFH infinite, 00H disabled, Table 10-16) and SetPortFeature(PORT_U2_TIMEOUT)
    (wValue = 24, wIndex[15..8] = 01H..FEH in 256 us steps up to 65.024 ms, FFH infinite, 00H disabled,
    Table 10-17, which triggers a U2 Inactivity Timeout LMP to the device) and enable device-initiated
    U1/U2/LTM via SetFeature(U1_ENABLE) (48), SetFeature(U2_ENABLE) (49), and SetFeature(LTM_ENABLE)
    (50), provided that host-initiated U1/U2 System Exit Latency plus one Bus Interval (125 us) does
    not exceed the minimum service interval of any periodic endpoint on the device.'
