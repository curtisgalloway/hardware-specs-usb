- id: set-address-status-stage-and-configured-state
  section: gotchas
  title: SetAddress() switches address only after Status stage ACK and is unspecified in Configured
    state
  claim: Unlike every other device request — which completes its operation before the Status stage
    — a device processing SetAddress() (bRequest = 5) completes the Status stage (STATUS TP -> ACK
    TP) on its old address (such as default address 0) and changes its device address only after the
    Status stage completes successfully within 50 ms. In addition, while SetAddress(0) in the Address
    state returns the device to the Default state, receiving SetAddress() while the device is in the
    Configured state has unspecified behavior in Section 9.4.6 (even though Table 9-10 includes a
    Set Address 0 column); host software must use SetConfiguration(0) or a port reset rather than
    sending SetAddress() to a configured device.
