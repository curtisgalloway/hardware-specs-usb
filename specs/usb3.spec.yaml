- id: data-packets-and-itp
  section: standards
  title: Data Packet (DP), Deferred DPH, and Isochronous Timestamp Packet (ITP) formats
  claim: 'A Data Packet (DP, Type = 01000b) consists of a Data Packet Header (DPH) followed immediately
    with zero spacing by a Data Packet Payload (DPP). The DPP is framed by DPPSTART (3x SDP + EPF)
    and DPPEND (3x END + EPF) or DPPABORT (3x EDB + EPF) and contains 0 to 1024 data bytes (Data Length
    in DWORD 1 bits 31..16, excluding CRC) followed by a 4-byte CRC-32 (polynomial 04C11DB7h, initial
    value FFFFFFFFh, complemented remainder, constant receiver residual C704DD7Bh); even a zero-length
    DP carries a 4-byte CRC-32. Key DPH fields (Table 8-25) are Seq Num (DWORD 1 bits 4..0, wrapping
    at 31 to 0), End Of Burst / Last Packet Flag (EOB/LPF, DWORD 1 bit 6: EOB for non-isochronous
    IN endpoints when ending a burst with fewer than NumP packets on a non-short packet, failing to
    meet tMaxBurstInterval / tGen2MaxBurstInterval, or entering flow control on a short packet; 0
    for non-isochronous OUT and control endpoints; LPF for isochronous endpoints on the last packet
    of the last burst in the current service interval), Direction D (DWORD 1 bit 7), Endpoint Number
    (DWORD 1 bits 11..8), Setup S (DWORD 1 bit 15, set to 1 only by the host on Setup DPs), Data Length
    (DWORD 1 bits 31..16), Stream ID (DWORD 2 bits 15..0), and Packets Pending PP (DWORD 2 bit 27,
    set only by the host). When a hub cannot forward a downstream TP or DP because the target downstream
    port link is in U1 or U2, it initiates link exit to U0, sets the Deferred (DF) bit in the Link
    Control Word (stripping the DPP from a DP to form a Deferred DPH), and returns the header packet
    upstream. An Isochronous Timestamp Packet (ITP, Type = 01100b, Table 8-26) carries no addressing
    or routing fields and is multicast by the host within tTimestampWindow of every 125 us bus interval
    boundary on all root port links already in U0 (never waking a root port link just to send an ITP)
    and forwarded by hubs to all downstream ports in U0 that have completed Port Configuration; devices
    never respond to an ITP. DWORD 0 bits 31..5 hold the 27-bit Isochronous Timestamp (ITS): bits
    13..0 of ITS hold the 14-bit Bus interval counter (125 us microframes, rolling over from 0x3FFF
    to 0) and bits 26..14 hold the 13-bit Delta (0..7499 in tIsochTimestampGranularity units from
    the previous bus interval boundary), while DWORD 1 bits 20..7 hold a 14-bit PTM Correction field
    (set to 0 by the host). A device may ignore an ITP that has the Delayed (DL) bit set in its Link
    Control Word.'
