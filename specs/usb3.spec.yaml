- id: ltssm-link-states
  section: standards
  title: The 12 Link Training and Status State Machine (LTSSM) link states
  claim: 'The Link Training and Status State Machine (LTSSM) defines 12 link states grouped into four
    categories and reported in the hub wPortStatus PORT_LINK_STATE field (bits 8..5): (1) operational
    and low-power link states U0 (0x00, normal operational state in which packets and link commands
    are sent and received), U1 (0x01, low-power idle state with no packet transfers and fast exit
    latency to U0), U2 (0x02, deeper low-power idle state in which clocks may be quiesced with longer
    exit latency to U0), and U3 (0x03, link suspend state entered when initiated by the downstream
    port for selective or system suspend); (2) link initialization, training, and recovery states
    Rx.Detect (0x05, initial power-on and post-Warm-Reset state detecting far-end low-impedance receiver
    terminations R_RX-DC; a peripheral upstream port transitions to eSS.Disabled after 8 consecutive
    unsuccessful detections), Polling (0x07, LFPS/SCD/LBPM speed and lane capability negotiation followed
    by TSEQ, SYNC, TS1, and TS2 receiver equalization, bit/symbol lock, lane polarity inversion, and
    port configuration training), Recovery (0x08, retraining from U1/U2/U3 exit or a link error in
    U0 using TS1 and TS2 ordered sets without retraining Rx equalizers), and Hot Reset (0x09, inband
    reset entered from Recovery when TS1/TS2 ordered sets have the Reset bit asserted, resetting link
    and protocol state and returning to U0 while keeping PHY equalization and port configuration);
    (3) test states Compliance Mode (0x0A, entered on Polling.LFPS timeout when enabled for transmitter
    compliance testing) and Loopback (0x0B, entered when the Loopback bit is set in TS2 ordered sets
    for bit error rate testing); and (4) disabled and error states eSS.Disabled (0x04, low-impedance
    receiver termination R_RX-DC removed and Enhanced SuperSpeed connectivity disabled) and eSS.Inactive
    (0x06, link error state where Enhanced SuperSpeed operation has ceased and software intervention,
    a Warm Reset, or disconnect is required).'
