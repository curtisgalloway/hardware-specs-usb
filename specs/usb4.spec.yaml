- id: usb4-router-enumeration-and-reset
  section: programming-model
  title: Router enumeration sequence, Configuration Valid/Ready handshake, and Port/Host Router resets
  claim: >-
    A Connection Manager enumerates and initializes a Router across four Configuration Layer states (`Uninitialized
    Unplugged`, `Uninitialized Plugged`, `Enumerated`, and `Sleep`) using the following sequence: 1. Discover
    the Router's `Upstream Adapter`, `Max Adapter`, `USB4 Version`, and `UUID` by reading `ROUTER_CS_0..8`
    (`CS = 10b`). 2. Enumerate the Router using a single Write Request to `ROUTER_CS_1..4` that sets `Depth`
    (`0` for Host Router, `1..5` for Device Router), `TopologyID Low/High` matching `Depth`, `CMUV` (`20h`
    for a Ver. 2 CM on a Ver. 2 Router), and `TopologyID Valid (V) = 1b` while writing back the exact
    read values of `Upstream Adapter` and `USB4 Version`. Setting `V = 1b` transitions the Router from
    `Uninitialized Plugged` to `Enumerated` and resets its Control Packet sequence numbers (`SN` and `Sq`)
    to `0`. 3. If `CMUV >= 20h`, poll `ROUTER_CS_6.Router Ready (RR)` (bit `24`) until it reads `1b` (the
    Router must assert `RR = 1b` within `tSetRR` max `50 ms` of `V = 1b`). 4. For a Device Router, configure
    `TMU Adapter Configuration Capability` on its UFP (for a Ver. 2 CM), write the desired protocol tunneling
    flags (`CNS`, `PTO`, `UTO`, `HSGT`, `HCO` — never setting both `UTO` and `HCO` to `1b`) in `ROUTER_CS_5`,
    and set `Configuration Valid (CV) = 1b` (bit `31`) before configuring any Paths through the Router.
    If `PTO = 1b` or `UTO = 1b`, poll `ROUTER_CS_6.Configuration Ready (CR)` (bit `25`) until it reads
    `1b` (asserted within `tSetCR` max `50 ms` of `CV = 1b`) before setting up PCIe or USB3 Paths. 5.
    To unlock a Downstream Facing Port after receiving a `Hot Plug Event Packet` (`PDF = 5h, UPG = 0b`),
    configure `ADP_CS_5.DHP` if desired and clear `ADP_CS_4.Lock (LCK)` (bit `31`) from `1b` to `0b` so
    Control Packets can be forwarded to the downstream Router. To reset a Downstream Facing Port, the
    CM sets `PORT_CS_19.Downstream Port Reset (DPR)` (bit `0`) to `1b`, waits at least `tClearDPR` (`10
    ms`), and clears `DPR` to `0b`. To reset a Host Router, the CM sets `Host Router Reset` (`39898h`
    bit `0` `HRR = 1b`), which transitions the Host Router to `Uninitialized Plugged`, drives `SBTX` low
    for `tDisconnectTx` on all DFPs, restores Configuration Spaces (except `Target Link Speed`, `Request
    RS-FEC Gen 2`, and `Request RS-FEC Gen 3`) and Host Interface BAR registers to defaults, and clears
    `HRR` to `0b` within `tHRReset` (max `500 ms`, recommended `<= 200 ms`) without resetting the PCIe
    Endpoint configuration space or MSI/MSI-X structures.
