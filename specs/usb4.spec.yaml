- id: usb4-gotcha-control-and-lane1-adapter-cs-access
  section: gotchas
  title: Control Adapter 0 has no Configuration Spaces and Lane 1 Adapter CS access is restricted on Aggregated
    Links
  claim: >-
    `Adapter 0` (`Control Adapter`) has no `Adapter Configuration Space`, `Path Configuration Space`,
    or `Counters Configuration Space`. When an enumerated Router receives a `Read Request` or `Write Request`
    (`PDF = 1h` or `2h`): if `CS` is `Path` (`00b`), `Adapter` (`01b`), or `Counters` (`11b`) and the
    targeted `Adapter Num` does not exist or is unsupported (including `Adapter 0` when `CS != 10b`, or
    an Adapter with `Adapter Type = Unsupported Adapter`), the Router sends a Notification Packet with
    `Event Code = ERR_ADP` (`4` / `04h`); if `CS` is `Counters` (`11b`) on a valid Adapter that does not
    implement Counters Configuration Space (`ADP_CS_1.CCS = 0b`), or if the requested `Address` and `Read/Write
    Size` exceed the defined limits of the targeted Configuration Space, the Router sends a Notification
    Packet with `Event Code = ERR_ADDR` (`2` / `02h`). Separately, if an enumerated Router receives any
    Control Packet (`HopID = 0`) on a Lane Adapter other than its `Upstream Adapter`, it sends a Notification
    Packet with `Event Code = ERR_NUA` (`9` / `09h`). On a USB4 Port operating as an `Aggregated Link`
    (`Lane 0` and `Lane 1` bonded), the Connection Manager must not access the Capability linked list
    in the `Lane 1` Adapter's `Adapter Configuration Space`, must not write to the basic configuration
    registers `ADP_CS_0..8` of the `Lane 1` Adapter, and must not write to `LANE_ADP_CS_2` (`DW2`) of
    the `Lane 1` Adapter. The Connection Manager may only write to `LANE_ADP_CS_1` (`DW1`) of the `Lane
    1` Adapter to enable or disable the lane (`Lane Disable` bit `14`), and when doing so must write the
    exact same values as written to the `Lane 0` Adapter for all other `R/W` fields in `LANE_ADP_CS_1`.
