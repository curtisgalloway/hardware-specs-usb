- id: usb4-router-and-port-operations
  section: programming-model
  title: Router Operations (ROUTER_CS_9..26) and Sideband Port Operations (SB Registers 8, 9, and 18)
  claim: >-
    USB4 defines two concurrent command execution interfaces for a Connection Manager: 1. `Router Operations`
    (via `ROUTER_CS_9..26` in Router Configuration Space): The CM writes input parameters to `ROUTER_CS_9..24`
    (`Data[0..15]`) and `ROUTER_CS_25` (`Metadata`), writes the 16-bit `Opcode` (`ROUTER_CS_26[15:0]`),
    and sets `Operation Valid (OV)` (`ROUTER_CS_26[31]`) from `0b` to `1b` (zeroing any unused `Metadata`
    or `Data` DWs). Upon completion, the Router updates `Metadata` and `Data[0..15]` if applicable, sets
    `Operation Not Supported (ONS)` (bit `30`) to `1b` if unsupported or `0b` with completion `Status`
    in bits `29:24` (`0h` = success, `1h` = failed/not executed or reserved field value), clears `OV`
    to `0b`, and sends a Notification Packet with `Event Code = ROP_CMPLT` (`33` / `21h`, `Event Info
    = 00h`). Defined Router Operation Opcodes in Table 8-26 are: - `10h` `Query DP Resource Availability`,
    `11h` `Allocate DP Resource`, `12h` `De-allocate DP Resource`, `13h` `Connect DP OUT Adapter` - `20h`
    `NVM Write`, `21h` `NVM Authenticate Write`, `22h` `NVM Read`, `23h` `NVM Set Offset`, `24h` `DROM
    Read`, `25h` `Get NVM Sector Size` - `30h` `Get PCIe Downstream Entry Mapping`, `31h` `Get Capabilities`,
    `32h` `Set Capabilities`, `33h` `Buffer Allocation Request`, `34h` `Block Sideband Port Operations`,
    `35h` `Unblock Sideband Port Operations`, `36h` `Get Container-ID`, `37h` `Get Connectors Information`,
    and `8000h..FFFFh` `Vendor Specific Router Operations`. 2. `Port Operations` (via `SB Register Space`
    of a target USB4 Port or Re-timer, accessed through the `USB4 Port Capability` mailbox `PORT_CS_1..17`):
    The CM writes `Metadata` (`SB Reg 9`, 4B), writes `Data` (`SB Reg 18`, 64B), and then writes a 32-bit
    `FourCC` command code to `Opcode` (`SB Reg 8`, 4B), verifying each SB write before issuing the next.
    Writing `SB Reg 8` triggers execution; when finished, the target sets `SB Reg 8` (`Opcode`) to `00000000h`
    on success, `"!CMD"` (`444D4321h`) if unsupported, or `"ERR "` (`20525245h`) if supported but failed,
    and the Router sends a `POP_CMPLT` (`34` / `22h`) Notification Packet. Defined Port Operation FourCC
    opcodes in Table 8-65 include `TXCM` (`4D435854h`), `RXCM` (`4D435852h`), `SBER` (`52454253h`), `EBER`
    (`52454245h`), `BBER` (`52454242h`), `RBER` (`52454252h`), `EEIT` (`54494545h`), `LFPT` (`5450464Ch`),
    `LNKT` (`544B4E4Ch` `SET_LINK_TYPE`), `LSEN` (`4E45534Ch` `ROUTER_OFFLINE_MODE`), `ENUM` (`4D554E45h`
    `ENUMERATE_RE-TIMERS`), `FERS` (`53524546h` `FEC_ERRORS_STAT`), `RDCP` (`50434452h`), `RHMG` (`474D4852h`),
    `RSMG` (`474D5352h`), `RDSW` (`57534452h`), `SCLT` (`QUERY_CLX_LATENCY_TOL`), and `QCLT` (`SET_CLX_LATENCY_TOL`).
