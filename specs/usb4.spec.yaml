- id: usb4-lane-adapter-states-and-sideband
  section: standards
  title: Lane Adapter state machine encodings and 1 Mbps Sideband Channel transactions
  claim: >-
    Each Lane Adapter implements a Logical Layer state machine reported in `LANE_ADP_CS_1.Adapter State`
    (bits `29:26`) with eight defined state encodings: - `0000b` (`Disabled`): Lane is inactive (`Lane
    Disable = 1b`) - `0001b` (`Training` or `Lane Bonding`): Physical/Logical link initialization (`Training`)
    or bonding `Lane 0` and `Lane 1` into an Aggregated Link (`Lane Bonding` state is used by `Gen 2`/`Gen
    3`; `Gen 4` bonds during Lane Initialization) - `0010b` (`CL0`): Active data communication state (`CL0`
    on both bonded lanes is `CL0 (Aggregated)`) - `0011b` (`Transmitter in CL0s`) and `0100b` (`Receiver
    in CL0s`): Low-power sub-states for asymmetric link-idle power savings on `Gen 2` and `Gen 3` links
    (`CL0s Enable` is ignored on `Gen 4` links) - `0101b` (`CL1`) and `0110b` (`CL2`): Optional deeper
    Low Power link states entered via Ordered Set handshakes (`CL1_REQ`/`CL2_REQ`, `CL1_ACK`/`CL2_ACK`,
    and `CL_OFF` Ordered Sets on `Gen 2`/`Gen 3` Links, or `CL_OFF` Ordered Sets with `CLx State = 1t`/`2t`
    from `CL0s` on `Gen 4` Links, after a `PM Packet` with `PDF = Eh` clears path objections on Paths
    with `PMPS = 1b`) and exited via `LFPS` handshake; on `Gen 2`/`Gen 3` Links a Hub Router's Downstream
    Facing Port Lane Adapters shall not initiate entry to `CL2` (while on `Gen 4` Links a Hub Router's
    DFP only initiates entry to `CL0s (TX)` with option to enter `CL2` if it is already in `CL0s (RX)`
    with option to enter `CL2`) - `0111b` (`CLd`): Disconnected state (default reset value `7h`). Each
    USB4 Port also maintains a `1 Mbps` (`SBX_UI = 970..1030 ns`) `Sideband Channel` over `SBTX` and `SBRX`
    wires using 10-bit Start/Stop symbols (`1` Start bit `0b`, `8` payload bits sent LSB-first, `1` Stop
    bit `1b`). Sideband traffic uses four Transaction types starting with a `DLE` symbol (`FEh`): 3-byte
    `Link Type (LT)` (`StartLT = 10b, ELT = 0b`, bitwise-complement `CLSE`), 3-byte `Extended Link Type
    (ELT)` (`StartLT = 10b, ELT = 1b`, bitwise-complement `CELSE`), `Administrative Type (AT)` (`StartAT
    = 00b`), and `Re-timer Type (RT)` (`StartRT = 01b`, Broadcast or Addressed). AT and RT transactions
    end with a 16-bit CRC (poly `8005h`, init `FFFFh`, RefIn/RefOut `True`, XorOut `0000h` over `STX`
    and `Data` symbols, with `FEh` byte-stuffing) followed by `DLE-ETX` (`FEh-40h`), and access the per-port
    `SB Register Space` (`Reg 0` `Vendor ID`, `Reg 1` `Product ID`, `Reg 5` `Debug Configuration`, `Reg
    6` `Debug`, `Reg 7` `LRD Tuning`, `Reg 8` `Opcode`, `Reg 9` `Metadata`, `Reg 12` `Link Configuration`,
    `Reg 13` `Gen 2/3 TxFFE`, `Reg 14` `Gen 4 TxFFE`, `Reg 15` `Sideband Channel Version`, `Reg 18` `Data`).
