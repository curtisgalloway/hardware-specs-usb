  title: Router CS Read Response overwrites Adapter Num with the Upstream Adapter number, and ROUTER_CS_1/4
    write-back rules
  claim: >-
    Although a Connection Manager sets `Adapter Num = 0` (DW3 bits `24:19`) in `Read Request` and `Write
    Request` packets targeting `Router Configuration Space` (`CS = 10b`), a Router populates the `Adapter
    Num` field of a `Read Response` (`PDF = 1h`) for `Router Configuration Space` with the `Adapter Number`
    on which the `Read Request` arrived (its Upstream Adapter), whereas in a `Write Response` (`PDF =
    2h`) `Adapter Num` echoes the `Write Request`'s `Adapter Num` (`0`). Driver software parsing a `Read
    Response` must not reject the response for having a non-zero `Adapter Num` when `CS = 10b`. Furthermore,
    when writing to `ROUTER_CS_1` (`DW1`) or `ROUTER_CS_4` (`DW4`), the Connection Manager must first
    read those registers and write back the exact read values for `Upstream Adapter` (`ROUTER_CS_1[13:8]`)
    and `USB4 Version` (`ROUTER_CS_4[31:24]`), must never set `Notification Timeout` (`ROUTER_CS_4[7:0]`)
    to `0`, and must not modify `ROUTER_CS_1..3` or `CMUV` (`ROUTER_CS_4[15:8]`) after setting `TopologyID
    Valid (V)` to `1b`.
