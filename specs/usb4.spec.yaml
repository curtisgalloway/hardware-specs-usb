orientation: >-
  USB4 defines a packet-based switching fabric over USB Type-C connectors organized into five functional
  stack layers: Electrical Layer, Logical Layer (which together form the Physical Layer), Transport Layer,
  Configuration Layer, and Protocol Adapter Layer. Rather than carrying raw USB bus signaling on dedicated
  wires, a USB4 Fabric encapsulates and tunnels USB3 (Enhanced SuperSpeed Gen X and bandwidth-extended
  Gen T), DisplayPort (DP IN and DP OUT), PCI Express (PCIe Down and PCIe Up), and Host-to-Host traffic
  inside 4-byte-header Transport Layer Packets switched across Routers by 7-bit HopIDs. A USB4 Domain
  forms a Spanning Tree of up to 6 levels (depths 0 through 5) rooted at a Host Router (depth 0, TopologyID
  0,0,0,0,0,0,0) with Device Routers at depths 1 through 5 addressed by a 56-bit TopologyID encoding the
  Downstream Facing Port (DFP) Lane 0 Adapter Numbers at each level along the path from the Host Router.
  Physical links operate at Gen 2 (10.0 Gbps/lane, or 10.3125 Gbps in TBT3-Compatible Mode), Gen 3 (20.0
  Gbps/lane, or 20.625 Gbps in TBT3-Compatible Mode), or Gen 4 (40.0 Gbps/lane at 25.6 GBaud PAM3 with
  11b-to-7t mapping and RS(504, 480) FEC) in Single-Lane (x1, Gen 2/3 only), Symmetric Aggregated (2 Tx
  / 2 Rx), or Asymmetric Aggregated (3 Tx + 1 Rx or 1 Tx + 3 Rx, Gen 4 only) configurations alongside
  a 1 Mbps Sideband Channel (SBTX/SBRX) and a parallel USB 2.0 bus. A Connection Manager (CM) enumerates
  Routers, configures Adapters and Paths, and manages link power and time synchronization by exchanging
  CRC-32C-protected Control Packets on HopID 0 with each Router's Control Adapter (Adapter 0). Each Router
  exposes four Configuration Spaces addressed by the 2-bit CS field in Read and Write Requests: Router
  Configuration Space (CS = 10b, basic registers ROUTER_CS_0..26 plus a linked capability list including
  the required TMU Router Configuration Capability ID 03h and optional Vendor Specific Capabilities ID
  05h), Adapter Configuration Space (CS = 01b, basic registers ADP_CS_0..8 plus per-adapter capabilities:
  Lane Adapter ID 01h, TMU Adapter ID 03h, Protocol Adapter ID 04h, Vendor Specific ID 05h, and USB4 Port
  Capability ID 06h on Lane 0), Path Configuration Space (CS = 00b, 2-DW routing entries PATH_CS_0..1
  indexed by 2 * HopID), and optional Counters Configuration Space (CS = 11b, 3-DW counter sets CNT_CS_0..2).
  Long-running Router Operations (DP resource allocation, NVM/DROM access, PCIe/connector discovery) execute
  via ROUTER_CS_9..26, while Port Operations execute via Sideband Register Space registers 8, 9, and 18
  accessed through the USB4 Port Capability mailbox (PORT_CS_1..17). On a PCIe Host Router (PCI Class
  Code 0C0340h), the CM and host software interface to the fabric through the Chapter 12 Host Interface
  Adapter Layer residing in a single PCIe Memory BAR with N Transmit and N Receive Descriptor Rings (3
  <= N <= 21), where Ring 0 operates in Raw Mode for Control Packets and Rings 1..N-1 support Raw Mode
  and Frame Mode with optional modulo-8192 End-to-End (E2E) credit flow control. USB4 has several strict
  protocol and register-access invariants that break enumeration or data transfer if violated: (1) In
  a Read Response to Router Configuration Space (CS = 10b), Hardware overwrites the Adapter Num field
  (DW3 bits 24:19) with the Adapter Number on which the Read Request arrived (used by the CM to discover
  the Router's Upstream Adapter), whereas a Write Response echoes Adapter Num = 0; (2) When writing ROUTER_CS_1
  or ROUTER_CS_4, the CM must preserve the read-only Upstream Adapter and USB4 Version fields by writing
  back the exact values read, and must never set Notification Timeout to 0; (3) Adapter 0 (Control Adapter)
  has no Adapter, Path, or Counters Configuration Space, and on an Aggregated Link the CM must never access
  Lane 1's capability list or write Lane 1's ADP_CS_0..8 or LANE_ADP_CS_2 registers (only LANE_ADP_CS_1
  may be written to toggle Lane Disable); (4) Path Configuration Space entries must be read and written
  as atomic 2-DW requests (Address = 2 * HopID, Length = 2), only Weight and Valid may be modified while
  Valid = 1b, and after clearing Valid to 0b the CM must wait at least tTeardown (2 us) after Pending
  Packets (PP) clears to 0b before re-enabling the Path; (5) Multi-DW TMU registers and computation groups
  lock their Middle/High DWs only when the Low DW (such as LocalTime Low, TimeOffsetFromHR Low, or Inter-Domain
  Time Stamp Low) is read first; and (6) In the Host Interface, Data Buffers map big-endian into Transport
  Packet payload DWs while Descriptors map little-endian, a Data Length or Data Buffer Size field of 0
  means 4096 bytes, TX and RX rings invert which side owns Producer Index vs Consumer Index, and reading
  ISR (37800h) auto-clears all status bits in that DW unless Disable ISR Auto-Clear (39864h bit 17) is
  set to 1b.
