- id: usb4-path-and-counters-cs
  section: programming-model
  title: Path Configuration Space (CS = 00b) 2-DW entries, Path teardown, and Counters CS (CS = 11b)
  claim: >-
    `Path Configuration Space` (`CS = 00b`) in each Adapter (except Adapter 0) contains a 2-Doubleword
    entry (`PATH_CS_0` at DW `2 * n` and `PATH_CS_1` at DW `2 * n + 1`) for each supported Ingress `HopID
    n`: - `Path 0 Entry` (`HopID = 0`, DWs `0..1` on Lane Adapters and Host Interface Adapters): `PATH_CS_0[23:17]`
    is `Path Credits Allocated` (RO, minimum `2h`); `PATH_CS_1` contains `Counter ID` (bits `22:12`, R/W)
    and `Counter Enable (CE)` (bit `23`, R/W), while `PATH_CS_0[5:0]`, `PATH_CS_0[31]`, `PATH_CS_1[11:0]`,
    and `PATH_CS_1[31:24]` are `Vendor Defined (VD)`. - `Lane Adapter Path Entry n` (`HopID n` in `8..Max
    Input HopID`; entries `1..7` are reserved) and `Protocol Adapter Path Entry n` (`HopID n` in `1..Max
    Input HopID` for Host Interface Adapter, or `8..Max Input HopID` for USB3/PCIe/DP Adapters):
      - `PATH_CS_0` (`DW 2*n`): `Output HopID` (bits `6:0`, R/W), `Reserved` (bits `10:7`), `Output Adapter`
    (bits `16:11`, R/W), `Path Credits Allocated` (bits `23:17`, R/W on Lane Adapters; VD on Protocol
    Adapters), `PM Packet Support (PMPS)` (bit `24`, R/W on Lane Adapters; Reserved on Protocol Adapters),
    `Reserved` (bits `30:25`), and `Valid` (bit `31`, R/W: `1b` = Path enabled, `0b` = Path disabled).
      - `PATH_CS_1` (`DW 2*n+1`): `Weight` (bits `3:0`, R/W), `Reserved` (bits `7:4`), `Priority` (bits
    `10:8`, R/W, `1..7`), `Reserved` (bit `11`), `Counter ID` (bits `22:12`, R/W), `Counter Enable (CE)`
    (bit `23`, R/W), `Ingress Flow Control (IFC) Flag` (bit `24`, R/W on Lane Adapters; VD on Protocol
    Adapters), `Egress Flow Control (EFC) Flag` (bit `25`, R/W), `Ingress Shared Buffering Enable (ISE)
    Flag` (bit `26`, R/W on Lane Adapters; VD on Protocol Adapters), `Egress Shared Buffering Enable (ESE)
    Flag` (bit `27`, R/W), `Pending Packets (PP)` (bit `28`, RO: `1b` while packets for the Path wait
    to be dequeued), `Reserved` (bit `29`, RsvdZ), and `Reserved` (bits `31:30`).
    A Connection Manager tears down a Path starting from the `Destination Adapter` and ending at the `Source
    Adapter` by clearing `PATH_CS_0.Valid` from `1b` to `0b`; the Router responds to the Write Request,
    drains or discards queued packets within `tTeardown` (max `2 us`) after setting `Pending Packets (PP)`
    to `0b`, and blocks further transmission until `Valid` is set to `1b` again. When `ADP_CS_1.CCS =
    1b`, the Adapter implements `Counters Configuration Space` (`CS = 11b`) containing `Max Counter Sets`
    3-DW counter sets (`CNT_CS_0..2` at DWs `3 * id .. 3 * id + 2`, all `W/Clr`): 64-bit saturating `Received
    Counter Low` (`CNT_CS_0`) and `Received Counter High` (`CNT_CS_1`) counting received packets (`ADP_CS_1.RBE
    = 0b`) or payload bytes (`RBE = 1b`), and 32-bit saturating `Dropped Packets` (`CNT_CS_2`).
