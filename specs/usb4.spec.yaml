- id: usb4-transport-packet-format-and-hec
  section: standards
  title: Transport Layer Packet 4-byte header, HEC CRC-8, Idle Packet, and Link Management Packets
  claim: >-
    Every USB4 `Transport Layer Packet` begins with a 32-bit (`1 DW`) Header followed by `0` to `256`
    payload bytes (padded with `0..3` trailing zero bytes to a 4-byte multiple): - `HEC` (bits `7:0`):
    8-bit Header Error Control CRC calculated over header bits `31:8` (`Width = 8`, `Poly = 07h`, `Init
    = 00h`, `RefIn = False`, `RefOut = False`, `XorOut = 55h`). Receivers correct single-bit header errors
    and drop packets with uncorrectable multi-bit HEC errors (incrementing `ADP_CS_6.HEC Errors` and,
    if `ADP_CS_5.HEE = 1b`, setting `ADP_CS_3.HE = 1b` and sending an `ERR_HEC` Notification Packet).
    - `Length` (bits `15:8`): Payload byte count excluding padding (`01h..FFh` = `1..255` bytes; `00h`
    = `256` bytes for packets with payload, or `0` bytes for the header-only `Idle Packet`). - `HopID`
    (bits `22:16`): 7-bit Path identifier (`00h..7Fh`) used by the Ingress Adapter to look up routing
    and flow-control state. - `Rsvd` (bits `26:23`): Reserved (`0h`). - `SuppID` (bit `27`): Supplemental
    ID bit differentiating packet classes (`1b` for `Path Credit Sync Packets`; `0b` for all other Transport
    Layer Packets). - `PDF` (bits `31:28`): 4-bit Protocol Defined Field. Tunneled Power Management and
    Transport Layer Link Management Packets use fixed header and payload encodings: - `Idle Packet`: 4-byte
    header only (`PDF = 8h, SuppID = 0b, HopID = 01h, Length = 00h, HEC = 11h`, i.e. `08010011h`) inserted
    when no other packet is ready for transmission. - `PM Packet`: Tunneled Packet (`PDF = Eh, SuppID
    = 0b, Length = 04h, HopID = Path HopID > 7`), carrying a 1-DW payload with `CLx State` in bits `1:0`
    (`00b` no CLx states possible, `01b` CL1 possible, `10b` reserved, `11b` CL1 and CL2 possible) and
    `Reserved` (`0`) in bits `31:2`. - `Credit Grant Packet`: `PDF = 1h, SuppID = 0b, HopID = 01h`, `Length
    = 4 * K` for `1 <= K <= 63` (or `00h` when carrying `64` Credit Grant Records = `256` bytes), where
    each 1-DW Credit Grant Record carries `ECC` in bits `7:0` (CRC-8 over bits `31:8` with `Poly = 07h,
    Init = 00h, RefIn/RefOut = False, XorOut = 00h`), `Credits` in bits `15:8`, `CreditHopID` in bits
    `22:16`, `Rsvd` in bits `30:23`, and `L Flag` in bit `31` (`0b` Path, `1b` Shared Buffer). - `Path
    Credit Sync Packet`: `PDF = 0h, SuppID = 1b, HopID = Path HopID (> 7), Length = 04h`, with a 1-DW
    payload containing `ECC` in bits `7:0`, 8-bit `PCC` (`Path Credits Consumed`) in bits `15:8`, and
    `Rsvd` in bits `31:16`. - `Shared Buffers Credit Sync Packet`: `PDF = 2h, SuppID = 0b, HopID = 01h,
    Length = 04h`, with a 1-DW payload containing `ECC` in bits `7:0`, 8-bit `SCC` (`Shared Credits Consumed`)
    in bits `15:8`, and `Rsvd` in bits `31:16`. - `Time Sync Packet`: `HopID = 03h, SuppID = 0b` (`PDF
    = 1h, Length = 3Ch` / `60` bytes `Follow-Up Packet` or `PDF = 2h, Length = 1Ch` / `28` bytes `Inter-Domain
    Time Stamp Packet`, each protected by a trailing 32-bit `CRC32`).
