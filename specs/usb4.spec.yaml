      encapsulation and adapter state machines in usb4-2.0.pdf pp. 521-730 if implementing protocol-specific
      adapter logic.
- id: usb4-router-and-adapter-architecture
  section: standards
  title: Host and Device Routers, Adapter numbering rules, and USB4 Port composition
  claim: >-
    A USB4 Fabric is built from two types of Routers (`Host Router` in a USB4 Host, where the `Connection
    Manager` resides, and `Device Router` in a USB4 Hub, USB4-Based Dock, or USB4 Peripheral Device).
    Each Router contains up to `64` Adapters identified by a 6-bit `Adapter Number` (`0..63`): - `Control
    Adapter`: Always assigned `Adapter Number 0`. It is a logical-only entity that sends and receives
    Control Packets to and from the Connection Manager; it has no physical layer and does not have an
    `Adapter Configuration Space`, `Path Configuration Space`, or `Counters Configuration Space`. - `Lane
    Adapters`: Interface the Router to a USB4 Link. Every `USB4 Port` (`Downstream Facing Port` / `DFP`
    or `Upstream Facing Port` / `UFP`) contains two Lane Adapters (`Lane 0` and `Lane 1`) assigned consecutive
    Adapter Numbers with `Lane 0` having the lower Adapter Number (`Lane 1 = Lane 0 + 1`). On an Aggregated
    Link (`x2` Symmetric or `3 Tx`/`3 Rx` Asymmetric), all Transport Layer traffic is routed through the
    `Lane 0` Adapter while the `Lane 1` Adapter is not used by the Transport Layer. In a Device Router,
    the `Lane 0` Adapter of the `Upstream Facing Port` (`UFP`) is always assigned the lowest Adapter Number
    among all Lane Adapters in that Router. - `Protocol Adapters`: Translate between Tunneled Packets
    and internal native controllers/switches (`USB3 Gen X`, `USB3 Gen T`, `DP IN`, `DP OUT`, `DP OUT AUX`,
    `Downstream PCIe`, `Upstream PCIe`, `Host Interface`, and `Vendor Specific`). A Device Router shall
    not contain a `Host Interface Adapter`. In a Device Router that supports PCIe tunneling, the `Upstream
    PCIe Adapter` is assigned the lowest Adapter Number among all PCIe Adapters; in a Device Router that
    supports USB3 tunneling, the `Upstream USB3 Adapter` is assigned the lowest Adapter Number among all
    USB3 Adapters.
  support:
