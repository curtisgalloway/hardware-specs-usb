- id: usb4-architectural-layers-and-tunneling
  section: standards
  title: Five-layer USB4 architectural stack, tunneled protocols, and Type-C coexistence
  claim: >-
    The USB4 architecture comprises five functional stack layers: - `Electrical Layer`: Physical signaling
    characteristics, transmitter/receiver equalization, and Low Frequency Periodic Signaling (`LFPS`)
    - `Logical Layer`: Symbol/block encoding, scrambling, Reed-Solomon Forward Error Correction (`RS-FEC`),
    Lane initialization, Lane bonding, link power management (`CLx`), Sideband Channel (`SBTX`/`SBRX`)
    transactions, and Time Sync Notification Ordered Sets (`TSNOS`). Together, the `Electrical Layer`
    and `Logical Layer` form the `Physical Layer`. - `Transport Layer`: 4-byte-header Transport Layer
    Packet framing, Header Error Control (`HEC`), HopID-based packet switching, link flow control (`Credit
    Grant` and `Credit Sync` packets), quality-of-service (`QoS`) scheduling, and Path teardown - `Configuration
    Layer`: Control Packet processing on `HopID 0`, Router enumeration, TopologyID addressing, Notification/Hot
    Plug event reporting, and access to Router, Adapter, Path, and Counters Configuration Spaces - `Protocol
    Adapter Layer`: Encapsulation and decapsulation of native protocol traffic into Tunneled Packets for
    `USB3` (`Gen X` using USB 3.2 Enhanced SuperSpeed architecture and `Gen T` extended to operate up
    to USB4 link bandwidth), `DisplayPort` (`DP IN` and `DP OUT`), `PCIe` (`PCIe Down` and `PCIe Up`),
    and `Host-to-Host` communication via the `Host Interface (HI)` Adapter. USB4 over USB Type-C operates
    alongside a parallel `USB 2.0` bus (`D+`/`D-`) and defines no separate `VBUS` power model of its own,
    relying on the USB Type-C and USB Power Delivery (`USB PD`) specifications for connection detection,
    USB4 mode entry, and power delivery.
  support:
  - class: standard
    doc: usb4-2.0.pdf
    at:
