- id: usb4-tmu-time-synchronization
  section: programming-model
  title: Time Management Unit (TMU) Local Clock, capabilities (ID = 03h), handshake modes, and Post Time
  claim: >-
    Every Router with one or more DFPs, or supporting DP tunneling, USB3 tunneling with exposed downstream
    USB3 ports, or PCIe tunneling with PTM, must support the `Time Synchronization Protocol`, and all
    Routers must implement the `TMU Router Configuration Capability` (`Capability ID = 03h`, `TMU_RTR_CS_0..25`
    in Router CS) and `TMU Adapter Configuration Capability` (`Capability ID = 03h`, `TMU_ADP_CS_0..9`
    in each Lane Adapter CS): - `Local Clock & Counter`: Each Router provides a free-running non-spread-spectrum
    `Local Clock` at `>= 125 MHz` (`+/- 100 ppm`, `<= 8 ns` timestamp resolution) incrementing an 80-bit
    unsigned `LocalTime` counter (`Nanoseconds[79:16]` in `TMU_RTR_CS_2..3` and upper half of `TMU_RTR_CS_1`,
    `Fractional Nanoseconds[15:0]` in `TMU_RTR_CS_1[15:0]`). - `Handshake Modes & Accuracy`: Gen 2 and
    Gen 3 links support `Bi-Directional` (HiFi Mode only), `Uni-Directional` (`TMU_ADP_CS_3.UDM = 1b`,
    HiFi or LowRes Mode), and `Enhanced Uni-Directional` (`TMU_ADP_CS_8.EUDM = 1b`, HiFi Mode only) handshakes;
    Gen 4 links use `Enhanced Uni-Directional` handshakes (`24` Gen 4 `TSNOS` sent at the next RS-FEC
    block boundary with `Symbols Delay <= 1000`). For Bi-Directional and Uni-Directional modes, `TMU_RTR_CS_3.TSPacketInterval`
    (bits `31:16`) selects `0` (disabled, default), `16` (`16 us` `HiFi Mode`, `tHiAccuracy` max `2 ns`),
    or `1000` (`1 ms` `LowRes Mode`, `tLowAccuracy` max `4 ns`), converging within `tConvergeTime` (max
    `50 ms`) after enable and `tCLxConvergeTime` (max `100 us`) after resuming from pause. For Enhanced
    Uni-Directional HiFi Mode, the CM programs `TMU_ADP_CS_8..9` with `Replenish Timeout = 3125`, `Replenish
    Threshold = 0`, `ReplenishN = 30`, `DirSwitchN = 255`, and `AdapterTimeSyncInterval = 16`. - `Post
    Time & Time Disruption`: To seed a Router's `LocalTime` (via `TMU_RTR_CS_22..25`), the CM sets `TMU_RTR_CS_0.Time
    Disruption (TD)` (bit `27`) to `1b` (also required before changing TMU mode/filter parameters or enabling
    Inter-Domain time sync), reads the Host Router's `LocalTime`, writes the 64-bit Nanoseconds value
    to `Post Local Time Low/High` (`TMU_RTR_CS_22..23`), writes `1` across `Post Time Low/High` (`TMU_RTR_CS_24..25`,
    where writing `TMU_RTR_CS_25` `Post Time High` activates posting), polls `Post Time` until the Router
    clears it to `0`, and clears `TD` to `0b`.
