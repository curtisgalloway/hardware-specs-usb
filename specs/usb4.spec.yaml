- id: usb4-link-speeds-widths-and-encoding
  section: standards
  title: Gen 2, Gen 3, and Gen 4 link speeds, Single-Lane and Aggregated widths, and line encodings
  claim: >-
    USB4 Links support three speed generations and two link width modes across the two Lane Adapters of
    a USB4 Port: - `Gen 2 Speed`: `10.0 Gbps` per lane (`10.3125 Gbps` per lane when operating in `TBT3-Compatible
    Mode`). Support for Gen 2 is mandatory for all Router Assemblies. When RS-FEC is off, Gen 2 uses `64b/66b`
    encoding (`2` sync header bits `01b` for data or `10b` for an Ordered Set followed by `64` payload
    bits). - `Gen 3 Speed`: `20.0 Gbps` per lane (`20.625 Gbps` per lane in `TBT3-Compatible Mode`). Support
    for Gen 3 is mandatory for USB4 Hubs and optional for USB4 Hosts and USB4 Peripheral Devices. When
    RS-FEC is off, Gen 3 uses `128b/132b` encoding (`4` sync header bits `0101b` for data or `1010b` for
    an Ordered Set followed by `128` payload bits). - `Gen 4 Speed`: `40.0 Gbps` per lane at `25.6 GBaud`
    `PAM3` signaling using `11-bit` symbols grouped into 4-symbol sets (`44 bits`), `RS(504, 480)` Reed-Solomon
    Forward Error Correction over `GF(2^11)` (`480` payload symbols = `660 bytes` plus `24` redundancy
    symbols = `33 bytes`, correcting up to `12` symbol errors per RS-FEC block), `11b-to-7t` binary-to-ternary
    mapping, scrambling, and pre-coding. Support for Gen 4 is optional for all products. - `Link Widths`:
    A USB4 Link operates either as a `Single-Lane Link` (`x1`, where `Lane 0` is enabled and `Lane 1`
    is disabled; supported only at `Gen 2` and `Gen 3` speeds) or as an `Aggregated Link` where `Lane
    0` and `Lane 1` are bonded into a single Transport Layer link. An Aggregated Link operates as a `Symmetric
    Link` (`2 Tx` and `2 Rx`, supported at `Gen 2`, `Gen 3`, and `Gen 4`, yielding `20 Gbps`, `40 Gbps`,
    or `80 Gbps` full-duplex) or an `Asymmetric Link` (`3 Tx + 1 Rx` at one end paired with `1 Tx + 3
    Rx` at the Link Partner, supported at `Gen 4` only, yielding `120 Gbps` in the 3-lane direction and
    `40 Gbps` in the 1-lane direction).
