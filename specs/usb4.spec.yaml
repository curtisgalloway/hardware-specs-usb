- id: usb4-domain-topology-and-addressing
  section: standards
  title: Domain Spanning Tree depth limits and 56-bit TopologyID / 64-bit Route String addressing
  claim: >-
    Routers within a USB4 Domain are organized in a `Spanning Tree` hierarchy with up to `6` levels (`Depth
    0` through `Depth 5`, supporting up to `5` hops from the Host Router): - The `Host Router` is at the
    root of the Spanning Tree (`Depth = 0`) and is always assigned `TopologyID = 0,0,0,0,0,0,0`. - Each
    `Device Router` at `Depth X` (`1 <= X <= 5`) is addressed by a 56-bit `TopologyID` structured as 7
    bytes (`Level 0` through `Level 6`), where each byte holds a 6-bit `Adapter Number` in bits `5:0`
    and `00b` in reserved bits `7:6`. Bytes `0` through `X - 1` contain the `Lane 0` Adapter Numbers of
    the Downstream Facing Ports traversed at each level from the Host Router (`Level 0`) down to the parent
    Router (`Level X - 1`), and bytes `X` through `6` are `00h`. Control Packets carry the target or source
    `TopologyID` inside a 64-bit `Route String` split across two header Doublewords: - `Route String High`
    (`DW1`, bits `63:32` of Route String): `Level 4` in bits `5:0` (`Reserved` `7:6`), `Level 5` in bits
    `13:8` (`Reserved` `15:14`), `Level 6` in bits `21:16` (`Reserved` `23:22`), `Reserved` in bits `30:24`
    (bits `62:56` of Route String), and the `CM` direction bit in bit `31` (bit `63` of Route String,
    set to `0b` for packets sent from a Connection Manager to a Router and `1b` for packets sent from
    a Router to a Connection Manager). - `Route String Low` (`DW2`, bits `31:0` of Route String): `Level
    0` in bits `5:0` (`Reserved` `7:6`), `Level 1` in bits `13:8` (`Reserved` `15:14`), `Level 2` in bits
    `21:16` (`Reserved` `23:22`), and `Level 3` in bits `29:24` (`Reserved` `31:30`).
