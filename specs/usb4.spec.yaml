- id: usb4-hopid-allocation-and-routing
  section: standards
  title: HopID allocation ranges, Routing Table lookup, flow control, and 3-tier Traffic Manager scheduler
  claim: >-
    Each Adapter (except the Control Adapter) has a `Path Configuration Space` that acts as its `Routing
    Table`, indexed by the incoming packet's 7-bit `Ingress HopID`: - `HopID 0`: Reserved on Lane Adapters
    and Host Interface Adapters for `Control Packets` (`Path 0`). `HopID 0` always uses `Dedicated Flow
    Control` with at least `2` initial credits (`PATH_CS_0.Path Credits Allocated >= 2h`) and is assigned
    exclusively to `Priority Group 0` (no other traffic may use `Priority Group 0`). - `HopIDs 1..7` on
    Lane Adapters: Reserved for Transport Layer Link Management Packets (`HopID 1` for Credit Grant and
    Shared Buffers Credit Sync, `HopID 3` for Time Sync; packets received on a Lane Adapter with `HopID
    2` or `4..7` are dropped without incrementing `Invalid HopID Errors`). - `Tunneled Packet HopIDs`:
    When a Path's Egress Adapter is not a Host Interface Adapter, the Egress `Output HopID` must be in
    `[8, Max Output HopID]` of the Egress Adapter and `<= Max Input HopID` of the next Router's Ingress
    Adapter. When a Path's Egress Adapter is a Host Interface Adapter, the Egress `Output HopID` must
    be in `[1, Max Input HopID]` of the Host Interface Adapter (corresponding to Receive Descriptor Rings
    `1..N-1`). A Router's `Traffic Manager` arbitrates egress transmission across three hierarchical scheduling
    layers: 1. `Path Scheduler` (per Priority Group `0..7`): Schedules among Paths within the same Priority
    Group using Weighted Round Robin (`WRR`) according to `PATH_CS_1.Weight` (`1..15`), or for USB3 Gen
    T Paths on a Host Router with `ROUTER_CS_6.GTBW = 1b`, using the shared `PORT_CS_19.Bundle Weight`
    (`1..255`). 2. `Priority Group Scheduler`: Arbitrates among the eight Priority Groups using strict
    priority where `Priority Group 0` is highest and `Priority Group 7` is lowest. 3. `Link Scheduler`:
    Multiplexes onto the physical link using strict priority from highest to lowest: `Flow Control Packets`
    (`Credit Grant` / `Credit Sync`) > `Time Sync Packets` > `Packets from the Priority Group Scheduler`.
