- id: usb4-gotcha-path-cs-access-and-teardown-delay
  section: gotchas
  title: Path Configuration Space requires atomic 2-DW accesses and a tTeardown (2 us) wait after Pending
    Packets clears
  claim: >-
    When reading or writing a Path entry in `Path Configuration Space` (`CS = 00b`), a Ver. 2 Connection
    Manager must issue a single Read Request or Write Request covering both Doublewords (`PATH_CS_0` and
    `PATH_CS_1`, `Address = 2 * HopID, Length = 2`), must read the entry before writing so that `Vendor
    Defined (VD)` and `RsvdZ` bits are preserved unchanged, must set a non-zero `Weight` (`1..15`) and
    a `Priority` in `1..7` whenever `Valid = 1b`, and must not modify any field other than `Weight` and
    `Valid` while `Valid = 1b`. When tearing down a Path by clearing `Valid` from `1b` to `0b`, the Connection
    Manager must poll `PATH_CS_1.Pending Packets (PP)` (bit `28`) until it reads `0b` and then wait at
    least `tTeardown` (`2 us`) before setting `Valid` for that Path back to `1b`.
