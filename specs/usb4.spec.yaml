- id: usb4-host-interface-descriptors-and-modes
  section: programming-model
  title: Host Interface Raw and Frame Modes, E2E flow control, and 16-byte TX/RX Descriptor layouts
  claim: >-
    In the Host Interface Adapter Layer, `Transmit Ring 0` and `Receive Ring 0` (`HopID 0`) operate exclusively
    in `Raw Mode` without End-to-End (`E2E`) flow control to carry Connection Manager Control Packets;
    all other rings (`1..N-1`) support both `Raw Mode` (one Transport Layer Packet payload per Data Buffer)
    and `Frame Mode` (frames of `1..4096` bytes segmented across `Start of Frame`, `Middle of Frame` `PDF
    = 0h`, and `End of Frame` Tunneled Packets with a trailing hardware-generated/checked 32-bit CRC-32C
    that is stripped before posting to RX Data Buffers). When `E2E Flow Control` (`Ring Control` bit `28`)
    is enabled on non-zero rings, one credit equals one Receive Descriptor (up to `8192` advertised credits,
    tracked modulo `8192`) exchanged via `E2E Credit Grant Packets` (`PDF = Fh, SuppID = 0b, Length =
    04h, CS = 0b` sent every `tE2ERate` `1..1000 ms` and on descriptor replenishment using `Transmit E2E
    HopID`) and `E2E Credit Sync Packets` (`PDF = Fh, SuppID = 0b, Length = 04h, CS = 1b` sent every `tE2ESync`
    `10..20 s`). Each `Transmit Descriptor` and `Receive Descriptor` in host memory is `16 bytes` (`4
    DWs`, with Data Buffer physical addresses 4-byte aligned so `Address Low[1:0] = 00b`): - `Transmit
    Descriptor` (Table 12-6): `DW0` `Address Low[31:0]`, `DW1` `Address High[31:0]`, `DW2` `Data Length[11:0]`
    (`0` = `4096` bytes), `EOF PDF[15:12]` (`0h..Eh` in Raw Mode; `1h..Eh` on last descriptor of a Frame
    or `0h` otherwise in Frame Mode, never `Eh` if the lane carries a Path with `PMPS = 1b`), `SOF PDF[19:16]`
    (ignored in Raw Mode; `1h..Eh` on first descriptor of a multi-packet Frame and different from `EOF
    PDF`, or `0h` otherwise), `Rsvd[20]`, `Descriptor Done (DD)[21]` (cleared to `0b` by Host; set to
    `1b` by hardware upon completion when `RS = 1b`), `Request Status (RS)[22]`, `Interrupt Enable (IE)[23]`,
    `Offset[31:24]` (byte offset in Data Buffer), and `DW3` `Rsvd[31:0]`. - `Receive Descriptor Posted
    by Host` (Table 12-7): `DW0` `Address Low[31:0]`, `DW1` `Address High[31:0]`, `DW2` `Reserved[20:0]`,
    `DD[21] = 0b`, `RS[22] = 1b` (Host shall always set `RS = 1b`), `IE[23]`, `Offset[31:24]`, and `DW3`
    `Reserved[31:0]`. - `Receive Descriptor Written Back by Hardware` (Table 12-8, written when `RS =
    1b`): `DW0..1` `Address Low/High`, `DW2` `Data Length[11:0]` (`0` = `4096` bytes posted), `EOF PDF[15:12]`,
    `SOF PDF[19:16]`, `CRC Error[20]` (`1b` if Frame Mode CRC-32C check failed), `DD[21] = 1b`, `Buffer
    Overflow (BO)[22]`, `IE[23]`, `Offset[31:24]`, and `DW3` `Reserved[31:0]`.
