- id: usb4-gotcha-tmu-register-locking-and-bidi-clx
  section: gotchas
  title: Multi-DW TMU registers and computation groups lock only when the Low DW is read first, and Bi-Directional
    HiFi blocks CLx
  claim: >-
    In the `TMU Router Configuration Capability` (`ID = 03h`), multi-DW registers (`LocalTime {Low, Middle,
    High}` at `TMU_RTR_CS_1..3`, `TimeOffsetFromHR {Low, High}` at `TMU_RTR_CS_4..5`, and `Inter-Domain
    Time Stamp {Low, Middle, High}` at `TMU_RTR_CS_16..18`) and register groups (`Time Computation Group`
    `TMU_RTR_CS_4..14` plus `Received Counter Low/High` when `ADP_CS_1.LBE = 1b`, triggered by reading
    `TimeOffsetFromHR Low` at `TMU_RTR_CS_4`; and `Inter-Domain Computation Group` `TMU_RTR_CS_16..21`,
    triggered by reading `Inter-Domain Time Stamp Low` at `TMU_RTR_CS_16`) latch their upper DWs and group
    members when the `Low` (`Triggering`) DW is read and hold those latched values until the `Low` DW
    is read again. Software must always read the `Low` DW first to capture a coherent snapshot. Additionally,
    `Bi-Directional` Time Sync Handshakes (`TMU_ADP_CS_3.UDM = 0b, TMU_ADP_CS_8.EUDM = 0b`) only support
    `HiFi Mode` (`TSPacketInterval = 16`) — never `LowRes Mode` — and prevent the USB4 Link from entering
    any Low Power (`CLx`) state.
