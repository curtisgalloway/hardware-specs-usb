    Size` in DWs (bits `18:13`, `1..60` DWs), 6-bit `Adapter Num` (bits `24:19`), 2-bit `Configuration
    Space (CS)` selector (bits `26:25`: `00b` `Path`, `01b` `Adapter`, `10b` `Router`, `11b` `Counters`),
    2-bit `Sequence Number (SN)` (bits `28:27`), and `Rsvd` (bits `31:29`). `Read Response` inserts `Read
    Size` DWs of `Read Data` before the trailing `CRC` DW. - `Write Request` (`PDF = 2h`, `Length = 10h
    + 4 * Write Size`) and `Write Response` (`PDF = 2h`, `Length = 10h`, 5 DWs total): `DW3` has the same
    layout as `Read Request` with `Write Size` (`1..60` DWs) in bits `18:13`; `Write Request` carries
    `Write Data` in `DW4..DW(N+3)` followed by `CRC` in `DW(N+4)`, while `Write Response` echoes `DW3`
    followed by `CRC` in `DW4`. - `Notification Packet` (`PDF = 3h`, `Length = 10h`, 5 DWs total): `DW3`
    contains `Event Code` (bits `7:0`, defined in Table 6-12 as: `0` / `00h` `ERR_CONN`, `1` / `01h` `ERR_LINK`,
    `2` / `02h` `ERR_ADDR`, `4` / `04h` `ERR_ADP`, `7` / `07h` `HP_ACK`, `8` / `08h` `ERR_ENUM`, `9` /
    `09h` `ERR_NUA`, `11` / `0Bh` `ERR_LEN`, `12` / `0Ch` `ERR_HEC`, `13` / `0Dh` `ERR_FC`, `14` / `0Eh`
    `ERR_PLUG`, `15` / `0Fh` `ERR_LOCK`, `32` / `20h` `DP_BW`, `33` / `21h` `ROP_CMPLT`, `34` / `22h`
    `POP_CMPLT`, `35` / `23h` `PCIE_WAKE`, `36` / `24h` `DP_CON_CHANGE`, `37` / `25h` `DPTX_DISCOVERY`,
    `38` / `26h` `LINK_RECOVERY`, and `39` / `27h` `ASYM_LINK`), `Adapter Num` (bits `13:8`), `PG` (bits
    `15:14`: `00b` not Hot Plug Ack, `10b` Hot Plug Event Ack, `11b` Hot Unplug Event Ack), `Event Info`
    (bits `23:16`), `Sequence (Sq)` (bit `24`), and `Rsvd` (bits `31:25`); `DW4` is `CRC`. - `Notification
    Acknowledgement Packet` (`PDF = 4h`, `Length = 0Ch`, 4 DWs total): `DW0` Header, `DW1..2` Route String,
    `DW3` `CRC`. - `Hot Plug Event Packet` (`PDF = 5h`, `Length = 10h`, 5 DWs total): `DW3` contains `Adapter
    Num` (bits `5:0`), `Rsvd` (bits `30:6`), and `UPG` (bit `31`: `0b` Hot Plug, `1b` Hot Unplug); `DW4`
    is `CRC`. - `Inter-Domain Request` (`PDF = 6h`) and `Inter-Domain Response` (`PDF = 7h`): Transfer
    `N` DWs of `InterDomain Data` (`DW3..DW(N+3)`) between Connection Managers with `CM = 0b`. - `Enhanced
    Notification Acknowledgement Packet` (`PDF = 8h`, `Length = 10h`, 5 DWs total): Used when the `Sequence
