- id: usb4-gotcha-hi-endianness-ring-indices-and-4096-length
  section: gotchas
  title: Host Interface payload vs descriptor byte order, 0-equals-4096 length encoding, and inverted
    TX/RX Producer/Consumer index ownership
  claim: >-
    The Host Interface Adapter Layer has four subtle ring-programming rules: 1. `Opposite Byte Ordering`:
    Transmit and Receive Descriptors in host memory are mapped little-endian into Doublewords (lowest-addressed
    byte at bits `7:0` of `DW0`), whereas Data Buffer bytes are mapped big-endian into Transport Layer
    Packet payload Doublewords (lowest-addressed byte at bits `31:24` of the first payload DW). 2. `Zero
    Encodes 4096 Bytes`: In `Transmit Descriptor.Data Length` (`DW2[11:0]`), `Receive Descriptor.Data
    Length` (`DW2[11:0]`), and RX `Ring & Buffer Size.Data Buffer Size` (`0800Ch + n * 10h` bits `27:16`),
    a value of `0` indicates `4096` bytes (`1000h`). When a written-back Receive Descriptor has `CRC Error`
    (`DW2[20]`) set to `1b`, software must ignore the `Data Length` field. 3. `Inverted Producer/Consumer
    Ownership`: For a `Transmit Descriptor Ring` (`00008h + n * 10h`), `Consumer Index` (bits `15:0`,
    RO) is owned by hardware and `Producer Index` (bits `31:16`, R/W) is advanced by software; for a `Receive
    Descriptor Ring` (`08008h + n * 10h`), `Consumer Index` (bits `15:0`, R/W) is advanced by software
    to supply free descriptors and `Producer Index` (bits `31:16`, RO) is owned by hardware. In both rings,
    software must never advance its index to equal the hardware-owned index (always leaving at least one
    vacant descriptor slot in the ring), and writing to `Base Address Low`, `Base Address High`, or `Ring
    Size` resets both `Producer Index` and `Consumer Index` to `0`. 4. `RX Request Status Mandatory`:
    Software must always set `Request Status (RS)` (`DW2[22]`) to `1b` in every Receive Descriptor posted
    to a Receive Descriptor Ring, and after disabling an RX ring (`Ring Valid = 0b`), software must write
    `0` to `Consumer Index` and reset all fields in RX `Ring Control` (`29800h + n * 20h`) to their default
    values.
  support:
  - class: standard
    doc: usb4-2.0.pdf
    at:
    - page: '732'
      section: 12.1.1
    - page: '739'
      section: 12.3.1
    - pages:
      - '742'
      - '745'
      section: 12.4.1
    - pages:
      - '752'
      - '757'
      section: 12.6.3.2
- id: usb4-gotcha-host-router-reset-and-isr-autoclear
  section: gotchas
  title: Host Router Reset 1 ms TX ring drain and 50 ms quiet window, single-DW BAR access limit, and
    ISR read auto-clear
  claim: >-
    When initiating a `Host Router Reset` on a PCIe Host Router via `39898h` bit `0` (`HRR`), the Connection
    Manager must first disable all Transmit Descriptor Rings (`Ring Valid = 0b`) and wait at least `1
    ms` before setting `HRR = 1b`. After setting `HRR = 1b`, the Connection Manager must not read or write
    the `Host Router Reset` register (`39898h`) for `50 ms`, and must not write to any register in the
    Host Interface Memory BAR space or access any Receive Descriptor Ring until `HRR` reads back `0b`
    (within `tHRReset` max `500 ms`; reading any other BAR register while `HRR = 1b` returns undefined
    values). In normal operation, the Connection Manager must restrict all PCIe Memory BAR reads and writes
    to aligned single-DW (`32-bit`, all Byte Enables `1b`) accesses, and when `Disable ISR Auto-Clear`
    (`Host Interface Control` `39864h` bit `17`) is at its default value of `0b`, reading any `Interrupt
    Status Register` (`37800h + 4*k`) automatically clears all 32 status bits in that DW to `0` (use `Disable
    ISR Auto-Clear = 1b` together with `Interrupt Status Clear` at `37808h + 4*k` if write-1-to-clear
    semantics are desired).
