  section: gotchas
  title: Asynchronous connector changes can arrive in CCI alongside a command completion
  claim: >-
    An asynchronous connector event can be reported in CCI Connector Change Indicator (bits 7:1) at
    the same time as a command completion (or CANCEL completion), whereas a connector change that
    occurs as a direct result of a command sent to that connector (such as a successful role swap
    from SET_UOR or SET_PDR, or Alternate Mode entry from SET_NEW_CAM) must not set Connector
    Change Indicator unless the LPM/PPM needs more time to process the command. When CCI reports
    both a command completion and an asynchronous connector change, the OPM can either acknowledge
    Command Completed first and process the pending connector change afterward, or process the
    connector change and set both Connector Change Acknowledge (bit 16) and Command Completed
    Acknowledge (bit 17) in a single ACK_CC_CI command.
  support:
