- id: get-error-status-cleared-on-ack
  section: gotchas
  title: Query GET_ERROR_STATUS before acknowledging a failed command or error notification
  claim: >-
    The PPM is permitted to clear its Error Status Data once the OPM has acknowledged the command
    completion or connector change notification (or after receiving PPM_RESET), and is forbidden to
    clear it before then. An OPM that wants error details via GET_ERROR_STATUS after seeing CCI
    Error Indicator = 1 or a connector change with the Error bit set must therefore issue
    GET_ERROR_STATUS before acknowledging the original failed command or connector change
    notification with ACK_CC_CI.
  support:
