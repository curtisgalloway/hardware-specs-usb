      section: '1.4'
      table: '1-1'
    - pages: ['12', '13']
      section: '1.5'
    - page: '14'
      section: '2'
    - page: '28'
      section: '6.4'

- id: opm-ppm-data-structures
  section: standards
  title: Shared memory data structures between OPM and PPM
  claim: >-
    Information passes between the OPM and PPM through a 528-byte data structure layout (Table
    4-1): VERSION at byte offset 0 (24 bits, PPM/LPM->OPM, read-only to the OPM), RESERVED at
    offset 3 (8 bits), CCI at offset 4 (32 bits, PPM->OPM, read-only to the OPM), CONTROL at
    offset 8 (64 bits, OPM->PPM, written only by the OPM and read-only to the PPM), MESSAGE IN at
    offset 16 (2040 bits / 255 bytes, PPM->OPM, read-only to the OPM), RESERVED at offset 271 (8
    bits), MESSAGE OUT at offset 272 (2040 bits / 255 bytes, OPM->PPM), and RESERVED at offset 527
    (8 bits). In VERSION (Table 4-2), bits 15:0 hold the BCD UCSI specification version 0xJJMN for
    version JJ.M.N (JJ major, M minor, N sub-minor, updated by the PPM right after power-on or
    reset; for example 0x0213 for 2.1.3 and 0x0300 for 3.0.0), and bits 23:16 hold the 8-bit
    register address on the LPM for the other UCSI data structures. In CONTROL (Table 4-4), bits
    7:0 hold the Command code, bits 15:8 hold Data Length (bytes of valid data in MESSAGE OUT, at
    most MAX_DATA_LENGTH = 0xFF), and bits 63:16 hold 48 bits of command-specific parameters. The
    PPM writes MESSAGE IN before notifying the OPM of command completion, and the OPM reads MESSAGE
    IN only when notified that a command completed with CCI Data Length greater than zero; the OPM
    writes MESSAGE OUT only when no command is currently active at the PPM.
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - pages: ['17', '20']
      section: '4'
    - page: '17'
      table: '4-1'
    - page: '17'
      section: '4.1'
      table: '4-2'
    - pages: ['19', '20']
      section: '4.3'
      table: '4-4'
    - pages: ['19', '20']
      section: '4.4'
    - page: '20'
      section: '4.5'
    - page: '110'
      table: 'A-2'

- id: lpm-interface-and-pcie-aic
  section: standards
  title: PPM-LPM register protocol, address retries and PCIe Add-In-Card DVSEC
  claim: >-
    Between an OPM/PPM and an LPM over an addressed bus such as I2C or SMBus, the UCSI data
    structures are accessed by LPM target address, UCSI register address and byte count: VERSION is
    at fixed UCSI register address 0x99, and the address byte 0xYY returned in VERSION bits 23:16
    sets the register addresses of CCI (0xYY), CONTROL (0xYY + 1), MESSAGE IN (0xYY + 2) and
    MESSAGE OUT (0xYY + 3). Because an LPM without clock stretching may not acknowledge its address
    byte while busy with a high-priority task or in a power-gated/low-power state, a PPM/OPM must
    implement 3 retries for the address byte when ACK is not received within the required time
    interval, waiting at least 10 ms from the Stop condition of one retry to the first bit of the
    next. On a PCIe Add-In-Card (AIC), LPMs may be exposed via a PCIe Designated Vendor-Specific
    Extended Capability (DVSEC, PCIe Extended Capability ID 0023h, DVSEC Vendor ID 8087h) that
    carries a Topology/Version header, N 16-byte per-port Resource blocks at offsets 10h to
    N*10h+10h, and the UCSI registers at N*10h+20h (UCSI Version), N*10h+24h (CCI), N*10h+28h
    (CONTROL), N*10h+30h (MSG IN), N*10h+130h (MSG OUT) and N*10h+230h (VIRTUAL ALERT).
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - pages: ['15', '16']
      section: '3'
    - pages: ['21', '22']
      section: '5'
      table: '5-1'
    - pages: ['105', '108']
      section: '8'
      table: '8-1'
  todo:
    check: document
    text: >-
      Figure 3-1's bit/byte wire transmission example (pp. 15-16), Figures 5-1 to 5-4's message
      framing diagrams (pp. 21-22), Table 8-1's AIC Topology bit encodings and Figure 8-2's
      Resource register fields (pp. 107-108) are not extracted in full.

- id: cci-layout
  section: programming-model
  title: CCI (Command Status and Connector Change Indication) 32-bit field layout
  claim: >-
    When notified, the OPM reads the 32-bit CCI data structure at byte offset 4 (Table 4-3): bit 0
    is End of Message Indicator (used in multi-chunk LPM_FW_UPDATE_REQUEST and SECURITY_REQUEST
    commands; reserved and 0 for all other commands); bits 7:1 are Connector Change Indicator (0
    when no connector change occurred, or 1 to the maximum number of supported connectors to name
    the changed connector); bits 15:8 are Data Length (bytes of valid data in MESSAGE IN, at most
    MAX_DATA_LENGTH = 0xFF); bit 16 is Vendor Defined Message Indicator (1 when a custom defined
    message is ready, mutually exclusive with any other indicator, and repurposed on some commands);
    bits 22:17 are Reserved (0 in Table 4-3, while the command-specific status tables for
    LPM_FW_UPDATE_REQUEST, SECURITY_REQUEST, SET_RETIMER_MODE, SET_PDOS and SET_CAM_PRIORITY define
    bits 22:16 as a 7-bit Data Index); bit 23 is Security Request Indicator (1 for an asynchronous
    Security Request from the port partner); bit 24 is FW Update Request Indicator (1 for an
    asynchronous LPM FW Update Request from the port partner); bit 25 is Not Supported Indicator (1
    when the PPM does not currently support the command; valid only when Command Completed
    Indicator is 1); bit 26 is Cancel Completed Indicator (1 when CANCEL completed; valid only when
    Command Completed Indicator is 1); bit 27 is Reset Completed Indicator (1 when PPM_RESET
    completed; when 1, no other bits in CCI may be set by the PPM, and the PPM clears it on
    receiving the next non-PPM_RESET command from the OPM); bit 28 is Busy Indicator (1 when the
    PPM is busy and will complete the command later; when 1, no other bits in CCI may be set by the
    PPM, and on completion the PPM clears it and updates the other CCI fields before notifying the
    OPM); bit 29 is Acknowledge Command Indicator (1 when ACK_CC_CI completes, automatically reset
    on receiving the next command from the OPM; when 1, the only other field that may be set is
    Connector Change Indicator); bit 30 is Error Indicator (1 when command execution encountered an
    error; valid only when Command Completed Indicator is 1); and bit 31 is Command Completed
    Indicator (1 when the PPM completed the command sent by the OPM).
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
