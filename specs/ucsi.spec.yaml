- id: set-notification-enable
  section: programming-model
  title: SET_NOTIFICATION_ENABLE bitmask and mandatory vs optional events
  claim: >-
    SET_NOTIFICATION_ENABLE (0x05, Data Length = 0x00; Table 6-9) sets the 17-bit Notification
    Enable bitmap in CONTROL bits 32:16 (bits 63:33 reserved 0): bit 0 Command Completed, bit 1
    External Supply Change (Optional), bit 2 Power Operation Mode Change, bit 3 Attention
    (Optional), bit 4 LPM FW Update Request from Port Partner (Optional), bit 5 Supported Provider
    Capabilities Change (Optional), bit 6 Negotiated Power Level Change (Optional), bit 7 PD Reset
    Complete (Optional), bit 8 Supported CAM Change (Optional), bit 9 Battery Charging Status
    Change, bit 10 Security Request from Port Partner (Optional), bit 11 Connector Partner Change,
    bit 12 Power Direction Change, bit 13 Set Re-timer Mode (Optional), bit 14 Connect Change, bit
    15 Error, and bit 16 Sink Path Status Change (all unannotated bits are Normative). The OPM may
    update the enabled notification list at any time, must not attempt to enable notifications the
    PPM does not support, and whenever any notification is enabled must also enable Command
    Completed (bit 0). On completion the PPM sets Command Completed Indicator (bit 31) to 1 (and
    Error Indicator bit 30 to 1 if unsuccessful; Table 6-10).
