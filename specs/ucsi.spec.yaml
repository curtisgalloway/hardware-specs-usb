      table: 'A-1'

- id: ppm-reset
  section: programming-model
  title: PPM_RESET execution and polling completion
  claim: >-
    PPM_RESET (0x01, Data Length = 0x00, bits 63:16 reserved 0; Table 6-1) resets the PPM and may
    be sent by the OPM at any time; if the OPM wants to reset the connectors on the PPM, it must
    perform a CONNECTOR_RESET on each individual connector before sending PPM_RESET. On receiving
    PPM_RESET, the PPM disables all notifications, transitions to the "PPM Idle (Notifications
    Disabled)" state, resets itself, and sets CCI Reset Completed Indicator (bit 27) to 1 with all
    other CCI fields set to 0 (Table 6-2). The OPM polls CCI to detect when PPM_RESET completes
    (within the 200 ms PPM RESET timeout in Table 7-2) and does not acknowledge it with ACK_CC_CI;
    the PPM clears Reset Completed Indicator on receiving the next command (not PPM_RESET) from the
    OPM.
