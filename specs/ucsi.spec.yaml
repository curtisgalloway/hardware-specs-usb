    direction it sets Incompatible Connector Partner. SET_PDOS (0x1D, Table 6-75) overwrites Source
    (bit 26 = 1) or Sink (bit 26 = 0) PDOs from MESSAGE_OUT (Table 6-76; Connector Number = 0
