- id: get-capability
  section: programming-model
  title: GET_CAPABILITY response structure, bmAttributes and bmOptionalFeatures
  claim: >-
    GET_CAPABILITY (0x06, Data Length = 0x00, bits 63:16 reserved 0; Table 6-11) returns CCI Data
    Length = 0x10 (16 bytes) on success (0x00 on failure; Table 6-12) and populates MESSAGE IN
    (Table 6-13): bmAttributes at bits 31:0 (Table 6-14: bit 0 Disabled State Support, bit 1
    Battery Charging, bit 2 USB Power Delivery, bits 5:3 reserved 0, bit 6 USB Type-C Current, bit
    7 reserved 0, bits 15:8 bmPowerSource where at least one of bit 8 AC Supply, bit 10 Other or
    bit 14 Uses VBUS must be set and bits 9, 13:11 and 15 are reserved 0, bits 31:16 reserved 0);
    bNumConnectors at bits 38:32 (7 bits, number of connectors the PPM supports; 0 is illegal); bit
    39 reserved 0; bmOptionalFeatures at bits 63:40 (24 bits, Table 6-91: bit 0 SET_CCOM supported,
    bit 1 SET_POWER_LEVEL supported which is always set to supported for backward compatibility,
