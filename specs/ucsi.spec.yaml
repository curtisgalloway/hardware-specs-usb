- id: command-codes-and-applicability
  section: programming-model
  title: Command codes and OPM/PPM/LPM applicability
  claim: >-
    CONTROL bits 7:0 encode the command (Table A-1): 0x00 RESERVED, 0x01 PPM_RESET, 0x02 CANCEL,
    0x03 CONNECTOR_RESET, 0x04 ACK_CC_CI, 0x05 SET_NOTIFICATION_ENABLE, 0x06 GET_CAPABILITY, 0x07
    GET_CONNECTOR_CAPABILITY, 0x08 SET_CCOM, 0x09 SET_UOR, 0x0A SET_PDM (obsolete), 0x0B SET_PDR,
    0x0C GET_ALTERNATE_MODES, 0x0D GET_CAM_SUPPORTED, 0x0E GET_CURRENT_CAM, 0x0F SET_NEW_CAM, 0x10
    GET_PDOS, 0x11 GET_CABLE_PROPERTY, 0x12 GET_CONNECTOR_STATUS, 0x13 GET_ERROR_STATUS, 0x14
    SET_POWER_LEVEL, 0x15 GET_PD_MESSAGE, 0x16 GET_ATTENTION_VDO, 0x17 Reserved, 0x18 GET_CAM_CS,
    0x19 LPM_FW_UPDATE_REQUEST, 0x1A SECURITY_REQUEST, 0x1B SET_RETIMER_MODE, 0x1C SET_SINK_PATH,
    0x1D SET_PDOS, 0x1E READ_POWER_LEVEL, 0x1F CHUNKING_SUPPORT, 0x20 VENDOR DEFINED COMMANDs, 0x21
    SET_USB, 0x22 GET_LPM_PPM_INFO and 0x23 SET_CAM_PRIORITY. In the Command Applicability Table
    (Table 6-90), CANCEL, GET_CONNECTOR_STATUS, GET_ERROR_STATUS, SET_POWER_LEVEL and
    GET_LPM_PPM_INFO are normative (N) across OPM, PPM and LPM; PPM_RESET is normative for the PPM,
    conditional normative for the OPM (not applicable if the system has no PPM or the PPM works in
    pass-through mode) and not supported (NS) by an LPM (even if the LPM controls two connectors
    and performs the PPM role); ACK_CC_CI, SET_NOTIFICATION_ENABLE and GET_CAPABILITY are normative
    for the PPM (with ACK_CC_CI and GET_CAPABILITY conditional normative on the LPM in pass-through
    or OPM-LPM configurations, and SET_NOTIFICATION_ENABLE normative on the LPM and optional on the
    OPM); and CONNECTOR_RESET, GET_CONNECTOR_CAPABILITY, SET_UOR, SET_PDR, GET_PDOS, SET_PDOS and
    READ_POWER_LEVEL are normative for the OPM and LPM (NA for the PPM).
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - pages: ['97', '99']
      section: '6.6'
      table: '6-90'
    - page: '109'
      table: 'A-1'
  todo:
    check: document
    text: >-
      Per-column OPM/PPM/LPM applicability entries and footnote rules for the remaining commands
      (SET_CCOM, the Alternate Mode commands, SET_USB, GET_CABLE_PROPERTY, GET_PD_MESSAGE,
      GET_ATTENTION_VDO, LPM_FW_UPDATE_REQUEST, SECURITY_REQUEST, SET_RETIMER_MODE, SET_SINK_PATH,
      CHUNKING_SUPPORT and VENDOR DEFINED COMMANDs) in Table 6-90 (pp. 98-99) are not extracted in
      full.

- id: ppm-initialization-flow
  section: programming-model
  title: PPM initialization state and startup command sequence
  claim: >-
    The PPM functions without OS interaction and, upon completing internal initialization or a
    PPM_RESET, enters the "PPM Idle (Notifications Disabled)" state. In this state the PPM does not
    notify the OPM, and the only commands the PPM is required to process are
    SET_NOTIFICATION_ENABLE and PPM_RESET; successful completion of SET_NOTIFICATION_ENABLE
    transitions the PPM to "PPM Idle (Notifications Enabled)". Because not all notifications are
    required to be supported by the PPM, the OPM first enables only the Command Completed
    notification (or chooses to enable only the notifications UCSI requires the PPM to support),
    sends GET_CAPABILITY to discover the number of connectors (bNumConnectors) and the
    notifications/features supported by the PPM, and then sends SET_NOTIFICATION_ENABLE to enable
    the desired supported notifications, followed by GET_CONNECTOR_CAPABILITY (and, when Alternate
    Modes or cable details are supported, GET_ALTERNATE_MODES, GET_CAM_SUPPORTED,
    GET_CABLE_PROPERTY, GET_CURRENT_CAM and SET_NEW_CAM as needed) for each connector.
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - pages: ['23', '24']
      section: '6'
    - page: '25'
      section: '6.1'
      figure: '6-1'
    - page: '28'
      section: '6.3'

- id: command-serialization-and-busy-cancel
  section: programming-model
  title: One-command-at-a-time rule, Busy responses and CANCEL
  claim: >-
    The OPM sends no more than one command at a time to the PPM and waits until the PPM completes
    the current command before sending the next; the only exceptions are PPM_RESET (which may be
    sent at any time) and CANCEL (which may be sent only to cancel an outstanding command for which
    the OPM previously received a CCI Busy Indicator response). If a command (neither CANCEL nor
    PPM_RESET) takes longer than Tlpm max to complete, or the LPM/PPM is busy, the LPM/PPM sets the
    CCI Busy Indicator (bit 28) to 1 with all other CCI bits 0 and notifies the OPM (if Command
    Completed notification is enabled) between MIN_TIME_TO_RESPOND_WITH_BUSY (0xBE = 190 ms) and
    Tlpm max. Upon receiving Busy Indicator = 1, the OPM may reset its timer and continue waiting
    (the OPM resets its timer when it sends ACK_CC_CI + Tppm_ack, while the PPM/LPM resets its
    timer upon receiving the last bit of ACK_CC_CI), send CANCEL (0x02, Data Length = 0x00, bits
    63:16 reserved 0; Table 6-3), or reset the PPM/LPM. On receiving CANCEL, if the LPM/PPM is not
    currently processing a command (or has already completed it) it drops the CANCEL request;
    otherwise it cancels the current operation, completes CANCEL by setting both Cancel Completed
    Indicator (bit 26) and Command Completed Indicator (bit 31) to 1 in CCI (with Connector Change
    Indicator set if an asynchronous connector event occurred; Table 6-4), and notifies the OPM if
    Command Completed notification is enabled.
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - pages: ['23', '24']
      section: '6'
    - pages: ['30', '31']
      section: '6.5.2'
      table: '6-3'
    - pages: ['30', '31']
      section: '6.5.2'
      table: '6-4'
    - page: '109'
      table: 'A-1'
    - page: '110'
      table: 'A-2'

- id: ack-cc-ci-and-notifications
  section: programming-model
  title: ACK_CC_CI synchronization and Connector Change notification rules
  claim: >-
    ACK_CC_CI (0x04, Data Length = 0x00, bits 63:18 reserved 0; Table 6-7) acknowledges to the
    PPM/LPM that the OPM received and processed a Command Completion, a Connector Change
    Indication, or both: bit 16 is Connector Change Acknowledge (set to 1 to acknowledge the
    connector change reported in CCI), and bit 17 is Command Completed Acknowledge (set to 1 to
    acknowledge that a command completed). On completing ACK_CC_CI, the PPM/LPM sets CCI
    Acknowledge Command Indicator (bit 29) to 1 and Command Completed Indicator (bit 31) to 0
    (Table 6-8), and automatically resets bit 29 on receiving the next command from the OPM. The
    LPM/PPM sends no more than one Connection Change notification at a time to the OPM and waits
    until the OPM acknowledges the asynchronous notification before sending the next. The LPM/PPM
    does not set Connector Change Indicator if the change on the connector occurred as a direct
    result of a command sent to that connector, unless the LPM/PPM requires more time to process
    the command. In Section 6, notifications are not acknowledged by the OPM in two cases: the
    command completion notification for ACK_CC_CI or PPM_RESET, and when a Control command is
    followed by MESSAGE IN (Section 6.5.4 also notes that setting Command Completed Acknowledge is
    not required for connector changes that require reading MESSAGE IN, such as port-partner LPM FW
    Update Request and Security Request commands).
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - pages: ['17', '19']
      section: '4.2'
      table: '4-3'
    - pages: ['23', '24']
