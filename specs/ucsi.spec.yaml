- id: get-connector-capability
  section: programming-model
  title: GET_CONNECTOR_CAPABILITY command and response fields
  claim: >-
    GET_CONNECTOR_CAPABILITY (0x07, Data Length = 0x00, Connector Number in bits 22:16 where 0 is
    illegal, bits 63:23 reserved 0; Table 6-15) returns CCI Data Length = 0x04 on success (0x00 on
    failure; Table 6-16) and populates MESSAGE IN (Table 6-17, which defines bits 0 to 63 with bits
    63:40 reserved 0): Operation Mode at bits 7:0 (bit 0 Rp only, bit 1 Rd only, bit 2 DRP
    (Rp/Rd), bit 3 Analog Audio Accessory Mode (Ra/Ra), bit 4 Debug Accessory Mode (Rd/Rd), bit 5
    USB2, bit 6 USB3, bit 7 Alternate Mode); Provider at bit 8 (valid only when Operation Mode is
    DRP or Rp only; 1 if capable of providing power via PD, Type-C Current or BC 1.2); Consumer at
    bit 9 (valid only when Operation Mode is DRP or Rd only; 1 if capable of consuming power); Swap
    to DFP at bit 10 and Swap to UFP at bit 11 (both valid only when Operation Mode is DRP, Rp only
    or Rd only); Swap to SRC at bit 12 and Swap to SNK at bit 13 (both valid only when Operation
