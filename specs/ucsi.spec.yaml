- id: ppm-reset-no-notification-no-ack
  section: gotchas
  title: PPM_RESET disables notifications, sets Reset Completed Indicator (not Command Completed) and never takes ACK_CC_CI
  claim: >-
    Unlike normal commands, PPM_RESET disables all notifications and puts the PPM into the "PPM
    Idle (Notifications Disabled)" state, so the PPM sets CCI Reset Completed Indicator (bit 27) to
    1 with Command Completed Indicator (bit 31) and all other CCI bits set to 0, without sending a
    notification to the OPM. The OPM must poll CCI for Reset Completed Indicator == 1 and must not
    send ACK_CC_CI after PPM_RESET; the PPM clears Reset Completed Indicator automatically when it
    receives the next non-PPM_RESET command from the OPM.
