  claim: >-
    When the PPM/LPM completes ACK_CC_CI, it sets CCI Acknowledge Command Indicator (bit 29) to 1
    and leaves Command Completed Indicator (bit 31) set to 0 (Table 6-8). An OPM driver must wait
    for Acknowledge Command Indicator == 1 rather than Command Completed Indicator == 1, and must
    not send another ACK_CC_CI to acknowledge the ACK_CC_CI completion notification; the PPM
    automatically resets bit 29 when it receives the next command from the OPM.
