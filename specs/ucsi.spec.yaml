  section: programming-model
  title: PDO discovery, configuration and power controls (GET_PDOS, SET_PDOS, SET_POWER_LEVEL, SET_SINK_PATH, READ_POWER_LEVEL)
  claim: >-
    GET_PDOS (0x10, Table 6-35) retrieves up to four 32-bit PDOs in MESSAGE IN (Table 6-37, CCI
