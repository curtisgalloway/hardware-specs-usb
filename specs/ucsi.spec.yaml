- id: role-swap-commands-set-uor-and-set-pdr
  section: programming-model
  title: Data and power role control (SET_UOR and SET_PDR)
  claim: >-
    SET_UOR (0x09, Data Length = 0, Connector Number in bits 22:16 where 0 is illegal, USB
    Operation Role in bits 25:23, Data Role Swap Policy in bits 27:26, bits 63:28 reserved 0; Table
    6-20) and SET_PDR (0x0B, Data Length = 0, Connector Number in bits 22:16 where 0 is illegal,
    Power Direction Role in bits 25:23, bits 63:26 reserved 0; Table 6-22) set the USB operation
    role and power direction role for the current connection, and their values reset when the PPM
    is reset, power cycled, or the remote device detaches. Both require an active connection and
    USB PD support (SET_UOR is valid only if the connector supports PD and fails if there is no
    active connection or the requested role is unsupported; SET_PDR fails if there is no active
    connection, the port partner is not PD-capable, or the requested role is unsupported). If the
    connector is already in the requested role, the command completes successfully; if executing
    the command results in a successful data or power role swap, it should not generate a connector
    status change notification, whereas if the swap fails (for example Port Partner rejected Swap,
    Hard Reset occurred, or PPM Policy Conflict) the command returns an error and the role remains
    unchanged. In SET_UOR, USB Operation Role bit 0 initiates a swap to DFP if not already DFP, bit
    1 initiates a swap to UFP if not already UFP (setting or clearing Bit 0 and Bit 1 at the same
    time is illegal), and bit 2 controls whether the connector accepts role swap requests from the
    port partner based on Data Role Swap Policy (0 accept all, 1 only accept swaps to DFP, 2 only
    accept swaps to UFP, 3 reserved; ignored if bit 2 is not set). In SET_PDR, Power Direction Role
    bit 0 initiates a swap to Source if not already Source, bit 1 initiates a swap to Sink if not
    already Sink, and bit 2 accepts (1) or rejects (0) power swap requests from the port partner
    (default before SET_PDR is to accept power swaps; setting all three bits to 0 is illegal).
