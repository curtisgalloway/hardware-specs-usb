- id: connector-reset-and-set-ccom
  section: programming-model
  title: CONNECTOR_RESET (Hard Reset vs Data Reset) and SET_CCOM
  claim: >-
    CONNECTOR_RESET (0x03, Data Length = 0x00, Connector Number in bits 22:16, Reset Type in bit
    23: 0 Hard Reset (default) or 1 Data Reset, bits 63:24 reserved 0; Table 6-5) resets the
    specified connector: the PPM sends a command completion once it starts the Reset process and an
    asynchronous notification after the Reset process completes on the connector. A Hard Reset puts
    the connector through a disconnect-connect sequence; if a USB Type-C charger is connected to
    the connector being reset and there is no other power source (e.g. a dead battery condition),
    the PPM must fail CONNECTOR_RESET, and the OPM can identify the cause via bit 5 of
    GET_ERROR_STATUS. A Data Reset resets the USB data connection and exits all Alternate Modes
    with a port partner while preserving VBUS power (following the USB PD Data_Reset message): a
    port that supports USB4 must support Data Reset, whereas a port that does not support USB4 may
    set CCI Not Supported Indicator (bit 25) to 1; on success the PPM/LPM sets Command Completed
    Indicator within tSenderResponse + tDataReset + LPM_BUSY_ATOMIC_TIME (LPM_BUSY_ATOMIC_TIME
    minimum 0xF0 = 240 ms; Table A-2), or else sets Error Indicator. SET_CCOM (0x08, Data Length =
    0, Connector Number in bits 22:16 where 0 is illegal, CC Operation Mode in bits 26:23: bit 0 Rp
    Only, bit 1 Rd Only, bit 2 DRP, bit 3 Disabled removing all CC terminations for at least
    tErrorRecovery when transitioning from Attached.SNK; setting all four bits to 0 is illegal;
    bits 63:27 reserved 0; Table 6-18) changes the connector's USB Type-C state machine mode and
    resets when the PPM is reset (defaulting to DRP if supported). If the LPM does not support the
    requested role it returns Not Supported, except for Disable: if the LPM does not support
    Disable, it directs the port to Unattached.SNK or Unattached.SRC.
  support:
