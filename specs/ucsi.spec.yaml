orientation: >-
  Terms: the OPM (OS Policy Manager) is the operating system software driver that interfaces with
  the PPM (Platform Policy Manager), the combination of hardware, firmware and any vendor-provided
  OS software that manages all USB Type-C connectors on the platform. An LPM (Local Policy Manager)
  manages an individual USB Type-C connector. CCI is the 32-bit USB Type-C Command Status and
  Connector Change Indication structure; CONTROL is the 64-bit command structure written by the
  OPM; MESSAGE IN and MESSAGE OUT are the 255-byte payload buffers. This spec records the generic
  UCSI register layout, operational state machine and command model; how a platform exposes the PPM
  (ACPI, I2C, SMBus, PCIe or shared memory) belongs in the board or SoC spec.
facts:
- id: interface-scope
  section: standards
  title: OPM, PPM and LPM roles and specification precedence
  claim: >-
    UCSI defines the registers and data structures used by the OS Policy Manager (OPM, the
    operating software component) to send commands to and retrieve capabilities and status from the
    Platform Policy Manager (PPM, the hardware, firmware and any vendor-provided OS software that
    manages all USB Type-C connectors on the platform), together with the physical layer and
    interface protocol between an OPM/PPM and each individual connector's Local Policy Manager
    (LPM). The specification does not define the bus or transport (such as PCIe, ACPI or I2C) a
    system manufacturer uses to expose the PPM (apart from the PCIe Add-In-Card DVSEC in Chapter
    8), nor the policy the OPM must implement, nor OPM/PPM behavior during system suspend and
    resume. Where UCSI conflicts with the USB Type-C or USB Power Delivery specifications, those
    specifications take precedence; within UCSI itself, tables take precedence over figures, and
    figures over text. Multi-byte fields are transferred and interpreted in little-endian order
    (LSB to MSB) unless otherwise specified, and reserved bits, bytes, words, fields and code
    values must be set to zero (or not sent) by the sender and ignored by the receiver.
  support:
  - class: standard
    doc: usb-ucsi-3.1.pdf
    at:
    - page: '11'
      section: '1.1'
    - page: '11'
      section: '1.2'
