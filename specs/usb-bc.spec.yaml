    != RID_FLOAT for TDCD_DBNC)—because DCD cannot pull D+ low when attached to an ACA-Dock, a DCP
    with excessive leakage current, an ACA with a charger and a Full-Speed or High-Speed B-device
    on its Accessory Port, a PS/2 port that pulls D+ high, or a proprietary charger that pulls D+
