- id: primary-detection
  section: programming-model
  title: Primary Detection (sourcing `VDP_SRC` on D+ and comparing D- to `VDAT_REF`)
  claim: >-
    Primary Detection is mandatory for every PD and distinguishes an SDP from a Charging Port. The
    PD enables VDP_SRC (0.5 V to 0.7 V; able to source at least 250 uA when D+ is between 0.5 V and
    0.7 V, and required not to pull D+ below 2.2 V when D+ is pulled to VDP_UP through RDP_UP) on
    D+ and IDM_SINK (25 to 175 uA; required to pull D- to VDAT_SINK of at most 0.15 V for source
    currents below IDM_SINK min, and not sink more than IDM_SINK max for D- voltages below VLGC
    max) on D-, keeps VDP_SRC enabled for TVDPSRC_ON (at least 40 ms), and compares the D- voltage
    against VDAT_REF (0.25 V to 0.4 V). On an SDP, RDM_DWN pulls D- below VDAT_REF, so with ID =
    RID_FLOAT the PD classifies the port as an SDP (limiting draw to ISUSP until enumerated). On a
    DCP (which shorts D+ to D- through RDCP_DAT of at most 200 Ohm) or a CDP (which drives VDM_SRC
    of 0.5 to 0.7 V on D-), D- rises above VDAT_REF, so with ID = RID_FLOAT the PD classifies the
    port as a DCP or CDP and may draw up to IDEV_CHG (1.5 A). When ID = RID_FLOAT, a PD may
    optionally also compare D- against VLGC (0.8 V to 2.0 V) and require VDAT_REF < D- < VLGC to
    classify a port as DCP/CDP (treating D- > VLGC as an SDP): this prevents drawing IDEV_CHG from
    a PS/2 port (which pulls D+ and D- high), at the expense of treating proprietary chargers that
    pull D+ and D- high as SDPs.
  support:
