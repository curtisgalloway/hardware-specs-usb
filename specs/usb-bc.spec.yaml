      tables are covered in other facts.

- id: data-contact-detect
  section: programming-model
  title: Data Contact Detect (DCD) current source (`IDP_SRC`), debounce (`TDCD_DBNC`) and timeout (`TDCD_TIMEOUT`)
  claim: >-
    Because USB power pins make contact before data pins during plug insertion (delays over 200 ms
    have been observed), running Primary Detection before data contact would cause a PD to
    misclassify a DCP as an SDP and limit itself to ISUSP while waiting for an enumeration that
    never arrives. Upon detecting VBUS above VOTG_SESS_VLD, every PD must start a DCD timer of
    TDCD_TIMEOUT (300 ms to 900 ms). Implementing the DCD current source IDP_SRC (7 to 13 uA on D+)
    is optional: a PD without DCD waits at least TDCD_TIMEOUT min (300 ms) after attach before
    starting Primary Detection. To run DCD, the PD enables IDP_SRC on D+ and enables either RDM_DWN
    (14.25 to 24.8 kOhm pull-down) or IDM_SINK (25 to 175 uA) on D-. While nothing is attached to
    D+, IDP_SRC is sized to hold D+ at VLGC_HI (2.0 to 3.6 V) against worst-case PD data-line
    leakage (modeled as RDAT_LKG of at least 300 kOhm to VDAT_LKG of 0 to 3.6 V); once the data
    pins make contact with an SDP or CDP, the upstream port's RDP_DWN (14.25 to 24.8 kOhm) pulls D+
    down to VLGC_LOW (0 to 0.8 V) against IDP_SRC and worst-case leakage. When D+ has remained at
    VLGC_LOW for TDCD_DBNC (at least 10 ms)—or when ID has been non-floating (ID != RID_FLOAT) for
    TDCD_DBNC on a PD supporting ACA Detection, or when TDCD_TIMEOUT expires first—the PD turns off
    IDP_SRC and the D- pull-down/sink and proceeds to Primary Detection (or directly to an ACA
    state if ID != RID_FLOAT for TDCD_DBNC).
  support:
  - class: standard
    doc: usb-bc-1.2.pdf
    at:
    - pages: ['20', '24']
      section: 3.2.3
    - pages: ['41', '42']
      section: 3.3.2
    - pages: ['43', '45']
      section: 3.4.1
    - pages: ['53', '54']
      section: 4.6.2
