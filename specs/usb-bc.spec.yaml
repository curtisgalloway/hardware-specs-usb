      this document and not extracted.

- id: current-limits-and-superspeed
  section: standards
  title: Current limits across port types and USB 3.0 SuperSpeed adjustments
  claim: >-
    When attached to an SDP, a PD is limited to suspend current ISUSP of at most 2.5 mA (averaged
    over 1 s) when unconnected or suspended (a compound PD may draw ISUSP plus an additional ISUSP
    for each downstream port while attached but not connected or during suspend), unit load current
    IUNIT of at most 100 mA (averaged over 250 ms) when unconfigured, and maximum configured
    current ICFG_MAX of at most 500 mA when configured and not suspended. USB 3.0 SuperSpeed ports
    may implement BC 1.2 charger detection; when a PD detects that it is attached to a SuperSpeed
    port, IUNIT increases to 150 mA (averaged over 250 ms) and ICFG_MAX increases to 900 mA. The
    Rated Current (current a Charging Port can output while keeping VBUS within VCHG) is ICDP of
    1.5 A minimum to 5.0 A maximum for a CDP or ACA-Dock, and IDCP of 0.5 A minimum to 5.0 A
    maximum for a DCP; the 5.0 A maximum on ICDP and IDCP is a USB 2.0 section 7.2.1.2.1 safety
    limit, and the output current of a Charging Port must not exceed ICDP max (5.0 A) under any
    condition. A PD must not draw more than IDEV_CHG max (1.5 A) from a Charging Port; on a CDP it
    may draw up to IDEV_CHG (1.5 A) during High-Speed chirp and traffic as well as Low- and
    Full-Speed operation, provided any PD drawing more than ICFG_MAX from a CDP and any host port
    granting the CDP handshake support LS, FS, HS and chirp signaling with a local-to-remote ground
    offset up to VGND_OFFSET max (375 mV, expanding the USB 2.0 common-mode range).
  support:
