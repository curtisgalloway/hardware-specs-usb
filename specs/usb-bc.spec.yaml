- id: pd-aca-state-machine
  section: programming-model
  title: Portable Device 7-state machine for OTG, ACA and ACA-Dock operation
  claim: >-
    A PD that supports ACA Detection tracks VBUS, ID resistance and D- across seven states (Figure
    6-4): State 1 (!Chg & !Acc, !VBUS, RID_FLOAT) when unattached or attached to a partner that
    neither drives VBUS nor pulls ID low; State 2 (Chg & Dock, VBUS, RID_A, VDM_SRC on D-) when
    attached to a powered ACA-Dock, returning to State 1 if detached or if the ACA-Dock removes
    VBUS; State 3 (!Chg & A, VBUS, RID_FLOAT) when attached directly to an A-device (SDP, CDP or
    DCP) or to a Micro ACA with a powered A-device on its Accessory Port and no charger on its
    Charger Port, drawing current from the A-device (up to IDEV_CHG if it is a CDP or DCP); State 4
    (Chg & A, VBUS, RID_C) when attached to a Micro ACA with a Charging Port on its Charger Port
    and a powered A-device on its Accessory Port (PD acts as B-device, may connect, must not do
    SRP, and charges from the Charger Port); State 5 (Chg & !Acc, VBUS, RID_B) when attached to a
    Micro ACA with a Charging Port on its Charger Port and nothing or an unpowered A-device on its
    Accessory Port (PD acts as B-device, must not connect, may initiate SRP, and charges from the
    Charger Port); State 6 (Chg & B, VBUS, RID_A without VDM_SRC) when attached to a Micro ACA with
    a Charging Port and a B-device on its Accessory Port, or a Standard ACA with a Charging Port
    (PD acts as A-device/host while drawing power from VBUS, limiting its draw so VBUS_OTG stays
    above VACA_OPR min of 4.1 V); and State 7 (!Chg & B, !VBUS from partner, RID_GND) when attached
    directly to a B-device or to an ACA with no Charging Port and a B-device (or a Standard ACA
    with no Charging Port). State 7 is the only state in which the PD is required to output power
    on VBUS; in States 2 through 6 the PD draws power from VBUS.
