- id: cdp-detection-signaling-and-timing
  section: programming-model
  title: Charging Downstream Port (CDP) detection signaling modes and timing
  claim: >-
    A CDP has a Standard-A receptacle and must never output VDM_SRC on D- from the time a
    peripheral connects until the peripheral disconnects. While no peripheral is connected, a CDP
    must operate in one of two modes: (1) always-on while disconnected, in which the CDP enables
    VDM_SRC (0.5 to 0.7 V) on D- within TCP_VDM_EN (at most 200 ms) of a disconnect and disables
    VDM_SRC within TCP_VDM_DIS (at most 10 ms) of a connect, without needing to enable IDP_SINK or
    compare D+ to VDAT_REF; or (2) D+-gated during Primary Detection, in which the CDP compares D+
    against VDAT_REF (0.25 to 0.4 V) and VLGC (0.8 to 2.0 V) (with IDP_SINK enabled on D+), enables
    VDM_SRC on D- within TVDMSRC_EN (at most 20 ms) when D+ rises into the range VDAT_REF < D+ <
    VLGC, disables VDM_SRC within TVDMSRC_DIS (at most 20 ms) when D+ falls below VDAT_REF or rises
    above VLGC (and within TCP_VDM_DIS = 10 ms max on connect), and disables IDP_SINK within
    TCON_IDPSNK_DIS (at most 10 ms) of detecting that the PD has connected. Comparing D+ against
