- id: vbus-detect-and-comparator-thresholds
  section: programming-model
  title: VBUS session-valid detection (`VOTG_SESS_VLD`), internal comparator thresholds and connect time
  claim: >-
    Each PD must have a session-valid comparator that detects when VBUS exceeds its internal
    session-valid threshold, which must lie within VOTG_SESS_VLD (0.8 V to 4.0 V). Likewise, a PD's
    internal comparator thresholds for data detection and logic levels must lie within VDAT_REF
    (0.25 V to 0.4 V) and VLGC (0.8 V to 2.0 V, separating VLGC_LOW of 0 to 0.8 V from VLGC_HI of
    2.0 to 3.6 V); in the detection algorithms the PD compares VBUS, D+ and D- against its own
    internal thresholds rather than against the minimum or maximum limits of VOTG_SESS_VLD,
    VDAT_REF or VLGC. A powered-up peripheral must connect to a USB host within TSVLD_CON_PWD (at
    most 1 s) of detecting VBUS above VOTG_SESS_VLD (and a PD attached to a DCP must enable VDP_SRC
    or pull D+ high through RDP_UP within TSVLD_CON_PWD of attach), whereas a PD with a Weak
    Battery reaching the end of the Good Battery Algorithm may delay for up to TSVLD_CON_WKB (at
    most 45 min) before connecting or applying a bus reset on every exit except the direct DCP/CDP
    connect branch.
  support:
  - class: standard
    doc: usb-bc-1.2.pdf
    at:
