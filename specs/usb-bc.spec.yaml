- id: attach-versus-connect-and-battery-thresholds
  section: standards
  title: Attach versus connect and Dead, Weak and Good Battery thresholds
  claim: >-
    A downstream device is attached to an upstream port when a physical cable joins them; it is
    connected when it is attached and has pulled either D+ or D- high through a 1.5 kOhm resistor
    (RDP_UP, 900 to 1575 Ohm to VDP_UP, 3.0 to 3.6 V) to enter Low-Speed, Full-Speed or High-Speed
    signaling. The Dead Battery Threshold is the maximum battery charge level below which a device
    is assured of not being able to power up successfully; the Weak Battery Threshold is the
    minimum battery charge level above which a device is assured of being able to power up
    successfully. A Dead Battery is below the Dead Battery Threshold, a Weak Battery is above the
    Dead Battery Threshold and below the Weak Battery Threshold (and may or may not be able to
    power up the device successfully), and a Good Battery is above the Weak Battery Threshold. A PD
    with a Dead Battery cannot distinguish a PC from an OTG A-device and treats both the same; an
    OTG A-device is under no obligation to supply more current than it normally would to a device
    on its Targeted Peripheral List (TPL) and may stop driving VBUS after TA_WAIT_BCON (defined in
    the OTG 2.0 Supplement) if the B-device does not connect.
  support:
  - class: standard
    doc: usb-bc-1.2.pdf
    at:
    - pages: ['13', '15']
      section: '1.4'
    - page: '15'
      section: '1.6'
    - page: '55'
      table: '5-1'
    - page: '57'
      table: '5-3'
  todo:
