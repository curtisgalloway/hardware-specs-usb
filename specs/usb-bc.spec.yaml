- id: weak-battery-detection-algorithm
  section: programming-model
  title: Weak Battery charger detection algorithm
  claim: >-
    A PD with a Weak Battery may implement the optional Weak Battery Algorithm (Figure 3-14), any
    other algorithm that complies with the Dead Battery Provision (DBP), or the Good Battery
    Algorithm subject to DBP rules. In the Weak Battery Algorithm, once VBUS exceeds VOTG_SESS_VLD,
    the PD drives D+ to VDP_SRC, starts a timer for TSVLD_CON_WKB (45 min max; required under DBP
    to enable VDP_SRC within TDBP_ATT_VDPSRC of at most 1 s of attach), and checks whether D- >
    VDAT_REF (optionally also requiring D- < VLGC to avoid charging from PS/2 ports and some
    proprietary chargers) or, if ACA Detection is supported, ID != RID_FLOAT. If that condition
    holds, the PD classifies the port as a Charging Port and may draw up to IDEV_CHG (1.5 A;
    labeled IDCP in Figure 3-14 and IDEV_CHG in section 3.3.1's text). Otherwise it treats the port
    as an SDP and draws up to IUNIT (100 mA, or 150 mA on SuperSpeed) while waiting to become ready
    to connect: if it becomes ready to connect before TSVLD_CON_WKB expires, it transitions to the
    Good Battery Algorithm; if TSVLD_CON_WKB expires first, it must reduce its current draw to
    ISUSP (2.5 mA max).
