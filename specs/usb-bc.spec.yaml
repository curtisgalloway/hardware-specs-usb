      Only VDP_SRC from Table 5-1 (p. 55), IUNIT and ISUSP from Table 5-2 (p. 56), and
      TDBP_ATT_VDPSRC, TDBP_VDPSRC_CON and TSVLD_CON_WKB from Table 5-5 (p. 59) are cited here;
      other rows of those tables are covered in other facts.

- id: dead-battery-provision-configured
  section: programming-model
  title: Dead Battery Provision — Configured Clause (after SetConfiguration)
  claim: >-
    Under the DBP Configured Clause, a PD with a Dead or Weak Battery that has been configured by
    an SDP may draw its configured current (up to ICFG_MAX: 500 mA on USB 2.0, 900 mA on SuperSpeed)
    without having to pass USBCV compliance tests, provided it meets seven requirements: (1) it
    responds to any USB tokens addressed to it with a NAK or any other valid USB response; (2) upon
    receiving a USB reset, it reduces its current to IUNIT (or disconnects, in which case it may
    use the DBP Unconfigured Clause); (3) upon receiving a USB suspend, it either remains connected
    and reduces its current to ISUSP, or disconnects (and while disconnected may use the DBP
    Unconfigured Clause); (4) after TDBP_FUL_FNCTN (at most 15 min) from attach, it either remains
    connected and able to pass USBCV, or disconnects (and while disconnected may use the DBP
    Unconfigured Clause); (5) it uses the current to reach the Weak Battery Threshold and provide
    full USB functionality as soon as possible, without performing unrelated tasks (charging beyond
    the Weak Battery Threshold, making a phone call, playing a song, video or game, or establishing
    a wireless connection); (6) it provides full USB functionality immediately upon reaching the
    Weak Battery Threshold if that occurs before TDBP_FUL_FNCTN after attach; and (7) it informs
    the user within TDBP_INFORM (at most 1 min) of attach that it is charging and not available for
    other functions.
  support:
  - class: standard
    doc: usb-bc-1.2.pdf
    at:
    - pages: ['16', '17']
      section: '2.3'
    - page: '56'
      table: '5-2'
    - page: '59'
      table: '5-5'
  todo:
