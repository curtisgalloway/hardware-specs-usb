- id: charging-port-voltage-and-operating-ranges
  section: standards
  title: Charging Port output voltage, operating ranges, undershoot, overshoot and shutdown
  claim: >-
    A Charging Port's normal output voltage VCHG is 4.75 V to 5.25 V, averaged over TVBUS_AVG (at
    most 250 ms). Across all Charging Ports (CDP, ACA-Dock, DCP and ACA): the output voltage must
    never exceed VCHG_OVRSHT (6.0 V max) for any load-current step or when powering on or off; must
    remain within VCHG_FAIL (-0.3 V to 9.0 V) under any single-point failure; in a multi-port
    device each Charging Port must stay within its Required Operating Range regardless of the other
    ports; and when a PD's current draw drives a Charging Port outside its Required Operating
    Range, any form of shutdown is allowed (including turning off VBUS, constant-current limiting
    or foldback current limiting). A CDP and an ACA-Dock share the same Required Operating Range
    and undershoot rules: they must output VCHG (4.75 to 5.25 V) for all currents below ICDP min
    (1.5 A), may shut down for load currents above ICDP min, and must keep output voltage at or
    above VCHG_UNDSHT (4.1 V min) for any step change in load current below ICDP min; if a CDP
    shuts down on a current overload, it must recover and output VCHG within TSHTDWN_REC (at most
    2 min) after the overload is removed. A DCP must output VCHG for all currents below IDCP min
    (0.5 A), must not shut down when load current is below IDEV_CHG (1.5 A) and load voltage is
    above VDCP_SHTDWN (2.0 V max), and may shut down for load currents above IDEV_CHG max (1.5 A)
    or load voltages below VDCP_SHTDWN (2.0 V max). For DCP load steps from IDCP_LOW (at most
    30 mA) to IDCP_MID (30 to 100 mA) or from IDCP_MID to IDCP_HI (at least 100 mA, occurring at
    least TDCP_LD_STP = 20 ms min after the low-to-mid transition), DCP output voltage must stay at
    or above VCHG_UNDSHT (4.1 V min) for an undershoot duration of TDCP_UNDSHT (at most 10 ms); for
    a direct step from IDCP_LOW to IDCP_HI, a DCP's output voltage may drop to the attached PD's
    load voltage for TDCP_UNDSHT (at most 10 ms) and must then be at VCHG for load currents below
    IDCP min. A PD must not draw more than IDEV_CHG max (1.5 A) from a Charging Port, must not pull
    a Charging Port's output voltage below VDCP_SHTDWN max (2.0 V), and when drawing power through
    an ACA must limit its current so VBUS_OTG remains above VACA_OPR min (4.1 V; VACA_OPR is 4.1 to
    6.0 V).
