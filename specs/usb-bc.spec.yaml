orientation: >-
  Terms: a Portable Device (PD) is a USB 2.0-compliant device that can draw charging current from
  USB. A Downstream Port is either a Standard Downstream Port (SDP, a normal USB 2.0 host or hub
  port) or a Charging Downstream Port (CDP, a host or hub port that also supports the BC 1.2
  handshake and higher current). A Dedicated Charging Port (DCP) supplies power through a USB
  connector without enumerating a device and shorts D+ to D-. An Accessory Charger Adapter (ACA, in
  Micro ACA and Standard ACA forms) and an ACA-Dock supply charging power while the PD acts as host
  or peripheral via the Micro-AB ID pin. A Charging Port is a DCP, CDP, ACA-Dock or ACA. This spec
  records the BC 1.2 port types, voltage and current limits, the Dead Battery Provision (DBP), the
  PD charger detection sequence (VBUS Detect, Data Contact Detect, Primary Detection, Secondary
  Detection, ACA Detection), CDP and DCP port behavior, and renegotiation rules. How a particular SoC
  or PMIC exposes BC 1.2 detection registers belongs in that chip's spec.
facts:
- id: port-types
  section: standards
  title: Downstream Port and Charging Port types (SDP, CDP, DCP, ACA-Dock and ACA)
  claim: >-
    BC 1.2 groups ports into Standard Downstream Ports (SDPs) and Charging Ports. A Downstream Port
    is an SDP or a Charging Downstream Port (CDP). An SDP complies with the USB 2.0 host or hub
    definition, pulls D+ and D- to ground through two 15 kOhm (typical) resistors (RDP_DWN and
    RDM_DWN, each 14.25 to 24.8 kOhm), can enumerate a connected downstream device, and requires a
    connected PD (with a Good Battery) to draw less than 2.5 mA average (ISUSP) when unconnected or
    suspended, up to 100 mA (IUNIT) when connected, unconfigured and not suspended, and up to
    500 mA (ICFG_MAX) when configured for 500 mA and not suspended. A Charging Port is a DCP, CDP,
    ACA-Dock or ACA; a PD attached to any Charging Port may draw up to IDEV_CHG (1.5 A) without
    having to be configured or follow USB suspend rules. A CDP is a USB 2.0-compliant host or hub
    downstream port that also supports the CDP detection handshake and current (ICDP). A DCP (used
    in a USB Charger such as a wall or car adapter) outputs power (IDCP at an average voltage of
    VCHG) through a USB connector, cannot enumerate a downstream device, and shorts D+ to D-. An
    ACA-Dock is a docking station with one upstream port (a captive Micro-A plug capable of
    sourcing ICDP to a PD) and zero or more downstream ports. An ACA is an adapter with an OTG Port
    (captive cable terminating in a Micro-A plug), an Accessory Port (Micro-AB receptacle on a
    Micro ACA, Standard-A receptacle on a Standard ACA) and a Charger Port (labeled "Charger Only",
    supporting power from a Charging Port but no USB data communication), allowing a single OTG port
    to attach to a charger and another device at the same time.
  support:
  - class: standard
    doc: usb-bc-1.2.pdf
    at:
