- id: repeat-detection-requires-cdp-recovery-wait
  section: gotchas
  title: Repeating charger detection without waiting `TCP_VDM_EN` max or discharging VBUS can miss a CDP
  claim: >-
    A PD that disconnects and repeats charger detection while remaining attached must wait at least
    TCP_VDM_EN max (200 ms) between disconnecting and restarting charger detection; restarting
    sooner can catch a disconnect-gated CDP before it has re-enabled VDM_SRC on D- (which takes up
