- id: aca-charger-port-ground-offset-and-usb-reset
  section: gotchas
  title: An ACA must keep its Charger Switch closed across ground-offset dips on `DN_CHG` and CDP bus resets
  claim: >-
    When a Micro ACA or Standard ACA detects VBUS_CHG asserted on its Charger Port, it outputs
    VDP_SRC on DP_CHG and closes its Charger Switch if DN_CHG > VDAT_REF (because it does not check
    whether DN_CHG < VLGC, an ACA attached to a PS/2 port can draw more than ICFG_MAX from the PS/2
    port). Once the Charger Switch is closed, if the Charger Port is attached to a CDP, charging
    currents can drop the CDP ground below the ACA ground enough to pull DN_CHG below the ACA's
    VDAT_REF, or the CDP can issue a USB reset; the ACA must ignore both conditions and keep its
    Charger Switch closed for as long as VBUS_CHG remains above VOTG_SESS_VLD, re-checking DN_CHG >
    VDAT_REF only after VBUS_CHG drops below VOTG_SESS_VLD.
