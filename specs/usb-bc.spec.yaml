- id: dead-battery-provision-unconfigured
  section: programming-model
  title: Dead Battery Provision — Unconfigured Clause (before SetConfiguration)
  claim: >-
    Only devices that can operate stand-alone from internal battery power are allowed to use the
    Dead Battery Provision (DBP). Under the DBP Unconfigured Clause—which covers both the time a PD
    is attached and not connected and the time it is connected and not yet configured (until it
    receives a SET_CONFIGURATION command from the host)—a PD with a Dead or Weak Battery may draw
    up to IUNIT (100 mA max averaged over 250 ms, or 150 mA on a SuperSpeed port) from a Downstream
    Port, provided it meets four conditions: (1) while attached and not connected, it enables
    VDP_SRC (0.5 to 0.7 V) on D+ within TDBP_ATT_VDPSRC (at most 1 s) of attach and connects within
    TDBP_VDPSRC_CON (at most 1 s) of disabling VDP_SRC (PDs are required to drive D+ to VDP_SRC
    whenever they draw more than ISUSP while attached and not connected, allowing an SDP that
    senses VDP_SRC to manage its power states); (2) if the PD is not ready to connect and be
    enumerated within TSVLD_CON_WKB (at most 45 min) after attach, it reduces its current draw to
    ISUSP (2.5 mA max averaged over 1 s); (3) it uses the current to power up and enumerate, or
    reach the Weak Battery Threshold and enumerate, as soon as possible, and does not use DBP
    current for unrelated tasks (such as charging beyond the Weak Battery Threshold, making a phone
    call, playing a song, video or game, or establishing a wireless connection); and (4) it passes
    the USB-IF compliance inrush test.
  support:
  - class: standard
    doc: usb-bc-1.2.pdf
    at:
    - page: '14'
      section: 1.4.13
    - pages: ['15', '16']
      section: '2.2'
    - page: '55'
      table: '5-1'
    - page: '56'
      table: '5-2'
    - page: '59'
      table: '5-5'
  todo:
    check: document
