- id: detection-renegotiation-and-repeat
  section: programming-model
  title: Charger detection renegotiation via VBUS cycling and PD repeat detection
  claim: >-
    A downstream port is allowed to act as an SDP, CDP or DCP and change between those roles. To
    force an attached PD to repeat the charger detection procedure, the downstream port must stop
    driving VBUS, allow VBUS to fall below VBUS_LKG (0.7 V max), wait for at least TVBUS_REAPP
    (100 ms min) with VBUS below VBUS_LKG, and then start driving VBUS again. To detect this drop in
    VBUS, a PD must discharge its VBUS input below VBUS_LKG (0.7 V max) within TVLD_VLKG (at most
    500 ms from when VBUS is no longer driven) whenever VBUS is removed. A PD is also allowed to
    disconnect and repeat the charger detection process multiple times while remaining attached,
    provided it waits at least TCP_VDM_EN max (200 ms) between disconnecting and restarting the
    charger detection process.
