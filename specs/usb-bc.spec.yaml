- id: aca-and-aca-dock-id-detection
  section: programming-model
  title: ACA and ACA-Dock detection via ID pin resistances (`RID_A`, `RID_B`, `RID_C`, `RID_GND`, `RID_FLOAT`) and D-
  claim: >-
    ACA Detection is optional and supported only by PDs with a Micro-AB receptacle; a PD that
    supports ACA Detection must implement the Good Battery Algorithm and monitor the ID pin
    resistance throughout the entire time VBUS is above VOTG_SESS_VLD, accounting for ground-drop
    offsets across ROTG_ACA_GND (at most 100 mOhm between OTG ground and ACA ground when IDEV_CHG
    or ICFG_MAX flows) and up to IID_LKG_CONT (-1 to +1 uA) of ID pin contamination leakage. Five
    ID resistance ranges to ground (measured by the ACA when VBUS_CHG is at VACA_OPR of 4.1 to
    6.0 V for RID_A/B/C or at VBUS_LKG of at most 0.7 V for RID_FLOAT/GND, and when ID_OTG is at
    VDAT_LKG of 0 to 3.6 V) are distinguished: RID_GND (at most 1 kOhm: B-device attached directly
    or via an uncharged ACA; PD acts as A-device and drives VBUS), RID_C (36 to 37 kOhm, nominal
    36.5 kOhm: Micro ACA with a Charging Port and a powered A-device on its Accessory Port; PD acts
    as B-device, may draw up to IDCP/IDEV_CHG, may connect, and must not initiate SRP), RID_B (67
    to 69 kOhm, nominal 68 kOhm: Micro ACA with a Charging Port and either nothing or an unpowered
    A-device on its Accessory Port; PD acts as B-device, may draw up to IDCP/IDEV_CHG, may initiate
    SRP, and must not connect / assert D+), RID_A (122 to 126 kOhm, nominal 124 kOhm: ACA-Dock, or
    Micro ACA with a Charging Port and a B-device, or Standard ACA with a Charging Port; PD acts as
    A-device/host while drawing charging current from VBUS), and RID_FLOAT (at least 220 kOhm: ID
    floating). If ID is not RID_FLOAT for TDCD_DBNC (at least 10 ms), the PD may leave DCD early,
    and if ID is RID_B or RID_C it may proceed directly to the ACA-B or ACA-C state without running
    Primary Detection or asserting VDP_SRC. When ID is RID_A, the PD must run Primary Detection
    after attach and before connect and compare D- against both VDAT_REF (0.25 to 0.4 V) and VLGC
    (0.8 to 2.0 V): D- < VDAT_REF indicates an ACA-A with a Full-Speed (or High-Speed or no)
    B-device on its Accessory Port (current budget IDCP shared with the accessory); VDAT_REF < D- <
    VLGC indicates an ACA-Dock (which pulls D+ to VDP_UP of 3.0 to 3.6 V through RDP_UP of 900 to
    1575 Ohm when VBUS > VOTG_SESS_VLD, enables VDM_SRC on D- after D+/- have been at idle J for
