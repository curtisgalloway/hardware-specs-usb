    timer (TDCD_TIMEOUT, 300 ms to 900 ms) is mandatory for all PDs. A PD that omits IDP_SRC must
    wait at least TDCD_TIMEOUT min (300 ms) after attach before starting Primary Detection, and a
    PD that implements IDP_SRC must still proceed to Primary Detection within TDCD_TIMEOUT max
