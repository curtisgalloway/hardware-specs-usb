- id: secondary-detection
  section: programming-model
  title: Secondary Detection (sourcing `VDM_SRC` on D- and comparing D+ to `VDAT_REF` to separate DCP and CDP)
  claim: >-
    Secondary Detection distinguishes a DCP from a CDP after Primary Detection reports a DCP/CDP
    with ID = RID_FLOAT. A PD that is ready to be enumerated within TSVLD_CON_PWD (at most 1 s) of
    detecting VBUS may bypass Secondary Detection and immediately connect; a PD that is not ready
    to be enumerated within TSVLD_CON_PWD is required to implement and run Secondary Detection. To
    perform Secondary Detection, the PD disables VDP_SRC and IDM_SINK, enables VDM_SRC (0.5 V to
    0.7 V; able to source at least 250 uA at 0.5 to 0.7 V, and required not to pull D- below 2.2 V
    when D- is pulled to VDP_UP through RDP_UP) on D- and IDP_SINK (25 to 175 uA; pulls D+ to
    VDAT_SINK of at most 0.15 V for source currents below IDP_SINK min, and sinks at most IDP_SINK
    max below VLGC max) on D+, waits TVDMSRC_ON (at least 40 ms), and compares D+ against VDAT_REF
    (0.25 V to 0.4 V); comparing D+ to VLGC is not required during Secondary Detection. If D+ >
    VDAT_REF (because a DCP shorts D+ to D- through RDCP_DAT), the PD is attached to a DCP: it
    disables VDM_SRC, enables either VDP_SRC or RDP_UP (to VDP_UP) on D+ within TSVLD_CON_PWD (1 s
    max) of attach while maintaining D+ > VDAT_REF as long as VBUS is asserted, and may draw up to
    IDEV_CHG (1.5 A). If D+ < VDAT_REF (because a CDP does not short D+ to D- and pulls D+ low
    through RDP_DWN), the PD is attached to a CDP: it disables VDM_SRC (and VDP_SRC), leaves both
    D+ and D- low until it is ready to connect and be enumerated, and may draw up to IDEV_CHG
    (1.5 A).
