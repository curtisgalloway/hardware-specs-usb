- id: split-periodic-pipeline-and-scheduling
  section: programming-model
  title: Periodic split transaction microframe pipeline and scheduling rules
  claim: >-
    High-speed split transactions for periodic (interrupt and isochronous) endpoints are
    allocated from the 80% periodic portion of a high-speed microframe across the eight 125 us
    microframes Y0..Y7 of each 1 ms full-speed frame, where Y0 is the zeroth microframe (whose
    high-speed SOF increments the 11-bit frame number). The host schedules periodic split
    transactions from a best-case full-speed wire budget assuming no bit stuffing, using each
    endpoint's wMaxPacketSize, maximum inter-packet gaps, bus turnaround times and the hub's TT
    think time: a 1 ms frame holds at most 1157 periodic bytes (90% of raw full-speed capacity
    after worst-case 7/6 bit stuffing), budgeted as 188 bytes each in Y0..Y5, 29 bytes in Y6
    and 0 bytes in Y7 (raw wire time is 187.5 bytes in Y0..Y5 and 32 bytes in Y6). The host
    must never schedule a periodic SSPLIT in microframe Y6 (TT behavior is undefined), must
    schedule each periodic SSPLIT in the microframe before its full-/low-speed transaction (or
    188-byte isochronous OUT slice) is budgeted to start, must never schedule more than one
    CSPLIT in the same microframe for the same full-/low-speed transaction, must never issue
    more than 16 SSPLITs in any microframe for any TT (at most 16 full-speed transactions can
    complete in a microframe; the TT periodic pipeline requires less than 752 data bytes / 4
    microframes and 16 x 4 status entries of < 4 bytes each for SSPLITs, plus 2 x 188 data
    bytes / 2 microframes and 16 x 2 status entries for CSPLITs), must issue each split
    transaction in its scheduled microframe, and must issue periodic CSPLITs in a microframe in
    the same relative order as their corresponding SSPLITs. At each microframe boundary (NOW),
    the TT marks SSPLITs received in NOW-1 as pending, frees unstarted pending SSPLITs from
    NOW-4 or earlier (and at full-speed EOF frees pending SSPLITs except those received in
    (Y-1)7), and frees CSPLIT response entries from NOW-2. The TT aborts an in-progress
    downstream periodic transaction if full-speed EOF occurs, or for an interrupt transaction if
    the microframe timer reaches X+4 for an SSPLIT received in microframe X (for IN, omitting
    the downstream handshake and ignoring the data; for OUT, stopping data transmission and
    forcing a bit-stuffing error), creating no CSPLIT entry so the host receives NYET. When
    searching the CSPLIT pipeline (which holds at most 1 microframe of responses accumulated in
    the previous microframe), the TT may time out the first CSPLIT if its search is not yet
    complete (match_busy), causing the host to retry CSPLIT immediately; if a CSPLIT matches a
    later pipeline entry, the TT frees earlier skipped entries and returns the matching entry's
    response.
  support:
  - class: standard
    doc: usb-2.0.pdf
    at:
    - page: '86'
