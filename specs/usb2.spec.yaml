- id: split-interrupt-sequences
  section: programming-model
  title: Interrupt split transaction sequences and microframe responses
  claim: >-
    For a full- or low-speed interrupt IN or OUT transaction budgeted to start in microframe B,
    the host schedules one SSPLIT in microframe B-1 and schedules CSPLITs in microframes B+1 and
    B+2, plus a third CSPLIT in B+3 unless B is microframe Y6 (which gets only two CSPLITs, in
    Y7 and (Y+1)0). An interrupt OUT SSPLIT consists of SSPLIT, OUT token and DATA0/DATA1 with a
    single high-speed CRC16; an interrupt IN SSPLIT consists of SSPLIT and IN token; neither has
    a high-speed handshake phase, and if an SSPLIT suffers a high-speed timeout or CRC failure
    the TT ignores it and does not start the downstream transaction. Unlike bulk/control, the TT
    never locally retries a downstream interrupt transaction error. On an interrupt OUT CSPLIT
    (CSPLIT + OUT), the TT returns ACK (host advances), NAK (host retries from SSPLIT at the
    next period), STALL (host halts endpoint), ERR (downstream transaction error) or NYET (not
    yet finished / no match). On an interrupt IN CSPLIT (CSPLIT + IN), the TT slices received
    downstream data on microframe boundaries without forwarding the full-/low-speed CRC16: if
    the downstream packet is still arriving at the microframe boundary, the TT returns NYET when
    fewer than 3 data bytes have been received (since 2 bytes could be the CRC16) or returns
    MDATA (with high-speed CRC16) containing the received bytes minus the last 2 bytes when more
    than 2 data bytes have been received; when the downstream packet completes in a microframe,
    the TT returns DATA0 or DATA1 (matching the downstream PID) with high-speed CRC16 if the
    downstream CRC16 passed, or returns ERR (no data) if the downstream CRC16 failed or another
    downstream transaction error occurred (or NAK or STALL if the device returned those
    handshakes). Because an interrupt payload is at most 64 bytes (full speed) or 8 bytes (low
    speed), it spans at most one microframe boundary and needs at most two CSPLITs to return
    data. Once the host receives ACK, NAK, STALL, ERR or DATA0/DATA1, it stops issuing any
    remaining scheduled CSPLITs for that transaction. For interrupt IN DATA0/DATA1 with valid
    high-speed CRC16, the host accepts the data and advances if the PID matches the expected
    data toggle, or rejects the data and retries from SSPLIT without incrementing err_count on a
    toggle mismatch. On NYET before the last scheduled CSPLIT, or on MDATA with valid high-speed
    CRC16, the host proceeds to the next scheduled CSPLIT. On NYET on the last scheduled CSPLIT,
    or on ERR (which on a second CSPLIT also discards any MDATA payload accepted from the first
    CSPLIT), the host increments err_count and retries from SSPLIT at the next period while
    err_count < 3 or halts the endpoint at err_count >= 3. On a high-speed transaction error on
    CSPLIT itself (timeout, including a TT search timeout, invalid PID or bad high-speed CRC16
    on MDATA/DATAx), the host increments err_count and immediately retries the CSPLIT while
    err_count < 3, or halts the endpoint at err_count >= 3.
  support:
  - class: standard
    doc: usb-2.0.pdf
    at:
