- id: tt-architecture-single-vs-multi
  section: programming-model
  title: Single-TT and Multi-TT hub organizations and descriptors
  claim: >-
    A high-speed hub isolates high-speed signaling from downstream full- and low-speed ports
    using a Transaction Translator (TT) with a high-speed handler, a full-/low-speed handler,
    and separate periodic (isochronous/interrupt) and non-periodic (bulk/control) transaction
    buffers. A hub can provide either one TT shared across all downstream facing ports that have
    full- or low-speed devices attached (single TT) or one TT per downstream facing port
    (multiple TT); all hubs must support the single-TT organization, and the TT organization
    must not be changed while full- or low-speed transactions are in progress. When operating at
    high speed, a single-TT hub sets bDeviceClass = 09H (HUB_CLASSCODE), bDeviceSubClass = 0 and
    bDeviceProtocol = 1 in its device descriptor and exposes one interface descriptor
    (bInterfaceNumber = 0, bAlternateSetting = 0) with bInterfaceProtocol = 0; a multiple-TT hub
    sets bDeviceProtocol = 2 in its device descriptor and exposes two interface descriptors for
    interface 0: alternate setting 0 with bInterfaceProtocol = 1 (single-TT mode) and alternate
    setting 1 with bInterfaceProtocol = 2 (multiple-TT mode). When operating at full speed, a
    hub sets bDeviceProtocol = 0 and bInterfaceProtocol = 0, reporting its high-speed
    bDeviceProtocol (1 or 2) in its device_qualifier descriptor. In the class-specific hub
    descriptor (bDescriptorType = 29H), wHubCharacteristics (offset 3, 2 bytes) bits 6..5 report
    the TT Think Time, the inter-transaction gap the TT requires on a downstream full- or
    low-speed bus before proceeding to the next transaction: 00B at most 8 full-speed bit times,
    01B at most 16, 10B at most 24 and 11B at most 32 full-speed bit times.
