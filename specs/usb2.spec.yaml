      section: '11.20'

- id: split-isochronous-sequences
  section: programming-model
  title: Isochronous split transaction sequences and payload framing
  claim: >-
    Full-speed isochronous split transactions never perform local retries on the downstream bus
    and use asymmetric OUT and IN sequences (low-speed isochronous transactions are not
    permitted). For isochronous OUT, the host must never schedule a CSPLIT (TT response is
    undefined); instead, for each microframe in which the full-speed OUT transaction is
    budgeted, the host schedules an SSPLIT (SSPLIT token + OUT token + DATA0 with high-speed
    CRC16, no handshake) one microframe before that chunk is budgeted on the full-speed bus,
    sending up to 188 data bytes (or the remaining payload) per SSPLIT. The SSPLIT S and E bits
    mark each chunk: S=1, E=1 (all) when a single SSPLIT carries the whole payload (including
    any zero-length payload, or a <= 187-byte payload whose wire budget spans two microframes so
    an SSPLIT-end would otherwise carry zero data); otherwise S=1, E=0 (beginning) on the first
    SSPLIT, S=0, E=0 (middle) on intermediate SSPLITs and S=0, E=1 (end) on the final SSPLIT,
    each of which must have a non-zero data payload. The TT checks and strips each high-speed
    CRC16, recombines the chunks into one full-speed DATA0 packet, and generates a single
    full-speed CRC16. If the first (beginning or all) SSPLIT is missed or fails CRC16, the TT
    does not start the downstream transaction; after SSPLIT-begin is accepted, if any microframe
    passes without an SSPLIT for that endpoint before SSPLIT-end, or if a chunk fails high-speed
    CRC16 or has an out-of-sequence S/E encoding (Bad_IsochOut), the TT forces a bit-stuffing
    error on the downstream full-speed packet and ignores subsequent middle/end SSPLITs for that
    endpoint until a non-middle/non-end SSPLIT (or, after a CRC failure, an SSPLIT-end for that
    endpoint or a start-split for another endpoint) is received. For isochronous IN, the host
    schedules one SSPLIT (SSPLIT token with S=0, E=0 + IN token, no handshake) in the microframe
    before the full-speed transaction is budgeted to start, schedules one CSPLIT (CSPLIT + IN)
    in each microframe following a budgeted microframe (calling the last such microframe L), and
    schedules extra CSPLITs in L+1 and L+2 when L < Y6, in Y7 plus (unless budgeted to start in
    Y0) (Y+1)0 when L = Y6, or in (Y+1)0 (unless budgeted to start in Y0) when L = Y7 (up to 8
    CSPLITs for a 1023-byte packet). In response to each CSPLIT + IN, the TT returns MDATA (with
    high-speed CRC16, holding received bytes minus the last 2 bytes when > 2 bytes have arrived
    and the downstream packet is still in progress at the microframe boundary), NYET (when < 3
    bytes have arrived at the microframe boundary or no pipeline entry matches yet), DATA0
    (always DATA0, with high-speed CRC16, when the downstream packet finishes in the microframe
    with a valid full-speed CRC16) or ERR (when the downstream transaction suffers a CRC16 or
    other transaction error). The host stops issuing remaining CSPLITs for the frame upon
    receiving DATA0 or ERR; if the host receives ERR, or receives MDATA or NYET on the last
    scheduled CSPLIT for the frame (HC_cmd.last), it records an error for that frame and
    advances to the next frame's command without halting the endpoint. On a high-speed
    transaction error on CSPLIT itself (timeout, invalid PID or bad high-speed CRC16 on
    MDATA/DATA0), the host increments err_count and immediately retries the CSPLIT while
    err_count < 3, or abandons the transaction at err_count >= 3.
  support:
  - class: standard
    doc: usb-2.0.pdf
    at:
    - pages: ['230', '231']
      section: 8.4.2.2
      table: '8-2'
    - pages: ['402', '405']
