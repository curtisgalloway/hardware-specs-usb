- id: multi-tt-requires-set-interface
  section: gotchas
  title: Multi-TT hubs configure into Single-TT mode until SetInterface selects alternate setting 1
  claim: >-
    Every high-speed hub must support the single-TT organization, and a multiple-TT hub
    (bDeviceProtocol = 2) places single-TT operation (bInterfaceProtocol = 1) on interface 0
    alternate setting 0 and multiple-TT operation (bInterfaceProtocol = 2) on interface 0
    alternate setting 1. Because SetConfiguration() always initializes every interface to
    alternate setting 0, a multiple-TT hub operates as a single-TT hub after configuration until
    host software issues SetInterface() to select alternate setting 1, which must be done while
    no full- or low-speed transactions are in progress. Note two internal inconsistencies in
    Chapter 11 of the base specification: Table 11-14 lists GET_INTERFACE and SET_INTERFACE as
