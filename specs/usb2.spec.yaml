      section: 11.18.5
    - pages: ['422', '432']
      section: '11.21'

- id: tt-timer-sync-and-error-handling
  section: programming-model
  title: TT frame and microframe timer synchronization and downstream EOF rules
  claim: >-
    A high-speed hub synchronizes its 125 us microframe timer after receiving high-speed SOFs in
    two consecutive microframes, and synchronizes its 1 ms downstream frame timer when it
    receives a zeroth microframe SOF (recognized when two consecutive microframe SOFs increment
    the 11-bit frame number by 1 modulo 2^11) while its microframe timer is synchronized. While
    the 1 ms frame timer is synchronized, the TT generates a full-speed SOF on downstream
    full-speed ports within +/-3 full-speed bit times of each zeroth high-speed SOF (and
    keep-alives on low-speed ports) and keeps the 1 ms frame timer synchronized every 8
    microframes even if zeroth microframe SOFs are missed, as long as the 125 us microframe
    timer stays synchronized. The TT must stop issuing full-speed SOFs after detecting 250 us of
    high-speed bus idle (so downstream full-/low-speed ports enter suspend within 250 us of the
    high-speed bus) and must never issue downstream transactions while its upstream port is
    suspended. Missing three consecutive microframe SOFs causes both the 125 us microframe timer
    and the 1 ms frame timer to lose synchronization at once; while unsynchronized, the TT (1)
    responds to periodic CSPLITs with any responses already buffered in the periodic pipeline
    (at most 1 microframe of CSPLITs), (2) aborts buffered periodic SSPLITs, ignores incoming
    high-speed periodic SSPLITs and starts no new downstream periodic transactions, (3) stops
    issuing downstream full-speed SOFs and low-speed keep-alives, and (4) continues responding
    to high-speed bulk/control SSPLITs and CSPLITs while holding pending bulk/control
    transactions in their buffers without issuing them downstream until both timers
    re-synchronize (within 0.250 to 1.250 ms after error-free high-speed SOFs resume) or a
    Clear_TT_Buffer request clears them. On the downstream bus, before starting a non-periodic
    transaction the TT must verify that enough time remains before EOF1 assuming the transfer
    type's maximum allowed payload size for INs; if the TT is still transmitting near EOF1 it
    forces an abnormal termination sequence and stops transmitting, and if it is still receiving
    a packet at EOF2 it disables the transmitting downstream port.
  support:
  - class: standard
    doc: usb-2.0.pdf
    at:
    - page: '402'
      section: 11.18.3
    - pages: ['432', '434']
      section: '11.22'

- id: tt-hub-class-requests
  section: programming-model
  title: Transaction Translator hub class requests
  claim: >-
    All four TT-specific hub class requests are mandatory for hubs with a TT, use the
    port-recipient class bmRequestType (00100011B host-to-device for Clear_TT_Buffer, Reset_TT
    and Stop_TT; 10100011B device-to-host for Get_TT_State), and take TT_Port in wIndex (the
    1-based port number of the target TT on a multiple-TT hub, or 1 on a single-TT hub, where
    Reset_TT and Stop_TT allow a single-TT hub to ignore the port number): (1) Clear_TT_Buffer
    (bRequest = CLEAR_TT_BUFFER = 8, wLength = 0, no Data stage) clears a bulk or control TT
    buffer left in a busy state after high-speed errors so it can be reused; it is defined only
    for non-periodic endpoints (response for a periodic endpoint is undefined), treats clearing
    a transaction not buffered by the TT as a functional no-operation, and encodes the target
    full-/low-speed endpoint in wValue (Table 11-18: bits 3..0 Endpoint Number, bits 10..4
    Device Address, bits 12..11 Endpoint Type, bits 14..13 reserved zero, bit 15 Direction with
    1 = IN and 0 = OUT). (2) Reset_TT (bRequest = RESET_TT = 9, wValue = 0, wLength = 0, no
    Data stage) returns the target TT's internal buffers, pipeline and state machines to their
    post-configuration state without resetting the hub controller, hub repeater or downstream
    facing ports, so attached full-/low-speed devices do not require re-enumeration. (3)
    Stop_TT (bRequest = STOP_TT = 11, wValue = 0, wLength = 0, no Data stage) stops normal
    execution of the TT for debugging so its state can be read via Get_TT_State; the only
    standardized way to restart a stopped TT is Reset_TT. (4) Get_TT_State (bRequest =
    GET_TT_STATE = 10, wValue = TT_Flags with bits 7..0 reserved zero and bits 15..8
    vendor-specific, wLength = TT State Length) requires the TT to have been stopped first via
    Stop_TT and returns Table 11-23's state block (4-byte TT_Return_Flags at offset 0 with bits
    15..0 reserved zero and bits 31..16 vendor-specific, followed at offset 4 by
    implementation-dependent TT_specific_state, truncated to wLength if wLength is smaller and
    returning only actual length if wLength is larger); the TT's state after processing
    Get_TT_State is undefined. For all four requests, a nonexistent port in wIndex (or a
    non-zero wLength on the no-data requests) is a Request Error, and if the hub is not
    configured its response is undefined.
