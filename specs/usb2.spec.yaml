- id: split-bulk-and-control-sequences
  section: programming-model
  title: Bulk and control split transaction sequences and responses
  claim: >-
    Each TT provides at least two non-periodic bulk/control transaction buffers (requiring at
    least 2 x (64 data + 4 status) bytes) and services pending periodic start-splits ahead of
    bulk/control transactions, issuing a pending bulk/control transaction on the downstream bus
    in round-robin order only when no periodic start-split is available and sufficient time
    remains in the 1 ms frame before EOF1. A TT buffers at most one bulk or control split
    transaction per endpoint at a time, matching buffers by device address, endpoint number and,
    for bulk endpoints only (not control endpoints), direction. On a bulk/control start-split
    (SSPLIT + OUT/SETUP + DATA0/1, or SSPLIT + IN), the TT returns ACK if a free buffer accepts
    the transaction (Is_new_SS) or if a buffer for that endpoint is already pending or ready
    (Is_old_SS, a retry after a lost ACK, in which case duplicate OUT data is ignored), and
    returns NAK if all bulk/control buffers are occupied by other endpoints (Is_no_space). After
    ACK the host must not send another SSPLIT for that endpoint until the corresponding CSPLIT
    completes; after NAK the host retries SSPLIT on its normal schedule without incrementing
    err_count and may skip other bulk/control SSPLITs for that TT until a bulk/control CSPLIT
    finishes. If the TT times out waiting for the token or data packet or sees a bad CRC16 on
    OUT data, it sends no handshake; on a high-speed timeout or invalid handshake, the host
    increments err_count (unless caused by a host memory or non-USB system hold-off) and retries
    SSPLIT while err_count < 3 or halts the endpoint at err_count >= 3. On the downstream bus,
    the TT locally retries full-/low-speed transaction errors up to three strikes—reflecting
    three downstream errors as a STALL result—and never locally retries an ACK, NAK or STALL
    handshake from the device. On a complete-split (CSPLIT + OUT/SETUP/IN), the TT returns NYET
    while the downstream transaction is still pending (host retries CSPLIT later), returns STALL
    if no matching buffer exists (protocol violation), or marks a ready buffer old (freeing it
    for reuse after the CSPLIT) and returns the downstream result: for OUT/SETUP, ACK (advance
    to next command and reset err_count to 0), NAK (retry from SSPLIT without incrementing
    err_count; not allowed for control SETUP) or STALL (halt endpoint); for IN, DATA0/DATA1
    (if CRC16 is valid and matches the expected data toggle, accept data and advance; if CRC16
    is valid but the toggle mismatches, reject data and retry from SSPLIT), NAK (retry from
    SSPLIT) or STALL (halt endpoint; an unexpected downstream ACK state on IN also maps to STALL
    in Figure 11-59). On a high-speed transaction error during CSPLIT (timeout, invalid
    handshake or bad CRC16 on IN data), the host increments err_count (unless due to a host
    hold-off) and while err_count < 3 retries the CSPLIT immediately before any other
    bulk/control split transaction for that TT (periodic split or non-split transactions may
    intervene), halting the endpoint at err_count >= 3.
  support:
  - class: standard
    doc: usb-2.0.pdf
    at:
