- id: clear-tt-buffer-on-async-abort
  section: gotchas
  title: Failed bulk or control split transactions leave the TT buffer busy until Clear_TT_Buffer
  claim: >-
    When a bulk or control split transaction fails on the high-speed bus, it can leave the
    associated non-periodic TT transaction buffer in a busy (ready/x) state that prevents the
    buffer from being reused for other bulk or control split transactions. As part of endpoint
    halt processing for any full- or low-speed bulk or control endpoint connected via a TT, host
    software must issue a Clear_TT_Buffer request (bRequest = 8, wValue encoding the target
    endpoint number in bits 3..0, device address in bits 10..4, endpoint type in bits 12..11 and
    direction in bit 15, and wIndex = TT_Port: 1 for a single-TT hub or the port number for a
    multiple-TT hub) to return the buffer to the free state.
