- id: power-budget
  section: standards
  title: Bus power before and after configuration
  claim: >-
    A device draws no more than one unit load from VBUS until it is configured, and after reset
    no more than 100 mA; depending on the port, it may draw up to five unit loads once
    configured, as its configuration descriptor's bMaxPower states. Host software does not
    select a configuration whose power requirement exceeds what the port can supply. A device
    that was self-powered with a configuration needing more than 100 mA returns to the Address
    state if it switches to bus power.
