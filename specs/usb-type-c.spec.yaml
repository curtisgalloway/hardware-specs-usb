- id: emarker-and-ra-state-machines
  section: programming-model
  title: Cable eMarker and Ra management state machines (4.5.2.4 and 4.5.2.5)
  claim: >-
    In the Cable eMarker State Machine (Section 4.5.2.4, which also applies to an eMarker in a
    direct-connect device), each eMarker starts in eMarker Power On when VCONN or VBUS is
    applied (detachable Type-C cables must use VCONN to power their eMarkers; a direct-connect
    device's eMarker may use VCONN, VBUS or another local supply), initializes, and transitions
    to eMarker Communications Ready upon completing boot within teMarkerReady (at most 50 ms,
    Table 4-24). In eMarker Communications Ready, a passive cable should power only one eMarker
    at a time responding to SOP' only; if two eMarkers in a cable are powered at the same time,
    one responds to SOP' and the other to SOP'', with the SOP' and SOP'' assignment fixed for
    each eMarker and never dynamically set when VCONN is applied (a direct-connect device has at
    most one eMarker, responding only to SOP'). An eMarker returns from eMarker Communications
    Ready to eMarker Power On upon sensing a Hard Reset, Cable Reset, or Power On Reset—triggered
    in a cable by sensing VCONN below vVCONNDisconnect (1.0 to 2.4 V, Table 4-6), and in a
    direct-connect device by either sensing VCONN below vVCONNDisconnect or transitioning from
    any attached state to any unattached state. Independently, any cable or direct-connect
    device that uses VCONN to power circuitry implements the Cable Ra Management State Machine
    (Section 4.5.2.5) independently at each plug end based on that end's VCONN (a direct-connect
    device whose SOP' is not powered by VCONN still implements Ra and meets Section 4.5.2.4
    timing, but need not weaken Ra or follow Section 4.5.2.5): starting in Ra Applied, each
    eMarker applies Ra to VCONN within tRaReconnect (at most 1 ms, Table 4-6), transitions to Ra
    Weakened to remove or weaken Ra when VCONN exceeds vVCONNDisconnect for tRaWeaken (21 ms to
    1.2 s, Table 4-6), and returns to Ra Applied when VCONN falls below vVCONNDisconnect. Under
    Table 4-6, a VCONN-powered cable operates over vVCONNValid of 3.0 to 5.5 V, presents at most
    10 uF inrush capacitance, draws at most iRaDetect = 10 mA below vVCONNValid, consumes at
    most 20 mW for an electronically marked passive cable with no USB PD traffic at least
    tRaWeaken after VCONN is applied (75 mW max for the first tRaWeaken), and on disconnect
    discharges VCONN below vVCONNDischarge (800 mV max) within tVCONNDischarge (230 ms max).
  support:
  - class: standard
    doc: usb-type-c-2.5.pdf
    at:
    - page: '155'
      table: '4-6'
    - pages: ['202', '204']
      section: 4.5.2.4
    - pages: ['204', '205']
      section: 4.5.2.5
    - pages: ['239', '242']
      section: '4.9'
    - page: '242'
      section: 4.9.1
      table: '4-24'
