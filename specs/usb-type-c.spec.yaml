- id: vconn-shutoff-and-swap-rules
  section: gotchas
  title: When a Source may turn off VCONN after eMarker discovery and how VCONN_Swap preserves cable power
  claim: >-
    Even after a Source initially supplies VCONN on entry to Attached.SRC, it may turn VCONN off
    not only when Ra is not detected after tCCDebounce or SOP' Discover Identity receives no
    GoodCRC, but also after reading the cable's eMarker per Table 4-4: a Source without TX/RX or
    VPD support that supports more than 3 A (100 mW VCONN minimum) may remove VCONN once it has
    read the eMarker and determined the cable's current-carrying capacity, and a Source with
    TX/RX or VPD support (1 W for single-lane or VPD support, 1.5 W for dual-lane) may remove
    VCONN if the eMarker shows the cable is not a VPD and its Cable Termination Type field is
    00b (both plugs passive, VCONN not required). Conversely, when VCONN must remain powered
    (such as for an active cable), a USB PD VCONN_Swap must run in a make-before-break
    sequence—the new VCONN source starts supplying VCONN within tVCONNON (at most 2 ms) while
    the original VCONN source continues supplying VCONN until stopping within tVCONNOFF (at most
    35 ms)—so VCONN is never dropped; a PR_Swap or DR_Swap alone does not change which port
    sources VCONN, and a Fast Role Swap that fails to maintain VCONN causes an active cable to
    drop USB 3.2 signaling.
  support:
