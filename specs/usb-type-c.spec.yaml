kind: ip
id: usb-type-c
name: USB Type-C port connection detection (Configuration Channel)
triggers:
- usb-type-c
- USB Type-C
- USB-C
- Type-C port
- configuration channel
resources:
  documents:
  - name: usb-type-c-2.5.pdf
    class: standard
    title: Universal Serial Bus Type-C Cable and Connector Specification
    revision: Release 2.5, March 2026
    url: https://www.usb.org/document-library/usb-type-cr-cable-and-connector-specification-release-25
    retrieval:
