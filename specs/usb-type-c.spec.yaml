- id: liquid-corrosion-mitigation
  section: programming-model
  title: Liquid Corrosion Mitigation Mode (CorrosionMitigation state and Appendix A)
  claim: >-
    Liquid Corrosion Mitigation Mode (Appendix A, which replaced the deprecated Audio Adapter
    Accessory Mode on Ra/Ra) is an optional normative mode that reduces electrolytic pin
    corrosion when liquid bridges connector pins by removing or pulling bias voltages as close
    to 0 V as possible. When liquid is detected, a port is directed into CorrosionMitigation by
    first passing through ErrorRecovery (exiting ErrorRecovery to CorrosionMitigation after
    tErrorRecovery when directed, and exiting CorrosionMitigation back to ErrorRecovery when
    directed once liquid is no longer detected). In CorrosionMitigation the port reconfigures
    its pins per Appendix A, drives neither VBUS nor VCONN, keeps non-CC pins open or pulled
    low, and implements one of two CC behaviors: (1) pull both CC1 and CC2 low with a resistance
    at or below the maximum impedance of Ra in Table 4-29 (1.2 kOhm, and preferably stronger
    than Ra), or (2) pull only one CC pin low while keeping the other open (above zOPEN),
    monitoring the open CC pin and swapping the pull-down and open between CC1 and CC2 whenever
    SNK.Rp is detected on the open pin. A Source or DRP partner connected to a port in
    CorrosionMitigation moves to AttachWait.SRC (two Ra detected), stays in Unattached.SRC
    (Source seeing one Ra), or continues DRP toggling (DRP seeing one Ra), keeping VBUS and
    VCONN at 0 V until the partner leaves CorrosionMitigation.
