- id: ctvpd-host-states-and-limits
  section: programming-model
  title: Host Charge-Through VPD states (CTUnattached.SNK and CTAttached.SNK), current limits and PD restrictions
  claim: >-
    A DRP in Attached.SRC or a Sink in Powered.Accessory that supports Charge-Through VPDs
    transitions to CTUnattached.SNK when the connected device identifies itself as a
    Charge-Through VPD in its SOP' Discover Identity response (which may be delayed for further
    SOP' communication; a port in Attached.SNK that detects a CTVPD on SOP' transitions to
    TryWait.SRC if supported, or else to Unattached.SRC or Unattached.Accessory, optionally
    delaying until it has enough battery charge to stay powered until CTAttached.SNK). On
    entering CTUnattached.SNK, the host removes its Rp (if present) and terminates CC to ground
    through Rd, continues supplying VCONN, stops sourcing or sinking VBUS and discharges it, and
    may query the CTVPD's eMarker on SOP' (and in USB PD 2.0 initiates PD messages); it exits to
    Unattached.SNK if CC is SNK.Open for tVPDDetach (10 to 20 ms, Table 4-33) after VBUS reaches
    vSafe0V, or transitions directly to CTAttached.SNK as soon as VBUS is detected (with no
    intermediate CTAttachWait.SNK state because the CTVPD has already debounced the
    passed-through CC pin). In CTAttached.SNK, the host keeps Rd on CC, continues supplying
    VCONN, operates in the Sink Power Sub-States (Section 4.5.2.3) until VBUS is removed or a
    USB PD contract is established with the pass-through Source, and returns to CTUnattached.SNK
    (unless in a USB PD Hard Reset) within tSinkDisconnect when VBUS falls below vSinkDisconnect
    (at or below 5 V) or vSinkDisconnectPD (above 5 V), or after CC stays below vRd-USB for
    tPDDebounce if monitoring CC after USB PD communication. While in CTAttached.SNK, the host
    must not negotiate VBUS above the maximum voltage in the CTVPD's Discover Identity response,
    must not perform USB BC 1.2 primary detection, must neither initiate nor respond to SOP'
    communication, must not negotiate or accept PR_Swap or VCONN_Swap (and must reject a VCONN
    swap request) or enable FR_Swap, must not negotiate Alternate Modes that change connector
    pin functions, must alter its advertised USB PD capabilities to represent itself as a
    Sink-only, data-less UFP (while remaining DFP for USB data, and in USB PD 2.0 not initiating
    PD messages and negotiating DR_Swap only to switch which side initiates PD messaging), and
    must cap its current draw using the CTVPD's reported VPD_GND_DCR (in 1-mOhm steps) and
    VPD_VBUS_DCR (in 2-mOhm steps) impedances per Section 4.6.2.5 and Tables 4-21 and 4-22: at
    most 0.25 V / (0.25 V / Icable + VPD_GND_DCR) for the GND IR-drop limit, and either lower
    its VBUS detach threshold or further limit its current to at most 0.75 V / (0.75 V / Icable +
    VPD_VBUS_DCR + VPD_GND_DCR) for the combined VBUS+GND limit, where the inferred cable rating
