- id: ctvpd-device-states
  section: programming-model
  title: Charge-Through VPD device-side state machine and host-port Rd/Rp switching
  claim: >-
    For initial host attach, a Charge-Through VCONN-Powered USB Device (CTVPD) uses
    Unattached.SNK, AttachWait.SNK and Attached.SNK (entering Attached.SNK after its Host-side
    CC pin is SNK.Rp for at least tCCDebounce and host-side VCONN or VBUS is detected): in
    Attached.SNK it isolates its Host-side and Charge-Through ports, presents Rd on Host-side CC
    and above zOPEN on Charge-Through CC1 and CC2, responds only to SOP' queries, and starts a
    Charge-Through Support Timer (presenting a USB Billboard interface if it does not exit
    Attached.SNK within tAMETimeout). Once VCONN is present and the Host-side CC pin is SNK.Open
    for tVPDCTDD (30 us to 5 ms, Table 4-34) because the Charge-Through-capable host removed
    VBUS and switched to Rd, the CTVPD enters CTUnattached.VPD: it isolates both ports (powered
    by VCONN and drawing at most ICCS for USB 3.2 or ICCSH for USB 2.0 from VBUS for
    monitoring), removes Rd on Host-side CC and applies an Rp advertising 3.0 A (signaling
    continued connection without advertising VBUS current), responds only to SOP' Discover
    Identity on Host-side CC (meeting cReceiver), terminates Charge-Through CC1 and CC2 to
    ground through Rd, and provides CCTB (1 to 10 uF, Table 4-26) bypass capacitance on
    Charge-Through VBUS. When SNK.Rp is detected on exactly one Charge-Through CC pin (debug
    accessories are not supported on the Charge-Through port), the CTVPD enters CTAttachWait.VPD,
    keeping its 3.0 A Rp on Host-side CC and Rd on Charge-Through CC1 and CC2 and completing any
    active SOP' query; it returns to CTUnattached.VPD if both Charge-Through CC pins are
    SNK.Open for at least tPDDebounce, or enters CTAttached.VPD once one Charge-Through CC pin
    has been SNK.Rp for at least tCCDebounce and Charge-Through VBUS is detected. On entering
    CTAttached.VPD, within tVPDDetach minimum (10 ms, Table 4-33) and in exact order, the CTVPD:
    (1) reduces additional Host-side CC capacitance to at most twice the maximum cCablePlug_CC,
    (2) disables its 3.0 A Rp on Host-side CC, (3) passively multiplexes the connected
    Charge-Through CC pin to Host-side CC with impedance below RccCON (at most 15 Ohm when
    enabled, at least zOPEN when disabled, Table 4-25), (4) disables Rd on Charge-Through CC1
    and CC2, and (5) connects Charge-Through VBUS to Host-side VBUS; while in CTAttached.VPD it
    does not respond to any USB PD communication, and returns to CTUnattached.VPD when VBUS
    falls below vSinkDisconnect and the passed-through CC pin is SNK.Open for tVPDCTDD
    (reapplying the 3.0 A Rp on Host-side CC within tVPDCTDD). If VCONN falls below
    vVCONNDisconnect, the CTVPD transitions directly to Unattached.SNK from CTUnattached.VPD, or
    to CTDisabled.VPD from CTAttachWait.VPD or CTAttached.VPD—where it isolates both ports,
    presents above zOPEN on Host-side CC and Charge-Through CC1 and CC2 while powered entirely
    by VBUS, and transitions to Unattached.SNK after tVPDDisable (at least 25 ms, Table 4-34).
