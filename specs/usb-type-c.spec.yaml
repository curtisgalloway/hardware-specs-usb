- id: dam-equal-rp-no-orientation
  section: gotchas
  title: Equal Rp terminations on both CC pins in Debug Accessory Mode provide no orientation or USB PD
  claim: >-
    In Debug Accessory Mode, orientation detection relies on asymmetric CC voltages (CC1 not
    equal to CC2): a DTS Source presents two distinct Rp values from Table B-2 (weaker
    resistance on CC2), whereas a TS Source presents the same standard Rp value on both CC1 and
    CC2 and relies on a DTS Sink to pull B5 (CC2) to at most Ra after entering AttachedDeb.SNK.
    If a Sink does not pull CC2 to at most Ra (or if a partner presents equal terminations on
    both CC pins), a TS Source stays in UnorientedDebugAccessory.SRC rather than entering
    OrientedDebugAccessory.SRC, and neither side can determine plug orientation, connect
    orientation-sensitive debug signals, or initiate USB PD communication (which Table 4-18 and
    Section B.2.3 permit only when orientation is determined).
