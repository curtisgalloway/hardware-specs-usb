- id: ctvpd-unsupported-states
  section: programming-model
  title: Charge-Through VPD unsupported-partner states (CTUnattached.Unsupported, CTAttachWait.Unsupported, CTTry.SNK and CTAttached.Unsupported)
  claim: >-
    Because a Charge-Through VPD supports neither Sinks nor Debug Accessory Mode on its
    Charge-Through port, when no Source is attached in CTUnattached.VPD it toggles on its
    Charge-Through port between CTUnattached.VPD (leaving for CTUnattached.Unsupported within
    tDRPTransition after both Charge-Through CC pins are SNK.Open for tDRP minus dcSRC.DRP times
    tDRP, or when directed) and CTUnattached.Unsupported (returning to CTUnattached.VPD within
    tDRPTransition after dcSRC.DRP times tDRP, or when directed). In CTUnattached.Unsupported
    and CTAttachWait.Unsupported, the CTVPD isolates its Host-side and Charge-Through ports
    (powered by VCONN, drawing at most ICCS or ICCSH from VBUS for monitoring), maintains its
    3.0 A Rp and SOP' Discover Identity responder (meeting cReceiver) on Host-side CC, removes
    Rd on Charge-Through CC1 and CC2, and applies Rp advertising Default USB Power instead. It
    moves from CTUnattached.Unsupported to CTAttachWait.Unsupported when SRC.Rd is detected on
    at least one Charge-Through CC pin or SRC.Ra on both; from CTAttachWait.Unsupported it
    returns to CTUnattached.VPD if either Charge-Through CC pin is SRC.Open for at least
    tCCDebounce, or enters CTTry.SNK once SRC.Rd on at least one pin or SRC.Ra on both persists
    for at least tCCDebounce. In CTTry.SNK (whose state requirements match CTUnattached.VPD,
    terminating Charge-Through CC1 and CC2 through Rd), the CTVPD waits tDRPTry before
    monitoring Charge-Through CC for SNK.Rp: if SNK.Rp is detected for at least tTryCCDebounce
    and Charge-Through VBUS is detected (riding through brief USB PD SNK.Open glitches up to
    tTryCCDebounce), it enters CTAttached.VPD; if SNK.Rp is not detected for tDRPTryWait, it
    enters CTAttached.Unsupported. In CTAttached.Unsupported, the CTVPD isolates both ports,
    maintains its 3.0 A Rp on Host-side CC, replaces Rd on Charge-Through CC1 and CC2 with
    Default USB Power Rp while monitoring their voltage, presents a USB Billboard Device Class
    interface indicating an unsupported accessory or device, and returns to CTUnattached.VPD
    when SRC.Open is detected on both Charge-Through CC pins or SRC.Open on one and SRC.Ra on
    the other; from CTUnattached.Unsupported, CTAttachWait.Unsupported, CTTry.SNK and
    CTAttached.Unsupported it also returns to Unattached.SNK if VCONN falls below
    vVCONNDisconnect (or VCONN is removed per Figure 4-18 and Section 4.5.3.1.8 Case 6).
