- id: emarker-requirements-and-discovery
  section: programming-model
  title: When cables require an eMarker and how SOP' and SOP'' discovery works
  claim: >-
    An eMarker—an element in an Electronically Marked Cable that returns cable characteristics
    in response to a USB PD Structured VDM Discover Identity command—is required in all USB
    Full-Featured Type-C cables (USB 3.2 Gen 1/Gen 2 and USB4), all USB 2.0 Type-C cables rated
    above 3 A, all Extended Power Range (EPR, 50 V and 5 A) cables, all active cables, and any
    captive-cable or thumb-drive device (Sink, UFP or DRP) that either sinks more than 3 A or
    supports USB4 (where the eMarker may reside in the captive cable or the device); USB 2.0
    Type-C cables rated at 3 A or less may optionally include one. Electronically marked cables
    respond to Discover Identity directed to SOP' (active cables return Active Cable VDOs,
    identify whether they support one or two TX/RX lanes, and when data bus signal conditioning
    is in both plugs must implement SOP' and may implement SOP'', responding to Get_Status on
    SOP' and on SOP'' when the SOP'' Controller Present bit is set). Prior to an explicit USB PD
    contract, a Sourcing Device is allowed to use SOP' to discover the cable's identity; once an
    explicit USB PD contract has been negotiated, only the VCONN Source may communicate with
    SOP' and SOP''. Once VCONN is available, all electronically marked cables (except Optically
    Isolated Active Cables, Section 6.3, which may draw from both VCONN and VBUS) must use VCONN
    as their only power source; if VCONN is applied after VBUS, a cable that draws power from
    VBUS until VCONN is available must switch from VBUS to VCONN within tVCONNSwitch (at most
    teMarkerReady, where teMarkerReady is at most 50 ms from the application of VCONN or VBUS,
    whichever is later, Table 4-24). A cable whose VCONN wire traverses the cable includes
    isolation elements so VCONN cannot pass end-to-end, whereas a cable whose VCONN wire does
    not extend through the cable places an SOP' eMarker at each end without isolation elements.
