- id: vpa-and-vpd-operation
  section: programming-model
  title: Direct-attach VCONN-Powered Accessories (VPAs) and VCONN-Powered USB Devices (VPDs)
  claim: >-
    VCONN-Powered Accessories (VPAs) and VCONN-Powered USB Devices (VPDs) are direct-attach
    Sinks that can operate from VCONN alone, exposing at most Ra to ground on their VCONN pin
    and Rd on their CC pin. In AttachWait.SNK either may transition to Attached.SNK as soon as
    VCONN or VBUS is detected without waiting tCCDebounce; when VBUS is absent they treat the
    application of VCONN as attach and the removal of VCONN as detach (a VPD in Attached.SNK
    returns to Unattached.SNK only when VBUS is below vSinkDisconnect and VCONN is below
    vVCONNDisconnect, and a Source in Attached.SRC that discovers a VPD on SOP' may remove VBUS
    and discharge it to vSafe0V while staying in Attached.SRC with VCONN applied). A VPA
    implements an Alternate Mode, responds to USB PD on SOP, and when powered only by VCONN must
    negotiate an Alternate Mode within tAMETimeout or its partner removes VCONN (when VBUS is
    supplied, it must present a USB Billboard Device Class interface if Alternate Mode
    negotiation fails); under Table 4-7 it draws at most 35 mW before Alternate Mode entry (75
    mW max for the first 500 ms after VCONN is applied, reduced 5 s after VCONN is applied if no
    Alternate Mode entry has occurred). A VPD implements a USB UFP endpoint, responds only to
    USB PD messaging on SOP' (plus Hard Reset and Cable Reset signaling) and never on SOP, and
    therefore cannot enter Alternate Modes or negotiate PR_Swap, DR_Swap or VCONN_Swap; under
    Table 4-8 it draws at most 35 mW before USB enumeration (75 mW max for the first 500 ms) and
    at most 500 mW (USB 2.0) or 750 mW (USB 3.2) when active, exposing only a low-power USB
    interface. Both require vVCONNValid of 3.0 to 5.5 V, present at most 10 uF inrush
    capacitance, draw at most iRaDetect = 10 mA below vVCONNValid, weaken or remove Ra within
    tRaWeaken (at most 1.2 s) after VCONN enters vVCONNValid, detect VCONN disconnect at
    vVCONNDisconnect (1.0 to 2.4 V), reapply Ra when VCONN falls below vRaReconnect (800 mV
    min), and discharge VCONN below vVCONNDischarge (800 mV max) within tVCONNDischarge (230 ms
    max) on disconnect.
