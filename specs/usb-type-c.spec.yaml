- id: debug-accessory-target-states
  section: programming-model
  title: Target System Debug Accessory Mode states (UnorientedDebugAccessory.SRC, OrientedDebugAccessory.SRC and DebugAccessory.SNK)
  claim: >-
    Debug Accessory Mode (DAM, Appendix B) is for debug only and must not be used for
    communicating with commercial products; neither a Debug and Test System (DTS) nor a Target
    System (TS) drives VCONN in any state, and because a standard Type-C cable passes only one
    CC wire, detecting Rp/Rp or Rd/Rd requires the DTS to be a captive cable or direct-attach
    plug mated to a TS receptacle. A DAM-capable TS Source or DRP enters
    UnorientedDebugAccessory.SRC from AttachWait.SRC when VBUS is at vSafe0V and SRC.Rd is
    detected on both CC1 and CC2 for at least tCCDebounce: it provides Rp (Table 4-27) on both
    CC1 and CC2, supplies VBUS at the current its Rp advertises, drives no VCONN, may connect
    non-orientation-specific debug signals only after entry, and moves to
    OrientedDebugAccessory.SRC if orientation is required and detected per Section B.2.6.1.2. In
    OrientedDebugAccessory.SRC the TS connects orientation-specific debug signals (keeping
    non-orientation-specific signals connected) and, if needed, initiates USB PD as initial
    DFP/Source only after entry and once VBUS reaches vSafe5V; both UnorientedDebugAccessory.SRC
    and OrientedDebugAccessory.SRC exit to Unattached.SRC (for a Source) or Unattached.SNK (for
    a DRP) when SRC.Open is detected on either CC1 or CC2. A DAM-capable TS Sink or DRP enters
    DebugAccessory.SNK from AttachWait.SNK when both CC1 and CC2 are SNK.Rp for at least
    tCCDebounce and VBUS is detected (riding through brief USB PD SNK.Open pulses on one CC pin
    up to tPDDebounce): it drives neither VBUS nor VCONN, provides Rd (Table 4-28) on both CC1
    and CC2, determines orientation if supported per Section B.2.6.1.1 and connects debug
    signals only after entry, and exits to Unattached.SNK when VBUS is no longer present.
