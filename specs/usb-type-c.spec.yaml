- id: debug-accessory-dts-and-orientation
  section: programming-model
  title: DTS state machine, asymmetric Rp current table and DAM orientation detection
  claim: >-
    A Debug and Test System (DTS) port uses the UnattachedDeb.SRC, AttachWaitDeb.SRC,
    AttachedDeb.SRC, UnattachedDeb.SNK, AttachWaitDeb.SNK, AttachedDeb.SNK, TryDeb.SRC and
    TryWaitDeb.SNK states (Table B-3), with a DTS DRP entering TryDeb.SRC from AttachWaitDeb.SNK
    so that it favors the Source role when connected to a TS DRP; a DTS Source to TS Source
    connection and a DTS Sink to TS Sink (with or without accessory support) connection are
    non-functional and must not harm either port (Table B-1). A DTS Source presents asymmetric
    Rp values on its plug's CC1 and CC2 pins (weaker resistance on CC2) per Table B-2 both to
    indicate orientation and to advertise VBUS current: Rp for 3 A on CC1 and Rp for 1.5 A on
    CC2 for Default USB Power, Rp for 1.5 A on CC1 and Rp for Default on CC2 for 1.5 A at 5 V,
    and Rp for 3 A on CC1 and Rp for Default on CC2 for 3.0 A at 5 V. A TS Sink in
    DebugAccessory.SNK tracks these advertisements in PowerDefaultDeb.SNK, Power1.5Deb.SNK and
    Power3.0Deb.SNK after both vRd voltages are stable for tRpValueChange (reducing consumption
    within tSinkAdj when the advertisement drops), whereas a TS Source instead presents the same
    standard Rp value on both CC1 and CC2 (tracked by a DTS Sink using the normal Sink Power
    Sub-States of Section 4.5.2.3). When optional normative orientation detection is used, the
    DTS always initiates it: as a Source via the asymmetric Rp pair of Table B-2, or as a Sink
    by first presenting Rd/Rd to enter DAM and then, upon entering AttachedDeb.SNK, presenting a
    resistance to ground of at most Ra on B5 (CC2). The TS (in DebugAccessory.SNK after both vRd
    voltages are stable for tRpValueChange, or in OrientedDebugAccessory.SRC after SRC.Ra is
    detected on one CC pin) selects the CC pin with the greater voltage as the plug CC pin and
    the USB PD CC communication wire, and must not perform USB PD communication or connect
