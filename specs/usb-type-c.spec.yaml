    access: public
    verified: 2026-10-18
    fetch: ok
    note: >-
      The USB-IF document library serves the release as a zip download without an account; the
      cited bytes are the file "USB Type-C Spec R2.5 - March 2026.pdf" inside it (the zip also
      holds a redline against Release 2.4, the incorporated ECNs and the adopters agreement). No
      page carries a confidentiality marking. The USB 3.0 Promoter Group's copyright and limited
